name: 급지 대시보드 데이터 생성

on:
  schedule:
    # 매월 1일 06:00 UTC(= 15:00 KST). collect-trades.yml이 "매월 마지막 날 18:30 UTC"에 돌아
    # data/analyze를 채운 뒤라, 그 결과를 재가공하는 이 배치는 그보다 11시간 반 뒤에 실행한다
    # (collect-trades의 timeout이 300분이라 가장 오래 걸려도 끝나고 남는 시간).
    # 2026.09 추가 — 그전까지는 workflow_dispatch 전용이라, 실거래가 새로 수집돼도 여기를 수동으로
    # 눌러주기 전까진 급지 분석 화면이 옛 데이터 그대로였음(수민 지적).
    - cron: "0 6 1 * *"
  workflow_dispatch:
    inputs:
      months:
        description: "최근 몇 개월 내 거래를 볼지(기본 24 = 2년, 평형별 2년 내 최고가 기준)"
        required: false
        default: "24"

permissions:
  contents: write

concurrency:
  # collect-trades.yml·collect-hhcnt.yml과 같은 그룹 — 셋 다 main에 커밋·푸시하므로 겹쳐 돌면
  # 서로의 push를 거절시킨다(rejected/fetch first). API 호출은 없지만 push는 하므로 직렬화가 필요.
  group: aptsum-data-collect
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: git identity 설정
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # ⚠️ 폴백이 '6'이면 안 됨 — 스케줄 실행에선 inputs.months가 비어 있어서 폴백값이 그대로 쓰이는데,
      # 급지 기준은 2026.09부터 "2년(24개월) 내 최고가"로 바뀌었다(입력칸 default도 24). 폴백만 옛 값(6)으로
      # 남아 있어서, 스케줄을 붙이는 순간 자동 실행만 6개월 기준으로 계산될 뻔했음(2026.09 수정).
      - name: 급지 대시보드 데이터 생성 (data/tier-map.json)
        run: node scripts/build-tier-map.mjs --months=${{ inputs.months || '24' }}

      - name: 커밋 & 푸시
        run: |
          git add data/tier-map.json
          if git diff --cached --quiet; then
            echo "변경된 데이터 없음"
          else
            git commit -m "chore: 급지 대시보드 데이터 갱신 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
