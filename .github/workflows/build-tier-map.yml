name: 급지 대시보드 데이터 생성

on:
  # 정기/수동 실거래 수집은 collect-trades.mjs가 종료 전에 급지 데이터를 함께 생성한다.
  # 이 워크플로는 실거래 재수집 없이 급지만 별도로 재계산할 때 사용한다.
  workflow_dispatch:
    inputs:
      months:
        description: "최근 몇 개월 내 거래를 볼지(기본 36 = 3년, 평형별 3년 내 최고가 기준)"
        required: false
        default: "36"

permissions:
  contents: write

concurrency:
  # collect-trades.yml·collect-hhcnt.yml과 같은 그룹 — 셋 다 main에 커밋·푸시하므로 겹쳐 돌면
  # 서로의 push를 거절시킨다(rejected/fetch first). API 호출은 없지만 push는 하므로 직렬화가 필요.
  group: aptsum-data-collect
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: git identity 설정
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # 독립 수동 실행도 기본 급지 기준(최근 36개월)을 사용한다.
      - name: 급지 대시보드 데이터 생성 (data/tier-map.json)
        run: node scripts/build-tier-map.mjs --months=${{ inputs.months || '36' }}

      - name: 커밋 & 푸시
        run: |
          git add data/tier-map.json
          if git diff --cached --quiet; then
            echo "변경된 데이터 없음"
          else
            git commit -m "chore: 급지 대시보드 데이터 갱신 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
