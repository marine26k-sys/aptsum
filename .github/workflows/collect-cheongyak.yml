name: 청약 공고 자동 갱신
on:
  schedule:
    # 한국시간 00·04·08·12·16·20시 17분, 하루 6회.
    - cron: '17 3,7,11,15,19,23 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aptsum-data-collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 서울·경기·인천·부산 청약홈 공고 수집
        run: python scripts/collect-cheongyak.py
      - name: 데이터 저장
        run: |
          git config user.name 'aptsum-bot'
          git config user.email 'aptsum-bot@users.noreply.github.com'
          git add data/cheongyak.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: 청약 공고 자동 갱신 [skip netlify]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
