name: 세대수 데이터 배치 수집

on:
  schedule:
    # 매월 "마지막 날" 00:00 UTC = 09:00 KST에 1회 실행(2026.09: 격월→매월로 변경, collect-trades.yml과
    # 동일한 "마지막 날" 방식으로 통일). cron은 "매월 마지막 날"을 직접 표현할 수 없어 28~31일 매일 이
    # 시각에 실행하되, 아래 gate 스텝에서 "내일이 1일"인 날에만 실제로 진행하고 나머지는 건너뛴다
    # (28~30일짜리 달에서 중복 실행 방지).
    - cron: "0 0 28-31 * *"
  workflow_dispatch:
    inputs:
      only:
        description: "특정 지역만 (콤마 구분 lawd 코드, 비우면 전체)"
        default: ""
permissions:
  contents: write
concurrency:
  # collect-trades.yml과 그룹을 통일: 둘 다 같은 main 브랜치에 커밋·푸시하므로
  # 동시에 돌면 서로의 push를 거절(rejected/fetch first)시키는 문제가 있었음 → 직렬화
  group: aptsum-data-collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: 매월 마지막 날인지 확인 (schedule 실행에만 적용 — 28~31일 중 "내일이 1일"인 날만 진행)
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            tomorrow=$(date -u -d tomorrow +%d)
            if [ "$tomorrow" != "01" ]; then
              echo "오늘은 이번 달 마지막 날이 아님(내일=${tomorrow}일) — 이번 실행은 건너뜀"
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: "20"

      - name: git identity 설정 (스크립트 내 중간 커밋에도 사용됨)
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 세대수 배치 수집 실행 (지역 10개마다 스크립트가 자체적으로 중간 커밋·푸시함)
        if: steps.gate.outputs.run == 'true'
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          node scripts/collect-hhcnt.mjs ${{ github.event.inputs.only && format('--only={0}', github.event.inputs.only) || '' }}

      - name: 남은 변경분 최종 커밋 & 푸시 (타임아웃/중단으로 스크립트가 always 실행 못했을 때의 안전망)
        if: always() && steps.gate.outputs.run == 'true'
        run: |
          [ -d data/hhcnt ] && git add data/hhcnt
          if git diff --cached --quiet; then
            echo "변경된 데이터 없음"
          else
            git commit -m "chore: 세대수 데이터 배치 수집 최종 커밋 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            for i in 1 2 3 4 5; do
              git push && break
              echo "push 거절됨, fetch+rebase 후 재시도 ($i/5)"
              git fetch origin main
              git rebase origin/main || { git rebase --abort; break; }
            done
          fi
