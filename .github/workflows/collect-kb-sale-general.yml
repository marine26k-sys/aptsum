name: Collect KB apartment sale general prices

on:
  schedule:
    # KB prices update weekly; collect Saturday 02:00 KST, after Friday's update window.
    - cron: "0 17 * * 5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aptsum-data-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect by KB complex and area
        env:
          KB_REQUESTS_PER_SECOND: "4"
          KB_WORKERS: "8"
        run: python3 scripts/collect-kb-sale-general.py

      - name: Commit and publish data without a Netlify build
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/kb-sale-general.json
          if git diff --cached --quiet; then
            echo "KB sale general data unchanged"
            exit 0
          fi
          git commit -m "data: KB 단지별 매매 일반가 갱신 [skip netlify]"
          for attempt in 1 2 3 4 5; do
            if git push origin "$TARGET_BRANCH"; then exit 0; fi
            git fetch origin "$TARGET_BRANCH"
            git rebase "origin/$TARGET_BRANCH" || { git rebase --abort; exit 1; }
          done
          echo "Could not publish the KB price snapshot after five attempts"
          exit 1

