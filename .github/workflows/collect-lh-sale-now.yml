name: One-time LH sale notice collection
on:
  push:
    branches: [feat/lh-sale-notices]
    paths:
      - scripts/collect-lh-sale.py
      - .github/workflows/collect-lh-sale-now.yml
permissions:
  contents: write
concurrency:
  group: aptsum-lh-sale-one-time
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/lh-sale-notices
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect current LH sale notices
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python scripts/collect-lh-sale.py
      - name: Save collected data to this PR branch
        run: |
          git config user.name 'aptsum-bot'
          git config user.email 'aptsum-bot@users.noreply.github.com'
          git add data/lh-sale.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: collect current LH sale notices [skip netlify]'
            git push origin HEAD:feat/lh-sale-notices
          fi
