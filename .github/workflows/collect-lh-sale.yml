name: LH 분양주택 공고 자동 갱신
on:
  schedule:
    # 한국시간 매일 오전 7시 15분
    - cron: '15 22 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aptsum-data-collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: LH 분양주택 공고 수집
        env:
          LH_DATA_GO_KR_KEY: ${{ secrets.LH_DATA_GO_KR_KEY }}
        run: python scripts/collect-lh-sale.py
      - name: 데이터 저장
        run: |
          git config user.name 'aptsum-bot'
          git config user.email 'aptsum-bot@users.noreply.github.com'
          git add data/lh-sale.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: LH 분양주택 공고 자동 갱신 [skip netlify]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
