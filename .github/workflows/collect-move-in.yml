name: Update apartment move-in supply

on:
  schedule:
    - cron: "0 0 5 * *" # Monthly, after the previous month's completion figures are published.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apartment-statistics-publish
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download the latest Korea Real Estate Board dataset
        run: node scripts/collect-move-in.mjs
      - name: Download monthly apartment completion history
        run: node scripts/collect-move-in-history.mjs
      - name: Publish without site deployment
        run: node scripts/publish-apartment-stats.mjs data/move-in.json
