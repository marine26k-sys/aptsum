name: Refresh R-ONE apartment sale prices

on:
  schedule:
    - cron: "0 15 20 * *" # Monthly at 00:00 KST on the 21st.
  workflow_dispatch:
  push:
    branches: [feat/undervalue-listing-layout]
    paths:
      - .github/workflows/collect-reb-apartment-prices.yml
      - scripts/collect-reb-apartment-prices.mjs

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect official average and median prices
        env:
          REB_RONE_API_KEY: ${{ secrets.REB_RONE_API_KEY }}
        run: node scripts/collect-reb-apartment-prices.mjs
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reb-apartment-prices.json
          if git diff --cached --quiet; then
            echo "No R-ONE apartment price changes."
          else
            git commit -m "Refresh R-ONE apartment sale price data"
            git push
          fi
