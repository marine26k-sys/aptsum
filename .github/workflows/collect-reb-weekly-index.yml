name: Refresh R-ONE weekly apartment sale price index

on:
  schedule:
    - cron: "0 1 * * 5" # Friday 10:00 KST, after the weekly publication.
  workflow_dispatch:
  push:
    branches: [feat/undervalue-listing-layout]
    paths:
      - .github/workflows/collect-reb-weekly-index.yml
      - scripts/collect-reb-weekly-index.mjs

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect official weekly index
        env:
          REB_RONE_API_KEY: ${{ secrets.REB_RONE_API_KEY }}
        run: node scripts/collect-reb-weekly-index.mjs
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reb-weekly-index.json
          if git diff --cached --quiet; then
            echo "No R-ONE weekly index changes."
          else
            git commit -m "Refresh R-ONE weekly apartment price index"
            git push
          fi
