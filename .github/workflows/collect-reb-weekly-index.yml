name: Refresh R-ONE apartment price index maps

on:
  schedule:
    - cron: "0 1 * * 5" # Friday 10:00 KST, after the weekly release.
  workflow_dispatch:
  push:
    branches: [feat/undervalue-listing-layout]
    paths:
      - .github/workflows/collect-reb-weekly-index.yml
      - scripts/collect-reb-weekly-index.mjs

permissions:
  contents: write

concurrency:
  group: apartment-statistics-publish
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect official district monthly and weekly indices
        env:
          REB_RONE_API_KEY: ${{ secrets.REB_RONE_API_KEY }}
        run: node scripts/collect-reb-weekly-index.mjs
      - name: Publish without site deployment
        run: node scripts/publish-apartment-stats.mjs data/reb-weekly-index.json
