name: 노선 호재 뉴스 배치 수집

on:
  schedule:
    # 매주 월요일 04:00 KST(전날 19:00 UTC) — 뉴스는 실거래·세대수보다 자주 바뀌지만, 개통 예정
    # 노선 진행상황이 주 단위로 요동치진 않아 이 정도 주기면 충분
    - cron: "0 19 * * 0"
  workflow_dispatch:
    inputs:
      only:
        description: "특정 노선만 (콤마 구분 id: gtxa,gtxb,gtxc,sinansan,wolpan / 비우면 전체)"
        default: ""
permissions:
  contents: write
concurrency:
  # 다른 배치 워크플로들과 동일 그룹으로 묶어 같은 main에 동시에 push해 서로 거절되는 걸 방지
  group: aptsum-data-collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: git identity 설정 (스크립트 내 커밋에도 사용됨)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 노선 호재 관련 뉴스 수집 (data/subway-news.json)
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: |
          node scripts/collect-subway-news.mjs ${{ github.event.inputs.only && format('--only={0}', github.event.inputs.only) || '' }}
