name: 공급면적 데이터 배치 수집

on:
  workflow_dispatch: {}
  schedule:
    # 격월(짝수월) 2일 18:00 KST = UTC 09:00. 세대수/실거래 배치(홀수월 1일)가 먼저 끝난 다음 달에 돌아서
    # 그 사이 새로 쌓인 지번/단지를 반영하는 흐름. 공급면적 자체는 거의 안 바뀌는 값이라 이 주기로 충분함
    # — 필요하면 collect-trades.yml/collect-hhcnt.yml의 기존 cron 표기와 맞춰 시간대를 조정할 것.
    - cron: "0 9 2 2,4,6,8,10,12 *"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: git identity 설정
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 공급면적 배치 수집 실행
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: node scripts/collect-supply-area.mjs
