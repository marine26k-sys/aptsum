name: 공급면적 배치 수집
on:
  workflow_dispatch:
    inputs:
      only:
        description: '지역 코드(콤마 구분, 비우면 전체)'
        required: false
      limit:
        description: '이번 실행에서 처리할 단지 수(비우면 최대한 다 처리)'
        required: false
        default: '99999'
  schedule:
    # 전체 재수집이 끝날 때까지는 매일 반복 실행해서 이어서 채우고(74개 지역 전체를 한 번에 못 끝내므로),
    # 다 채워진 뒤에는(2026.08 재수집 완료 후) collect-trades.yml처럼 월 1회 등으로 다시 줄여도 됨.
    # 20:00 UTC = 05:00 KST — collect-trades.yml(03:30 KST)·collect-hhcnt.yml과 겹치지 않는 시간대로 배치,
    # 어차피 concurrency group으로 직렬화되니 겹쳐도 안전하지만 대기 시간을 줄이기 위함.
    - cron: '0 20 * * *'
permissions:
  contents: write
concurrency:
  # collect-hhcnt.yml/collect-trades.yml과 그룹을 통일: 셋 다 같은 main 브랜치에 커밋·푸시하므로
  # 동시에 돌면 서로의 push를 거절(rejected/fetch first)시키는 문제가 있음 → 직렬화
  group: aptsum-data-collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: git identity 설정
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: 공급면적 배치 수집 실행
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          BLDHUB_KEY: ${{ secrets.BLDHUB_KEY }}
        run: node scripts/collect-supply-area.mjs ${{ inputs.only && format('--only={0}', inputs.only) || '' }} --limit=${{ inputs.limit || 99999 }}
