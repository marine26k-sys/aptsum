name: 공급면적 배치 수집
on:
  workflow_dispatch:
    inputs:
      only:
        description: '지역 코드(콤마 구분, 비우면 전체)'
        required: false
      limit:
        description: '이번 실행에서 처리할 단지 수'
        required: false
        default: '30'
permissions:
  contents: write
concurrency:
  # collect-hhcnt.yml/collect-trades.yml과 그룹을 통일: 셋 다 같은 main 브랜치에 커밋·푸시하므로
  # 동시에 돌면 서로의 push를 거절(rejected/fetch first)시키는 문제가 있음 → 직렬화
  group: aptsum-data-collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: git identity 설정
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: 공급면적 배치 수집 실행
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          BLDHUB_KEY: ${{ secrets.BLDHUB_KEY }}
        run: node scripts/collect-supply-area.mjs ${{ inputs.only && format('--only={0}', inputs.only) || '' }} --limit=${{ inputs.limit }}
