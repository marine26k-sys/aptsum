name: 공급면적 배치 수집

on:
  workflow_dispatch:
    inputs:
      only:
        description: "지역 코드(콤마 구분, 비우면 전체)"
        required: false
      limit:
        description: "이번 실행에서 처리할 단지 수(비우면 최대한 다 처리)"
        required: false
        default: "99999"

permissions:
  contents: write

concurrency:
  # collect-hhcnt.yml / collect-trades.yml과 그룹을 통일: 셋 다 같은 main 브랜치에 커밋·푸시하므로
  # 동시에 돌면 서로의 push를 거절(rejected/fetch first)시키는 문제가 있음 → 직렬화
  group: aptsum-data-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: git identity 설정 (스크립트 내 중간 커밋에도 사용됨)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 공급면적 배치 수집 실행 (단지 5개마다 스크립트가 자체적으로 중간 커밋·푸시함)
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          BLDHUB_KEY: ${{ secrets.BLDHUB_KEY }}
        run: |
          node scripts/collect-supply-area.mjs \
            ${{ inputs.only && format('--only={0}', inputs.only) || '' }} \
            --limit=${{ inputs.limit || '99999' }}

      - name: 남은 변경분 최종 커밋 & 푸시 (타임아웃/중단으로 스크립트가 always 실행 못했을 때의 안전망)
        if: always()
        run: |
          [ -d data/supply-area ] && git add data/supply-area
          if git diff --cached --quiet; then
            echo "변경된 데이터 없음"
          else
            git commit -m "chore: 공급면적 데이터 배치 수집 최종 커밋 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            for i in 1 2 3 4 5; do
              git push && break
              echo "push 거절됨, fetch+rebase 후 재시도 ($i/5)"
              git fetch origin main
              git rebase origin/main || { git rebase --abort; break; }
            done
          fi
