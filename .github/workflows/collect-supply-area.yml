name: 공급면적 배치 수집
on:
  workflow_dispatch:
    inputs:
      only:
        description: '지역 코드(콤마 구분, 비우면 전체)'
        required: false
      limit:
        description: '이번 실행에서 처리할 단지 수(비우면 최대한 다 처리)'
        required: false
        default: '99999'
permissions:
  contents: write
concurrency:
  group: aptsum-data-collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: git identity 설정
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: 공급면적 배치 수집 실행
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          BLDHUB_KEY: ${{ secrets.BLDHUB_KEY }}
        run: node scripts/collect-supply-area.mjs ${{ inputs.only && format('--only={0}', inputs.only) || '' }} --limit=${{ inputs.limit || 99999 }}
