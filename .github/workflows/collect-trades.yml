name: 실거래 데이터 배치 수집 (매매/분양권/전세)

on:
  schedule:
    # 한국 시간 월말 15:30(UTC 06:30). 월 전환 전에 수집을 끝낼 여유를 확보한다.
    # 28~31일 중 마지막 날만 gate에서 실행. 평소 최근 4개월, 분기말 최근 12개월 재조회.
    - cron: "30 6 28-31 * *"
  workflow_dispatch:
    inputs:
      months:
        description: "수집할 개월 수 (최초 백필은 60 권장, 5년)"
        default: "60"
      refresh:
        description: "매번 강제로 재조회할 최근 개월 수 (신고 지연 반영)"
        default: "4"
      kinds:
        description: "수집할 종류 (콤마 구분: analyze,presale,rent)"
        default: "analyze,presale,rent"
      force:
        description: "이미 있는 파일도 전부 강제 재수집"
        type: boolean
        default: false
      only:
        description: "특정 지역만 (콤마 구분 lawd 코드, 비우면 전체) — 지역 신규 추가 시 그 지역만 백필할 때 사용"
        default: ""

permissions:
  contents: write

concurrency:
  # collect-hhcnt.yml과 그룹을 통일: 둘 다 같은 main 브랜치에 커밋·푸시하므로
  # 동시에 돌면 서로의 push를 거절(rejected/fetch first)시키는 문제가 있었음 → 직렬화
  group: aptsum-data-collect
  cancel-in-progress: false # 이전 실행이 아직 커밋/푸시 중일 수 있으니 겹쳐 돌리지 않고 대기시킴

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: 매월 마지막 날인지 확인 (schedule 실행에만 적용 — 28~31일 중 "내일이 1일"인 날만 진행)
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            tomorrow=$(date -u -d tomorrow +%d)
            if [ "$tomorrow" != "01" ]; then
              echo "오늘은 이번 달 마지막 날이 아님(내일=${tomorrow}일) — 이번 실행은 건너뜀"
              echo "run=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          refresh="${{ github.event.inputs.refresh }}"
          if [ -z "$refresh" ]; then
            refresh=4
            if [ "${{ github.event_name }}" = "schedule" ]; then
              case "$(date -u +%m)" in
                03|06|09|12) refresh=12 ;;
              esac
            fi
          fi
          echo "refresh=$refresh" >> "$GITHUB_OUTPUT"
          echo "run=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
        with:
          ref: main

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: "20"

      - name: git identity 설정 (스크립트 내 중간 커밋에도 사용됨)
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 수집 개월수 결정 (data/.trades-backfilled 마커 없으면 최초 백필로 보고 60개월, 있으면 24개월)
        if: steps.gate.outputs.run == 'true'
        id: months
        run: |
          if [ -n "${{ github.event.inputs.months }}" ]; then
            MONTHS="${{ github.event.inputs.months }}"   # 수동 실행 시 입력값 우선
          elif [ -f data/.trades-backfilled ]; then
            MONTHS=24
          else
            MONTHS=60
          fi
          echo "수집 개월수: $MONTHS"
          echo "months=$MONTHS" >> "$GITHUB_OUTPUT"

      - name: 실거래 수집 및 급지 대시보드 갱신 (스크립트가 중간·최종 커밋을 푸시함)
        if: steps.gate.outputs.run == 'true'
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: |
          node scripts/collect-trades.mjs \
            --kinds=${{ github.event.inputs.kinds || 'analyze,presale,rent' }} \
            --months=${{ steps.months.outputs.months }} \
            --refresh=${{ steps.gate.outputs.refresh }} \
            ${{ github.event.inputs.only && format('--only={0}', github.event.inputs.only) || '' }} \
            ${{ github.event.inputs.force == 'true' && '--force' || '' }}

      - name: 최초 백필 완료 표시 (자동 60개월 백필이 성공했을 때만)
        if: steps.gate.outputs.run == 'true' && success() && github.event_name == 'schedule' && steps.months.outputs.months == '60'
        run: |
          mkdir -p data
          touch data/.trades-backfilled
          git add data/.trades-backfilled
          git commit -m "chore: 5년치 초기 백필 완료 표시 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3 4 5; do
            git push && break
            echo "push 거절됨, fetch+rebase 후 재시도 ($i/5)"
            git fetch origin main
            git rebase origin/main || { git rebase --abort; break; }
          done

      - name: 남은 변경분 최종 커밋 & 푸시 (중간 커밋의 푸시 실패도 재시도)
        if: always() && steps.gate.outputs.run == 'true'
        run: |
          for d in data/analyze data/presale data/rent; do
            [ -d "$d" ] && git add "$d"
          done
          [ -f data/tier-map.json ] && git add data/tier-map.json
          if git diff --cached --quiet; then
            echo "변경된 데이터 없음"
          else
            git commit -m "chore: 실거래 데이터 배치 수집 최종 커밋 $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          fi
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push 거절됨, fetch+rebase 후 재시도 ($i/5)"
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
          done
          echo "5회 재시도 후에도 푸시 실패"
          exit 1
