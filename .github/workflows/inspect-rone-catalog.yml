name: Inspect R-ONE housing statistics catalog

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch catalog using repository secret
        env:
          REB_RONE_API_KEY: ${{ secrets.REB_RONE_API_KEY }}
        run: node scripts/inspect-rone-catalog.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: rone-housing-catalog
          path: /tmp/rone-catalog.json
          retention-days: 1
