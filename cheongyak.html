<!doctype html>
<html lang="ko">
<head>

<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">

<style>
.filter{display:block}.filter label{display:block;width:auto;margin-bottom:8px}.filter-pills{flex:none;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}.filter-pills::-webkit-scrollbar{display:none}
/* Compact notice cards while keeping controls easy to tap. */
.notice{margin-bottom:9px}.notice-head{padding:12px 14px}.topline{margin-bottom:3px}.notice h2{line-height:1.25}.address{margin-top:3px;line-height:1.25}.notice-body{padding:10px 14px}.statusline{margin-bottom:7px}dl{row-gap:4px;column-gap:8px;line-height:1.35}details{margin-top:9px;padding-top:7px}.notice summary{padding:6px 10px;min-height:44px}th,td{padding:4px 3px;line-height:1.25}.schedule{margin-top:5px;line-height:1.35}.actions{margin-top:9px;gap:7px}.action{min-height:44px;padding:7px 4px;display:flex;align-items:center;justify-content:center}
</style>
<link rel="stylesheet" href="/assets/page-header.css">
</head>
<body><main class="wrap">
<header><a class="back" href="./index.html" aria-label="아파트썸 메뉴로">←</a><div class="logo"><svg class="brand-mark" viewBox="0 0 28 28" aria-hidden="true"><rect x="2" y="15" width="5" height="11" rx="1" fill="currentColor" opacity=".55"/><rect x="11" y="9" width="5" height="17" rx="1" fill="currentColor" opacity=".8"/><rect x="20" y="2" width="5" height="24" rx="1" fill="currentColor"/></svg><div class="brand-copy"><span class="brand-name">아파트썸</span><span class="brand-description">청약 공고</span></div></div></header>
<div id="warning" class="warning" hidden></div>
<section class="counts" aria-label="청약 접수 상태" style="grid-template-columns:repeat(2,1fr)"><button class="count on" data-status="open">접수 중<b id="countOpen">—</b></button><button class="count" data-status="upcoming">진행 예정<b id="countUpcoming">—</b></button></section>
<div class="updated" id="updated"></div>
<section class="panel" aria-label="청약 공고 필터">
<div class="filter"><label>공급 유형</label><div class="filter-pills" role="radiogroup" aria-label="공급 유형"><button type="button" class="filter-pill on" data-filter-id="category" data-value="" aria-pressed="true">전체</button><button type="button" class="filter-pill" data-filter-id="category" data-value="apt" aria-pressed="false">아파트</button><button type="button" class="filter-pill" data-filter-id="category" data-value="remainder" aria-pressed="false">무순위·잔여세대</button></div><select id="category" hidden><option value="">전체</option><option value="apt">아파트</option><option value="remainder">무순위·잔여세대</option></select></div>
<div class="filter"><label>지역</label><div class="filter-pills" role="radiogroup" aria-label="지역"><button type="button" class="filter-pill on" data-filter-id="region" data-value="" aria-pressed="true">전체</button><button type="button" class="filter-pill" data-filter-id="region" data-value="서울" aria-pressed="false">서울</button><button type="button" class="filter-pill" data-filter-id="region" data-value="경기" aria-pressed="false">경기</button><button type="button" class="filter-pill" data-filter-id="region" data-value="인천" aria-pressed="false">인천</button><button type="button" class="filter-pill" data-filter-id="region" data-value="부산" aria-pressed="false">부산</button></div><select id="region" hidden><option value="">전체</option><option>서울</option><option>경기</option><option>인천</option><option>부산</option></select></div>
<input class="search" id="query" onkeydown="if(event.key==='Enter'&&!event.isComposing){event.preventDefault();this.blur()}" type="search" placeholder="공고명·주소 검색" aria-label="공고명·주소 검색">
<div class="tools"><label><input id="favoritesOnly" type="checkbox"> ★ 관심 공고만</label><button class="reset" id="reset">↺ 필터 초기화</button></div>
</section>
<div class="summary"><span id="resultCount" role="status">공고 불러오는 중…</span><span id="sortOrder">최신 공고일 순</span></div>
<section id="results" aria-label="청약 공고"></section><button id="more" class="more" hidden>더 보기</button>
<footer>출처: 한국부동산원 청약홈 · 일정은 한국시간 기준입니다.<br>자격·접수 시간·공급 금액은 <b>청약홈 공고문</b>에서 확인하세요. 관심 공고는 이 브라우저에 저장됩니다.</footer>
</main><script type="module" src="./assets/cheongyak.mjs"></script></body></html>
