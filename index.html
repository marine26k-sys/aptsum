// ── 지하철 검색(비공개 탭) ──
// data/hhcnt/<lawd>.json은 매매 실거래 API와 무관한 별도 정적 배치(collect-hhcnt.mjs)라
// 이 탭에서만 쓰는 전용 캐시(lawd → items[])를 따로 둔다. 필터(도보시간)를 바꿀 때마다
// 다시 fetch하지 않도록 세션 내 메모리에만 유지(새로고침하면 비워짐 — 세대수 데이터 자체가
// 자주 안 바뀌는 값이라 무거운 영속 캐시까지는 불필요).
const subwayDataCache = {};
// K-apt 원본 데이터 자체의 오기입을 보정 — hhcnt.mjs의 PARTIAL_OVERRIDE와 같은 케이스를 여기서도 고쳐야 함
// (이 탭은 data/hhcnt/<lawd>.json을 hhcnt.mjs 경유 없이 직접 읽으므로, 서버 쪽 보정만으론 여기 반영 안 됨)
// key: kaptName 그대로(공백 포함, data/hhcnt items의 name 필드와 정확히 일치해야 함)
const SUBWAY_LINE_FIX = {
  "평촌목련2단지아파트": ["4호선"], // 안양 동안구 — 원본에 경춘선이 잘못 섞여 있음(2026.08)
  "한가람한양6차": ["4호선"], // 안양 동안구 — 원본에 의정부경전철이 잘못 섞여 있음(2026.08)
};
function applySubwayLineFix(items){
  return items.map(it => SUBWAY_LINE_FIX[it.name] ? { ...it, subwayLines: SUBWAY_LINE_FIX[it.name] } : it);
}
async function loadSubwayData(lawd){
  if(subwayDataCache[lawd]) return subwayDataCache[lawd];
  const r = await fetch(`/data/hhcnt/${encodeURIComponent(lawd)}.json`);
  if(!r.ok) throw new Error('데이터 조회 실패');
  const j = await r.json().catch(()=>null);
  const items = applySubwayLineFix((j && Array.isArray(j.items)) ? j.items : []);
  subwayDataCache[lawd] = items;
  return items;
}
// subwayWalk는 K-apt 원본 텍스트 그대로("5분이내"/"15~20분이내"/"20분이상" 등 케이스가 섞여 있음) —
// "○○분 이내" 필터는 최악값(범위면 상한, 단일값이면 그 값, "이상/초과"면 무한대) 기준으로 판단해야
// "15~20분이내"인 단지가 "15분 이내" 필터에 잘못 걸리는 일이 없다.
function parseSubwayWalk(raw){
  if(!raw) return null;
  const nums = (String(raw).match(/\d+/g) || []).map(Number);
  if(!nums.length) return null;
  if(nums.length >= 2) return { min: nums[0], max: nums[1] };
  const open = /이상|초과/.test(raw);
  return open ? { min: nums[0], max: Infinity } : { min: 0, max: nums[0] };
}
// 단지별로 지정된 전용면적 구간의 최근 거래 1건씩 뽑는다(수민이 지정한 4개 구간: 45~54/55~60/80~85/86~105㎡).
// 매매만 대상(분양권/입주권은 준공 전 시세라 제외).
// 밴드별(전용면적 구간) 표시가는 원래 "가장 최근 거래 1건"이었는데, 특이값(급매·저층 등) 하나로 단지가
// 실제보다 저평가돼 보일 수 있어 "최근 1년 내 최고가"로 변경(2026.08, 수민 요청). 최근 1년 안에 해당
// 구간 거래가 아예 없으면 그 밴드는 표시 안 함(오래된 거래를 최근인 것처럼 보여주는 게 더 나쁘다고 판단).
function peakByAreaLastYear(trades, minA, maxA){
  const recentSet = new Set(lastMonthsYm(12));
  const map = {};
  trades.forEach(t=>{
    if(t.kind || !t.area) return;
    if(t.area < minA || t.area > maxA) return;
    if(!recentSet.has(t.ym)) return;
    const k = t.apt.replace(/\s/g, '');
    const cur = map[k];
    if(!cur || t.amt > cur.amt) map[k] = t;
  });
  return map;
}
// bandMaps·priceMap처럼 서로 다른 부분집합(밴드별로 그 밴드에 거래가 있는 단지만 키로 존재)에 대해
// 매번 독립적으로 substring 매칭을 하면, 정작 그 밴드에 거래가 없는 진짜 단지 대신 우연히 그 밴드에는
// 데이터가 있는 훨씬 짧고 무관한 이름(예: "삼성")이 "유일 후보"로 오매칭될 수 있다(2026.08 실사고 —
// "안양동삼성래미안"엔 84㎡ 타입 자체가 없는데, 그 지역 84㎡ 밴드맵엔 완전히 다른 "삼성"이라는 단지가
// 있었고 그게 유일하게 substring이 걸려서 엉뚱하게 4.9억이 33평(전용84) 배지로 붙어버림). 그래서 이름
// 해석은 그 지역 "전체" 단지명 목록(allAptNames, 가장 정보가 많아 오매칭 여지가 적음) 기준으로 딱 한 번만
// 하고, 일단 진짜 이름이 정해지면 그 이후엔 각 밴드맵·평단가맵에 정확일치로만 조회한다. 해석 자체가
// 모호하면(동명이인 단지가 실제로 있으면) null — 엉뚱한 단지 가격을 보여주는 것보다 배지를 안 보여주는
// 게 안전하다는 판단.
function resolveAptName(allNames, name){
  const qn = name.replace(/\s/g,'');
  const variants = aptNameVariants(qn);
  const exact = allNames.find(n => variants.includes(n.replace(/\s/g,'')));
  if(exact) return exact;
  const cand = [...new Set(allNames.filter(n => { const a=n.replace(/\s/g,''); return variants.some(v=>a.includes(v)||v.includes(a)); }))];
  if(cand.length>1){
    const norm = s=>s.replace(/\s/g,'');
    const maximal = cand.filter(n => !cand.some(other => other!==n && norm(other).includes(norm(n))));
    if(maximal.length) return maximal.length===1 ? maximal[0] : null;
  }
  return cand.length===1 ? cand[0] : null;
}
async function searchSubway(){
  const lawd = sel.value;
  if(!lawd){ showError('지역을 선택해 주세요.'); return; }
  document.getElementById('error').classList.remove('on');
  const r = document.getElementById('result'); r.classList.remove('on'); r.innerHTML='';
  document.getElementById('loadMsg').textContent = '지하철 데이터 조회 중…';
  document.getElementById('loading').classList.add('on');
  document.getElementById('btn').disabled = true;
  try{
    const items = await loadSubwayData(lawd);
    const maxWalk = +document.getElementById('subwayWalkMax').value;
    let rows = items
      .map(it => ({ ...it, walk: parseSubwayWalk(it.subwayWalk) }))
      .filter(it => it.subwayLines && it.subwayLines.length && it.walk && it.walk.max <= maxWalk);

    // 평단가(전용면적 평단가 탭과 동일 로직) + 전용면적 구간별 최근 실거래가 조회 — 실패해도 목록 자체는 보여주고 도보시간 순으로만 정렬
    // 2026.08: 기존 4구간(45~54/55~60/80~85/86~105)은 사이에 빈 구간(61~79, 106+)이 있어서 30평·47평·55평처럼
    // "국민평형대"가 아닌 단지는 아무 가격도 안 뜨는 문제(예: 압구정미성2차, 전용74/118/140㎡) — 20~200㎡을
    // 빈틈없이 이어붙인 7구간으로 확장해서 어떤 평형대든 최소 하나는 걸리도록 함(수민 요청)
    const AREA_BANDS = [
      { key: 'b1', min: 20, max: 44 },
      { key: 'b2', min: 45, max: 54 },
      { key: 'b3', min: 55, max: 65 },  // 국민평형(59㎡대) 포함 — 아래 priceBadges에서 우선순위 1
      { key: 'b4', min: 66, max: 79 },
      { key: 'b5', min: 80, max: 95 },  // 국민평형(84㎡대) 포함 — 아래 priceBadges에서 우선순위 2
      { key: 'b6', min: 96, max: 130 },
      { key: 'b7', min: 131, max: 200 },
    ];
    const bandMaps = {};
    let allAptNames = [];
    try{
      document.getElementById('loadMsg').textContent = '평단가 데이터 조회 중…';
      const trades = await ensureMonths(lawd, 36);
      allAptNames = [...new Set(trades.map(t=>t.apt))];
      AREA_BANDS.forEach(b => { bandMaps[b.key] = peakByAreaLastYear(trades, b.min, b.max); });
    }catch(e){ /* 조회 실패 — 맵 비워둔 채 아래에서 도보시간 순으로 폴백, 가격 표시는 생략 */ }

    rows = rows.map(x => {
      const resolved = resolveAptName(allAptNames, x.name); // 밴드별로 따로 찾지 않고 이름을 먼저 한 번만 확정
      const rk = resolved ? resolved.replace(/\s/g,'') : null;
      const bandResults = rk==null ? [] : AREA_BANDS.map(b => ({ key: b.key, trade: bandMaps[b.key][rk] || null })).filter(r=>r.trade);
      // 정렬 기준(평단가)은 반드시 화면에 실제로 보여줄 후보(pickSubwayPriceCandidates)에서만 계산한다 —
      // "전용면적 평단가" 탭처럼 단지 전체 유닛 중 평단가 1위 유닛(화면엔 안 보이는 소형 특수평형일 수 있음)
      // 으로 정렬하면, 화면엔 전혀 다른(더 낮은 평단가의) 국민평형 가격만 보이면서 순위가 안 맞아 보이는
      // 모순이 생김(2026.08, 수민 리포트 — "1위 단지가 화면상 평단가는 더 낮아 보이는데 왜 1위?").
      const candidates = pickSubwayPriceCandidates(bandResults);
      const pricePerPy = candidates.length ? Math.max(...candidates.map(c => c.amt / (c.area / SQM_PER_PY))) : null;
      return { ...x, pricePerPy, bandResults };
    });
    rows.sort((a,b) => {
      if(a.pricePerPy == null && b.pricePerPy == null) return (a.walk.max-b.walk.max) || (a.walk.min-b.walk.min) || a.name.localeCompare(b.name,'ko');
      if(a.pricePerPy == null) return 1; // 가격 정보 없는 단지는 뒤로
      if(b.pricePerPy == null) return -1;
      return b.pricePerPy - a.pricePerPy; // 평단가 높은 순
    });
    // 2026.08 버그 수정 — 이전엔 이 아래서 renderSubway()만 부르고 lastData/pushView()를 빼먹어서, 역세권
    // 탭에서 단지명 클릭(quick()) → 단지 분석으로 이동 → 뒤로가기 하면 역세권 결과 화면이 히스토리에 아예
    // 없어 그냥 건너뛰어져 버렸음(수민 리포트). 다른 탭들과 동일하게 lastData를 채우고 pushView()로 이
    // 결과를 히스토리에 쌓는다 — mode:'subway'를 같이 저장해서 restoreView()가 되돌아올 때 renderSubway로
    // 분기할 수 있게 함.
    const subwayData = { mode:'subway', regionName: sel.options[sel.selectedIndex].textContent, maxWalk, rows };
    renderSubway(subwayData);
    window.scrollTo(0, 0);
    lastData = subwayData;
    pushView();
    saveLastRegionPref(lawd);
  }catch(e){
    showError('지하철 데이터를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.');
  }finally{
    document.getElementById('loading').classList.remove('on');
    document.getElementById('btn').disabled = false;
  }
}
// 지하철 도보시간 표시 공용 — "5~10분이내"처럼 범위로 된 원본 텍스트를 "10분이내"(상한만)로 축약해서 보여준다.
// (필터링 자체는 parseSubwayWalk()의 상한 기준 그대로, 이건 화면 표시만 간결하게 바꾸는 것)
// 지하철 검색 탭(renderSubway)과 단지 분석 탭(subwayMetaHTML) 양쪽에서 공용으로 사용(2026.08).
function formatWalkDisplay(raw){
  if(!raw) return '';
  const nums = (String(raw).match(/\d+/g) || []).map(Number);
  if(nums.length >= 2) return `${nums[1]}분이내`;
  return raw;
}
// K-apt 표기는 "...아파트"까지 붙어서 오는 경우가 있는데(예: "롯데캐슬캠퍼스타운아파트"), 실거래 등록명·
// 다른 탭 표기 관행에 맞춰 화면엔 접미사를 떼고 보여준다(2026.08, 수민 요청 — matchComplex()의 접미사
// 처리와는 별개로 "역세권 탭 표시 자체"를 정리).
function stripAptSuffix(name){ return name.replace(/아파트$/, ''); }
// 역세권 탭에서 화면에 실제로 보여줄 가격 배지 후보를 고른다 — 국민평형대(b3=55~65㎡, b5=80~95㎡) 우선,
// 최대 2개까지만, 부족하면 나머지 구간(b1/b2/b4/b6/b7)으로 채움(수민 요청, 2026.08 — 압구정미성2차처럼
// 30/47/55평 등 국민평형이 아닌 단지도 최소 하나는 뜨도록). 정렬 기준(평단가)도 반드시 이 함수로 뽑은
// 후보에서만 계산해야 한다 — 안 그러면 "전용면적 평단가" 탭 방식(단지 전체 유닛 중 평단가 1위, 화면엔
// 안 보이는 소형 특수평형일 수 있음)으로 정렬 순위를 매기면서 화면엔 전혀 다른(더 낮은 평단가의) 국민평형
// 가격만 보여주는 모순이 생김(2026.08, 수민 리포트 — "1위 단지가 화면상 평단가는 더 낮아 보이는데 왜 1위?").
const SUBWAY_PRICE_BAND_PRIORITY = ['b3','b5'];
function pickSubwayPriceCandidates(bandResults){
  const byKey = Object.fromEntries((bandResults||[]).map(r=>[r.key, r.trade]));
  const prioritized = SUBWAY_PRICE_BAND_PRIORITY.map(k=>byKey[k]).filter(Boolean);
  const rest = (bandResults||[]).filter(r=>!SUBWAY_PRICE_BAND_PRIORITY.includes(r.key)).map(r=>r.trade);
  return [...prioritized, ...rest].slice(0,2);
}
function renderSubway(d){
  const priceBadges = x => {
    const candidates = pickSubwayPriceCandidates(x.bandResults).sort((a,b)=>a.area-b.area);
    // py(평형)는 실거래 데이터를 서버에서 받아올 때 이미 areaToPy()로 계산돼 있는 값을 그대로 재사용
    // (2026.08 — 공급면적 실측 배치가 아직 안 돌아서 보간표 기반 추정값이지만, 새로 개편된 앵커 기준)
    const parts = candidates.map(t => `<div><span style="font-size:10px">${esc(t.py)}평(전용${Math.floor(t.area)})</span> <b style="color:var(--teal-dark)">${t.amt.toFixed(1)}억</b></div>`);
    return parts.length ? `<span class="val" style="text-align:right;font-size:11px;white-space:nowrap">${parts.join('')}</span>` : '';
  };
  const withBadges = d.rows.map(x=>({ x, badge: priceBadges(x) }));
  // 실거래 매칭이 안 돼 가격 뱃지가 비는 단지는 역세권 탭에서 아예 숨긴다(수민 요청, 2026.08) —
  // 이 탭은 "도보 N분 이내·평단가 높은 순" 랭킹이 핵심인데, 오른쪽 가격이 안 뜨는 항목은 랭킹 기준 자체를
  // 보여줄 수 없어 목록에 있어봐야 혼란만 줌.
  const filtered = withBadges.filter(({badge})=>badge);
  const rows = filtered.length
    ? filtered.map(({x,badge},i)=>`<div class="rk"><span class="no">${i+1}</span>
        <span class="nm"><span class="nm-title"><span class="clickable" onclick="quick('${esc(stripAptSuffix(x.name))}')">${esc(stripAptSuffix(x.name))}</span></span><small>지하철 도보${esc(formatWalkDisplay(x.subwayWalk))}${x.useDate? ` · ${x.useDate.slice(0,4)}년 준공`:''}${x.hhcnt? ` · ${x.hhcnt.toLocaleString()}세대`:''}</small></span>
        ${badge}
      </div>`).join('')
    : '<div class="rng" style="padding:6px 0">조건에 맞는 단지가 없습니다</div>';
  const html = `
  <div class="card">
    <div class="card-hd">
      ${hdTop('역세권')}
      <h2>${esc(shortRegionLabel(d.regionName))}</h2>
      <div class="meta">도보 ${d.maxWalk}분 이내 · 전용면적 평단가 높은 순</div>
    </div>
    <div class="sec">
      ${rows}
    </div>
  </div>
  <div class="src-note">출처: 국토교통부 K-apt(세대수·지하철) · 실거래가(전용면적 평단가·전용 20~200㎡ 최근 실거래가 중 최대 2개, 국민평형(55~65·80~95㎡) 우선, 최근 3년)</div>`;
  const r = document.getElementById('result'); r.innerHTML=html; r.classList.add('on');
}

// 랭킹류(지역/거래량/등락/저평가) 공용: 매매 데이터에 분양권을 이름 정규화해서 합친다.
// 표기(띄어쓰기 등)만 다른 같은 단지가 별개 항목으로 갈라지지 않도록 정규화 —
// 1) 분양권 단지명을 매매 쪽 표기에 맞춤(exact→substring), 2) 매매에 아예 없는(분양권 전용) 단지는 분양권끼리도 표기 통일
// (지역 복수 선택 통합 랭킹에서도 동일 로직을 써야 해서 2026.07 공용 함수로 분리)
function mergeTradeAndPresaleForRanking(raw, rawP){
  try{
    const tradeNames = [...new Set(raw.map(t=>t.apt))];
    const tradeNormMap = {};
    tradeNames.forEach(n=>{ const norm=n.replace(/\s/g,''); if(!tradeNormMap[norm]) tradeNormMap[norm]=n; });

    const presaleNames = [...new Set(rawP.map(t=>t.apt))];
    const presaleCount = {}; rawP.forEach(t=>presaleCount[t.apt]=(presaleCount[t.apt]||0)+1);
    const presaleNormRep = {};
    presaleNames.forEach(n=>{
      const norm = n.replace(/\s/g,'');
      if(!presaleNormRep[norm] || presaleCount[n] > presaleCount[presaleNormRep[norm]]) presaleNormRep[norm] = n;
    });

    const nameMap = {};
    presaleNames.forEach(pname=>{
      const norm = pname.replace(/\s/g,'');
      if(tradeNormMap[norm]){ nameMap[pname] = tradeNormMap[norm]; return; }
      const matched = tradeNames.find(n=>{ const tn=n.replace(/\s/g,''); return tn.includes(norm)||norm.includes(tn); });
      nameMap[pname] = matched || presaleNormRep[norm];
    });

    const convertedP = rawP.map(t=>({
      apt:nameMap[t.apt], umd:t.umd, area:t.area, py:t.py, amt:t.amt, ym:t.ym, d:t.d,
      floor:t.floor||'', build:'', direct:t.direct, kind:t.ownership||'분양권'
    }));
    return raw.concat(convertedP);
  }catch(e){ return raw; }
}

async function search(){
  // 지하철 검색 탭은 실거래(analyze.mjs) 기반이 아니라 세대수 배치 데이터(data/hhcnt/<lawd>.json)만 쓰는
  // 완전히 별개의 조회라, 아래 매매·분양권 조회 파이프라인을 전혀 안 타고 여기서 바로 갈라진다.
  if(mode==='subway') return searchSubway();
  const myToken = ++searchToken;
  updateRegionFavBtn();
  renderFavRegions();
  const name = document.getElementById('q').value.trim();
  const lawd = sel.value;
  let cmpItems = [];
  if(mode==='compare'){
    cmpItems = [...document.querySelectorAll('.cmp-row')].map(r=>({
      lawd: r.querySelector('select').value,
      name: r.querySelector('input').value.trim()
    })).filter(x=>x.name.length>=2);
    if(cmpItems.length<2){ showError('비교할 단지를 2개 이상 입력해 주세요.'); return; }
  }
  if(mode==='complex' && name.length<2){ showError('단지명을 2자 이상 입력해 주세요.'); return; }
  if(mode!=='compare' && !lawd && regionSel.length===0){ showError('지역을 선택해 주세요.'); return; }
  document.getElementById('error').classList.remove('on');
  const r = document.getElementById('result'); r.classList.remove('on'); r.innerHTML='';
  const mN = +document.getElementById('monthsN').value;
  const fM = (mode==='region'||mode==='volume'||mode==='updown'||mode==='peak'||mode==='longpeak'||mode==='longpeakdong'||mode==='newhigh'||mode==='newlow'||mode==='pyprice'||mode==='shortval'||mode==='gap') ? 0 : +document.getElementById('floorMin').value; // 이 탭들은 층수 필터 UI 자체를 숨겼으므로(고정 내부 층수 규칙 사용) 계산에서도 항상 무시
  // 연간 저평가: 올해 1월~현재월(N개월) vs 작년 1~12월(12개월) 캘린더 연도 비교 → 실제 분석에 필요한 개월수 = 현재월+12
  const curMonthNum = new Date().getMonth()+1; // 1~12
  // 신고가 탭: "선택 기간"이 아니라 그 단지 최고가 갱신 여부를 봐야 하므로, 조회기간 셀렉트와 무관하게
  // 고정 기간으로 분석한다 — 그 안에서 최고가가 최근 한 달(30일) 이내 세워졌는지를 판단(완전한 전체 역대 최고가는
  // 아니지만, RTMS 조회 가능 범위 안에서 근사). 최초엔 5년(60개월)으로 구현했는데, 콜드 캐시 상태에서 6개 조각을
  // 받아와야 해서 처음 조회하는 지역은 응답이 느려(로그 기준 조각당 1~5초) 사용자가 답답해서 새로고침·재시도를
  // 반복하다 매번 이전 요청이 취소(HTTP 499)되는 문제가 있었음(2026.07) — 3년(36개월, 조각 4개)으로 줄여 완화
  const neededMN = (mode==='updown'||mode==='shortval') ? 4 : (mode==='peak' ? 12 : ((mode==='longpeak'||mode==='longpeakdong') ? curMonthNum+12 : ((mode==='newhigh'||mode==='pyprice') ? 36 : (mode==='newlow' ? 12 : (mode==='gap' ? 3 : mN))))); // 등락 랭킹·단기 저평가는 최근 2개월 vs 이전 2개월(4개월) / 반기 저평가는 최근 6개월 vs 이전 6개월 최고가(12개월, 2026.07 분기(3+3)→반기(6+6)로 변경) / 연간 저평가(동일 동 포함)는 올해(1~현재월) vs 작년(1~12월) 캘린더 연도 비교 / 신고가·평단가는 3년 고정(2026.07 5년→3년, 콜드 캐시 부하 완화) / 신저가는 1년 고정(2026.08, 2년→1년으로 축소, 수민 요청) / 전세가율 랭킹은 최근 3개월 평균 고정(2026.08, 12개월→2개월→3개월로 완화 — 2개월은 표본이 너무 좁아서 조회되는 단지 수가 급감)
  // 저평가 계열 네 탭(단기·분기·연간 저평가, 등락 랭킹)은 실제 분석 창(neededMN)과 무관하게 API 조회 자체는 항상 24개월로 통일
  // → 같은 지역에서 이 탭들을 오가며 검토할 때 매번 다른 개월수를 새로 조회하지 않고 동일한 24개월(2×12개월 샤드) 캐시를 그대로 공유함. 분석 로직·기간 표시는 기존과 동일하게 neededMN만큼만 사용(아래 windowF로 걸러냄)
  // 나머지 모든 탭(지역·거래량·단지분석·단지비교)도 같은 이유로 최소 24개월치를 조회한다 — 디폴트든 사용자가 12개월을 직접 선택했든, 실제 API 조회는 항상 24개월 이상이라 어떤 탭으로 옮겨가도 이미 캐싱된 24개월 안에서 서로 겹쳐 재조회가 없다.
  // 표시상 개월수(neededMN)는 그대로 유지되고, 사용자가 36개월 이상을 직접 선택하면 그 값을 그대로 따른다(24는 하한선일 뿐 상한이 아님).
  // '○○ 전체' 통합 조회는 지역 수(서울 25 / 경기 39 / 인천 10)만큼 조회량이 배가되므로
  // 24개월 하한(탭 간 캐시 공유 목적)을 적용하지 않고 선택한 기간만 조회한다.
  // 지역 랭킹·저평가(단기/반기/연간) 복수 선택: 칩이 하나라도 있으면 그 목록으로, 없고 셀렉트가 '○○ 전체'면 그 시·도 전체로 조회
  const multiTargets = !(mode==='region'||mode==='shortval'||mode==='peak'||mode==='longpeak'||mode==='longpeakdong'||mode==='newhigh'||mode==='newlow'||mode==='pyprice') ? []
    : (regionSel.length ? regionSel.slice() : (isAllScope(sel.value) ? lawdsOfScope(sel.value) : []));
  const allScope = multiTargets.length > 0;
  const effMN = allScope
    ? ((mode==='shortval'||mode==='peak'||mode==='longpeak'||mode==='longpeakdong'||mode==='newhigh'||mode==='newlow'||mode==='pyprice') ? neededMN : mN) // 이 네 탭은 고정 분석 창(neededMN)이 있어 '○○ 전체'에서도 그만큼만 조회 — mN(숨겨진/공유 셀렉트 잔여값)을 쓰면 필요한 개월수와 안 맞을 수 있음
    : (mode==='updown'||mode==='peak'||mode==='longpeak'||mode==='longpeakdong'||mode==='shortval'||mode==='gap'||mode==='newlow') ? 24 : ((mode==='newhigh'||mode==='pyprice') ? 36 : Math.max(mN, 24));
  document.getElementById('loadMsg').textContent = effMN+'개월 실거래 조회·분석 중…';
  document.getElementById('loading').classList.add('on');
  document.getElementById('btn').disabled = true;

  try{
    const months = lastMonthsYm(neededMN); // 분석 창(윈도우) 계산용 — effMN치로 받아온 원본 중 이 개월들만 실제 분석에 사용
    const neededSet = new Set(months);
    const floorF = arr => fM ? arr.filter(t=>parseInt(t.floor,10)>=fM) : arr;
    // 모든 탭이 이제 effMN(≥24개월)치로 받아오므로, 실제 분석 창(neededMN)보다 더 받아온 만큼은 항상 걸러내야 한다
    // (mN이 24 이상으로 선택된 경우엔 effMN===neededMN이라 필터링이 그대로 통과, 즉 no-op)
    const windowF = arr => arr.filter(t=>neededSet.has(t.ym));
    let d;
    let rawP = [];
    let rawJ = [];

    if(allScope){
      // 시·도 전체 통합 조회: 브라우저·서버 양쪽 부하를 감안해 한 번에 6개 지역씩 끊어서 조회한다
      // (25~39개를 동시에 던지면 모바일에서 일부 요청이 타임아웃되거나 순서가 크게 밀림)
      const targets = multiTargets;
      const merged = [];
      const failed = [];
      const CHUNK = 6;
      for(let i=0;i<targets.length;i+=CHUNK){
        const part = targets.slice(i, i+CHUNK);
        document.getElementById('loadMsg').textContent =
          `${targets.length}개 지역 조회 중… (${Math.min(i+CHUNK,targets.length)}/${targets.length})`;
        // 매매·분양권을 구별로 동시에 조회 — 이름 정규화 병합은 구 단위로 해야 한다(다른 구에 같은 단지명이
        // 존재할 수 있어, 전체를 한꺼번에 정규화하면 서로 다른 구의 단지가 잘못 합쳐질 수 있음)
        const gotPairs = await Promise.all(part.map(t => Promise.all([
          ensureMonths(t.lawd, effMN).catch(()=>{ failed.push(t.name); return []; }),
          ensureMonthsP(t.lawd, effMN).catch(()=>[]),
        ])));
        gotPairs.forEach(([tradeArr, presaleArr], k)=>{
          const guName = part[k].name, guLawd = part[k].lawd;
          const mergedGu = mergeTradeAndPresaleForRanking(tradeArr, presaleArr);
          // 통합 랭킹에서는 어느 구인지 표시해야 하므로 거래마다 구 이름과 법정동코드를 붙인다
          // (법정동코드는 세대수 API를 그 구로 정확히 라우팅하는 데도 쓰임 — 아래 attachAll 참조)
          for(const t of mergedGu) merged.push({ ...t, gu: guName, lawd: guLawd });
        });
      }
      let items = floorF(windowF(merged));
      // 헤더 제목: 1~4개면 이름을 나열하고, 그보다 많으면 "○○ 외 N곳"으로 축약 (2026.08 3→4개로 확대)
      const names = targets.map(t=>t.name);
      const scopeLabel = regionSel.length
        ? (names.length<=4 ? names.join(' · ') : `${names[0]} 외 ${names.length-1}곳`)
        : sel.options[sel.selectedIndex].textContent;
      if(mode==='shortval'||mode==='peak'||mode==='longpeak'||mode==='longpeakdong'){
        // 이 세 탭은 평형(20~39평 고정, 20평대/30평대 평대별)·연식 필터 UI가 없어 items를 그대로 각자의 분석 함수에 넘긴다(단일 지역 조회와 동일한 방식)
        if(!items.length){
          d = {found:false, note:'선택한 조건에 맞는 거래가 없습니다. 기간을 조정해 보세요.'};
        } else {
          d = mode==='shortval' ? analyzeShortUndervalue(items, months, items)
            : mode==='peak' ? analyzePeakUndervalue(items, months, items)
            : analyzeLongPeakUndervalue(items, months, items, mode==='longpeakdong');
          d.scopeLabel = scopeLabel;
          d.failedRegions = failed;
        }
      } else if(mode==='newhigh'||mode==='newlow'||mode==='pyprice'){
        // 신고가·신저가·전용면적 평단가는 동일한 필터 UI 사용: 연식 필터 + 평형 다중 선택(pyBandMultiSel)
        items = pyBandMultiFilter(items);
        items = applyBuildYearFilter(items);
        if(!items.length){
          d = {found:false, note:'선택한 평형·연식 조건에 맞는 거래가 없습니다. 필터를 조정해 보세요.'};
        } else {
          d = mode==='newhigh' ? analyzeNewHigh(items, months) : mode==='newlow' ? analyzeNewLow(items, months) : analyzePricePerPyeong(items, months);
          d.pyBand = pyBandMultiSel.length ? pyBandMultiLabel() : null;
          d.buildYear = buildYearLabel();
          d.scopeLabel = scopeLabel;
          d.failedRegions = failed;
        }
      } else {
        items = pyBandMultiFilter(items);
        items = applyBuildYearFilter(items);
        if(!items.length){
          d = {found:false, note:'선택한 조건에 맞는 거래가 없습니다. 기간이나 평형을 조정해 보세요.'};
        } else {
          d = analyzeRegion(items, months);
          d.pyBand = pyBandMultiSel.length ? pyBandMultiLabel() : null;
          d.buildYear = buildYearLabel();
          d.scopeLabel = scopeLabel;
          d.failedRegions = failed;
        }
      }
    } else if(mode==='compare'){
      const uniq = [...new Set(cmpItems.map(x=>x.lawd))];
      // 단지 분석과 동일하게 매매+분양권을 병렬로 함께 조회 — 매매 실거래가 없는 분양권 전용(신축) 단지도 비교 가능하도록
      const [fetched, fetchedP] = await Promise.all([
        Promise.all(uniq.map(ld=>ensureMonths(ld, effMN))),
        Promise.all(uniq.map(ld=>ensureMonthsP(ld, effMN).catch(()=>[]))),
      ]);
      const byLawd = {};
      uniq.forEach((ld,i)=>{
        const merged = mergeTradeAndPresaleForRanking(fetched[i], fetchedP[i]);
        byLawd[ld]=floorF(windowF(merged));
      });
      d = analyzeCompare(byLawd, cmpItems, months);
    } else {
      // 매매·분양권·전세를 병렬로 동시에 조회 (기존에는 매매 끝난 뒤 분양권을 순차로 기다려서 응답 시간이 그대로 합산됐음)
      // 전세는 단지 분석 탭에서만 쓰므로, 다른 탭(지역/거래량/등락 랭킹 등)에서는 호출 자체를 하지 않는다.
      const [raw, rawPFetched, rawJFetched] = await Promise.all([
        ensureMonths(lawd, effMN),
        ensureMonthsP(lawd, effMN).catch(()=>[]),
        (mode==='complex'||mode==='gap') ? ensureMonthsJ(lawd, effMN).catch(()=>[]) : Promise.resolve([]),
      ]);
      rawP = rawPFetched;
      rawJ = rawJFetched;
      // 분양권·입주권도 매매와 합쳐서 함께 분석 (평균·차트·최고가 배지 전부 반영)
      // 매매 데이터가 아예 없는 "분양권 전용" 신축 단지(예: 아직 준공 전)도 조회 가능해야 하므로,
      // 매매·분양권 양쪽에서 독립적으로 이름 매칭을 시도한 뒤 병합한다 (매매 매칭 성공 여부와 무관하게 분양권도 항상 시도).
      let rawMerged = raw;
      if(mode==='complex'){
        try{
          const fuzzyMatch = (arr, nm) => {
            const qn = nm.replace(/\s/g,'');
            let hits = arr.filter(t=>t.apt.replace(/\s/g,'')===qn);
            if(!hits.length) hits = arr.filter(t=>{ const an=t.apt.replace(/\s/g,''); return an && (an.includes(qn)||qn.includes(an)); });
            if(!hits.length) return null;
            const nameCnt={}; hits.forEach(t=>nameCnt[t.apt]=(nameCnt[t.apt]||0)+1);
            const officialName = Object.entries(nameCnt).sort((a,b)=>b[1]-a[1])[0][0];
            return { hits, officialName };
          };
          const mTrade = fuzzyMatch(raw, name);
          const mPresale = fuzzyMatch(rawP, name);
          if(mTrade || mPresale){
            // 매매 쪽 이름·준공년도를 우선 채택 (더 공식적인 등기명), 매매가 없으면 분양권 자체 표기 사용
            const officialName = mTrade ? mTrade.officialName : mPresale.officialName;
            const buildYear = mTrade ? mTrade.hits[0].build : '';
            const pHits = mPresale ? mPresale.hits : [];
            const converted = pHits.map(t=>({
              apt: officialName, umd: t.umd || (mTrade ? mTrade.hits[0].umd : ''), area:t.area, py:t.py, amt:t.amt,
              ym:t.ym, d:t.d, floor:t.floor||'', build:buildYear, direct:t.direct, kind:t.ownership||'분양권'
            }));
            rawMerged = raw.concat(converted);
          }
        }catch(e){ rawMerged = raw; }
      } else if(mode==='region' || mode==='volume' || mode==='updown' || mode==='peak' || mode==='longpeak' || mode==='longpeakdong' || mode==='newhigh' || mode==='newlow' || mode==='pyprice' || mode==='gap'){
        rawMerged = mergeTradeAndPresaleForRanking(raw, rawP);
      }
      let items = windowF(floorF(rawMerged));
      if(mode==='region' || mode==='volume'){
        items = pyBandMultiFilter(items);
        items = applyBuildYearFilter(items);
        d = analyzeRegion(items, months);
        if(mode==='volume') d.mode = 'volume';
        d.pyBand = pyBandMultiSel.length ? pyBandMultiLabel() : null;
        d.buildYear = buildYearLabel();
        if(!items.length){ d = {found:false, note:'선택한 평형·층수·연식 조건에 맞는 거래가 없습니다. 필터를 조정해 보세요.'}; }
      } else if(mode==='newhigh'||mode==='newlow'||mode==='pyprice'){
        items = pyBandMultiFilter(items);
        items = applyBuildYearFilter(items);
        d = mode==='newhigh' ? analyzeNewHigh(items, months) : mode==='newlow' ? analyzeNewLow(items, months) : analyzePricePerPyeong(items, months);
        d.pyBand = pyBandMultiSel.length ? pyBandMultiLabel() : null;
        d.buildYear = buildYearLabel();
        if(!items.length){ d = {found:false, note:'선택한 평형·연식 조건에 맞는 거래가 없습니다. 필터를 조정해 보세요.'}; }
      } else if(mode==='shortval'){
        // 평형 필터 UI가 없는 탭(내부적으로 20~39평 고정, 20평대/30평대 평대별) — peak/longpeak와 동일한 패턴
        d = analyzeShortUndervalue(items, months, items);
        if(!items.length){ d = {found:false, note:'선택한 연식 조건에 맞는 거래가 없습니다. 필터를 조정해 보세요.'}; }
      } else if(mode==='updown'){
        items = pyBandMultiFilter(items);
        items = applyBuildYearFilter(items);
        d = analyzeUpDown(items, months);
        d.pyBand = pyBandMultiSel.length ? pyBandMultiLabel() : null;
        d.buildYear = buildYearLabel();
        if(!items.length){ d = {found:false, note:'선택한 평형·층수·연식 조건에 맞는 거래가 없습니다. 필터를 조정해 보세요.'}; }
      } else if(mode==='peak'){
        const itemsUnfiltered = items; // 평형 필터 UI가 없는 탭(20~39평 고정, 20평대/30평대 평대별) — "반기 저평가"는 이 데이터로 고정 계산
        d = analyzePeakUndervalue(items, months, itemsUnfiltered);
        if(!items.length){ d = {found:false, note:'선택한 조건에 맞는 거래가 없습니다. 기간을 조정해 보세요.'}; }
      } else if(mode==='longpeak'||mode==='longpeakdong'){
        const itemsUnfiltered = items; // 평형 필터 UI가 없는 탭(20~39평 고정, 20평대/30평대 평대별) — "연간 저평가"는 이 데이터로 고정 계산
        d = analyzeLongPeakUndervalue(items, months, itemsUnfiltered, mode==='longpeakdong');
        if(!items.length){ d = {found:false, note:'선택한 조건에 맞는 거래가 없습니다. 기간을 조정해 보세요.'}; }
      } else if(mode==='gap'){
        // 공개 탭(2026.08) — 매매·전세 실거래를 짝지어 전세가율(갭투자) 랭킹.
        items = pyBandMultiFilter(items); // 매매 쪽만 걸러도 충분 — 전세 쪽은 매칭 시 자연스럽게 걸러짐(아래 analyzeGapRanking 주석 참고)
        const rentItems = windowF(rawJ);
        d = analyzeGapRanking(items, rentItems, months);
        if(!d.rows.length){ d = {found:false, note:'선택한 평형 조건에 맞게 매매·전세가 모두 있는 단지가 없습니다. 지역이나 평형을 조정해 보세요.'}; }
      } else {
        d = analyzeComplex(items, name, months, rawMerged);
        // 전세는 매매·분양권과 합산하지 않고 독립적으로 분석(별도 서브탭). 이름 매칭도 전세 데이터 안에서
        // 자체적으로 시도하므로, 매매 매칭이 실패해도(예: 표기 차이) 전세는 따로 찾힐 수 있다.
        try{
          const itemsJ = windowF(floorF(rawJ));
          const dJ = analyzeComplex(itemsJ, name, months);
          d.jeonse = dJ.found ? dJ : null;
        }catch(e){ d.jeonse = null; }
      }
    }
    d.monthsN = neededMN;
    // 분양권 병합으로 매매 조회 기간보다 오래된 거래가 섞여 들어올 수 있으므로, 표시되는 "거래 기간" 문구도 실제 최고령 거래에 맞춰 보정
    if(d.found && d.mode==='complex' && d.trades && d.trades.length){
      const minYm = d.trades.reduce((m,t)=> t.date < m ? t.date : m, d.trades[0].date).slice(0,5);
      const [curStart, curEnd] = d.period.split(' ~ ');
      if(minYm < curStart) d.period = `${minYm} ~ ${curEnd}`;
    }
    d.floorMin = fM;
    // 세대수는 실거래 API와 완전히 별개인 국토부 공동주택 단지정보 API로 조회 — 매칭 실패해도 조용히 비워둠
    // 2026.07: 목록형 화면(지역·거래량·등락 랭킹, 단지 비교)은 fetchHHCntBatch로 lawd당 한 번에 묶어서 조회
    // (예전엔 최대 12건 동시 개별 조회 큐를 썼는데, 그래도 결국 목록 크기만큼 서버가 같은 정적 파일을
    // 반복해서 읽어야 했음 — 배치 엔드포인트로 바뀌면서 이 큐는 저평가 계열의 조기 종료 배치에만 남겨둠).
    // 2026.07 추가: 단지분석·지역/거래량/등락 랭킹·단지비교의 세대수는 표시용 부가 정보일 뿐 목록 자체를
    // 바꾸지 않으므로, 여기서 기다리지 않고 렌더링 이후 attachHHCountsAsync()에서 비동기로 채워 넣는다
    // (첫 화면이 뜨기까지 세대수 API 왕복 한 번만큼 더 안 기다려도 됨). 단, 아래 400세대 이상 필터처럼
    // 세대수가 목록 구성 자체를 바꾸는 경우는 예외적으로 렌더링 전에 그대로 기다린다.
    const HH_CONCURRENCY = 12; // 저평가 계열(아래) 조기 종료용 배치 크기로만 사용
    // 등락 랭킹의 "단기 저평가 단지"·반기/연간 저평가 탭도 동일하게 세대수 표시(비교 대상 목록 각 항목)
    // 저평가 계열(단기·반기·연간) 세 로직은 모두 400세대 이상 단지에만 적용 — 소규모 단지는 표본이 얇아 비교군·최고가 흐름이 쉽게 왜곡되어 저평가로 오탐되는 사례가 많음.
    // divergence는 이미 격차 큰 순으로 정렬돼 있으므로, 앞에서부터 HH_CONCURRENCY만큼 배치로 세대수를 조회하면서
    // 400세대 이상 조건을 만족하는 상위 50개(2026.07 10→30, 2026.08 30→50으로 확대)가 모이면 즉시 멈춘다 — 후보가 수십~수백 개여도 대부분 앞쪽 몇 배치만 조회하고 끝나서
    // (이전처럼 전체 후보의 세대수를 다 조회한 뒤 거르는 방식보다) 로딩이 느려지지 않는다.
    const DIVERGENCE_CAP = 50;
    if(d.found && (mode==='shortval'||mode==='peak'||mode==='longpeak'||mode==='longpeakdong') && d.divergence && d.divergence.length){
      const filtered = [];
      for(let i=0; i<d.divergence.length && filtered.length<DIVERGENCE_CAP; i+=HH_CONCURRENCY){
        const batch = d.divergence.slice(i, i+HH_CONCURRENCY);
        // 지역 복수선택 시 배치 안에 서로 다른 구의 단지가 섞여 있을 수 있으므로, 각 항목이 실제로 속한
        // 구(x.lawd)별로 나눠서 조회한다 — 항상 셀렉트에 표시된 지역(lawd) 하나로만 조회하면 다른 구 단지는
        // 세대수 매칭에 실패해 400세대 조건을 통과 못 하고 부당하게 누락됨(2026.07 지역 복수선택 추가 시 발견).
        const byLawd = {};
        batch.forEach(x=>{ const lw = x.lawd || lawd; (byLawd[lw] ||= []).push(x); });
        await Promise.all(Object.entries(byLawd).map(async ([lw, items])=>{
          const map = await fetchHHCntBatch(lw, items.map(x=>x.apt));
          items.forEach(x=>{ x.hh = map[x.apt] || null; });
        }));
        for(const x of batch){
          if(filtered.length>=DIVERGENCE_CAP) break;
          if(x.hh && x.hh.hhcnt>=400) filtered.push(x);
        }
      }
      d.divergence = filtered;
    }

    // 신저가 탭: 300세대 이상 단지만 집계 — 소규모 단지는 표본이 얇아 개별 거래 하나로도
    // "신저가"가 쉽게 왜곡될 수 있어 저평가 계열(400세대 기준)과 동일한 취지로 세대수 하한을 둔다.
    // 신고가 탭은 세대수 조건 없음(수민 요청 — 신저가에만 적용).
    if(d.found && mode==='newlow' && d.newLow && d.newLow.length){
      const byLawd = {};
      d.newLow.forEach(x=>{ const lw = x.lawd || lawd; (byLawd[lw] ||= []).push(x); });
      await Promise.all(Object.entries(byLawd).map(async ([lw, list])=>{
        const map = await fetchHHCntBatch(lw, list.map(x=>x.apt));
        list.forEach(x=>{ x.hh = map[x.apt] || null; });
      }));
      d.newLow = d.newLow.filter(x=>x.hh && x.hh.hhcnt>=300);
    }


    // 매매·병합 데이터로 매칭 실패했을 때, 분양권 원본(rawP)에서도 이름 유사 후보를 추가로 찾아 추천에 포함
    // (표기 순서가 뒤바뀐 경우 등 substring 매칭조차 실패하는 오타성 불일치를 "혹시 이 단지?"로 구제)
    if(!d.found && !d.multi && rawP.length){
      const q = name.replace(/\s/g,'');
      const grams=[]; for(let i=0;i+2<=q.length;i++) grams.push(q.slice(i,i+2));
      const pNames = [...new Set(rawP.map(t=>t.apt))].filter(n=>!(d.suggest||[]).includes(n));
      const pSugg = pNames.map(n=>[n, grams.filter(g=>n.replace(/\s/g,'').includes(g)).length])
        .filter(([,s])=>s>0).sort((a,b)=>b[1]-a[1]).slice(0,4).map(([n])=>n);
      d.suggest = [...(d.suggest||[]), ...pSugg];
    }

    // 이 사이 더 최신 검색(예: 지역랭킹에서 단지명 클릭 → 단지분석 검색)이 이미 시작됐다면,
    // 지금 결과는 낡은 것이므로 화면에 반영하지 않고 조용히 버린다.
    if(myToken !== searchToken) return;

    if(!d.found){
      if(d.multi){
        showError('여러 단지가 일치합니다. 단지를 선택해 주세요:<br>' +
          d.suggest.map(s=>`<a onclick="quick('${esc(s)}')">${esc(s)}</a>`).join(' · '));
        return;
      }
      showError((d.note || '해당 기간·층수 조건에 맞는 거래 내역이 없습니다. 기간을 늘리거나 층 필터를 풀어보세요.') +
        (d.suggest && d.suggest.length ? '<br>혹시 이 단지? ' + d.suggest.map(s=>`<a onclick="quick('${esc(s)}')">${esc(s)}</a>`).join(' · ') : ''));
      return;
    }
    lastData = d;
    if(d.mode==='complex') renderComplex(d); else if(d.mode==='compare') renderCompare(d); else if(d.mode==='updown') renderUpDown(d); else if(d.mode==='shortval') renderShortUndervalue(d); else if(d.mode==='peak') renderPeak(d); else if(d.mode==='longpeak') renderLongPeak(d); else if(d.mode==='longpeakdong') renderLongPeak(d); else if(d.mode==='volume') renderVolume(d); else if(d.mode==='newhigh') renderNewHigh(d); else if(d.mode==='newlow') renderNewLow(d); else if(d.mode==='pyprice') renderPricePerPyeong(d); else if(d.mode==='gap') renderGap(d); else renderRegion(d);
    // 지역랭킹처럼 긴 목록을 한참 스크롤한 상태에서 단지명을 클릭하면(quick()), 스크롤 위치가 그대로 유지된 채
    // 내용만 단지분석으로 바뀌어서 화면 중간(차트 아래쪽 등)부터 보이고, 그 위에 있는 평형별 요약표가 안 보이는
    // 것처럼 느껴지는 문제가 있었음 — 새 결과를 그릴 때마다 스크롤을 맨 위로 되돌린다.
    window.scrollTo(0, 0);
    pushView();
    saveLastRegionPref(lawd);
    // 즐겨찾기 단지를 방금 확인했으므로, "신규 거래" 배지 기준선을 지금 시점으로 갱신
    if(d.mode==='complex' && isFav(lawd, d.name)){
      favTradeCount(lawd, d.name).then(n=>{ setFavSeenCount(lawd, d.name, n); renderFavs(); }).catch(()=>{});
    }
    // 세대수는 표시용 부가 정보라 화면을 막지 않고 렌더링 이후 비동기로 채워 넣는다 (2026.07)
    attachHHCountsAsync(d, myToken, lawd);
  }catch(err){ if(myToken===searchToken) showError('오류: ' + esc(err.message)); }
  finally{
    if(myToken===searchToken){
      document.getElementById('loading').classList.remove('on');
      document.getElementById('btn').disabled = false;
    }
  }
}

// 단지 상세 헤더(#complexMeta)의 지하철 표시 조각. hhcnt.mjs가 subwayLines(배열)/subwayStation/subwayWalk를
// 함께 내려주므로(2026.08 추가) 세대수 옆에 이어붙인다. 정보가 하나도 없으면 빈 문자열(기존처럼 표시 안 함).
function subwayMetaHTML(hh){
  if(!hh || !hh.subwayWalk) return ''; // 역명/호선명 표시는 2026.08부터 전면 중단(K-apt 원본 데이터에 반복되는
  // 오기입 문제 — 경춘선(평촌목련2단지), 의정부경전철(한가람한양6차), 양평역(동탄 소재 단지) 등, 계속
  // 새로 발견될 때마다 하나씩 override 거는 방식으로는 근본 해결이 안 됨 — 대신 "지하철 도보 N분 이내"처럼
  // 구체적 역명/호선 없이 도보시간만 안내. subwayLines는 역세권 탭에서 "지하철 근처인지" 여부 판정에는
  // 계속 쓰이지만(호선 선택 필터 자체는 2026.08 삭제), 화면 표시에서는 이제 안 씀.
  return ` · 지하철 도보${esc(formatWalkDisplay(hh.subwayWalk))}`;
}
// 단지 상세 카드 헤더(#complexMeta) 전체 텍스트를 만드는 공용 함수 — renderComplex 최초 렌더와
// attachHHCountsAsync의 비동기 갱신이 서로 다른 문자열을 만들어 어긋나는 일이 없도록 하나로 합침.
function complexMetaHTML(d){
  return `${esc(d.umd)}${d.build? ` · ${d.build}년 준공` : ''}${d.hh? ` · ${d.hh.hhcnt.toLocaleString()}세대` : ''}${subwayMetaHTML(d.hh)} · ${esc(d.period)}${d.floorMin? ` · <b style="color:#7FD4D9">${d.floorMin}층 이상</b>`:''}`;
}

// 세대수(HH count)는 목록 자체를 바꾸지 않는 부가 표시 정보라, 메인 화면이 뜬 뒤
// 비동기로 채워 넣는다(2026.07 — 예전엔 이 API 응답을 기다린 뒤에야 표가 그려져서 체감 지연이 있었음).
// myToken이 이미 낡았으면(그 사이 다른 검색·탭전환·뒤로가기가 있었으면) 아무것도 건드리지 않고 조용히 종료.
// 단지 분석·단지 비교는 사용자가 이미 평형/서브탭을 조작했을 수 있어 전체 재렌더 대신 필요한 부분만 patch한다.
async function attachHHCountsAsync(d, myToken, lawd){
  try{
    if(d.mode==='complex'){
      d.hh = await fetchHHCnt(lawd, d.name);
      if(myToken!==searchToken) return;
      const el = document.getElementById('complexMeta');
      if(el) el.innerHTML = complexMetaHTML(d);
    } else if(d.mode==='region'){
      // highDeals 각 항목의 실제 lawd로 그룹핑해서 구별로 정확히 조회(복수 지역 통합 조회 대응)
      const byLawd = {};
      (d.highDeals||[]).forEach(x=>{ const lw = x.lawd || lawd; (byLawd[lw] ||= []).push(x); });
      await Promise.all(Object.entries(byLawd).map(async ([lw, list])=>{
        const map = await fetchHHCntBatch(lw, list.map(x=>x.apt));
        list.forEach(x=>{ x.hh = map[x.apt] || null; });
      }));
      if(myToken===searchToken) renderRegion(d); // 목록 화면이라 상태 유실 없이 전체 재렌더 가능
    } else if(d.mode==='volume'){
      if(d.topVolume && d.topVolume.length){
        const map = await fetchHHCntBatch(lawd, d.topVolume.map(x=>x.apt));
        d.topVolume.forEach(x=>{ x.hh = map[x.apt] || null; });
      }
      if(myToken===searchToken) renderVolume(d);
    } else if(d.mode==='newhigh'){
      if(d.newHigh && d.newHigh.length){
        // 지역 복수선택 시 항목마다 실제 소속 구가 다를 수 있으므로 구별로 그룹핑해서 조회(2026.07 신고가 지역 복수선택 추가)
        const byLawd = {};
        d.newHigh.forEach(x=>{ const lw = x.lawd || lawd; (byLawd[lw] ||= []).push(x); });
        await Promise.all(Object.entries(byLawd).map(async ([lw, list])=>{
          const map = await fetchHHCntBatch(lw, list.map(x=>x.apt));
          list.forEach(x=>{ x.hh = map[x.apt] || null; });
        }));
      }
      if(myToken===searchToken) renderNewHigh(d);
    } else if(d.mode==='newlow'){
      // 신저가는 300세대 필터 적용을 위해 search() 단계에서 이미 세대수를 조회·부착해뒀으므로(위 참고) 여기선 재조회 불필요
    } else if(d.mode==='pyprice'){
      // 평단가는 세대수를 표시하지 않는 탭이라 조회 자체를 생략(수민 요청 범위 밖 — 필요해지면 newhigh 분기처럼 추가하면 됨)
    } else if(d.mode==='updown'){
      const attachAll = (list) => list && list.length
        ? fetchHHCntBatch(lawd, list.map(x=>x.apt)).then(map=>{ list.forEach(x=>{ x.hh = map[x.apt] || null; }); })
        : Promise.resolve();
      await Promise.all([ attachAll(d.up), attachAll(d.down) ]);
      if(myToken===searchToken) renderUpDown(d);
    } else if(d.mode==='gap') {
      if(d.rows && d.rows.length){
        const byLawd = {};
        d.rows.forEach(x=>{ const lw = x.lawd || lawd; (byLawd[lw] ||= []).push(x); });
        await Promise.all(Object.entries(byLawd).map(async ([lw, list])=>{
          const map = await fetchHHCntBatch(lw, list.map(x=>x.apt));
          list.forEach(x=>{ x.hh = map[x.apt] || null; });
        }));
      }
      if(myToken===searchToken) renderGap(d);
    } else if(d.mode==='compare' && d.complexes && d.complexes.length){
      const byLawd = {};
      d.complexes.forEach(c=>{ (byLawd[c.lawd] ||= []).push(c); });
      await Promise.all(Object.entries(byLawd).map(async ([lw, arr])=>{
        const map = await fetchHHCntBatch(lw, arr.map(c=>c.name));
        arr.forEach(c=>{ c.hh = map[c.name] || null; });
      }));
      // renderCompare(d) 대신 drawCompare(d)만 다시 그려서, 사용자가 이미 선택해둔 단지별 평형(cmpPyMap)을 유지한다.
      if(myToken===searchToken && document.getElementById('cmpChart')) drawCompare(d);
    }
  }catch(e){ /* 세대수 조회 실패는 무시 — 메인 표는 이미 떠 있으므로 화면엔 영향 없음 */ }
}

// ── 차트 호버 툴팁 ──
function showTip(e, html){
  const tip = document.getElementById('tip');
  tip.innerHTML = html;
  tip.style.display = 'block';
  const w = tip.offsetWidth, h = tip.offsetHeight;
  let x = e.clientX + 12, y = e.clientY - h - 10;
  if(x + w > innerWidth - 8) x = e.clientX - w - 12;
  if(y < 8) y = e.clientY + 14;
  x = Math.min(Math.max(x, 8), innerWidth - w - 8);   // 왼쪽으로 뒤집었을 때 화면 밖으로 나가는 것 방지
  y = Math.min(Math.max(y, 8), innerHeight - h - 8);  // 아래로 옮겼을 때 화면 밑으로 잘리는 것 방지
  tip.style.left = x+'px'; tip.style.top = y+'px';
}
function hideTip(){ document.getElementById('tip').style.display='none'; }
function tipPointerHandler(e){
  const t = e.target.closest ? e.target.closest('[data-tip]') : null;
  if(t) showTip(e, t.getAttribute('data-tip'));
  else if(!(e.target.closest && e.target.closest('.chart-hover-capture'))) hideTip();
}
document.addEventListener('pointermove', tipPointerHandler);
document.addEventListener('pointerdown', function(e){
  tipPointerHandler(e);
  // 차트 바깥을 탭하면 고정된(pin) 툴팁·세로선 해제
  if(curChart.pinned >= 0 && !(e.target.closest && e.target.closest('.chart-hover-capture'))){
    curChart.pinned = -1;
    const line = document.getElementById('chartHoverLine');
    const dot = document.getElementById('chartHoverDot');
    if(line) line.style.opacity = 0;
    if(dot) dot.style.opacity = 0;
  }
  if(curMultiChart.pinned >= 0 && !(e.target.closest && e.target.closest('.chart-hover-capture'))){
    curMultiChart.pinned = -1;
    const line = document.getElementById('cmpHoverLine');
    if(line) line.style.opacity = 0;
  }
});

// ── SVG 월별 추이 차트 ──
// 호버/터치 상태 (차트는 항상 1개만 표시되므로 전역 변수로 관리)
let curChart = { monthly:[], xs:[], ys:[], tipFor:null, W:340, top:0, bottom:0, pinned:-1 };

function chartNearestIdx(e){
  const svgEl = e.currentTarget.closest('svg');
  const r = svgEl.getBoundingClientRect();
  const relX = (e.clientX - r.left) / r.width * curChart.W;
  let idx = 0, best = Infinity;
  curChart.xs.forEach((x,i)=>{ const dd = Math.abs(x-relX); if(dd<best){ best=dd; idx=i; } });
  return idx;
}
function chartHoverAt(e){
  if(!curChart.monthly.length) return;
  const idx = chartNearestIdx(e);
  const m = curChart.monthly[idx];
  const line = document.getElementById('chartHoverLine');
  const dot = document.getElementById('chartHoverDot');
  if(line){ line.setAttribute('x1', curChart.xs[idx]); line.setAttribute('x2', curChart.xs[idx]); line.style.opacity = 1; }
  if(dot){ dot.setAttribute('cx', curChart.xs[idx]); dot.setAttribute('cy', curChart.ys[idx]); dot.style.opacity = 1; }
  showTip(e, curChart.tipFor(m));
}
function chartHoverEnd(e){
  const line = document.getElementById('chartHoverLine');
  const dot = document.getElementById('chartHoverDot');
  if(curChart.pinned >= 0){
    // 다른 점을 훑어보다 벗어나면 고정된 점으로 되돌림
    const idx = curChart.pinned;
    if(line){ line.setAttribute('x1', curChart.xs[idx]); line.setAttribute('x2', curChart.xs[idx]); line.style.opacity = 1; }
    if(dot){ dot.setAttribute('cx', curChart.xs[idx]); dot.setAttribute('cy', curChart.ys[idx]); dot.style.opacity = 1; }
    if(e) showTip(e, curChart.tipFor(curChart.monthly[idx]));
    return;
  }
  if(line) line.style.opacity = 0;
  if(dot) dot.style.opacity = 0;
  hideTip();
}
function chartClick(e){
  if(!curChart.monthly.length) return;
  const idx = chartNearestIdx(e);
  if(curChart.pinned === idx){
    // 같은 점을 다시 탭 → 해당 월 개별 거래 상세
    showMonthDeals(curChart.monthly[idx].ym);
    curChart.pinned = -1;
    return;
  }
  curChart.pinned = idx;
  const m = curChart.monthly[idx];
  const line = document.getElementById('chartHoverLine');
  const dot = document.getElementById('chartHoverDot');
  if(line){ line.setAttribute('x1', curChart.xs[idx]); line.setAttribute('x2', curChart.xs[idx]); line.style.opacity = 1; }
  if(dot){ dot.setAttribute('cx', curChart.xs[idx]); dot.setAttribute('cy', curChart.ys[idx]); dot.style.opacity = 1; }
  showTip(e, curChart.tipFor(m));
}

// ── 차트 숫자 라벨 겹침 방지 헬퍼 ──
// points: [{cx, cy, ...}] (반드시 cx 오름차순으로 정렬해서 전달)
// offsets: 시도할 세로 오프셋 우선순위 배열 (예: [-8, 14, -24, 30] = 위 → 아래 → 더 위 → 더 아래)
// boxW/boxH: 라벨 하나가 차지하는 대략적인 가로/세로 크기(px). 이미 배치된 라벨과 겹치면 다음 오프셋을 시도한다.
function placeLabels(points, offsets, boxW, boxH){
  const placed = [];
  const overlaps = (a,b) => a.x1 < b.x2 && a.x2 > b.x1 && a.y1 < b.y2 && a.y2 > b.y1;
  points.forEach(p=>{
    let chosen = offsets[offsets.length-1];
    for(const dy of offsets){
      const ly = p.cy + dy;
      const box = {x1:p.cx-boxW/2, x2:p.cx+boxW/2, y1:ly-boxH/2, y2:ly+boxH/2};
      if(!placed.some(b=>overlaps(b,box))){ placed.push(box); chosen = dy; break; }
      if(dy===offsets[offsets.length-1]) placed.push(box); // 모든 후보가 겹쳐도 마지막 값으로 강제 배치
    }
    p.dy = chosen;
  });
  return points;
}

function chartSVG(monthly, pyLabel, dataRef, priceLabel){
  dataRef = dataRef || lastData;
  priceLabel = priceLabel || '매매가';
  const tipFor = m => {
    let s = `<b>20${m.ym}</b> · 평균 <b>${m.avg.toFixed(1)}억</b> · 거래 ${m.n}건`;
    if(pyLabel && dataRef && dataRef.trades){
      const deals = dataRef.trades.filter(t=>t.py===pyLabel && t.date.startsWith(m.ym) && !t.ex).map(t=>t.amt);
      if(deals.length>1) s += `<br>범위 ${Math.min(...deals).toFixed(1)}~${Math.max(...deals).toFixed(1)}억`;
      s += '<br><span style="opacity:.7">한 번 더 탭하면 개별 거래 보기</span>';
    }
    return s;
  };
  if(!monthly || monthly.length < 2) return '<div class="rng" style="padding:8px 0">월별 데이터 부족 (2개월 이상 거래 필요)</div>';
  const W=340, H=170, P={t:14,r:12,b:24,l:38};
  const volH = 26; // 하단 거래량 막대 영역
  const xs = monthly.map((_,i)=> P.l + i*(W-P.l-P.r)/(monthly.length-1));
  const vals = monthly.map(m=>m.avg);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  if(hi===lo){ hi+=0.5; lo-=0.5; }
  const pad=(hi-lo)*0.12; lo-=pad; hi+=pad;
  const y = v => P.t + (hi-v)/(hi-lo)*(H-P.t-P.b-volH);
  const maxN = Math.max(...monthly.map(m=>m.n));
  const gap = monthly.length>1 ? (W-P.l-P.r)/(monthly.length-1) : 0;
  const barW = Math.min(14, Math.max(3, gap*0.55));
  const volY = n => (H-P.b) - (n/maxN)*(volH-4);
  const pts = monthly.map((m,i)=>`${xs[i]},${y(m.avg).toFixed(1)}`).join(' ');
  const iMax = vals.indexOf(Math.max(...vals)), iMin = vals.indexOf(Math.min(...vals));
  const dense = monthly.length > 14;
  const fs = dense ? 8 : 9.5;
  // 값 라벨 겹침 방지: 인접 달의 평균가가 비슷해 라벨이 겹치면 자동으로 위/아래 배치를 조정
  const labelPos = monthly.map((m,i)=>({cx:xs[i], cy:y(m.avg)}));
  placeLabels(labelPos, [-8, 14, -24, 30], Math.max(20, fs*2.6), fs+3);

  // 호버 인터랙션용 상태 등록 (이 차트가 현재 화면에 표시되는 인스턴스 — 매매/전세 서브탭은 항상 하나만 DOM에 존재)
  curChart = { monthly, xs, ys: monthly.map(m=>y(m.avg)), tipFor, W, top:P.t, bottom:H-P.b-volH, dataRef, pyLabel };

  return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">
    ${[0,.5,1].map(f=>{ const gy=P.t+f*(H-P.t-P.b); const gv=(hi-f*(hi-lo)).toFixed(1);
      return `<line x1="${P.l}" y1="${gy}" x2="${W-P.r}" y2="${gy}" stroke="#E2E8F0" stroke-width="1"/>
      <text x="${P.l-5}" y="${gy+3.5}" text-anchor="end" font-size="9" fill="#94A3B8">${gv}억</text>`; }).join('')}
    ${monthly.map((m,i)=>`<rect x="${(xs[i]-barW/2).toFixed(1)}" y="${volY(m.n).toFixed(1)}" width="${barW.toFixed(1)}" height="${((H-P.b)-volY(m.n)).toFixed(1)}" rx="1.5" fill="#00828A" opacity=".18"/>`).join('')}
    <text x="${W-P.r}" y="${H-P.b-volH+4}" text-anchor="end" font-size="8" fill="#94A3B8">거래량 (최대 ${maxN}건)</text>
    <polyline points="${pts}" fill="none" stroke="#00828A" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${monthly.map((m,i)=>`
      <circle cx="${xs[i]}" cy="${y(m.avg).toFixed(1)}" r="${i===iMax||i===iMin?4:2.5}" fill="${i===iMax?'#DC2626':i===iMin?'#0F2B3D':'#00828A'}"/>
      <text x="${xs[i]}" y="${y(m.avg) + labelPos[i].dy}" text-anchor="middle" font-size="${fs}" font-weight="${i===iMax||i===iMin?'700':'500'}" fill="${i===iMax?'#DC2626':i===iMin?'#0F2B3D':'#475569'}">${m.avg.toFixed(1)}</text>
      ${(i===0||i===monthly.length-1||i%Math.ceil(monthly.length/5)===0)? `<text x="${xs[i]}" y="${H-8}" text-anchor="middle" font-size="9" fill="#94A3B8">${m.ym}</text>`:''}
    `).join('')}
    <line id="chartHoverLine" x1="${xs[0]}" y1="${P.t}" x2="${xs[0]}" y2="${H-P.b-volH}" stroke="#0F2B3D" stroke-width="1" stroke-dasharray="3 3" opacity="0" style="pointer-events:none;transition:opacity .1s"/>
    <circle id="chartHoverDot" cx="${xs[0]}" cy="${y(monthly[0].avg).toFixed(1)}" r="5" fill="#fff" stroke="#00828A" stroke-width="2.5" opacity="0" style="pointer-events:none;transition:opacity .1s"/>
    <rect class="chart-hover-capture" x="${P.l}" y="${P.t}" width="${(W-P.l-P.r).toFixed(1)}" height="${(H-P.t-P.b).toFixed(1)}" fill="transparent" style="pointer-events:all"
      onpointerdown="chartHoverAt(event)" onpointermove="chartHoverAt(event)" onpointerleave="chartHoverEnd(event)" onclick="chartClick(event)"/>
  </svg></div>
  <div class="chart-note">라인 = 월평균 ${priceLabel}(억) · 막대 = 월 거래량 · <span style="color:#DC2626">●</span>최고 <span style="color:#0F2B3D">●</span>최저<br>점을 탭하면 월/건수/범위 고정 표시, 다시 탭하면 상세</div>`;
}

let selPy = -1; // -1 = 전체
const TRADES_PAGE_SIZE = 100;
let tradesShown = TRADES_PAGE_SIZE; // "최근 거래 내역" 표시 건수 (더보기로 증가)
// ── 단지 분석 서브탭(매매/전세) ── 항상 하나만 렌더링(공유 DOM 컨테이너) — 전환 시 평형 선택은 초기화됨
let complexView = 'sale'; // 'sale' | 'jeonse'
function curComplexData(){ return complexView==='jeonse' ? (lastData && lastData.jeonse) : lastData; }
const SALE_TRADES_FOOT = '평균·차트·최고가는 직거래 및 시세(동일 평형 전후 3개월 중앙값) 대비 30% 이상 낮은 거래 제외 · 분양권·입주권(국토부 별도 API)도 매매와 합산해 평균·차트·최고가에 반영';
const JEONSE_TRADES_FOOT = '평균·차트·최고가는 시세(동일 평형 전후 3개월 중앙값) 대비 30% 이상 낮은 전세 거래 제외 · 월세가 붙은 계약(반전세 포함)은 집계에서 제외한 순수 전세만 집계';

function avgCell(a){
  return a? `<b>${a.v.toFixed(1)}</b><div class="rng">${a.n}건</div>` : '<span class="rng">-</span>';
}
function pyTableHTML(d){
  const list = selPy === -1 ? d.byPy : [d.byPy[selPy]];
  if(!list.length) return '';
  const qLabels = list[0].quarters.map(q=>q.label); // 4개 분기 라벨은 모든 평형이 동일
  return `<table>
    <tr><th>평형</th><th class="tr-r">${esc(qLabels[0])}</th><th class="tr-r">${esc(qLabels[1])}</th><th class="tr-r th-teal2">${esc(qLabels[2])}</th><th class="tr-r th-teal">${esc(qLabels[3])}</th><th class="tr-r th-max">최고가</th></tr>
    ${list.map(p=>`<tr>
      <td>${esc(p.py)}${p.isNewHigh?'<span class="nh">최고가</span>':''}<div class="rng" style="font-size:9px">${esc(p.area)}</div></td>
      <td class="tr-r">${avgCell(p.quarters[0].avg)}</td>
      <td class="tr-r">${avgCell(p.quarters[1].avg)}</td>
      <td class="tr-r td-teal2">${avgCell(p.quarters[2].avg)}</td>
      <td class="tr-r td-teal">${avgCell(p.quarters[3].avg)}</td>
      <td class="tr-r td-max"><b>${p.max.toFixed(1)}</b><div class="rng">${esc(p.maxDate)}</div></td>
    </tr>`).join('')}
  </table>`;
}

function tradesHTML(d, footNote){
  footNote = footNote || SALE_TRADES_FOOT;
  const full = selPy === -1 ? d.trades : d.trades.filter(t=>t.py===d.byPy[selPy].py);
  if(!full.length) return '<div class="rng" style="padding:6px 0">해당 평형 거래 없음</div>';
  const list = full.slice(0, tradesShown);
  const maxByPy = {}; d.byPy.forEach(p=>{ maxByPy[p.py] = p.max; });
  const maxMarked = new Set(); // list는 최신순 정렬이라, 평형별로 처음 만나는 최고가(=가장 최근 것)에만 표시
  const remain = full.length - list.length;
  return `<table>
    <tr><th>일자</th><th>평형</th><th>층</th><th class="tr-r">금액</th></tr>
    ${list.map(t=>{
      const isMax = !t.ex && maxByPy[t.py] === t.amt && !maxMarked.has(t.py);
      if(isMax) maxMarked.add(t.py);
      const cls = t.ex ? ' class="exrow"' : '';
      return `<tr${cls}><td>${esc(t.date)}</td><td>${esc(t.py)}<span class="rng" style="font-size:9px">${t.area? ` ${t.area.toFixed(2)}㎡`:''}</span>${isMax?'<span class="nh">최고가</span>':''}${t.ex?`<span class="extag">${esc(t.ex)} 제외</span>`:''}${t.kind?`<span class="extag" style="color:#00565C;background:#E0F2F3;border-color:#B9E4E6">${esc(t.kind)}</span>`:''}</td><td>${t.floor?esc(t.floor)+'층':'-'}</td><td class="tr-r"><b>${t.amt.toFixed(1)}억</b></td></tr>`;
    }).join('')}
  </table>
  ${remain>0? `<button onclick="showMoreTrades()" style="width:100%;margin-top:8px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--teal-dark);font-weight:700;font-size:12.5px;font-family:inherit;cursor:pointer">더보기 (${remain}건 남음)</button>` : ''}
  <div class="rng" style="margin-top:6px">${footNote}</div>`;
}
function showMoreTrades(){
  tradesShown += TRADES_PAGE_SIZE;
  const d = curComplexData();
  document.getElementById('tradesBox').innerHTML = tradesHTML(d, complexView==='sale'?SALE_TRADES_FOOT:JEONSE_TRADES_FOOT);
}

function trendHTML(d){
  const list = selPy === -1 ? d.byPy : [d.byPy[selPy]];
  const rows = list.map(p=>{
    if(!p.trend) return `<div class="trend" style="margin-bottom:8px">
      <span class="pct rng" style="font-size:13px">-</span>
      <span class="pct" style="color:var(--navy);white-space:nowrap;flex-shrink:0">${esc(p.py)}</span>
      <span class="d">전후 2개월 거래 부족으로 비교 불가</span>
    </div>`;
    const t = p.trend;
    return `<div class="trend" style="margin-bottom:8px">
      <span class="pct ${t.pct>=0?'up':'down'}">${t.pct>0?'+':''}${t.pct}%</span>
      <span class="pct" style="color:var(--navy);white-space:nowrap;flex-shrink:0">${esc(p.py)}</span>
      <span class="d">이전 2개월 평균 <b>${t.prevAvg.toFixed(1)}억</b><br>최근 2개월 평균 <b>${t.recentAvg.toFixed(1)}억</b></span>
    </div>`;
  }).join('');
  return rows || '<div class="rng">데이터 없음</div>';
}

function chartTarget(d){
  if(selPy !== -1) return selPy;
  return d.byPy.reduce((best,p,i,a)=> p.n>a[best].n? i:best, 0); // 전체 = 거래 최다 평형
}

// ── 층별 가격 프리미엄 미니 차트 ──
function fbRow(label, b, color, pct){
  if(!b) return '';
  return `<div class="fbar-row">
    <div class="fbar-lb"><b>${label}</b><span class="rng">${b.fmin}~${b.fmax}층<br>${b.n}건</span></div>
    <div class="fbar-track"><div class="fbar-fill" style="width:${pct}%;background:${color}"></div></div>
    <div class="fbar-v">${b.v.toFixed(1)}억</div>
  </div>`;
}
function floorPremiumHTML(d, ci){
  const fb = d.byPy[ci].floorBand;
  if(!fb) return '<div class="rng" style="padding:6px 0">저층·고층 비교에 필요한 거래(각 2건 이상)가 부족합니다</div>';
  const vals = [fb.low, fb.mid, fb.high].filter(Boolean).map(b=>b.v);
  const minV = Math.min(...vals), maxV = Math.max(...vals);
  // 스케일 기준을 3개 값의 min~max가 아니라 실제 가격의 ±15%로 고정 → 작은 차이가 막대 길이로 과장되지 않음
  const base = minV * 0.85;
  const top = Math.max(maxV, minV * 1.15);
  const pct = v => Math.max(12, Math.min(100, Math.round((v-base)/((top-base)||1)*100)));
  const premBadge = (label, b) => {
    if(!b) return '';
    const p = Math.round((b.v - fb.low.v)/fb.low.v*100);
    const up = p >= 0;
    return `<div style="text-align:center">
      <div class="pct ${up?'up':'down'}" style="font-size:18px">${up?'+':''}${p}%</div>
      <div class="rng" style="margin-top:1px">${label}</div>
    </div>`;
  };
  return `
    <div class="trend" style="margin-bottom:10px;gap:18px">
      ${premBadge('중층', fb.mid)}
      ${premBadge('고층', fb.high)}
      <span class="d">저층(${fb.low.fmin}~${fb.low.fmax}층 · ${fb.low.v.toFixed(1)}억) 대비 프리미엄</span>
    </div>
    ${fbRow('저층', fb.low, '#94A3B8', pct(fb.low.v))}
    ${fbRow('중층', fb.mid, '#00828A', fb.mid?pct(fb.mid.v):0)}
    ${fbRow('고층', fb.high, '#0F2B3D', pct(fb.high.v))}
    <div class="rng" style="margin-top:4px">현재 층수 필터와 무관하게, 해당 평형의 관측된 최저~최고 층을 5등분(저층 1구간·중층 2~4구간·고층 5구간)해 비교</div>`;
}

// ── 월 클릭 → 해당월 개별 거래 플로팅 산점도 ──
function showMonthDeals(ym){
  hideTip();
  // 현재 그려진 차트(curChart)가 매매/전세 중 어느 데이터를 참조하는지로 판단 — lastData 고정 참조 대신
  // curChart.dataRef를 써야 전세 서브탭 차트를 클릭했을 때도 전세 거래가 뜬다
  const d = curChart && curChart.dataRef;
  const py = curChart && curChart.pyLabel;
  if(!d || !py) return;
  const deals = d.trades.filter(t=>t.py===py && t.date.startsWith(ym));
  if(!deals.length) return;
  document.getElementById('mpopTitle').textContent = `${py} · 20${ym} 거래 ${deals.length}건`;

  const W=330,H=190,P={t:16,r:14,b:26,l:38};
  const days = deals.map(t=>+t.date.split('.')[2]);
  const amts = deals.map(t=>t.amt);
  let lo=Math.min(...amts), hi=Math.max(...amts);
  if(hi===lo){hi+=0.3;lo-=0.3}
  const pad=(hi-lo)*0.18; lo-=pad; hi+=pad;
  const x = day => P.l + (day-1)/30*(W-P.l-P.r);
  const y = v => P.t + (hi-v)/(hi-lo)*(H-P.t-P.b);
  const incl = deals.filter(t=>!t.ex);
  const mAvg = incl.length ? Math.round(incl.reduce((s,t)=>s+t.amt,0)/incl.length*10)/10 : null;
  const dense = deals.length > 12;
  // 숫자 라벨 겹침 방지: 날짜/가격이 가까운 거래끼리 라벨이 겹치면 위·아래로 자동 분산 배치
  const labelPts = incl.map(t=>{ const day=+t.date.split('.')[2]; return { t, cx:x(day), cy:y(t.amt) }; }).sort((a,b)=>a.cx-b.cx);
  placeLabels(labelPts, [-8, 16, -24, 32], 24, 12);
  const labelDyOf = new Map(labelPts.map(p=>[p.t, p.dy]));

  const svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">
    ${[0,.5,1].map(fr=>{ const gy=P.t+fr*(H-P.t-P.b); const gv=(hi-fr*(hi-lo)).toFixed(1);
      return `<line x1="${P.l}" y1="${gy}" x2="${W-P.r}" y2="${gy}" stroke="#E2E8F0"/>
      <text x="${P.l-5}" y="${gy+3.5}" text-anchor="end" font-size="9" fill="#94A3B8">${gv}억</text>`; }).join('')}
    ${mAvg!==null? `<line x1="${P.l}" y1="${y(mAvg)}" x2="${W-P.r}" y2="${y(mAvg)}" stroke="#00828A" stroke-dasharray="4 3" stroke-width="1.2" opacity=".6"/>
      <text x="${P.l-5}" y="${y(mAvg)-6}" text-anchor="end" font-size="8" fill="#00828A">평균</text>
      <text x="${P.l-5}" y="${y(mAvg)+4}" text-anchor="end" font-size="9.5" font-weight="900" fill="#00828A">${mAvg.toFixed(1)}</text>`:''}
    ${deals.map(t=>{
      const day = +t.date.split('.')[2];
      if(t.ex) return `<text x="${x(day)}" y="${y(t.amt)+4}" text-anchor="middle" font-size="11" fill="#94A3B8">✕</text>`;
      return `<circle cx="${x(day)}" cy="${y(t.amt)}" r="4" fill="#00828A"/>
        ${dense? '' : `<text x="${x(day)}" y="${y(t.amt) + (labelDyOf.get(t) ?? -8)}" text-anchor="middle" font-size="9" font-weight="700" fill="#0F2B3D">${t.amt.toFixed(1)}</text>`}`;
    }).join('')}
    ${[1,10,20,31].map(dd=>`<text x="${x(dd)}" y="${H-8}" text-anchor="middle" font-size="9" fill="#94A3B8">${dd}일</text>`).join('')}
  </svg>`;
  document.getElementById('mpopChart').innerHTML = svg;
  document.getElementById('mpop').classList.add('on');
}

function selectPy(i){
  selPy = i;
  tradesShown = TRADES_PAGE_SIZE;
  const d = curComplexData();
  if(!d) return;
  const isSale = complexView==='sale';
  const priceLabel = isSale ? '매매가' : '전세가';
  document.querySelectorAll('#pyChips .chip').forEach((c,j)=>c.classList.toggle('on', j===i+1));
  document.getElementById('pyTable').innerHTML = pyTableHTML(d);
  const ci = chartTarget(d);
  document.getElementById('chartTitle').textContent = `월평균 ${priceLabel} 추이 — ` + d.byPy[ci].py + (selPy===-1?' (거래 최다)':'');
  document.getElementById('chartBox').innerHTML = chartSVG(d.byPy[ci].monthly, d.byPy[ci].py, d, priceLabel);
  if(isSale){
    document.getElementById('floorTitle').textContent = '층별 가격 프리미엄 — ' + d.byPy[ci].py + (selPy===-1?' (거래 최다)':'') + ' · 최근 6개월';
    document.getElementById('floorBox').innerHTML = floorPremiumHTML(d, ci);
    document.getElementById('trendBox').innerHTML = trendHTML(d);
  }
  document.getElementById('tradesBox').innerHTML = tradesHTML(d, isSale?SALE_TRADES_FOOT:JEONSE_TRADES_FOOT);
}

// 단지 분석 카드 안의 가변 영역(평형칩·요약표·차트·[단기추세·층별프리미엄]·거래내역) — 매매/전세 서브탭 전환 시 이 부분만 다시 그림
// ── 전세가율(전세 뷰 전용) ──
// 매매 데이터(lastData)와 전세 데이터(lastData.jeonse)에서 같은 평형끼리 최근 분기 평균가를 비교.
// 매매 화면은 전혀 건드리지 않고 "전세" 토글을 눌렀을 때만 한 줄로 노출한다. (2026.07 추가)
// 단일 최신 거래가 아니라 분기 평균을 쓰는 이유: 거래가 드문 단지에서 한 건의 저층·특이 거래로 비율이 크게 튀는 것을 막기 위함.
function latestQAvg(p){
  if(!p || !p.quarters) return null;
  for(let i=p.quarters.length-1; i>=0; i--){ if(p.quarters[i].avg) return p.quarters[i].avg; } // 오래된→최신 순이므로 뒤에서부터
  return null;
}
function jeonseRatioHTML(){
  const sale = lastData, jeon = lastData && lastData.jeonse;
  if(!sale || !jeon || !sale.byPy || !jeon.byPy) return '';
  // 평형이 양쪽에 다 있는 경우만 비교 가능 — 전세 거래 건수가 가장 많은 평형을 대표로 삼는다
  const rows = [];
  jeon.byPy.forEach(jp=>{
    const sp = sale.byPy.find(x=>x.py===jp.py);
    if(!sp) return;
    const jAvg = latestQAvg(jp), sAvg = latestQAvg(sp);
    if(!jAvg || !sAvg || !sAvg.v) return;
    rows.push({ py:jp.py, pct: Math.round(jAvg.v/sAvg.v*100), jv:jAvg.v, sv:sAvg.v, n:jp.n });
  });
  if(!rows.length) return '';
  const rep = rows.slice().sort((a,b)=>b.n-a.n)[0]; // 전세 거래 최다 평형
  const others = rows.filter(r=>r.py!==rep.py).sort((a,b)=>b.n-a.n)
    .map(r=>`${esc(r.py)} <b style="color:var(--teal)">${r.pct}%</b>`).join(' · ');
  return `
    <div class="sec" style="padding-bottom:0">
      <h3>전세가율 — ${esc(rep.py)} (전세 거래 최다)</h3>
      <div style="display:flex;align-items:baseline;gap:8px;margin:2px 0 4px">
        <span style="font-size:26px;font-weight:700;color:var(--teal)">${rep.pct}%</span>
        <span class="rng">전세 ${rep.jv}억 ÷ 매매 ${rep.sv}억</span>
      </div>
      ${others? `<div class="rng">다른 평형 — ${others}</div>`:''}
      <div class="rng" style="margin-top:4px">최근 분기 평균가 기준 · 매매·전세 거래가 모두 있는 평형만 계산</div>
    </div>`;
}

// ── 단지 비교 렌더링 ──
const CMP_COLORS = ['#00828A','#DC2626','#0F2B3D','#D97706'];
let cmpPyMap = {}; // cmpPyMap: 단지 인덱스 -> 선택 평형 (단지별 독립 선택)

function cmpDefaultPyFor(c){
  // 32~36평(국민평형) 중 거래 최다 → 없으면 23~27평 중 거래 최다 → 그래도 없으면 전체 중 거래 최다
  const byRange = (lo,hi) => {
    let best=null, bestN=-1;
    c.pys.forEach(p=>{ const n=parseInt(p.py,10); if(n>=lo && n<=hi && p.n>bestN){ bestN=p.n; best=p.py; } });
    return best;
  };
  return byRange(32,36) || byRange(23,27) || (()=>{
    let best=null, bestN=-1;
    c.pys.forEach(p=>{ if(p.n > bestN){ bestN = p.n; best = p.py; } });
    return best;
  })();
}

let curMultiChart = { allYm:[], xs:[], series:[], W:340, top:0, bottom:0, pinned:-1 };
function multiChartNearestIdx(e){
  const svgEl = e.currentTarget.closest('svg');
  const r = svgEl.getBoundingClientRect();
  const relX = (e.clientX - r.left) / r.width * curMultiChart.W;
  let idx = 0, best = Infinity;
  curMultiChart.xs.forEach((x,i)=>{ const dd = Math.abs(x-relX); if(dd<best){ best=dd; idx=i; } });
  return idx;
}
function multiTipFor(idx){
  const ym = curMultiChart.allYm[idx];
  const rows = curMultiChart.series
    .map(s=>({ s, m: s.byYm.get(ym) }))
    .sort((a,b)=> (b.m?b.m.avg:-Infinity) - (a.m?a.m.avg:-Infinity)) // 비싼 단지가 위로
    .map(({s,m})=> `<span style="color:${s.color}">●</span> ${esc(s.label)}: ${m? `<b>${m.avg.toFixed(1)}억</b>` : '<span style="opacity:.6">거래 없음</span>'}`)
    .join('<br>');
  return `<b>20${ym}</b><br>${rows}`;
}
function multiChartHoverAt(e){
  if(!curMultiChart.allYm.length) return;
  const idx = multiChartNearestIdx(e);
  const line = document.getElementById('cmpHoverLine');
  if(line){ line.setAttribute('x1', curMultiChart.xs[idx]); line.setAttribute('x2', curMultiChart.xs[idx]); line.style.opacity = 1; }
  showTip(e, multiTipFor(idx));
}
function multiChartHoverEnd(e){
  const line = document.getElementById('cmpHoverLine');
  if(curMultiChart.pinned >= 0){
    const idx = curMultiChart.pinned;
    if(line){ line.setAttribute('x1', curMultiChart.xs[idx]); line.setAttribute('x2', curMultiChart.xs[idx]); line.style.opacity = 1; }
    if(e) showTip(e, multiTipFor(idx));
    return;
  }
  if(line) line.style.opacity = 0;
  hideTip();
}
function multiChartClick(e){
  const idx = multiChartNearestIdx(e);
  curMultiChart.pinned = curMultiChart.pinned===idx ? -1 : idx;
  if(curMultiChart.pinned<0){ multiChartHoverEnd(); return; }
  multiChartHoverAt(e);
}
function chartMulti(series){
  // series: [{label,color,monthly:[{ym,avg}]}]
  const act = series.filter(s=>s.monthly.length>=2);
  if(!act.length) return '<div class="rng" style="padding:8px 0">표시할 데이터 부족</div>';
  const allYm = [...new Set(act.flatMap(s=>s.monthly.map(m=>m.ym)))].sort();
  const val = (s,m)=> m.avg;
  const allVals = act.flatMap(s=>s.monthly.map(m=>val(s,m)));
  let lo=Math.min(...allVals), hi=Math.max(...allVals);
  if(hi===lo){hi+=1;lo-=1}
  const pad=(hi-lo)*0.12; lo-=pad; hi+=pad;
  const W=340,H=170,P={t:12,r:12,b:24,l:40};
  const x = ym => P.l + allYm.indexOf(ym)*(W-P.l-P.r)/Math.max(1,allYm.length-1);
  const y = v => P.t + (hi-v)/(hi-lo)*(H-P.t-P.b);
  const fmt = v => v.toFixed(1);
  const grid = [0,.5,1].map(fr=>{
    const gy=P.t+fr*(H-P.t-P.b); const gv=hi-fr*(hi-lo);
    return `<line x1="${P.l}" y1="${gy}" x2="${W-P.r}" y2="${gy}" stroke="#E2E8F0"/>
    <text x="${P.l-5}" y="${gy+3.5}" text-anchor="end" font-size="9" fill="#94A3B8">${fmt(gv)}억</text>`;
  }).join('');
  const lines = act.map(s=>{
    const pts = s.monthly.map(m=>`${x(m.ym).toFixed(1)},${y(val(s,m)).toFixed(1)}`).join(' ');
    const last = s.monthly[s.monthly.length-1];
    return `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${s.monthly.map(m=>`<circle cx="${x(m.ym).toFixed(1)}" cy="${y(val(s,m)).toFixed(1)}" r="2.5" fill="${s.color}"/>`).join('')}
    <text x="${x(last.ym)}" y="${y(val(s,last))-7}" text-anchor="end" font-size="9" font-weight="700" fill="${s.color}">${fmt(val(s,last))}</text>`;
  }).join('');
  // 호버/탭 시 같은 달 모든 단지 정보를 한 번에 보여주기 위한 상태 등록
  curMultiChart = {
    allYm, xs: allYm.map(x), W, top:P.t, bottom:H-P.b, pinned:-1,
    series: act.map(s=>({ label:s.label, color:s.color, byYm: new Map(s.monthly.map(m=>[m.ym, m])) })),
  };
  const step = Math.max(1, Math.ceil(allYm.length/5));
  const xlab = allYm.map((ym,i)=> (i===0||i===allYm.length-1||i%step===0)? `<text x="${x(ym)}" y="${H-8}" text-anchor="middle" font-size="9" fill="#94A3B8">${ym}</text>`:'').join('');
  return `<div class="chart-wrap"><svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">${grid}${lines}${xlab}
    <line id="cmpHoverLine" x1="${x(allYm[0])}" y1="${P.t}" x2="${x(allYm[0])}" y2="${H-P.b}" stroke="#0F2B3D" stroke-width="1" stroke-dasharray="3 3" opacity="0" style="pointer-events:none;transition:opacity .1s"/>
    <rect class="chart-hover-capture" x="${P.l}" y="${P.t}" width="${(W-P.l-P.r).toFixed(1)}" height="${(H-P.t-P.b).toFixed(1)}" fill="transparent" style="pointer-events:all"
      onpointerdown="multiChartHoverAt(event)" onpointermove="multiChartHoverAt(event)" onpointerleave="multiChartHoverEnd(event)" onclick="multiChartClick(event)"/>
  </svg></div>
  <div class="chart-note">탭하면 그 달 모든 단지 정보 고정 표시, 다시 탭하면 해제</div>`;
}

function cmpSeries(d){
  return d.complexes.map((c,i)=>{
    const py = cmpPyMap[i];
    const p = c.pys.find(p=>p.py===py);
    return { label:`${c.name}${py?' '+py:''}`, color:CMP_COLORS[i%4], monthly: p? p.monthly : [] };
  });
}

function drawCompare(d){
  document.getElementById('cmpChart').innerHTML = chartMulti(cmpSeries(d));
  document.getElementById('cmpLegend').innerHTML = d.complexes.map((c,i)=>{
    const opts = c.pys.map(p=>p.py).sort((a,b)=>parseInt(a)-parseInt(b));
    const cur = cmpPyMap[i];
    if(!opts.length) return `<span style="display:inline-flex;align-items:center;gap:5px;opacity:.4"><i style="background:${CMP_COLORS[i%4]}"></i>${esc(c.name)} (거래 없음)</span>`;
    return `<span style="display:inline-flex;align-items:center;gap:5px">
      <i style="background:${CMP_COLORS[i%4]}"></i>${esc(c.name)}
      <select onchange="selectCmpPyFor(${i}, this.value)" style="font-size:16px;font-weight:700;color:var(--navy);border:1.3px solid var(--line);border-radius:7px;padding:1px 4px;background:#fff;max-width:120px">
        ${opts.map(py=>{ const p=c.pys.find(p=>p.py===py); return `<option value="${esc(py)}"${py===cur?' selected':''}>${esc(py)}(${p.area}㎡)</option>`; }).join('')}
      </select>
    </span>`;
  }).join('');
  document.getElementById('cmpTable').innerHTML = d.complexes.map((c,i)=>{
    const py = cmpPyMap[i];
    const p = c.pys.find(p=>p.py===py);
    const dot = `<i style="display:inline-block;width:10px;height:3px;border-radius:2px;background:${CMP_COLORS[i%4]};flex:none"></i>`;
    if(!p) return `<div class="rk">${dot}<span class="nm"><span class="nm-title">${esc(c.name)}</span><small>${esc(c.umd)}${c.hh?` · ${c.hh.hhcnt.toLocaleString()}세대`:''}</small></span><span class="val rng">거래 없음</span></div>`;
    return `<div class="rk">
      ${dot}
      <span class="nm"><span class="nm-title">${esc(c.name)}</span><small>${esc(c.umd)}${c.hh?` · ${c.hh.hhcnt.toLocaleString()}세대`:''} · ${esc(py)}(${p.area}㎡)</small></span>
      <span class="val">${p.avg3? `<b>${p.avg3.v.toFixed(1)}억</b>`:'-'}<small>${p.avg3?`최근 3개월 ${p.avg3.n}건`:''}</small><small>최고 ${p.max.toFixed(1)}억 · 총 ${p.n}건</small></span>
    </div>`;
  }).join('');
}
