    for(const [ym, e] of Object.entries(raw)){
      if(cache[ym]) continue;
      cache[ym] = { t: e.t, items: e.i.map(a => Object.fromEntries(LS_FIELDS_J.map((k,j)=>[k, a[j]]))) };
    }
  }catch(e){}
}
function lsSaveJ(lawd){
  try{
    const cache = monthCacheJ[lawd]; if(!cache) return;
    const out = {};
    for(const [ym, e] of Object.entries(cache)) out[ym] = { t: e.t, i: e.items.map(t => LS_FIELDS_J.map(k => t[k])) };
    localStorage.setItem('apcJ:'+CACHE_VER+':'+lawd, JSON.stringify(out));
    const meta = JSON.parse(localStorage.getItem('apcJ:'+CACHE_VER+':meta') || '{}');
    meta[lawd] = Date.now();
    localStorage.setItem('apcJ:'+CACHE_VER+':meta', JSON.stringify(meta));
  }catch(e){
    // 용량 초과 → 가장 오래 안 쓴 지역부터 삭제 후 1회 재시도 (매매 캐시 lsSave와 동일한 정책)
    try{
      const meta = JSON.parse(localStorage.getItem('apcJ:'+CACHE_VER+':meta') || '{}');
      const victims = Object.entries(meta).filter(([k])=>k!==lawd).sort((a,b)=>a[1]-b[1]);
      if(victims.length){
        localStorage.removeItem('apcJ:'+CACHE_VER+':'+victims[0][0]);
        delete meta[victims[0][0]];
        localStorage.setItem('apcJ:'+CACHE_VER+':meta', JSON.stringify(meta));
        lsSaveJ(lawd);
      }
    }catch(e2){}
  }
}
async function postFetchJ(lawd, yms){
  const q = yms.slice().sort().join(',');
  const res = await fetch(`/api/rent?lawd=${encodeURIComponent(lawd)}&yms=${q}&v=${CACHE_VER}`);
  const d = await res.json().catch(()=>({}));
  if(!res.ok || d.error) throw new Error(d.error || '오류 ('+res.status+')');
  return d.items || [];
}
async function ensureMonthsJ(lawd, n){
  lsLoadJ(lawd);
  const yms = lastMonthsYm(n);
  const cache = monthCacheJ[lawd] = monthCacheJ[lawd] || {};
  const now = Date.now();
  const fresh = new Set(yms.slice(0,4)); // 최신 4개월: 매매 쪽과 동일한 TTL 정책
  const missing = yms.filter(ym =>
    !cache[ym] ||
    (fresh.has(ym) && now - cache[ym].t > FRESH_TTL_MS) ||
    (cache[ym].items.length === 0 && now - cache[ym].t > EMPTY_RETRY_TTL_MS) ||
    (!fresh.has(ym) && cache[ym].items.length > 0 && now - cache[ym].t > STALE_RETRY_TTL_MS)
  );
  if(missing.length){
    const freshMs = missing.filter(ym => fresh.has(ym));
    const stableMs = missing.filter(ym => !fresh.has(ym));
    const chunks = [];
    if(freshMs.length) chunks.push(freshMs);
    for(let i=0;i<stableMs.length;i+=12) chunks.push(stableMs.slice(i,i+12));
    const results = await fetchChunksLimited(chunks, postFetchJ, lawd);
    chunks.forEach(c => c.forEach(ym => { cache[ym] = {t: now, items: []}; }));
    results.flat().forEach(t => { if(cache[t.ym]) cache[t.ym].items.push(t); });
    lsSaveJ(lawd);
  }
  return yms.flatMap(ym => cache[ym] ? cache[ym].items : []);
}

// ── 세대수 조회 (국토부 공동주택 단지목록·기본정보 API, 실거래 API와 별도) ──
// K-apt(공동주택관리정보시스템) 가입 단지만 나와서 못 찾을 수 있음 — 실패해도 조용히 무시(단지 분석 자체엔 영향 없음)
// 재건축 전까지 거의 안 바뀌는 값이라 localStorage에 길게 캐시(찾은 경우 180일) — CDN 캐시(hhcnt.mjs)까지 다 맞아도
// 매 방문마다 최소 1번의 fetch 왕복은 남는데, 이걸로 재방문 시 완전히 0회 호출로 만든다.
// 단, 못 찾은 경우(v=null)는 TTL을 짧게(1일) 둬서 일시적 API 오류로 인한 미스가 영구 고정되지 않게 함
const HH_TTL_FOUND_MS = 1000*60*60*24*180; // 180일
const HH_TTL_MISS_MS = 1000*60*60*24;      // 1일
// ⚠️ HH_CACHE_VER 체크리스트 — matchKapt()의 매칭 로직(예: 임대/분양 우선순위 판정)이 바뀌거나,
// hhcnt.mjs 응답에 새 필드가 추가되는 등 응답 형태 자체가 바뀔 때도 반드시 +1 할 것
// (2026.08 subwayLines/subwayStation/subwayWalk 필드 추가 시 4→5로 올림 — 필드만 추가돼도 옛 캐시엔
// 그 필드가 아예 없어서, 버전을 안 올리면 브라우저 localStorage(180일)·CDN(90일) 양쪽 다 새 필드 없는
// 옛 응답을 계속 돌려줘 화면에 지하철 정보가 영원히 안 뜨는 문제가 있었음)
// 세대수는 브라우저 localStorage에 180일, hhcnt.mjs의 GET 엔드포인트는 Netlify CDN에 90일(durable) 캐시돼 있어서,
// matchKapt() 코드만 고치고 배포해도 이미 캐시된 옛(오매칭) 결과가 그대로 재사용돼 버그가 안 고쳐진 것처럼 보인다
// (실제 사례: 두산아파트 임대/분양 오매칭 수정 후에도 캐시 때문에 여전히 옛 세대수가 보이던 문제).
// 버전을 올리면 localStorage 키가 바뀌어 옛 캐시를 자동으로 안 쓰게 되고, 쿼리에도 반영돼 CDN 캐시 키도 달라진다.
// (2026.08 5→6: data/hhcnt 정적 배치를 수동 재수집(강남구 등)한 뒤에도, 배치 실행 전에 이미 조회했던 지역은
// 지하철 필드 없는 옛 응답이 localStorage(180일)에 그대로 남아있어 새로고침해도 안 보이는 문제 — 버전을 올려
// 기존 사용자 전원의 로컬 캐시를 강제 무효화)
// (2026.08 6→7: 도봉동 "한신" matchKapt 오매칭 수동 보정(MANUAL_OVERRIDE) 추가 — 이미 캐시된 옛(오매칭) 응답이
// 남아있으면 서버 로직을 고쳐도 그대로 재사용돼 화면엔 여전히 틀린 세대수·지하철 정보가 보임)
// (2026.08 7→8: 봉천동 두산 PARTIAL_OVERRIDE 추가(임대 3단지 560세대로 오매칭 → 2,001세대로 고정) —
// 이미 캐시된 옛 560세대 응답이 남아있으면 서버 로직을 고쳐도 그대로 재사용됨)
// (2026.08 8→9: 평촌목련2단지아파트 subwayLines PARTIAL_OVERRIDE 추가(원본 데이터의 경춘선 오기입 제거) —
// 이미 캐시된 옛(경춘선 포함) 응답이 남아있으면 서버 로직을 고쳐도 그대로 재사용됨)
// (2026.08 9→10: 한가람한양6차 subwayLines PARTIAL_OVERRIDE 추가(원본 데이터의 의정부경전철 오기입 제거))
const HH_CACHE_VER = 10;
let hhLS = null;
function hhLSLoad(){
  if(hhLS) return hhLS;
  try{ hhLS = JSON.parse(localStorage.getItem(`apcHH:${HH_CACHE_VER}`) || '{}'); }catch(e){ hhLS = {}; }
  return hhLS;
}
function hhLSSave(){ try{ localStorage.setItem(`apcHH:${HH_CACHE_VER}`, JSON.stringify(hhLS)); }catch(e){} }
const hhMem = {}; // `${lawd}|${name}` → 결과(또는 null), 세션 내 메모리 캐시(localStorage 조회도 아끼기 위함)
async function fetchHHCnt(lawd, name){
  const k = `${lawd}|${name}`;
  if(k in hhMem) return hhMem[k];
  const ls = hhLSLoad();
  const cached = ls[k];
  if(cached && Date.now() - cached.t < (cached.v ? HH_TTL_FOUND_MS : HH_TTL_MISS_MS)){
    hhMem[k] = cached.v;
    return cached.v;
  }
  let v = null, ok = false;
  try{
    const r = await fetch(`/api/hhcnt?lawd=${encodeURIComponent(lawd)}&name=${encodeURIComponent(name)}&v=${HH_CACHE_VER}`);
    const d = await r.json();
    v = (d && d.found) ? d : null;
    ok = true; // 응답을 정상적으로 받아 "찾음/못찾음"이 확정된 경우만 신뢰 가능
  }catch(e){ v = null; } // 네트워크·파싱 오류 — 결과를 신뢰할 수 없으므로 ok=false로 남겨 캐시하지 않음(다음 조회 시 바로 재시도)
  hhMem[k] = v; // 같은 세션(페이지) 안에서는 반복 재요청 방지용으로만 메모리에 저장
  if(ok){ ls[k] = { v, t: Date.now() }; hhLSSave(); } // 확정된 결과만 로컬스토리지에 영구 캐시
  return v;
}

// 목록형 화면(지역 랭킹 등)에서 같은 lawd의 여러 단지명을 한 번의 요청으로 묶어 조회.
// 이전엔 단지마다 /api/hhcnt를 개별 호출해(최대 100건) 서버가 매번 같은 data/hhcnt/<lawd>.json을
// 반복해서 읽어야 했음 — 캐시 미스분만 모아 POST 배치로 보내 서버가 그 파일을 딱 한 번만 읽게 한다.
// (2026.07 추가 — 지역 랭킹 5년·전체평형처럼 목록이 100건에 가까울 때 체감 로딩이 크게 줄어듦)
async function fetchHHCntBatch(lawd, names){
  const uniq = [...new Set(names)];
  const result = {};
  const ls = hhLSLoad();
  const need = [];
  for(const nm of uniq){
    const k = `${lawd}|${nm}`;
    if(k in hhMem){ result[nm] = hhMem[k]; continue; }
    const cached = ls[k];
    if(cached && Date.now() - cached.t < (cached.v ? HH_TTL_FOUND_MS : HH_TTL_MISS_MS)){
      hhMem[k] = cached.v; result[nm] = cached.v; continue;
    }
    need.push(nm);
  }
  if(need.length){
    try{
      const r = await fetch('/api/hhcnt', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ lawd, names: need }) });
      const d = await r.json();
      const map = (d && d.results) || {};
      for(const nm of need){
        const raw = map[nm];
        const v = (raw && raw.found) ? raw : null;
        const k = `${lawd}|${nm}`;
        hhMem[k] = v; ls[k] = { v, t: Date.now() };
        result[nm] = v;
      }
      hhLSSave();
    }catch(e){ for(const nm of need) result[nm] = null; } // 네트워크 오류 — 캐시하지 않고 다음 조회 시 재시도
  }
  return result;
}

// 매매 단지명(officialName)과 분양권 데이터를 매칭 — 표기가 완전히 같지 않을 수 있어 exact→substring 순으로 시도
// ═══ 분석 엔진 (클라이언트) ═══
const R1 = x => Math.round(x*10)/10;
// 저평가(단기/반기/연간) 비교군은 20평대(20~29)·30평대(30~39) 평대 단위로만 서로 비교 — 평대가 다르면 가격이 비슷해도 비교군에서 제외(2026.08)
const pyBand = py => { const n = parseInt(py,10); if(n>=20 && n<=29) return 20; if(n>=30 && n<=39) return 30; return null; };
const avgA = arr => arr.length ? arr.reduce((s,t)=>s+t.amt,0)/arr.length : null;
const dkey = t => `${t.ym}${t.d}`;
const median = a => { const s=a.slice().sort((x,y)=>x-y); const m=s.length>>1; return s.length%2? s[m] : (s[m-1]+s[m])/2; };
// 계약일(ym+d) 기준 조회 시점으로부터 최근 N일 이내인지 — "신규" 배지·"신고가"(둘 다 기본값 30일) 공용
// (국토부 API는 신고일자를 안 주므로 계약일 기준 근사치, 신고 지연이 있는 거래는 놓칠 수 있음)
function isRecentDeal(t, days=30){
  const y = +t.ym.slice(0,4), mo = +t.ym.slice(4,6), da = +t.d;
  if(!y || !mo || !da) return false;
  const dealDate = new Date(y, mo-1, da);
  return (Date.now() - dealDate.getTime()) <= days*24*3600*1000 && dealDate.getTime() <= Date.now();
}
// 준공연도(입주년차) 필터 — 지역/거래량/등락 랭킹 공용. build 정보가 없는 거래(분양권 등 일부)는 연식을
// 특정할 수 없어 필터가 걸려있을 때는 제외한다(전체 연식 선택 시에는 그대로 포함).
function applyBuildYearFilter(items){
  const v = document.getElementById('buildYear').value;
  if(!v) return items;
  const nowY = new Date().getFullYear();
  return items.filter(t=>{
    const by = parseInt(t.build, 10);
    if(!by) return false;
    const age = nowY - by;
    return v==='20+' ? age>20 : age<=(+v);
  });
}
function buildYearLabel(){
  const v = document.getElementById('buildYear').value;
  if(!v) return null;
  return v==='20+' ? '20년 초과' : `${v}년 이내`;
}
function markOutliers(arr, months){
  for(const t of arr){
    // ⚠️ 여기서 t.ex를 캐싱해 재계산을 건너뛰면 안 됨 — 거래 객체(t)는 monthCache에서 여러 화면(단지 분석/등락 랭킹/저평가)이
    // 공유 참조로 재사용하는데, 화면마다 arr(층 필터)·months(기간)가 달라 같은 거래라도 판정 기준(비교군)이 달라진다.
    // 이전 화면에서 계산된 값을 그대로 스킵하면 탭 진입 순서에 따라 결과가 달라지는 버그가 생기므로 매번 새로 계산한다.
    if(t.direct){ t.ex='직거래'; continue; }
    const mi = months.indexOf(t.ym);
    const win = arr.filter(o=>o!==t && !o.direct && Math.abs(months.indexOf(o.ym)-mi)<=3).map(o=>o.amt);
    if(win.length>=2){
      const ref = median(win);
      if(t.amt < ref*0.7){ t.ex='저가'; continue; }
    }
    t.ex = null;
  }
  return arr.filter(t=>!t.ex);
}

// ── 층별 가격 프리미엄 (저층/중층/고층 비교, 관측 범위 5등분: 1구간 저층·2~4구간 중층·5구간 고층) ──
// arr: 이미 이상치(직거래·저가)가 제외된 동일 단지·평형 거래 배열
// 필터로 설정한 floorMin과 무관하게 "관측된 최저~최고 층"을 5등분해 나누므로,
// 층수 필터를 걸어도(예: 10층 이상) 저층 구간이 사라지지 않도록 raw(필터 이전) 데이터로 계산한다.
function floorBands(arr){
  const pts = arr.map(t=>({t, f:parseInt(t.floor,10)})).filter(x=>Number.isFinite(x.f) && x.f>0);
  if(pts.length < 6) return null; // 표본 부족
  const fs = pts.map(x=>x.f);
  const min = Math.min(...fs), max = Math.max(...fs);
  if(max===min) return null; // 전 거래가 같은 층 → 비교 불가
  const b1 = min + (max-min)/5, b2 = min + (max-min)*4/5; // 관측 층 범위를 5등분: 1구간=저층, 2~4구간=중층, 5구간=고층
  const low = pts.filter(x=>x.f<=b1), mid = pts.filter(x=>x.f>b1 && x.f<=b2), high = pts.filter(x=>x.f>b2);
  const band = list => list.length? { v:R1(avgA(list.map(x=>x.t))), n:list.length,
    fmin:Math.min(...list.map(x=>x.f)), fmax:Math.max(...list.map(x=>x.f)) } : null;
  const L=band(low), M=band(mid), H=band(high);
  if(!L || !H || L.n<2 || H.n<2) return null; // 저층·고층 각 2건 이상 필요
  return { low:L, mid:M, high:H, premiumPct:Math.round((H.v-L.v)/L.v*100) };
}

// 사업 진행 중 개명된 단지(옛 이름으로 등록된 과거 실거래도 함께 찾도록) — 공백 제거 기준, canonical: [옛 이름들]
// 2026.08: 개명이 아니라 K-apt 등록명과 국토부 실거래 등록명이 서로 다른 경우도 이 메커니즘으로 함께 대응
// (인덕원삼성 — K-apt엔 "인덕원삼성", 실거래엔 "인덕원마을삼성"으로 등록돼 있어 역세권 탭에서 클릭해도
// 단지 분석에서 못 찾던 문제)
const APT_ALIASES = {
  '흑석자이': ['흑석리버파크자이'],
  '인덕원마을삼성': ['인덕원삼성'],
};
const APT_ALIAS_CANON = {}; // 별칭 → canonical 정규화 키
Object.entries(APT_ALIASES).forEach(([canon, arr])=>{ arr.forEach(a=>{ APT_ALIAS_CANON[a.replace(/\s/g,'')] = canon; }); });
function canonNorm(norm){ return APT_ALIAS_CANON[norm] || norm; }
function aliasesFor(qn){
  const canon = APT_ALIAS_CANON[qn] || qn;
  const arr = APT_ALIASES[canon] || [];
  return [...new Set([canon, qn, ...arr.map(a=>a.replace(/\s/g,''))])];
}
// 검색어(K-apt류 표기)에서 있을 수 있는 이형 표기 후보를 만든다 — "...아파트" 접미사 제거, "N단지"→"F{N}BL"
// 변환(송도·청라 등 대형 택지지구, 2026.08). matchComplex()(단지 분석 매칭)와 resolveAptName()(역세권
// 탭 가격 매칭) 양쪽이 똑같이 이 표기 차이 문제를 겪어서 공용으로 뺐다 — 하나만 고치고 다른 쪽을
// 빠뜨리는 일이 없도록.
function aptNameVariants(qn){
  const qnNoSuffix = qn.replace(/아파트$/, '');
  const variants = [qn, qnNoSuffix].filter((v,i,a)=>a.indexOf(v)===i);
  const districtM = qnNoSuffix.match(/^(.+?)(\d{1,2})단지$/);
  if(districtM){
    const [, prefix, numStr] = districtM;
    variants.push(`${prefix}F${numStr}BL`, `${prefix}F${parseInt(numStr,10)}BL`);
  }
  return variants;
}
function matchComplex(all, name){
  const qn = name.replace(/\s/g,'');
  // 역세권 탭 등 K-apt 데이터 기반 화면은 이름 표기가 RTMS 실거래 등록명과 다른 경우가 있어(예: "아파트"
  // 접미사, "N단지" vs "F{N}BL") exact 매칭이 실패하고 substring fallback으로 떨어짐 — 그러면 "롯데"/
  // "롯데캐슬"처럼 훨씬 짧고 무관한 다른 단지명까지 q.includes(a)로 걸려서 "여러 단지 일치"로 잘못 뜸
  // (2026.08 발견). aptNameVariants()로 만든 이형 표기 후보도 exact 후보에 같이 넣어 이 경우를 substring
  // 단계까지 가기 전에 먼저 해결한다.
  const qnList = [...new Set(aptNameVariants(qn).flatMap(aliasesFor))]; // 검색어 본인(+이형 표기) + 알려진 개명 이력 별칭까지 함께 매칭
  const exact = all.filter(t=>qnList.includes(t.apt.replace(/\s/g,'')));
  if(exact.length) return {hits:exact};
  const cand = all.filter(t=>{ const a=t.apt.replace(/\s/g,''); return qnList.some(q=>a.includes(q)||q.includes(a)); });
  let names = [...new Set(cand.map(t=>t.apt))];
  if(names.length>1){
    // 매칭된 이름 중 하나가 다른 매칭된 이름의 부분 문자열이면(예: "삼성" ⊂ "삼성래미안") 대개는 진짜
    // 별개 단지가 아니라 우연히 걸린 조각이다 — "안양동삼성래미안"으로 검색했더니 정작 무관한 "삼성"까지
    // 같이 떠서 "여러 단지 일치"로 잘못 뜨던 문제(2026.08, hhcnt 쪽 법정동 접두어 표기 때문에 발생).
    // 서로가 서로를 포함하지 않는 진짜 다른 이름끼리만 남으면 그건 실제 모호한 경우라 그대로 다중 후보로 보여준다.
    const norm = s => s.replace(/\s/g,'');
    const maximal = names.filter(n => !names.some(other => other!==n && norm(other).includes(norm(n))));
    if(maximal.length) names = maximal;
  }
  if(names.length===1) return {hits: cand.filter(t=>t.apt===names[0])};
  if(names.length>1){
    const cnt={}; cand.forEach(t=>cnt[t.apt]=(cnt[t.apt]||0)+1);
    return {multi: names.sort((a,b)=>cnt[b]-cnt[a])};
  }
  return {hits:[]};
}

function analyzeComplex(all, name, months, rawAll){
  const q = name.replace(/\s/g,'');
  const m = matchComplex(all, name);
  if(m.multi) return {found:false, multi:true, suggest:m.multi.slice(0,8)};
  const hits = m.hits;
  if(!hits.length){
    const names = [...new Set(all.map(t=>t.apt))];
    const grams=[]; for(let i=0;i+2<=q.length;i++) grams.push(q.slice(i,i+2));
    const sugg = names.map(n=>[n, grams.filter(g=>n.replace(/\s/g,'').includes(g)).length])
      .filter(([,s])=>s>0).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([n])=>n);
    return {found:false, suggest:sugg};
  }
  const nameCnt={}; hits.forEach(t=>nameCnt[t.apt]=(nameCnt[t.apt]||0)+1);
  const officialName = Object.entries(nameCnt).sort((a,b)=>b[1]-a[1])[0][0];
  hits.sort((a,b)=>dkey(b).localeCompare(dkey(a)));
  const groups={}; for(const t of hits)(groups[t.py]=groups[t.py]||[]).push(t);
  const monthsAsc = months.slice().reverse();
  const m3=months.slice(0,2), p3v=months.slice(2,4);
  const periodAvg=(arr,ms)=>{ const a=arr.filter(t=>ms.includes(t.ym)); return a.length? {v:R1(avgA(a)), n:a.length} : null; };
  // 평형별 요약표: 최근 4개 "역법 분기"(달력 기준 1~3월/4~6월/7~9월/10~12월) 평균 — 롤링 기간이 아니라 실제 분기 단위
  const qKeyOf = ym => { const y=+ym.slice(0,4), mo=+ym.slice(4,6); return `${y}Q${Math.ceil(mo/3)}`; };
  const qLabelOf = key => { const [y,qn]=key.split('Q'); return `${y.slice(2)}년\n${qn}분기`; };
  const qMap = {};
  months.forEach(ym=>{ const k=qKeyOf(ym); (qMap[k]=qMap[k]||[]).push(ym); });
  const last4Q = [...new Set(months.map(qKeyOf))].slice(0,4).reverse(); // 오래된→최신 순
  const byPy = Object.entries(groups).map(([py, arrRaw])=>{
    const clean = markOutliers(arrRaw, months);
    const arr = clean.length? clean : arrRaw;
    const max = Math.max(...arr.map(t=>t.amt));
    const maxTrade = arr.find(t=>t.amt===max); // arr는 최신순 정렬 → 동가 시 최근 거래 채택
    const maxDate = `${maxTrade.ym.slice(0,4)}.${maxTrade.ym.slice(4)}`;
    const recent = arr[0];
    const quarters = last4Q.map(qk => ({ label: qLabelOf(qk), avg: periodAvg(arr, qMap[qk]) }));
    // 단기 추세는 1~4층(저층 할인 왜곡 방지) 제외한 별도 데이터로 계산 — 평형별 요약표의 분기 평균과는 무관 (2026.07 등락 랭킹·저평가 탭과 동일 기준으로 통일)
    const arrTrend = arr.filter(t=>parseInt(t.floor,10)>=5);
    const avg3t = periodAvg(arrTrend,m3), pv3t = periodAvg(arrTrend,p3v);
    const trend = avg3t&&pv3t? {pct:Math.round((avg3t.v-pv3t.v)/pv3t.v*100), recentAvg:avg3t.v, prevAvg:pv3t.v} : null;
    const monthly = monthsAsc.map(ym=>{
      const mA = arr.filter(t=>t.ym===ym);
      return mA.length? {ym:ymLabel(ym), avg:R1(avgA(mA)), n:mA.length} : null;
    }).filter(Boolean);
    // 층별 프리미엄: 층수 필터 이전(raw) 데이터 전체에서 같은 단지·평형 거래를 다시 모아 계산
    let floorBand = null;
    if(rawAll){
      // 층별 프리미엄은 조회 기간과 무관하게 최근 6개월 고정 — 기간이 길면 시세 상승분이 층 프리미엄에 섞여 왜곡되므로
      const recentMonths = months.slice(0,6);
      const recentSet = new Set(recentMonths);
      const rawMatch = rawAll.filter(t=>t.apt===officialName && String(t.py)===py && recentSet.has(t.ym));
      const rawClean = markOutliers(rawMatch, recentMonths);
      floorBand = floorBands(rawClean);
    }
    return { py:`${py}평`, area:`전용 ${Math.floor(recent.area)}㎡`, n:arr.length,
      excluded: arrRaw.length-arr.length, // arr = clean이 비면 arrRaw로 폴백되므로, 실제 표시 데이터 기준으로 계산해야 폴백 시 0건으로 정확히 나옴
      recent:{amt:recent.amt, ym:ymLabel(recent.ym), floor:recent.floor},
      max, maxDate, quarters, trend,
      // 최고가 배지: 가장 최근 거래가 곧 최고가일 때만 표시
      isNewHigh: recent.amt>=max && arr.length>=3, monthly, floorBand };
  }).sort((a,b)=>parseInt(a.py)-parseInt(b.py));
  return { found:true, mode:'complex', name:officialName, umd:hits[0].umd, build:hits[0].build,
    count:hits.length,
    period:`${ymLabel(months[months.length-1])} ~ ${ymLabel(months[0])}`,
    years:yearsLabel(months),
    byPy,
    trades: hits.map(t=>({date:`${ymLabel(t.ym)}.${String(t.d).padStart(2,'0')}`, py:`${t.py}평`, area:t.area, amt:t.amt, floor:t.floor, ex:t.ex||null, kind:t.kind||null})) };
}

function analyzeRegion(all, months){
  const byApt={};
  // 시·도 전체 통합 조회에서는 서로 다른 구에 같은 단지명이 존재할 수 있으므로 구까지 키에 포함한다
  for(const t of all){ const k=`${t.apt}|${t.umd}|${t.gu||''}`; (byApt[k]=byApt[k]||[]).push(t); }
  const r3set = new Set(months.slice(0,3)), p3set = new Set(months.slice(3,6));
  const topVolume = Object.entries(byApt).map(([k,arr])=>{
    const sorted = arr.slice().sort((a,b)=>dkey(b).localeCompare(dkey(a)));
    const pyCnt={}; sorted.forEach(t=>pyCnt[t.py]=(pyCnt[t.py]||0)+1);
    const mainPy = Object.entries(pyCnt).sort((a,b)=>b[1]-a[1])[0][0];
    const mainPyTrades = sorted.filter(t=>t.py===mainPy);
    const areaCnt={}; mainPyTrades.forEach(t=>areaCnt[Math.floor(t.area)]=(areaCnt[Math.floor(t.area)]||0)+1); // 주력 평형 내 가장 흔한 전용면적을 대표값으로
    const mainArea = Object.keys(areaCnt).length ? +Object.entries(areaCnt).sort((a,b)=>b[1]-a[1])[0][0] : null;
    const [apt,umd,gu]=k.split('|');
    const r3n = arr.filter(t=>r3set.has(t.ym)).length;
    const p3n = arr.filter(t=>p3set.has(t.ym)).length;
    const surge = r3n>=6 && r3n >= p3n*2; // 최근 3개월이 이전 3개월의 2배 이상
    return {apt, umd, gu:gu||null, n:sorted.length, mainPy:`${mainPy}평${mainArea!=null?`(전용 ${mainArea}㎡)`:''}`, recentAmt:sorted[0].amt, surge, build:(sorted.find(t=>t.build)||{}).build || ''};
  }).sort((a,b)=>b.n-a.n).slice(0,100);
  const grouped = Object.entries(byApt).map(([k,arr])=>{
    const top = arr.slice().sort((a,b)=>b.amt-a.amt || dkey(b).localeCompare(dkey(a)))[0];
    const [apt,umd,gu] = k.split('|');
    return {apt, umd, gu:gu||null, lawd:top.lawd||null, py:`${top.py}평`, area:top.area, amt:top.amt, date:`${ymLabel(top.ym)}.${top.d}`,
      floor:top.floor, build:top.build, kind:top.kind||null, isNew:isRecentDeal(top), n:arr.length};
  });
  const highDeals = grouped.slice().sort((a,b)=>b.amt-a.amt).slice(0,100);
  return { found:true, mode:'region', total:all.length,
    period:`${ymLabel(months[months.length-1])} ~ ${ymLabel(months[0])}`,
    years:yearsLabel(months),
    topVolume, highDeals };
}

// ═══ 신고가 탭 ═══
// "선택 조회기간(고정 3년) 내 최고가"가 최근 한 달(30일) 이내 계약된 단지만 추출 — 매매·분양권·입주권 모두 집계
// (지역/등락 랭킹과 동일하게 mergeTradeAndPresaleForRanking으로 병합된 데이터를 그대로 받음)
// 신축 첫 거래가 트리비얼하게 "신고가"로 잡히는 것을 막기 위해 표본 3건 이상만 인정.
function analyzeNewHigh(all, months){
  // 직거래(중개 없이 당사자끼리 신고, 특수관계 거래 가능성 있음)는 신고가 판정에서 아예 제외 —
  // 등락 랭킹·저평가 탭의 markOutliers()가 같은 이유로 직거래를 걸러내는 것과 동일한 원칙.
  // 신고가는 60,000명 팔로워에게 그대로 노출되는 공개 지표라, 특수관계자 간 1건의 시세 왜곡 거래만으로
  // "신고가"로 잘못 알려지는 것을 막기 위함(표본 3건 카운트에서도 제외).
  all = all.filter(t=>!t.direct);
  const byApt={};
  // 평형(py)을 키에 포함해야 함 — 안 그러면 같은 단지의 서로 다른 평형(예: 84㎡ vs 150㎡)이 한 그룹으로
  // 섞여서 "이번 달 84㎡ 신고가"가 훨씬 비싼 150㎡의 과거 거래 때문에 최고가로 안 잡히는(혹은 반대로
  // 잘못 잡히는) 문제가 있었음 — 평형 필터를 걸었을 때와 안 걸었을 때 결과 개수가 안 맞던 원인
  for(const t of all){ const k=`${t.apt}|${t.umd}|${t.py}|${t.gu||''}`; (byApt[k]=byApt[k]||[]).push(t); }
  const results = [];
  for(const [k, arr] of Object.entries(byApt)){
    if(arr.length < 3) continue;
    const sorted = arr.slice().sort((a,b)=>b.amt-a.amt || dkey(b).localeCompare(dkey(a))); // 최고가순, 동가면 최근 계약일 우선
    const top = sorted[0];
    if(!isRecentDeal(top, 30)) continue; // 그 기간 내 최고가 거래 자체가 최근 한 달(30일) 이내여야 "방금 갱신"으로 인정 — 국토부 신고기한이 최대 30일이라 7일로는 아직 신고 안 된 신고가를 놓칠 수 있어 완화
    // 직전 최고가(top을 제외한 나머지 중 최고) — 갱신폭(▲ 금액) 계산용
    const prevMax = sorted.slice(1).reduce((m,t)=>Math.max(m,t.amt), 0);
    const gapAmt = R1(top.amt - prevMax);
    // (2026.08) 예전엔 "직전 최고가와 같으면(동가 재현) 제외"였는데, 수민 피드백으로 기준 변경 —
    // 동가 재현이어도 "이번 거래 자체가 최근(30일 이내)"이면 신고가로 인정. 가격이 실제로 더 낮은 경우만 제외.
    // (top은 정의상 항상 그 그룹의 최댓값이라 prevMax<=top.amt가 수학적으로 항상 성립 — 즉 gapAmt<0은 원천적으로
    // 발생하지 않음. 이 줄은 "혹시 모를" 방어용일 뿐, 실질적으로는 표본 내 모든 최고가/동가 재현을 다 통과시킨다.)
    if(gapAmt < 0) continue;
    const [apt, umd, py, gu] = k.split('|');
    results.push({
      apt, umd, gu:gu||null, lawd:top.lawd||null, py:`${py}평`, area:top.area, amt:top.amt,
      date:`${ymLabel(top.ym)}.${top.d}`, floor:top.floor, build:top.build, kind:top.kind||null, n:arr.length,
      prevMax: prevMax || null, gapAmt, gapPct: prevMax? Math.round(gapAmt/prevMax*100) : null,
    });
  }
  results.sort((a,b)=> b.amt - a.amt); // 가격 높은 순
  return { found:true, mode:'newhigh', total:all.length,
    period:`${ymLabel(months[months.length-1])} ~ ${ymLabel(months[0])}`,
    years:yearsLabel(months),
    newHigh: results.slice(0,100) };
}

// ═══ 신저가 탭 ═══
// [2026.08 로직 전면 변경 — 수민 요청] 기존엔 "직전 최저가보다 더 낮은 가격을 새로 찍었는지"를 봤는데,
// 이제는 "1년 내 최고가 대비 최근 한 달 이내 거래가 -10%~-25% 하락했는지"로 기준을 바꿈(최초엔 2년으로
// 구현했다가 수민 요청으로 1년으로 축소, 이후 -30% 이상 하락한 거래는 이상치로 제외하는 상한도 추가했다가
// 다시 -25%로 더 좁힘) —
// 급격한 하락을 더 뚜렷하게 포착하기 위함(직전 최저가 대비는 하락폭이 미미해도 잡히던 반면, 이 방식은
// 실제 눈에 띄는 하락만 남음). analyzeNewHigh와 공유하는 원칙(직거래 제외, 표본 3건 이상, 1~5층 제외)은
// 그대로 유지.
function analyzeNewLow(all, months){
  // 직거래(중개 없이 당사자끼리 신고, 특수관계 거래 가능성 있음)는 신저가 판정에서도 제외 — 신고가와 동일한 이유.
  // 1~5층은 층수 할인(구조적으로 항상 싼 저층)이 "실제 시세 하락"처럼 잘못 잡히는 것을 막기 위해 제외.
  // 층수 정보가 없는 거래(분양권 등)도 저층 여부를 확인할 수 없으므로 안전하게 함께 제외.
  all = all.filter(t=>!t.direct && parseInt(t.floor,10)>=6);
  const byApt={};
  for(const t of all){ const k=`${t.apt}|${t.umd}|${t.py}|${t.gu||''}`; (byApt[k]=byApt[k]||[]).push(t); }
  const DROP_THRESHOLD = 0.10; // -10% 이상 하락만 신저가로 인정
  // -25% 이상 빠진 거래는 오히려 제외(2026.08 수민 요청, 최초 -30%에서 -25%로 더 좁힘) — 시세보다 지나치게 낮은 거래는 특수관계 매매(가족간
  // 저가 양도 등, direct 필드로 못 걸러지는 경우도 있음)나 급전 필요에 의한 이례적 급매일 가능성이 높아,
  // "완만하지만 뚜렷한" 하락 신호(10~25%)만 신저가로 인정하고 그보다 더 크게 빠진 이상치는 걸러낸다.
  const MAX_DROP = 0.25;
  const results = [];
  for(const [k, arr] of Object.entries(byApt)){
    if(arr.length < 3) continue;
    // 1년 최고가(peak) — months가 12개월 고정이므로 arr 전체가 곧 "1년 표본"
    const peak = arr.reduce((m,t)=> t.amt>m.amt ? t : m, arr[0]);
    // 최근 30일 이내 계약이면서 최고가 대비 10% 이상 ~ 25% 미만 하락한 거래만 후보로(그 이상은 이상치로 배제)
    const candidates = arr.filter(t=> isRecentDeal(t, 30) && t.amt <= peak.amt*(1-DROP_THRESHOLD) && t.amt > peak.amt*(1-MAX_DROP));
    if(!candidates.length) continue;
    // 후보 중 하락폭이 가장 큰(가격이 가장 낮은) 거래를 대표로 — 동가면 최근 계약일 우선
    const bottom = candidates.slice().sort((a,b)=> a.amt-b.amt || dkey(b).localeCompare(dkey(a)))[0];
    const gapAmt = R1(peak.amt - bottom.amt);
    const gapPct = Math.round(gapAmt/peak.amt*100);
    const [apt, umd, py, gu] = k.split('|');
    results.push({
      apt, umd, gu:gu||null, lawd:bottom.lawd||null, py:`${py}평`, area:bottom.area, amt:bottom.amt,
      date:`${ymLabel(bottom.ym)}.${bottom.d}`, floor:bottom.floor, build:bottom.build, kind:bottom.kind||null, n:arr.length,
      prevMax: peak.amt, gapAmt, gapPct,
    });
  }
  results.sort((a,b)=> b.gapPct - a.gapPct); // 하락률 큰 순
  return { found:true, mode:'newlow', total:all.length,
    period:`${ymLabel(months[months.length-1])} ~ ${ymLabel(months[0])}`,
    years:yearsLabel(months),
    newLow: results.slice(0,100) };
}

// ═══ 전용면적 평단가 탭 ═══
// 단지별로 "3년 내 최고가" 기준 전용면적 평단가(만원/전용평)를 평형(유닛 타입)별로 계산한 뒤, 그중 평단가가
// 가장 높은 평형 딱 1개만 그 단지의 대표값으로 채택 — 같은 단지라도 소형평이 대형평보다 평단가가 높은 경우가
// 흔해서(동일 단지 안에서도 평형별 프리미엄 차이가 큼) 대표 평형을 고정하지 않고 "가장 비싼 평단가"로 자동 선정.
// 결과는 단지 1개당 1행, 평단가 높은 순 정렬.
//
// [2026.08] "평단가"는 관행적으로 공급면적(전용+공용) 기준인데, 국토부 실거래 API는 전용면적만 제공하고
// 공급면적은 아예 주지 않음. 기존엔 "84㎡→33평"처럼 공급면적 관행 라벨로 역산하는 보간표(areaToPy)를 그대로
// 나눗셈에 썼는데, 이 라벨 자체가 근사치라 평단가 계산(나눗셈)에 쓰면 오차가 그대로 증폭되는 문제가 있었음.
// → 보간·근사 없이, 가진 데이터(전용면적) 그대로 "전용면적÷3.3058"로 정밀 환산한 전용평형으로 나눔.
// 계산의 정확성은 확보되지만, 사람들이 흔히 말하는 "평당가"(공급면적 기준)보다는 낮게 나올 수 있어
// 화면·제목에 "전용면적 평단가"라고 명시해 기준을 분명히 한다.
const SQM_PER_PY = 3.3058; // 1평 = 3.3058㎡ (전용면적 → 전용평형 정밀 환산 상수, 보간 없음)
function analyzePricePerPyeong(all, months){
  // 직거래는 최고가를 왜곡할 수 있어 제외 — 신고가 탭과 동일한 원칙.
  all = all.filter(t=>!t.direct);
  // 1) 단지+평형(유닛 타입 구분용 py 라벨)별 3년 최고가 산출 (동가면 최근 계약일 우선)
  //    ※ py는 여기서 "같은 평면구조 유닛인지 묶는 그룹핑 키"로만 쓰고, 아래 평단가 계산 자체에는 쓰지 않음
  const byPy = {};
  // pyCount: (단지|동|구|평형)별 표본 개수 — 딱 1건뿐인 평형은 뒤에서 이상치로 간주해 제외
  // (예: 국토부 원본 데이터에 단지 공식 평형과 무관한 소형 전용면적 1건이 섞여 들어오면, 분모가 작다는
  //  이유만으로 평단가가 비정상적으로 튀어 "가장 높은 평단가" 대표로 잘못 뽑히는 문제가 있었음)
  const pyCount = {};
  for(const t of all){
    const pk = `${t.apt}|${t.umd}|${t.gu||''}|${t.py}`;
    pyCount[pk] = (pyCount[pk]||0) + 1;
    const cur = byPy[pk];
    if(!cur || t.amt > cur.amt || (t.amt===cur.amt && dkey(t) > dkey(cur))) byPy[pk] = t;
  }
  // 2) 단지별로 전용면적 평단가(만원/전용평) 계산 후, 평단가가 가장 높은 평형 1개만 대표로 채택
  const byComplex = {};
  for(const t of Object.values(byPy)){
    if(!t.area) continue; // 전용면적 정보 없는 거래는 평단가 계산 불가
    const pk = `${t.apt}|${t.umd}|${t.gu||''}|${t.py}`;
    if((pyCount[pk]||0) < 2) continue; // 표본 1건뿐인 평형은 이상치 방지를 위해 대표 후보에서 제외
    const ck = `${t.apt}|${t.umd}|${t.gu||''}`;
    const pyExact = R1(t.area / SQM_PER_PY); // 전용면적(㎡) → 전용평형(정밀, 보간 없음)
    const pricePerPy = Math.round(t.amt*10000/pyExact); // 억 → 만원 환산 후 전용평형으로 나눔 = 만원/전용평
    const cur = byComplex[ck];
    if(!cur || pricePerPy > cur.pricePerPy) byComplex[ck] = {...t, pricePerPy, pyExact};
  }
  const results = Object.values(byComplex).map(t=>({
    apt:t.apt, umd:t.umd, gu:t.gu||null, lawd:t.lawd||null, py:`${t.py}평`, pyExact:t.pyExact, area:t.area, amt:t.amt,
    date:`${ymLabel(t.ym)}.${t.d}`, floor:t.floor, build:t.build, kind:t.kind||null, pricePerPy:t.pricePerPy,
  }));
  results.sort((a,b)=> b.pricePerPy - a.pricePerPy); // 평단가 높은 순
  return { found:true, mode:'pyprice', total:all.length,
    period:`${ymLabel(months[months.length-1])} ~ ${ymLabel(months[0])}`,
    years:yearsLabel(months),
    pyPrice: results.slice(0,100) };
}

// 평형별 등락률 대표행(단지당 거래량 최다 평형 1개) 계산 — analyzeUpDown 내부에서 공용으로 사용
function buildRepRows(all, months){
  const eligible = all.filter(t=>parseInt(t.floor,10)>=5); // 1~4층 제외 (2026.07 저평가/peak 탭과 동일 기준으로 강화 — 4층까지만 걸러서는 저층 할인 왜곡이 통계에 새어 들어와 실제로는 시세 변동이 없는 단지가 등락 랭킹·초단기 저평가 단지에 허위로 잡히는 사례 발견)
  const byAptPy = {};
  for(const t of eligible){ const k=`${t.apt}|${t.umd}|${t.py}|${t.gu||''}`; (byAptPy[k]=byAptPy[k]||[]).push(t); }
  const r3set = new Set(months.slice(0,2)), p3set = new Set(months.slice(2,4));
  const pyRows = Object.entries(byAptPy).map(([k,arrRaw])=>{
    const arr = markOutliers(arrRaw, months);
    const [apt,umd,py,gu] = k.split('|');
    const r3 = arr.filter(t=>r3set.has(t.ym));
    const p3 = arr.filter(t=>p3set.has(t.ym));
    if(r3.length<2 || p3.length<2) return null;
    const r3avg = avgA(r3), p3avg = avgA(p3);
    if(!p3avg) return null;
    const pct = Math.round((r3avg-p3avg)/p3avg*100);
    const areaCnt={}; arr.forEach(t=>areaCnt[Math.floor(t.area)]=(areaCnt[Math.floor(t.area)]||0)+1); // 그룹 내 가장 흔한 전용면적을 대표값으로
    const area = +Object.entries(areaCnt).sort((a,b)=>b[1]-a[1])[0][0];
    return { apt, umd, py, gu:gu||null, lawd:arr[0].lawd||null, area, build:arr[0].build, pct, r3avg:R1(r3avg), p3avg:R1(p3avg), n:arr.length, r3n:r3.length, p3n:p3.length };
  }).filter(Boolean);
  // 2026.08: 단지당 거래량 최다 평형 하나만 남기던 로직 제거 — 평형마다 독립적으로 등락/저평가 판정(다른 평형에 가려 누락되는 문제 방지)
  return pyRows.map(r=>({ ...r, mainPy:`${r.py}평(전용 ${r.area}㎡)` }));
}

// all: 평형 필터가 적용된 데이터(상승률·하락률 랭킹용) / allUnfiltered: 필터 적용 전 원본(초단기 저평가 단지용)
// → 초단기 저평가 단지는 "가격"이 기준이라 화면상 "평형" 필터와는 성격이 달라서, 필터 선택과 무관하게 항상 20평대(20~29)·30평대(30~39) 두 구간으로 나눠 같은 평대끼리만 고정 계산
function analyzeUpDown(all, months){
  const rows = buildRepRows(all, months);
  const up = rows.filter(r=>r.pct>0).sort((a,b)=>b.pct-a.pct).slice(0,10);
  const down = rows.filter(r=>r.pct<0).sort((a,b)=>a.pct-b.pct).slice(0,10);
  return { found:true, mode:'updown', total:all.length,
    period:`${ymLabel(months[months.length-1])} ~ ${ymLabel(months[0])}`,
    years:yearsLabel(months),
    up, down };
}

// ═══ 갭투자(전세가율) 랭킹 (2026.08 신규, 2026.08 공개 탭으로 전환) ═══
// 매매·전세 실거래를 각각 "단지+동+평형+구" 단위로 묶어 최근 3개월 평균가를 낸 뒤(2026.08, 12→2→3개월로
// 조정 — 2개월은 표본이 너무 좁아 조회되는 단지 수가 급감해서 3개월로 완화),
// 같은 단위끼리 짝지어 전세가율(전세평균÷매매평균)을 계산 — 갭투자(적은 시드로 매매) 소재용 랭킹. 표본이 적으면
// (매매·전세 각 2건 미만) 극단치 왜곡이 크므로 그 그룹은 아예 제외. 1~4층은 저층 할인 왜곡 방지를 위해 매매 쪽만
// 제외(전세는 원래도 표본이 얇아 층수까지 거르면 남는 그룹이 너무 적어짐).
function avgGroupA(items, months, minN){
  const ms = new Set(months);
  const byKey = {};
  for(const t of items){
    if(!ms.has(t.ym)) continue;
    const k = `${t.apt}|${t.umd}|${t.py}|${t.gu||''}`;
    (byKey[k]=byKey[k]||[]).push(t);
  }
  const out = {};
  for(const [k,arrRaw] of Object.entries(byKey)){
    const clean = markOutliers(arrRaw, months);
    const arr = clean.length ? clean : arrRaw;
    if(arr.length < minN) continue;
    // 그룹 내 가장 흔한 전용면적을 대표값으로(등락 랭킹 buildRepRows와 동일한 방식)
    const areaCnt={}; arr.forEach(t=>areaCnt[Math.floor(t.area)]=(areaCnt[Math.floor(t.area)]||0)+1);
    const area = +Object.entries(areaCnt).sort((a,b)=>b[1]-a[1])[0][0];
    out[k] = { avg: R1(avgA(arr)), n: arr.length, area, build: arr[0].build, lawd: arr[0].lawd||null };
  }
  return out;
}
function analyzeGapRanking(saleAll, rentAll, months){
  const saleBy = avgGroupA(saleAll.filter(t=>parseInt(t.floor,10)>=5), months, 2);
  const rentBy = avgGroupA(rentAll, months, 2);
  const rows = [];
  for(const k of Object.keys(rentBy)){
    const s = saleBy[k], r = rentBy[k];
    if(!s || !s.avg) continue;
    const [apt,umd,py,gu] = k.split('|');
    rows.push({
      apt, umd, py, gu: gu||null, area: s.area, build: s.build, lawd: s.lawd,
      saleAvg: s.avg, rentAvg: r.avg, saleN: s.n, rentN: r.n,
      pct: Math.round(r.avg/s.avg*100), gapAmt: R1(s.avg-r.avg),
    });
  }
  rows.sort((a,b)=> b.pct - a.pct); // 전세가율 높은(=갭 작은) 순
  return { found:true, mode:'gap', total:saleAll.length,
    period:`${ymLabel(months[months.length-1])} ~ ${ymLabel(months[0])}`,
    years:yearsLabel(months),
    rows: rows.slice(0,100) };
}

// ═══ 단기 저평가 (2026.07 등락 랭킹에서 별도 탭으로 분리) ═══
// - 매매 실거래만 사용(분양권·입주권은 준공 전 시세·전매 이슈 등 매매와 무관한 요인으로 움직여서 왜곡 소지가 큼 → 완전히 제외)
// - 20평대(20~29)끼리, 30평대(30~39)끼리 각각 따로 비교(초소형·초대형은 표본이 적고, 평대가 다르면 가격 스케일도 달라 같은 비교군으로 묶기 부적절)
// - 20평대(20~29)·30평대(30~39) 평대 단위로만 비교군 구성(2026.08) — 단지마다 "같은 평대이면서 이전 2개월 평균가가 나와 ±2% 이내인 단지 중 가격이 가장 가까운 최대 5개"
//   (고정 구간 대신 상대 비율 기준이라, 경계값 근처에서 억지로 갈리는 문제가 없음)
// → "최근 2개월 평균가"가 그 비교군 중앙값보다 5~15% 낮은 단지를 표시 (본인 포함 그룹원 3명 이상만 비교, 2026.08 -15% 초과 격차는 표본 왜곡 소지가 커 상한 추가)
function analyzeShortUndervalue(all, months, allUnfiltered){
  const tradeOnly = (allUnfiltered||all).filter(t=>{
    if(t.kind) return false;
    const py = parseInt(t.py,10);
    return py>=20 && py<=37; // 2026.08 상한 39→37평, 저평가 3탭 전부 20~37평으로 통일
  });
  const rowsAll = buildRepRows(tradeOnly, months);
  const median = arr => { // 표준 중앙값 (짝수 개수일 때 가운데 두 값의 평균)
    const s = arr.slice().sort((a,b)=>a-b), n = s.length, mid = n>>1;
    return n%2 ? s[mid] : (s[mid-1]+s[mid])/2;
  };
  const divergence = [];
  const MIN_PEER_N = 2; // 비교군은 최근·이전 2개월 구간 각각 최소 2건 이상 거래된 단지만 인정 (직거래·저가 이상치는 이미 markOutliers에서 제외된 뒤라 완화, 전체 단지 기준 최소치와 동일)
  rowsAll.forEach(r=>{
    const nearest = rowsAll
      .filter(o=> o!==r && pyBand(o.py)===pyBand(r.py) && o.r3n>=MIN_PEER_N && o.p3n>=MIN_PEER_N && Math.abs(o.p3avg - r.p3avg) / r.p3avg <= 0.02)
      .sort((a,b)=> Math.abs(a.p3avg-r.p3avg) - Math.abs(b.p3avg-r.p3avg))
      .slice(0,5); // 가격이 제일 가까운 단지 최대 5개까지
    const group = [r, ...nearest]; // groupN 표시용(본인 포함 표본수) — 중앙값 계산에는 본인 제외
    if(group.length < 3) return;
    const r3median = median(nearest.map(o=>o.r3avg));
    const gapPct = Math.round((r.r3avg - r3median)/r3median*100);
    if(gapPct <= -5 && gapPct >= -15){
      const peers = nearest.map(o=>({apt:o.apt, py:o.py, area:o.area, p3avg:o.p3avg, r3avg:o.r3avg})).sort((a,b)=>b.r3avg-a.r3avg); // 비교 대상 단지 상세(표 정리용) · 최근가 높은순 정렬
      divergence.push({ ...r, r3median:R1(r3median), gapAmt:R1(r3median-r.r3avg), gapPct, groupN:group.length, peers }); // gapAmt는 항상 양수(중앙값-내값) — 화면에 "OO억 낮음"으로 표시되므로
    }
  });
  // 가장 많이 벌어진 순(금액 기준, 억 단위 격차가 큰 순)으로 정렬, 동률이면 표본(n)이 더 많은 쪽을 우선(신뢰도 반영)
  divergence.sort((a,b)=> b.gapAmt-a.gapAmt || b.n-a.n);

  return { found:true, mode:'shortval', total:all.length,
    period:`${ymLabel(months[months.length-1])} ~ ${ymLabel(months[0])}`,
    years:yearsLabel(months),
    divergence: divergence.slice(0,30) };
}

// ═══ 저평가 (2026.07 잠금 해제 — 공개 탭 / v130에서 "분기 저평가"→"반기 저평가"로 개명) ═══
// 등락 랭킹의 "단기 저평가 단지"(2개월 평균 기준)와는 완전히 별개 로직.
// 평균가 대신 최고가, 2개월 구간 대신 6개월 구간을 사용(2026.07 3개월→6개월, 탭 이름을 "반기"로 바꾸며 함께 변경) —
// "또래 대비 덜 오른" 단지가 아니라 "동일 시세대에서 신고가 흐름을 못 따라간" 단지를 잡아내려는 실험적 지표.
// 등락 랭킹과 달리 분양권·입주권까지 전부 포함. 층수 제한 없음(2026.07 5층 이상 제한 삭제 — 연간 저평가와 통일) — 20평대(20~29)끼리, 30평대(30~39)끼리 각각 따로 비교(2026.08)
function buildPeakRows(all, months){
  const byAptPy = {};
  for(const t of all){ const k=`${t.apt}|${t.umd}|${t.py}|${t.gu||''}`; (byAptPy[k]=byAptPy[k]||[]).push(t); }
  const r3set = new Set(months.slice(0,6)), p3set = new Set(months.slice(6,12));
  const pyRows = Object.entries(byAptPy).map(([k,arrRaw])=>{
    const arr = markOutliers(arrRaw, months);
    const [apt,umd,py,gu] = k.split('|');
    const r3 = arr.filter(t=>r3set.has(t.ym));
    const p3 = arr.filter(t=>p3set.has(t.ym));
    if(r3.length<2 || p3.length<2) return null;
    // 최근 구간 최고가를 세운 실제 거래를 따로 잡아둔다 — 분양권/입주권 배지 표시용(등락 랭킹과 달리 반기/연간 저평가는 분양권·입주권도 포함하므로)
    const r3top = r3.reduce((best,t)=> (!best || t.amt>best.amt) ? t : best, null);
    const r3max = r3top.amt, p3max = Math.max(...p3.map(t=>t.amt));
    if(!p3max) return null;
    const areaCnt={}; arr.forEach(t=>areaCnt[Math.floor(t.area)]=(areaCnt[Math.floor(t.area)]||0)+1);
    const area = +Object.entries(areaCnt).sort((a,b)=>b[1]-a[1])[0][0];
    return { apt, umd, py, gu:gu||null, lawd:arr[0].lawd||null, area, build:arr[0].build, kind:r3top.kind||null, r3max:R1(r3max), p3max:R1(p3max), n:arr.length, r3n:r3.length, p3n:p3.length };
  }).filter(Boolean);
  // 2026.08: 단지당 거래량 최다 평형 하나만 남기던 로직 제거 — 평형마다 독립적으로 저평가 판정(다른 평형에 가려 누락되는 문제 방지)
  return pyRows.map(r=>({ ...r, mainPy:`${r.py}평(전용 ${r.area}㎡)` }));
}

function analyzePeakUndervalue(all, months, allUnfiltered){
  const tradeOnly = (allUnfiltered||all).filter(t=>{
    const py = parseInt(t.py,10);
    return py>=20 && py<=37; // 2026.07 층수 제한(5층 이상) 삭제 — 전 층 포함 (연간 저평가와 동일하게 통일) / 2026.08 상한 39→37평, 저평가 3탭 전부 20~37평으로 통일
  });
  const rowsAll = buildPeakRows(tradeOnly, months);
  const median = arr => {
    const s = arr.slice().sort((a,b)=>a-b), n = s.length, mid = n>>1;
    return n%2 ? s[mid] : (s[mid-1]+s[mid])/2;
  };
  const divergence = [];
  const MIN_PEER_N = 2;
  rowsAll.forEach(r=>{
    const nearest = rowsAll
      .filter(o=> o!==r && pyBand(o.py)===pyBand(r.py) && o.r3n>=MIN_PEER_N && o.p3n>=MIN_PEER_N && Math.abs(o.p3max - r.p3max) / r.p3max <= 0.02
        && (o.r3max - r.r3max) / r.r3max > 0.02) // 비교군은 "이전엔 비슷했지만 최근엔 나보다 확실히(2% 초과) 더 오른" 단지만 인정 — 나와 비슷하게 움직인 단지(오르지도 처지지도 않은)는 저평가 판단에 참고가 안 되므로 제외
      .sort((a,b)=> Math.abs(a.p3max-r.p3max) - Math.abs(b.p3max-r.p3max))
      .slice(0,5);
    const group = [r, ...nearest]; // groupN 표시용(본인 포함 표본수) — 중앙값 계산에는 본인 제외
    if(group.length < 3) return;
    const r3median = median(nearest.map(o=>o.r3max));
    const gapPct = Math.round((r.r3max - r3median)/r3median*100);
    if(gapPct <= -5 && gapPct >= -15){
      const peers = nearest.map(o=>({apt:o.apt, py:o.py, area:o.area, p3max:o.p3max, r3max:o.r3max})).sort((a,b)=>b.r3max-a.r3max); // 최근가 높은순 정렬
      divergence.push({ ...r, r3median:R1(r3median), gapAmt:R1(r3median-r.r3max), gapPct, groupN:group.length, peers }); // gapAmt는 항상 양수(중앙값-내값) — 화면에 "OO억 낮음"으로 표시되므로
    }
  });
  // 가장 많이 벌어진 순(금액 기준, 억 단위 격차가 큰 순)으로 정렬, 동률이면 표본(n)이 더 많은 쪽을 우선(신뢰도 반영)
  divergence.sort((a,b)=> b.gapAmt-a.gapAmt || b.n-a.n);

  return { found:true, mode:'peak', total:all.length,
    period:`${ymLabel(months[months.length-1])} ~ ${ymLabel(months[0])}`,
    years:yearsLabel(months),
    divergence: divergence.slice(0,30) };
}

// ═══ 연간 저평가 — "반기 저평가"(peak, 2026.07 이전 명칭 "분기 저평가")와 완전히 동일한 로직, 6개월 구간(6vs6) 대신 1년 구간(올해 vs 작년, 12개월씩)만 다름 ═══
// 반기 저평가가 "최근 신고가 흐름"을 못 따라간 단지를 잡는다면, 연간 저평가는 "지난 1년간 신고가 흐름"을 못 따라간 단지를 잡아내는 버전.
// 20~39평 제한(층수 제한 없음, 2026.07부로 두 탭 다 통일), 20평대·30평대 평대 단위로만 비교(2026.08), 비교군 구성(±2% 이내 최대 5개, 3명 이상), 5~15% 격차 기준 등 나머지 조건은 모두 동일.
function buildLongPeakRows(all, months){
  const byAptPy = {};
  for(const t of all){ const k=`${t.apt}|${t.umd}|${t.py}|${t.gu||''}`; (byAptPy[k]=byAptPy[k]||[]).push(t); }
  // 올해 1월~현재월(curN개월) vs 작년 1~12월(12개월) — months.length는 항상 curN+12 (호출부 effMN 계산과 짝)
  const curN = months.length - 12;
  const r12set = new Set(months.slice(0,curN)), p12set = new Set(months.slice(curN,curN+12));
  const pyRows = Object.entries(byAptPy).map(([k,arrRaw])=>{
    const arr = markOutliers(arrRaw, months);
    const [apt,umd,py,gu] = k.split('|');
    const r12 = arr.filter(t=>r12set.has(t.ym));
    const p12 = arr.filter(t=>p12set.has(t.ym));
    if(r12.length<2 || p12.length<2) return null;
    const r12top = r12.reduce((best,t)=> (!best || t.amt>best.amt) ? t : best, null);
    const r12max = r12top.amt, p12max = Math.max(...p12.map(t=>t.amt));
    if(!p12max) return null;
    const areaCnt={}; arr.forEach(t=>areaCnt[Math.floor(t.area)]=(areaCnt[Math.floor(t.area)]||0)+1);
    const area = +Object.entries(areaCnt).sort((a,b)=>b[1]-a[1])[0][0];
    return { apt, umd, py, gu:gu||null, lawd:arr[0].lawd||null, area, build:arr[0].build, kind:r12top.kind||null, r3max:R1(r12max), p3max:R1(p12max), n:arr.length, r3n:r12.length, p3n:p12.length };
  }).filter(Boolean);
  // 2026.08: 단지당 거래량 최다 평형 하나만 남기던 로직 제거 — 평형마다 독립적으로 저평가 판정(다른 평형에 가려 누락되는 문제 방지)
  return pyRows.map(r=>({ ...r, mainPy:`${r.py}평(전용 ${r.area}㎡)` }));
}

function analyzeLongPeakUndervalue(all, months, allUnfiltered, sameDongOnly){
  const tradeOnly = (allUnfiltered||all).filter(t=>{
    const py = parseInt(t.py,10);
    return py>=20 && py<=37; // 2026.07 층수 제한(5층 이상) 삭제 — 전 층 포함 / 2026.08 상한 39→37평, 저평가 3탭 전부 20~37평으로 통일
  });
  const rowsAll = buildLongPeakRows(tradeOnly, months);
  const median = arr => {
    const s = arr.slice().sort((a,b)=>a-b), n = s.length, mid = n>>1;
    return n%2 ? s[mid] : (s[mid-1]+s[mid])/2;
  };
  const divergence = [];
  const MIN_PEER_N = 2;
  rowsAll.forEach(r=>{
    const nearest = rowsAll
      .filter(o=> o!==r && (!sameDongOnly || o.umd===r.umd) && pyBand(o.py)===pyBand(r.py) && o.r3n>=MIN_PEER_N && o.p3n>=MIN_PEER_N && Math.abs(o.p3max - r.p3max) / r.p3max <= 0.02
        && (o.r3max - r.r3max) / r.r3max > 0.02) // 비교군은 "이전엔 비슷했지만 최근엔 나보다 확실히(2% 초과) 더 오른" 단지만 인정 — 나와 비슷하게 움직인 단지(오르지도 처지지도 않은)는 저평가 판단에 참고가 안 되므로 제외.
        // sameDongOnly=true(비공개 "연간 저평가·동일 동" 탭 전용, 2026.08)일 땐 같은 동(umd)까지 일치해야 비교군으로 인정 —
        // 학군·역세권 등 입지 차이가 큰 다른 동 단지가 섞여 중앙값이 왜곡되는 걸 막기 위함. 기존 공개 "연간 저평가" 탭은 그대로(구·시 전체 비교) 유지.
      .sort((a,b)=> Math.abs(a.p3max-r.p3max) - Math.abs(b.p3max-r.p3max))
      .slice(0,5);
    const group = [r, ...nearest]; // groupN 표시용(본인 포함 표본수) — 중앙값 계산에는 본인 제외
    if(group.length < 3) return;
    const r3median = median(nearest.map(o=>o.r3max));
    const gapPct = Math.round((r.r3max - r3median)/r3median*100);
    if(gapPct <= -5 && gapPct >= -15){
      const peers = nearest.map(o=>({apt:o.apt, py:o.py, area:o.area, p3max:o.p3max, r3max:o.r3max})).sort((a,b)=>b.r3max-a.r3max); // 최근가 높은순 정렬
      divergence.push({ ...r, r3median:R1(r3median), gapAmt:R1(r3median-r.r3max), gapPct, groupN:group.length, peers });
    }
  });
  divergence.sort((a,b)=> b.gapAmt-a.gapAmt || b.n-a.n);

  // 최근/이전 1년 라벨 자동 계산 — months[0]이 최신월(YYYYMM)이므로 그 해를 "최근", 그 전해를 "이전"으로 표시.
  // 날짜가 바뀌어도(해가 넘어가도) 수동 수정 없이 항상 현재 기준으로 자동 갱신됨.
  const recentYearNum = parseInt(months[0].slice(0,4),10);
  const recentYearLabel = `${String(recentYearNum).slice(-2)}년`;
  const prevYearLabel = `${String(recentYearNum-1).slice(-2)}년`;

  return { found:true, mode: sameDongOnly ? 'longpeakdong' : 'longpeak', total:all.length,
    period:`${ymLabel(months[months.length-1])} ~ ${ymLabel(months[0])}`,
    years:yearsLabel(months),
    recentYearLabel, prevYearLabel, sameDongOnly:!!sameDongOnly,
    divergence: divergence.slice(0,30) };
}

function analyzeCompare(itemsByLawd, targets, months){
  const monthsAsc = months.slice().reverse();
  const m3 = months.slice(0,3);
  const complexes=[], missing=[];
  for(const tg of targets){
    const all = itemsByLawd[tg.lawd] || [];
    const m = matchComplex(all, tg.name);
    if(m.multi){ missing.push(`${tg.name}(여러 단지 일치 — 정확한 단지명 입력)`); continue; }
    const hits = m.hits || [];
    if(!hits.length){ missing.push(tg.name); continue; }
    const nameCnt={}; hits.forEach(t=>nameCnt[t.apt]=(nameCnt[t.apt]||0)+1);
    const officialName = Object.entries(nameCnt).sort((a,b)=>b[1]-a[1])[0][0];
    const groups={}; for(const t of hits)(groups[t.py]=groups[t.py]||[]).push(t);
    const pys = Object.entries(groups).map(([py, arrRaw])=>{
      const clean = markOutliers(arrRaw, months);
      const arr = clean.length? clean : arrRaw;
      const a3 = arr.filter(t=>m3.includes(t.ym));
      const monthly = monthsAsc.map(ym=>{
        const mA = arr.filter(t=>t.ym===ym);
        return mA.length? {ym:ymLabel(ym), avg:R1(avgA(mA)), n:mA.length} : null;
      }).filter(Boolean);
      const areaCnt={}; arr.forEach(t=>areaCnt[Math.floor(t.area)]=(areaCnt[Math.floor(t.area)]||0)+1); // 그룹 내 가장 흔한 전용면적을 대표값으로
      const area = +Object.entries(areaCnt).sort((a,b)=>b[1]-a[1])[0][0];
      return { py:`${py}평`, area, n:arr.length,
        avg3: a3.length? {v:R1(avgA(a3)), n:a3.length} : null,
        max: Math.max(...arr.map(t=>t.amt)), monthly };
    }).sort((a,b)=>parseInt(a.py)-parseInt(b.py));
    if(!pys.length){ missing.push(tg.name); continue; }
    complexes.push({name:officialName, umd:hits[0].umd, count:hits.length, pys, lawd:tg.lawd});
  }
  return { found:complexes.length>0, mode:'compare',
    period:`${ymLabel(months[months.length-1])} ~ ${ymLabel(months[0])}`,
    years:yearsLabel(months),
    complexes, missing };
}

function esc(s){ return String(s??'').replace(/[<>&"']/g, c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c])); }

// 결과 헤더 h2 제목 전용 축약 — 선택 패널·즐겨찾기 칩·드롭다운은 "성남 분당구"처럼 도시명을 유지해야
// 어느 도시인지 알 수 있지만(2026.08, "지역 선택" 패널에서 도시명 없이 구 이름만 뜨면 못 알아본다는 피드백),
// 이미 지역을 고르고 난 뒤의 결과 헤더는 서울처럼 구 이름만 보여도 문맥상 충분해서 이 지점에서만 축약.
// "A · B · C", "A 외 N곳" 형태(복수 지역 선택 시)도 각 지역명을 개별로 축약한 뒤 그대로 이어붙임.
function shortRegionOne(s){
  const m = String(s||'').match(/^(\S+)\s(\S+구)$/);
  return m ? m[2] : s;
}
function shortRegionLabel(s){
  s = String(s||'');
  const m = s.match(/^(.+?)( 외 \d+곳)$/);
  if(m) return shortRegionOne(m[1]) + m[2];
  if(s.includes(' · ')) return s.split(' · ').map(shortRegionOne).join(' · ');
  return shortRegionOne(s);
}

// 랭킹류 탭(지역/거래량/전세가율/신고가/신저가/평단가/등락/저평가 3종/단지비교) 헤더 상단 공용 조각 —
// 로고(왼쪽, 흐리게)·탭 배지(오른쪽, 청록 알약)를 한 줄로. 2026.08 리디자인: 예전엔 로고가 중앙-배지와
// 자리를 다투며 배지를 가운데 정렬시켜야 했는데, 로고를 왼쪽 고정하며 배지를 오른쪽으로 옮겨 서로 안 겹치게 함.
function hdTop(badgeLabel){
  return `<div class="hd-top">
    <span class="hd-logo"><svg width="12" height="12" viewBox="0 0 20 20"><rect x="2" y="10" width="4" height="8" fill="#00A9B4"/><rect x="8" y="6" width="4" height="12" fill="#7FD4D9"/><rect x="14" y="2" width="4" height="16" fill="#00A9B4"/></svg><span>아파트썸</span></span>
    <span class="hd-badge">${esc(badgeLabel)}</span>
  </div>`;
}
// 최근 vs 이전(또는 올해 vs 작년) 비교 문구 전용 강조 박스 — 예전엔 헤더 meta 줄에 다른 정보들과 같은 흐린
// 회색으로 섞여 있어 정작 결과 해석에 제일 중요한 "무엇과 무엇을 비교했는지"가 잘 안 보였음. 별도 박스로 분리.
function hdVs(prevLabel, recentLabel){

}

function showError(html){ const e=document.getElementById('error'); e.innerHTML=html; e.classList.add('on'); }

// ── 단지명 자동완성 ──
const aptMem = {}; // lawd → apts
let acInput = null, acTimer = null;

async function getApts(lawd){
  if(aptMem[lawd]) return aptMem[lawd];
  const items = await ensureMonths(lawd, 12);
  // 표기(공백 등)가 달라도 같은 단지는 하나로 합치기 위해, 공백 제거한 문자열을 그룹 키로 사용
  // (예: "아크로 베스티뉴" vs "아크로베스티뉴"가 자동완성에 별개로 뜨던 문제 방지)
  const groups = {}; // norm -> { umd, presaleOnly, variants: {원문표기: 건수} }
  for(const t of items){
    const norm = canonNorm(t.apt.replace(/\s/g,'')); // 개명 이력 있는 단지는 옛 이름 표기도 같은 그룹으로 합침
    if(!groups[norm]) groups[norm] = { umd:t.umd, presaleOnly:false, variants:{} };
    groups[norm].presaleOnly = false;
    groups[norm].variants[t.apt] = (groups[norm].variants[t.apt]||0)+1;
  }
  // 분양권·입주권 전용(매매 실거래 없는 신축) 단지도 자동완성에 뜨도록 함께 조회
  try{
    const itemsP = await ensureMonthsP(lawd, 12);
    for(const t of itemsP){
      const norm = canonNorm(t.apt.replace(/\s/g,''));
      if(!groups[norm]) groups[norm] = { umd:t.umd, presaleOnly:true, variants:{} };
      // presaleOnly 여부와 무관하게 항상 카운트해야 매매+분양권 합산 단지의 자동완성 건수(n)가 실제 합계로 표시됨
      // (이전에는 presaleOnly가 true인 그룹에서만 카운트해, 매매 실거래가 이미 있는 단지는 분양권 건수가 누락되었음)
      groups[norm].variants[t.apt] = (groups[norm].variants[t.apt]||0)+1;
    }
  }catch(e){}
  aptMem[lawd] = Object.values(groups).map(g=>{
    const name = Object.entries(g.variants).sort((a,b)=>b[1]-a[1])[0][0]; // 가장 많이 등장한 표기를 대표 이름으로
    const n = Object.values(g.variants).reduce((s,c)=>s+c,0);
    return { name, umd:g.umd, n, presaleOnly:g.presaleOnly };
  }).sort((a,b)=>b.n-a.n);
  return aptMem[lawd];
}

function acPos(input){
  const r = input.getBoundingClientRect();
  const ac = document.getElementById('ac');

  let left = r.left;
  if(left + w > window.innerWidth - 8) left = Math.max(8, window.innerWidth - 8 - w);
  ac.style.left = left+'px';

  ac.style.width = w+'px';
