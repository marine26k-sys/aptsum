<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>아파트썸 실거래 분석</title>
<meta name="description" content="국토부 실거래가 데이터 기반 무료 아파트 시세 분석 — 단지 분석, 단지 비교, 지역 랭킹을 확인하세요.">
<meta name="theme-color" content="#0F2B3D">

<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">

<meta property="og:type" content="website">
<meta property="og:site_name" content="아파트썸 실거래 분석">
<meta property="og:title" content="아파트썸 실거래 분석 — 국토부 실거래가 기반 무료 시세 분석">
<meta property="og:description" content="단지 분석 · 단지 비교 · 지역 랭킹을 국토부 공공 데이터로 무료 제공합니다.">
<meta property="og:image" content="https://aptsumprice.netlify.app/assets/og-image.png">
<meta property="og:url" content="https://aptsumprice.netlify.app/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="아파트썸 실거래 분석">
<meta name="twitter:description" content="국토부 실거래가 기반 무료 아파트 시세 분석">
<meta name="twitter:image" content="https://aptsumprice.netlify.app/assets/og-image.png">

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --teal:#00828A; --teal-dark:#00565C; --teal-soft:#E0F2F3; --teal-light:#A8E0E4; --teal-light-soft:#F2FBFB;
    --navy:#0F2B3D; --slate-bg:#F1F5F9; --ink:#1E293B; --sub:#64748B;
    --line:#E2E8F0; --red:#DC2626; --yellow:#F5B400;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Noto Sans KR',sans-serif;background:var(--slate-bg);color:var(--ink);line-height:1.6;font-variant-numeric:tabular-nums;min-height:100vh;word-break:keep-all;overflow-wrap:break-word}
  .wrap{max-width:420px;margin:0 auto;padding:0 16px 60px;position:relative}
  header{padding:28px 0 6px;text-align:center}
  .logo{display:inline-flex;align-items:center;gap:8px;font-weight:900;font-size:19px;color:var(--navy);letter-spacing:-.5px}
  header p{font-size:11.5px;color:var(--sub);margin-top:4px}

  .tabs{display:flex;flex-wrap:wrap;background:#E2E8F0;border-radius:12px;padding:4px;margin:18px 0 12px}
  .tab{flex:1;text-align:center;font-size:13px;font-weight:700;color:var(--sub);padding:9px;border-radius:9px;cursor:pointer;transition:all .15s}
  .tab.on{background:#fff;color:var(--teal-dark);box-shadow:0 1px 4px rgba(15,43,61,.1)}

  .search-box{display:grid;gap:8px;margin-bottom:8px}
  .search-box > *{min-width:0}
  .row2{display:flex;gap:8px}
  select,input.q{border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;font-family:inherit;background:#fff}
  select:focus,input.q:focus{outline:none;border-color:var(--teal)}
  select{flex:0 0 138px;width:100%}
  input.q{flex:1;min-width:0}
  .go{background:var(--teal);color:#fff;border:none;border-radius:12px;padding:13px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer}
  .go:disabled{background:#93C9CC}

  .loading{display:none;text-align:center;padding:40px 0}
  .loading.on{display:block}
  .spinner{width:34px;height:34px;border:4px solid var(--teal-soft);border-top-color:var(--teal);border-radius:50%;margin:0 auto 12px;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading div{font-size:12.5px;color:var(--sub)}

  .error{display:none;background:#FEF2F2;border:1px solid #FECACA;border-radius:12px;padding:13px 15px;font-size:12.5px;color:var(--red);margin-top:12px;line-height:1.7}
  .error.on{display:block}
  .error a{color:var(--teal);cursor:pointer;text-decoration:underline}

  #result{display:none;margin-top:14px}
  #result.on{display:block;animation:fade .4s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .card{background:#fff;border-radius:16px;box-shadow:0 2px 14px rgba(15,43,61,.07);margin-bottom:12px}
  .card-hd{background:var(--navy);color:#fff;padding:15px 18px;border-radius:16px 16px 0 0;position:sticky;top:0;z-index:5;box-shadow:0 2px 6px rgba(15,43,61,.15)}
  .card-hd h2{font-size:18px;font-weight:900;letter-spacing:-.5px}
  .card-hd .meta{font-size:11px;opacity:.75;margin-top:2px}
  .sec{padding:14px 18px}
  .sec+.sec{border-top:1px solid var(--line)}
  .sec h3{display:inline-block;font-size:11.5px;font-weight:900;color:#fff;background:var(--teal);letter-spacing:.4px;padding:4px 10px;border-radius:6px;margin-bottom:9px}

  table{width:100%;border-collapse:collapse;font-size:11.5px}
  th{color:var(--sub);font-weight:500;font-size:10.5px;text-align:left;padding:3px 4px;border-bottom:1px solid var(--line);white-space:pre-line}
  td{padding:6px 4px;border-bottom:1px dashed var(--line)}
  .peer-table{table-layout:fixed}
  .peer-table th{padding:2px 4px;font-size:9.5px;overflow-wrap:break-word}
  .peer-table td{padding:1px 4px;font-size:10px;border-bottom:1px dashed var(--line);overflow-wrap:break-word}
  .peer-table th:nth-child(1),.peer-table td:nth-child(1){width:36%;word-break:break-all}
  .peer-table th:nth-child(2),.peer-table td:nth-child(2){width:13%}
  .peer-table th:nth-child(3),.peer-table td:nth-child(3),
  .peer-table th:nth-child(4),.peer-table td:nth-child(4){width:25.5%}
  .peer-table tr:last-child td{border-bottom:none}
  .tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  tr:last-child td{border-bottom:none}
  td b{font-size:12.5px;color:var(--navy)}
  .tr-r{text-align:right}
  .rng{color:var(--sub);font-size:10.5px}
  .th-recent{color:var(--teal-dark);font-weight:700}
  .td-recent b{color:var(--teal-dark)}
  .th-max{color:#fff;background:var(--red);border-radius:6px 6px 0 0;border-bottom:2px solid var(--red)}
  .td-max{background:#FEF2F2}
  .td-max b{color:var(--red);font-size:13px}
  .th-teal{color:#fff;background:var(--teal);border-radius:6px 6px 0 0;border-bottom:2px solid var(--teal)}
  .td-teal{background:var(--teal-soft)}
  .td-teal b{color:var(--teal-dark);font-size:13px}
  .th-teal2{color:var(--teal-dark);background:var(--teal-light);border-radius:6px 6px 0 0;border-bottom:2px solid var(--teal)}
  .td-teal2{background:var(--teal-light-soft)}
  .td-teal2 b{color:var(--teal-dark);font-size:13px}
  .nh{display:inline-block;font-size:7.5px;font-weight:700;color:#fff;background:var(--red);border-radius:2.5px;padding:1px 4px;margin-left:4px;vertical-align:1px}
  .extag{display:inline-block;font-size:9px;font-weight:700;color:var(--sub);background:var(--slate-bg);border:1px solid var(--line);border-radius:3px;padding:0 5px;margin-left:4px;vertical-align:1px}
  tr.exrow td{opacity:.45}

  .trend{display:flex;align-items:center;gap:10px;background:var(--slate-bg);border-radius:10px;padding:11px 14px}
  .trend .pct{font-size:14px;font-weight:900}
  .up{color:var(--teal)} .down{color:var(--red)}
  .trend .d{font-size:11px;color:var(--sub);line-height:1.5}
  .trend .d b{font-size:13px;color:var(--navy);font-weight:900}

  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .chip{font-size:11px;font-weight:700;border:1.5px solid var(--line);color:var(--sub);border-radius:20px;padding:4px 12px;cursor:pointer}
  .chip.on{border-color:var(--teal);color:var(--teal-dark);background:var(--teal-soft)}
  .chart-wrap{overflow:hidden}
  .chart-note{font-size:10px;color:var(--sub);text-align:right;margin-top:2px}
  circle[data-tip]{touch-action:none}
  .chart-hover-capture{touch-action:none;cursor:crosshair}

  .rk{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:12px}
  .rk:last-child{border-bottom:none}
  .rk .no{flex:none;width:20px;height:20px;border-radius:6px;background:var(--slate-bg);color:var(--sub);font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .rk:nth-child(-n+3) .no{background:var(--teal);color:#fff}
  .rk .nm{flex:1;min-width:0;font-weight:500;display:flex;flex-direction:column;gap:2px}
  .rk .nm .nm-title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rk .nm small{color:var(--sub);font-weight:400;font-size:10px}
  .rk .val{flex:none;text-align:right;font-weight:700;font-size:12px}
  .rk .val small{display:block;font-weight:400;color:var(--sub);font-size:10px}
  .rk .nm .clickable{cursor:pointer;border-bottom:1px dotted var(--sub)}

  .cmp-row{display:flex;gap:8px;margin-bottom:8px}
  .cmp-row select{flex:0 0 128px}
  .cmp-row input{flex:1;min-width:0;border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;font-family:inherit}
  .cmp-row input:focus{outline:none;border-color:var(--teal)}
  .cmp-row .rm{flex:none;width:40px;border:none;background:var(--slate-bg);border-radius:12px;color:var(--sub);font-size:16px;cursor:pointer}
  .legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin:8px 0 4px}
  .legend span{font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:5px}
  .legend i{width:14px;height:3.5px;border-radius:2px;display:inline-block}
  .toggle2{display:inline-flex;background:var(--slate-bg);border-radius:8px;padding:3px;margin-left:auto}
  .toggle2 span{font-size:10.5px;font-weight:700;color:var(--sub);padding:4px 10px;border-radius:6px;cursor:pointer}
  .toggle2 span.on{background:#fff;color:var(--teal-dark);box-shadow:0 1px 3px rgba(15,43,61,.12)}
  .ctl-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  #ac{position:fixed;z-index:60;background:#fff;border:1.5px solid var(--line);border-radius:12px;box-shadow:0 6px 20px rgba(15,43,61,.14);max-height:280px;overflow-y:auto;display:none}
  #ac.on{display:block}
  .ac-item{padding:10px 14px;font-size:13px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #F1F5F9}
  .ac-item:last-child{border-bottom:none}
  .ac-item:hover,.ac-item.hl{background:var(--teal-soft)}
  .ac-item b{color:var(--teal-dark)}
  .ac-item small{color:var(--sub);font-size:10.5px;white-space:nowrap;align-self:center}
  .ac-msg{padding:12px 14px;font-size:12px;color:var(--sub)}
  #tip{position:fixed;z-index:90;background:var(--navy);color:#fff;font-size:11px;line-height:1.5;border-radius:8px;padding:7px 10px;pointer-events:none;display:none;box-shadow:0 4px 14px rgba(15,43,61,.3);max-width:230px}
  #tip b{color:#7FD4D9}
  #mpop{position:fixed;inset:0;z-index:80;background:rgba(15,43,61,.45);display:none;align-items:center;justify-content:center;padding:20px}
  #mpop.on{display:flex}
  .mpop-box{background:#fff;border-radius:16px;box-shadow:0 10px 40px rgba(15,43,61,.3);max-width:380px;width:100%;padding:16px 18px;animation:fade .25s ease}
  .mpop-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .mpop-hd h3{font-size:13px;font-weight:900;color:var(--navy)}
  .mpop-hd button{border:none;background:var(--slate-bg);border-radius:8px;width:28px;height:28px;font-size:15px;color:var(--sub);cursor:pointer}
  .mpop-note{font-size:10px;color:var(--sub);margin-top:6px;text-align:right}
  .src-note{font-size:10px;color:var(--sub);text-align:center;padding:4px 0 20px;line-height:1.6}

  .fbar-row{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .fbar-lb{flex:0 0 64px;display:flex;flex-direction:column;gap:1px}
  .fbar-lb b{font-size:11.5px;color:var(--navy)}
  .fbar-lb .rng{font-size:9px}
  .fbar-track{flex:1;background:var(--slate-bg);border-radius:6px;height:15px;overflow:hidden}
  .fbar-fill{height:100%;border-radius:6px;transition:width .3s ease}
  .fbar-v{flex:0 0 44px;text-align:right;font-weight:700;font-size:12px;color:var(--navy)}

  /* ── 우클릭/드래그/복사 방지 (입력창은 예외) ── */
  body{ -webkit-user-select:none; -moz-user-select:none; user-select:none; -webkit-touch-callout:none; }
  input, textarea, select{ -webkit-user-select:auto; -moz-user-select:auto; user-select:auto; -webkit-touch-callout:default; }
  img{ -webkit-user-drag:none; user-drag:none; pointer-events:auto; }
  /* 커스텀 지역 선택 — 네이티브 select 드롭다운은 행 높이를 OS가 그려서 CSS로 못 줄이므로 직접 그린다 */
  #lawd{position:absolute;opacity:0;pointer-events:none;width:0;height:0}
  .rgpick{flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:6px;
    background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;
    font-family:inherit;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;text-align:left}
  .rgpick span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rgpick b{flex:0 0 auto;font-size:10px;color:var(--sub)}
  .rgdim{position:fixed;inset:0;background:rgba(15,43,61,.45);z-index:120;display:none}
  .rgdim.on{display:block}
  .rgpanel{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:460px;
    background:#fff;border-radius:16px 16px 0 0;z-index:121;display:none;flex-direction:column;max-height:82vh;overflow:hidden}
  .rgpanel.on{display:flex}
  .rghd{flex:0 0 auto;padding:12px 14px 8px;border-bottom:1px solid var(--line)}
  .rghd h4{margin:0 0 8px;font-size:14px;font-weight:800;color:var(--ink)}
  .rgsearch{width:100%;box-sizing:border-box;border:1.5px solid var(--line);border-radius:10px;
    padding:8px 10px;font-family:inherit;font-size:13px;outline:none}
  .rgsearch:focus{border-color:var(--teal)}
  .rgbody{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px}
  .rggrp{position:sticky;top:0;background:var(--slate-bg);color:var(--sub);
    font-size:10px;font-weight:800;padding:4px 14px;letter-spacing:.3px;z-index:1}
  /* 행간 초밀착: 세로 패딩 최소화 + line-height 1.15 → 행 높이 약 26px */
  .rgitem{display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:5px 14px;font-size:13px;line-height:1.15;color:var(--ink);cursor:pointer;border:0;background:none;
    width:100%;box-sizing:border-box;font-family:inherit;text-align:left}
  .rgitem:active{background:var(--teal-light-soft)}
  .rgitem.sel{background:var(--teal-soft);color:var(--teal-dark);font-weight:800}
  .rgitem.all{font-weight:800;color:var(--teal-dark)}
  .rgitem .tick{flex:0 0 auto;font-size:12px;color:var(--teal);visibility:hidden}
  .rgitem.sel .tick{visibility:visible}
  .rgft{flex:0 0 auto;display:flex;gap:8px;padding:9px 14px;border-top:1px solid var(--line);background:#fff}
  .rgft button{flex:1;border:0;border-radius:10px;padding:10px;font-family:inherit;font-size:13px;font-weight:800;cursor:pointer}
  .rgft .ok{background:var(--teal);color:#fff}
  .rgft .cl{background:var(--slate-bg);color:var(--sub)}
</style>
</head>
<body>
<div class="wrap">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2px;gap:8px">
    <a href="https://aptsum.netlify.app" style="font-size:11px;font-weight:700;color:var(--teal-dark);background:var(--teal-soft);border-radius:8px;padding:3px 8px;text-decoration:none;white-space:nowrap">📩 비즈니스 문의</a>
    <div style="display:flex;gap:5px;align-items:center">
      <img src="https://visitor-badge.laobi.icu/badge?page_id=aptsumprice.netlify.app&text=Total" alt="전체 방문자 수" loading="lazy" style="height:14px;opacity:.8">
      <img id="dailyBadge" alt="오늘 방문자 수" loading="lazy" style="height:14px;opacity:.8">
    </div>
  </div>
  <script>
    // 오늘 날짜를 page_id에 포함시켜, 날짜가 바뀌면 새 카운터로 자동 리셋되는 방식으로 "일일 방문자"를 구현
    (function(){
      const d = new Date();
      const ymd = d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
      document.getElementById('dailyBadge').src = `https://visitor-badge.laobi.icu/badge?page_id=aptsumprice.netlify.app-daily-${ymd}&text=Today`;
    })();
  </script>
  <header>
    <div class="logo" onclick="logoClick()" style="cursor:default">
      <svg width="20" height="20" viewBox="0 0 20 20"><rect x="2" y="10" width="4" height="8" fill="#00828A"/><rect x="8" y="6" width="4" height="12" fill="#0F2B3D"/><rect x="14" y="2" width="4" height="16" fill="#00828A"/></svg>
      아파트썸 실거래 분석
    </div>
  </header>

  <div class="tabs">
    <div class="tab on" id="tabC" onclick="setMode('complex')">단지 분석</div>
    <div class="tab" id="tabCmp" onclick="setMode('compare')">단지 비교</div>
    <div class="tab" id="tabR" onclick="setMode('region')">지역 랭킹</div>
    <div class="tab" id="tabV" onclick="setMode('volume')">거래량<br>랭킹</div>
    <div class="tab" id="tabU" onclick="setMode('updown')">등락 랭킹</div>
    <div class="tab" id="tabP" onclick="setMode('peak')" style="display:none">분기<br>저평가</div>
    <div class="tab" id="tabLP" onclick="setMode('longpeak')" style="display:none">연간<br>저평가</div>
  </div>

  <div class="search-box">
    <div class="row2" id="singleRow">
      <select id="lawd" style="flex:1;min-width:0"></select>
      <button type="button" class="rgpick" id="rgPick" onclick="openRegionPicker()"><span id="rgPickTxt">지역 선택</span><b>▼</b></button>
      <button id="regionFavBtn" onclick="toggleFavRegion()" title="이 지역 즐겨찾기" style="flex:0 0 auto;width:38px;background:#fff;border:1.5px solid var(--line);border-radius:12px;color:#D97706;font-size:15px;cursor:pointer">☆</button>
    </div>
    <div id="regionChips" style="display:none"></div>
    <input class="q" id="q" type="text" placeholder="아파트 단지명만 입력 (예: 래미안)" onkeydown="if(event.key==='Enter')search()" style="width:100%" autocomplete="off">
    <div id="cmpRows" style="display:none"></div>
    <button id="addRow" onclick="addCmpRow()" style="display:none;background:none;border:1.5px dashed var(--line);border-radius:12px;padding:9px;font-size:12px;font-weight:700;color:var(--sub);font-family:inherit;cursor:pointer">+ 단지 추가 (최대 4개)</button>
    <div class="row2" id="optRow">
      <select id="monthsN" style="flex:1.3;min-width:0">
        <option value="12">최근 1년</option>
        <option value="24" selected>최근 2년</option>
        <option value="36">최근 3년</option>
        <option value="48">최근 4년</option>
        <option value="60">최근 5년</option>
      </select>
      <select id="pyBand" style="flex:1;min-width:0;display:none">
        <option value="" selected>전체 평형</option>
        <option value="17-22">17~22평</option>
        <option value="23-27">23~27평</option>
        <option value="28-31">28~31평</option>
        <option value="32-36">32~36평</option>
        <option value="37-41">37~41평</option>

<script>
const REGIONS = [

];
let mode = 'complex';
let lastData = null;

// ── 뒤로가기 복원: 검색 결과를 스택에 쌓고 popstate로 복원 ──
const viewStack = [];
function pushView(){
  const inputs = {
    mode, lawd: sel.value,
    q: document.getElementById('q').value,
    mN: document.getElementById('monthsN').value,
    fM: document.getElementById('floorMin').value,
    py: document.getElementById('pyBand').value,
    cmp: [...document.querySelectorAll('.cmp-row')].map(r=>({lawd:r.querySelector('select').value, name:r.querySelector('input').value}))
  };
  viewStack.push({data:lastData, inputs});
  try{ history.pushState({vi: viewStack.length-1}, '', buildShareURL(inputs)); }catch(e){} // 샌드박스 미리보기(about:blank 등) 등 History API를 못 쓰는 환경에서도 앱 동작에 지장 없게
}
function buildShareURL(inp){
  // 비공개 탭(저평가/연간 저평가)은 공유 링크에 절대 노출하지 않음 — 잠금 우회 방지
  if(inp.mode==='peak' || inp.mode==='longpeak') return location.pathname;
  const p = new URLSearchParams();
  p.set('m', inp.mode); p.set('p', inp.mN); p.set('f', inp.fM);
  if(inp.mode==='compare'){
    p.set('c', inp.cmp.filter(x=>x.name.trim()).map(x=>x.lawd+':'+x.name.trim()).join('|'));
  } else {
    p.set('r', inp.lawd);
    if(inp.mode==='complex') p.set('q', inp.q);
    if((inp.mode==='region'||inp.mode==='volume'||inp.mode==='updown'||inp.mode==='peak'||inp.mode==='longpeak') && inp.py) p.set('py', inp.py);
  }
  return location.pathname + '?' + p.toString();
}
// 공유 링크 진입 시 자동 검색
function initFromURL(){
  const p = new URLSearchParams(location.search);
  const m = p.get('m');
  if(!m) return;
  // 비공개 탭(저평가/연간 저평가)은 URL만으로 절대 진입 불가 — 잠금 해제(비번 통과) 상태가 아니면 완전히 무시
  if(m==='peak' || m==='longpeak'){
    let unlocked = false;
    try{ unlocked = localStorage.getItem('apc:peakUnlocked') === '1'; }catch(e){}
    if(!unlocked) return;
  }
  setMode(m==='compare'?'compare':(m==='region'?'region':(m==='volume'?'volume':(m==='updown'?'updown':(m==='peak'?'peak':(m==='longpeak'?'longpeak':'complex'))))));
  if(p.get('p')) document.getElementById('monthsN').value = p.get('p');
  if(p.get('f')!==null) document.getElementById('floorMin').value = p.get('f');
  if(m==='compare'){
    const items = (p.get('c')||'').split('|').map(s=>{ const i=s.indexOf(':'); return {lawd:s.slice(0,i), name:s.slice(i+1)}; }).filter(x=>x.name);
    document.getElementById('cmpRows').innerHTML='';
    items.forEach(c=>{ addCmpRow(); const rows=document.querySelectorAll('.cmp-row'); const r=rows[rows.length-1]; r.querySelector('select').value=c.lawd; r.querySelector('input').value=c.name; });
    if(items.length>=2) search();
  } else {
    if(p.get('r')) sel.value = p.get('r');
    if(m==='region'||m==='volume'||m==='updown'||m==='peak'||m==='longpeak'){ if(p.get('py')) document.getElementById('pyBand').value = p.get('py'); search(); }
    else if(p.get('q')){ document.getElementById('q').value = p.get('q'); search(); }
  }
}
async function shareCurrent(){
  const url = location.origin + location.pathname + location.search;
  try{
    if(navigator.share){ await navigator.share({title:'아파트썸 실거래 분석', url}); return; }
    await navigator.clipboard.writeText(url);
    alert('분석 링크가 복사되었습니다');
  }catch(e){}
}

// ── 즐겨찾기 ──
function getFavs(){ try{ return JSON.parse(localStorage.getItem('apc:favs')||'[]'); }catch(e){ return []; } }
function isFav(lawd, name){ return getFavs().some(x=>x.lawd===lawd && x.name===name); }
function toggleFav(lawd, name){
  let favs = getFavs();
  if(isFav(lawd,name)){
    favs = favs.filter(x=>!(x.lawd===lawd && x.name===name));
    clearFavSeen(lawd, name);
  } else {
    const label = [...sel.options].find(o=>o.value===lawd)?.textContent || '';
    favs.unshift({lawd, name, label});
    favs = favs.slice(0,10);
    // 방금 추가한 즐겨찾기는 "지금까지의 거래건수"를 기준선으로 저장 → 다음 방문부터만 신규 거래 배지 표시
    favTradeCount(lawd, name).then(n=>setFavSeenCount(lawd, name, n)).catch(()=>{});
  }
  try{ localStorage.setItem('apc:favs', JSON.stringify(favs)); }catch(e){}
  renderFavs();
  const btn = document.getElementById('favBtn');
  if(btn) btn.textContent = isFav(lawd,name)? '★':'☆';
}
function renderFavs(){
  const favs = getFavs();
  const el = document.getElementById('favs');
  el.innerHTML = favs.map(x=>{
    const nb = favBadges[favKey(x.lawd,x.name)];
    const badge = nb>0 ? `<span class="nh">신규 ${nb}</span>` : '';
    return `<span class="chip" onclick="favGo('${esc(x.lawd)}','${esc(x.name)}')">★ ${esc(x.name)}<span style="font-weight:400;color:var(--sub)"> ${esc(x.label)}</span>${badge}</span>`;
  }).join('');
}
function favGo(lawd, name){
  setMode('complex');
  sel.value = lawd;
  document.getElementById('q').value = name;
  search();
  favTradeCount(lawd, name).then(n=>setFavSeenCount(lawd, name, n)).catch(()=>{}); // 확인했으니 배지 기준선 갱신
}
// ── 즐겨찾기 "신규 거래" 배지: 최근 12개월 거래건수를 마지막 확인 시점과 비교 ──
const favBadges = {}; // "lawd|name" → 신규 거래 건수
function favKey(lawd, name){ return lawd+'|'+name; }
function getFavSeen(){ try{ return JSON.parse(localStorage.getItem('apc:favSeen')||'{}'); }catch(e){ return {}; } }
function setFavSeenCount(lawd, name, n){
  try{
    const seen = getFavSeen();
    seen[favKey(lawd,name)] = n;
    localStorage.setItem('apc:favSeen', JSON.stringify(seen));
  }catch(e){}
  delete favBadges[favKey(lawd,name)];
}
function clearFavSeen(lawd, name){
  try{
    const seen = getFavSeen();
    delete seen[favKey(lawd,name)];
    localStorage.setItem('apc:favSeen', JSON.stringify(seen));
  }catch(e){}
  delete favBadges[favKey(lawd,name)];
}
async function favTradeCount(lawd, name){
  const items = await ensureMonths(lawd, 12); // 층수 필터와 무관하게 표준 12개월 기준으로 비교
  let itemsP = [];
  try{ itemsP = await ensureMonthsP(lawd, 12); }catch(e){} // 분양권 전용(매매 실거래 없는) 단지도 신규 거래 배지 대상에 포함
  const m = matchComplex(items, name);
  if(m.hits && m.hits.length) return m.hits.length + (matchComplex(itemsP, name).hits || []).length;
  const mp = matchComplex(itemsP, name);
  return mp.hits ? mp.hits.length : 0;
}
// 재방문 시(앱 로드 시) 즐겨찾기별로 마지막 확인 이후 늘어난 거래건수를 조회해 배지 표시
function refreshFavBadges(){
  const favs = getFavs();
  if(!favs.length) return;
  const seen = getFavSeen();
  favs.forEach(f=>{
    favTradeCount(f.lawd, f.name).then(n=>{
      const key = favKey(f.lawd, f.name);
      const prev = seen[key];
      if(prev===undefined){ setFavSeenCount(f.lawd, f.name, n); return; } // 최초 기준선
      const diff = n - prev;
      if(diff > 0){ favBadges[key] = diff; renderFavs(); }
    }).catch(()=>{}); // 배지는 부가 기능이므로 조회 실패는 조용히 무시
  });
}

// ── 자주 보는 지역(구) 즐겨찾기 ──
function getFavRegions(){ try{ return JSON.parse(localStorage.getItem('apc:favRegions')||'[]'); }catch(e){ return []; } }
function isFavRegion(code){ return getFavRegions().some(x=>x.code===code); }
function toggleFavRegion(){
  const code = sel.value;
  let favs = getFavRegions();
  if(isFavRegion(code)) favs = favs.filter(x=>x.code!==code);
  else {
    const label = [...sel.options].find(o=>o.value===code)?.textContent || code;
    favs.unshift({code, label});
    favs = favs.slice(0,20);
  }
  try{ localStorage.setItem('apc:favRegions', JSON.stringify(favs)); }catch(e){}
  renderFavRegions();
  updateRegionFavBtn();
}
function updateRegionFavBtn(){
  const btn = document.getElementById('regionFavBtn');
  if(btn) btn.textContent = isFavRegion(sel.value) ? '★' : '☆';
}
function renderFavRegions(){
  const favs = getFavRegions();
  const el = document.getElementById('favRegions');
  el.innerHTML = favs.map(x=>`<span class="chip${x.code===sel.value?' on':''}" onclick="favRegionGo('${esc(x.code)}')">${esc(x.label)}</span>`).join('');
}
function favRegionGo(code){
  sel.value = code;
  updateRegionFavBtn();
  renderFavRegions();
  if(mode==='region'||mode==='volume'||mode==='updown'||mode==='peak'||mode==='longpeak') search(); // 랭킹은 단지명 입력이 필요 없으니 바로 조회
}
function restoreView(vi){
  const v = viewStack[vi];
  if(!v){ // 초기 화면
    document.getElementById('result').classList.remove('on');
    document.getElementById('result').innerHTML='';
    return;
  }
  const inp = v.inputs;
  setMode(inp.mode);
  sel.value = inp.lawd;
  document.getElementById('q').value = inp.q;
  document.getElementById('monthsN').value = inp.mN;
  document.getElementById('floorMin').value = inp.fM;
  document.getElementById('pyBand').value = inp.py;
  if(inp.mode==='compare'){
    document.getElementById('cmpRows').innerHTML='';
    inp.cmp.forEach(c=>{ addCmpRow(); const rows=document.querySelectorAll('.cmp-row'); const r=rows[rows.length-1]; r.querySelector('select').value=c.lawd; r.querySelector('input').value=c.name; });
  }
  lastData = v.data;
  updateRegionFavBtn();
  renderFavRegions();
  if(v.data.mode==='complex') renderComplex(v.data);
  else if(v.data.mode==='compare') renderCompare(v.data);
  else if(v.data.mode==='updown') renderUpDown(v.data);
  else if(v.data.mode==='peak') renderPeak(v.data);
  else if(v.data.mode==='longpeak') renderLongPeak(v.data);
  else if(v.data.mode==='volume') renderVolume(v.data);
  else renderRegion(v.data);
}
try{ history.replaceState({vi:-1}, ''); }catch(e){} // 샌드박스 미리보기(about:blank 등) 등 History API를 못 쓰는 환경 대비
window.addEventListener('popstate', e=>{
  const vi = e.state && typeof e.state.vi==='number' ? e.state.vi : -1;
  restoreView(vi);
});

// 저평가(신규 로직, 3개월 최고가 기준) 탭 — 로고 5회 연속 클릭 시에만 비번 모달이 뜨는 숨김 기능
let _logoClicks = 0, _logoClickTimer = null;

}

  const pw = document.getElementById('peakPwInput').value;

    try{ localStorage.setItem('apc:peakUnlocked','1'); }catch(e){}

    document.getElementById('peakPwErr').style.display = '';
  }
}
document.getElementById('peakPwInput').addEventListener('keydown', e=>{ if(e.key==='Enter') submitPeakPw(); });
(function(){ // 이전에 잠금 해제한 적 있으면(이 브라우저 기준) 재입력 없이 탭 계속 노출
  try{ if(localStorage.getItem('apc:peakUnlocked')==='1'){ document.getElementById('tabP').style.display = ''; document.getElementById('tabLP').style.display = ''; } }catch(e){}
})();

const sel = document.getElementById('lawd');
// 시·도 전체 통합 조회용 가상 코드 — 값이 'ALL:서울' 형태. 실제 조회 시 해당 시·도의 모든 구/시군 코드로 펼쳐진다.
// 조회량이 지역 수만큼 배로 늘어나므로 지역 랭킹 탭에서만 노출한다(setMode 참조).
const ALL_PREFIX = 'ALL:';
function isAllScope(v){ return String(v||'').startsWith(ALL_PREFIX); }
function lawdsOfScope(v){
  const g = String(v).slice(ALL_PREFIX.length);
  const hit = REGIONS.find(([name])=>name===g);
  return hit ? hit[1].map(([n,c])=>({name:n, lawd:c})) : [];
}
REGIONS.forEach(([g,arr])=>{
  const og = document.createElement('optgroup'); og.label=g;
  const all = document.createElement('option');
  all.value = ALL_PREFIX+g; all.textContent = g+' 전체'; all.dataset.scope='all';

// ═══ 데이터 조회: 샤드 병렬 + 월 캐시 ═══
// ⚠️ CACHE_VER 체크리스트 — 아래 중 하나라도 바뀌면 배포 전에 반드시 +1 할 것:
//    · areaToPy() 앵커/보간 로직, parseItems()의 필드 구성(LS_FIELDS/LS_FIELDS_P/LS_FIELDS_J 순서 포함)
//    · xtag() 파싱 방식, dealAmount/deposit/excluUseAr 등 원본 API 필드 처리 방식
//    · 서버(analyze.mjs/presale.mjs/rent.mjs)가 응답에 담는 아이템의 필드 자체가 늘거나 줄 때
//    올리지 않으면 브라우저에 캐시된 옛 포맷 데이터가 새 코드로 그대로 읽혀 오류가 날 수 있음.
// 브라우저 localStorage 키 + API 요청 쿼리에 모두 반영되어, CDN의 durable 캐시와
// 브라우저의 영구 캐시를 동시에 무효화한다 (재배포만으로는 두 캐시 다 안 지워짐).
const CACHE_VER = 5;
// 이전 CACHE_VER 세대의 고아 캐시 정리 — 버전을 올릴 때마다 옛 데이터가 안 지워지고 쌓이면
// localStorage 용량을 넘겨서 매번 저장이 실패(=캐시가 전혀 안 쌓여 계속 느려짐)할 수 있으므로 시작 시 한 번 청소
// ⚠️ "apc:favs"·"apc:pyBand"처럼 버전 태그가 없는 설정값은 절대 건드리면 안 됨 — "apc:숫자:" 형태(월별 캐시)만 정확히 골라서 지운다
(function cleanupOldCache(){
  try{
    const versionedRe = /^apc[PJ]?:\d+:/;
    const keep = 'apc:'+CACHE_VER+':', keepP = 'apcP:'+CACHE_VER+':', keepJ = 'apcJ:'+CACHE_VER+':';
    const toRemove = [];
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(!k || !versionedRe.test(k)) continue; // 버전 태그 있는 캐시 키가 아니면(즐겨찾기 등 설정값) 절대 건드리지 않음
      if(!k.startsWith(keep) && !k.startsWith(keepP) && !k.startsWith(keepJ)) toRemove.push(k);
    }
    toRemove.forEach(k=>localStorage.removeItem(k));
  }catch(e){}
})();
const monthCache = {}; // lawd → { ym: {t, items} }
const FRESH_TTL_MS = 3600000; // 최신 4개월 재확인 주기: 1시간 (2026.07 6시간→1시간 변경)
const EMPTY_RETRY_TTL_MS = 1800000; // 과거월 캐시가 0건일 때만 재확인하는 주기(30분, 기존 유지) — API 일시 오류로 빈 캐시가 영구 박제되는 것 방지용, 최신월 TTL과는 별개
const STALE_RETRY_TTL_MS = 604800000; // 과거월이 0건이 아니어도(=거래는 있었지만) 캐시가 7일 넘게 지났으면 한 번 재확인 (2026.07 추가 — 조회 시점엔 일부만 신고돼 있다가 나중에 추가·정정 신고되는 경우, "4개월 신선 구간"을 벗어난 뒤엔 영구 고정돼 못 잡던 문제 보완. 재확인 후 캐시 시각(t)이 갱신되므로 이후 다시 7일 주기로 반복 확인됨(완전한 1회성은 아님) — 신고 지연이 통상 며칠~한 달 단위라 7일이면 대부분 커버되면서도 과도한 재호출은 피하는 절충)
function lastMonthsYm(n){
  const out=[]; const d=new Date();
  for(let i=0;i<n;i++){ out.push(`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}`); d.setMonth(d.getMonth()-1); }
  return out; // 최신→과거
}
const ymLabel = ym => `${ym.slice(2,4)}.${ym.slice(4)}`;
async function postFetch(lawd, yms){
  // GET + 정렬된 yms → 사용자 간 동일 URL로 CDN 캐시 적중률 확보
  const q = yms.slice().sort().join(',');
  const res = await fetch(`/api/analyze?lawd=${encodeURIComponent(lawd)}&yms=${q}&v=${CACHE_VER}`);
  const d = await res.json().catch(()=>({}));
  if(!res.ok || d.error) throw new Error(d.error || '오류 ('+res.status+')');
  return d.items || [];
}

// ── localStorage 영구 캐시 (압축 배열 포맷, 용량 초과 시 오래된 지역 삭제) ──
const LS_FIELDS = ['apt','umd','area','py','amt','ym','d','floor','build','direct'];
const lsLoaded = {};
function lsLoad(lawd){
  if(lsLoaded[lawd]) return;
  lsLoaded[lawd] = true;
  try{
    const raw = JSON.parse(localStorage.getItem('apc:'+CACHE_VER+':'+lawd) || 'null');
    if(!raw) return;
    const cache = monthCache[lawd] = monthCache[lawd] || {};
    for(const [ym, e] of Object.entries(raw)){
      if(cache[ym]) continue;
      cache[ym] = { t: e.t, items: e.i.map(a => Object.fromEntries(LS_FIELDS.map((k,j)=>[k, a[j]]))) };
    }
  }catch(e){}
}
function lsSave(lawd){
  try{
    const cache = monthCache[lawd]; if(!cache) return;
    const out = {};
    for(const [ym, e] of Object.entries(cache)) out[ym] = { t: e.t, i: e.items.map(t => LS_FIELDS.map(k => t[k])) };
    localStorage.setItem('apc:'+CACHE_VER+':'+lawd, JSON.stringify(out));
    const meta = JSON.parse(localStorage.getItem('apc:'+CACHE_VER+':meta') || '{}');
    meta[lawd] = Date.now();
    localStorage.setItem('apc:'+CACHE_VER+':meta', JSON.stringify(meta));
  }catch(e){
    // 용량 초과 → 가장 오래 안 쓴 지역부터 삭제 후 1회 재시도
    try{
      const meta = JSON.parse(localStorage.getItem('apc:'+CACHE_VER+':meta') || '{}');
      const victims = Object.entries(meta).filter(([k])=>k!==lawd).sort((a,b)=>a[1]-b[1]);
      if(victims.length){
        localStorage.removeItem('apc:'+CACHE_VER+':'+victims[0][0]);
        delete meta[victims[0][0]];
        localStorage.setItem('apc:'+CACHE_VER+':meta', JSON.stringify(meta));
        lsSave(lawd);
      }
    }catch(e2){}
  }
}

async function ensureMonths(lawd, n){
  lsLoad(lawd);
  const yms = lastMonthsYm(n);
  const cache = monthCache[lawd] = monthCache[lawd] || {};
  const now = Date.now();
  const fresh = new Set(yms.slice(0,4)); // 최신 4개월: 1시간 TTL (2026.07 2→4개월 확대 — 국토부 신고기한(최대 30일)으로 실거래가 계약월보다 늦게, 심지어 다다음달에도 뒤늦게 등록되는 경우가 있어 2개월로는 놓치는 경우 발생. "저평가" 탭처럼 과거월 최고가를 고정값으로 쓰는 계산은 뒤늦게 반영된 신고가를 못 따라잡을 수 있어 확대)
  // 과거월이라도 캐시된 결과가 0건이면 API 일시 오류(레이트리밋 등)로 빈 캐시가 영구 박제될 수 있으므로
  // 30분 경과 시 한 번 더 재확인한다. 실제로 거래가 없는 달은 다시 0건으로 채워질 뿐이라 안전하다.
  // 0건이 아니어도(거래는 있었지만 조회 시점엔 일부만 신고돼 있던 경우) 7일 지나면 한 번 더 재확인
  const missing = yms.filter(ym =>
    !cache[ym] ||
    (fresh.has(ym) && now - cache[ym].t > FRESH_TTL_MS) ||
    (cache[ym].items.length === 0 && now - cache[ym].t > EMPTY_RETRY_TTL_MS) ||
    (!fresh.has(ym) && cache[ym].items.length > 0 && now - cache[ym].t > STALE_RETRY_TTL_MS)
  );
  if(missing.length){
    // CDN 캐시 효율: 최신월 요청과 과거월 요청 분리 (과거월 샤드는 30일 캐시 대상)

}

// ── 세대수 조회 (국토부 공동주택 단지목록·기본정보 API, 실거래 API와 별도) ──
// K-apt(공동주택관리정보시스템) 가입 단지만 나와서 못 찾을 수 있음 — 실패해도 조용히 무시(단지 분석 자체엔 영향 없음)
// 재건축 전까지 거의 안 바뀌는 값이라 localStorage에 길게 캐시(찾은 경우 180일) — CDN 캐시(hhcnt.mjs)까지 다 맞아도
// 매 방문마다 최소 1번의 fetch 왕복은 남는데, 이걸로 재방문 시 완전히 0회 호출로 만든다.
// 단, 못 찾은 경우(v=null)는 TTL을 짧게(1일) 둬서 일시적 API 오류로 인한 미스가 영구 고정되지 않게 함
const HH_TTL_FOUND_MS = 1000*60*60*24*180; // 180일
const HH_TTL_MISS_MS = 1000*60*60*24;      // 1일
let hhLS = null;
function hhLSLoad(){
  if(hhLS) return hhLS;
  try{ hhLS = JSON.parse(localStorage.getItem('apcHH:1') || '{}'); }catch(e){ hhLS = {}; }
  return hhLS;
}
function hhLSSave(){ try{ localStorage.setItem('apcHH:1', JSON.stringify(hhLS)); }catch(e){} }
const hhMem = {}; // `${lawd}|${name}` → 결과(또는 null), 세션 내 메모리 캐시(localStorage 조회도 아끼기 위함)
async function fetchHHCnt(lawd, name){
  const k = `${lawd}|${name}`;
  if(k in hhMem) return hhMem[k];
  const ls = hhLSLoad();
  const cached = ls[k];
  if(cached && Date.now() - cached.t < (cached.v ? HH_TTL_FOUND_MS : HH_TTL_MISS_MS)){
    hhMem[k] = cached.v;
    return cached.v;
  }
  let v = null, ok = false;
  try{
    const r = await fetch(`/api/hhcnt?lawd=${encodeURIComponent(lawd)}&name=${encodeURIComponent(name)}`);
    const d = await r.json();
    v = (d && d.found) ? d : null;
    ok = true; // 응답을 정상적으로 받아 "찾음/못찾음"이 확정된 경우만 신뢰 가능
  }catch(e){ v = null; } // 네트워크·파싱 오류 — 결과를 신뢰할 수 없으므로 ok=false로 남겨 캐시하지 않음(다음 조회 시 바로 재시도)
  hhMem[k] = v; // 같은 세션(페이지) 안에서는 반복 재요청 방지용으로만 메모리에 저장
  if(ok){ ls[k] = { v, t: Date.now() }; hhLSSave(); } // 확정된 결과만 로컬스토리지에 영구 캐시
  return v;
}

// 목록형 화면(지역 랭킹 등)에서 같은 lawd의 여러 단지명을 한 번의 요청으로 묶어 조회.
// 이전엔 단지마다 /api/hhcnt를 개별 호출해(최대 100건) 서버가 매번 같은 data/hhcnt/<lawd>.json을
// 반복해서 읽어야 했음 — 캐시 미스분만 모아 POST 배치로 보내 서버가 그 파일을 딱 한 번만 읽게 한다.
// (2026.07 추가 — 지역 랭킹 5년·전체평형처럼 목록이 100건에 가까울 때 체감 로딩이 크게 줄어듦)
async function fetchHHCntBatch(lawd, names){
  const uniq = [...new Set(names)];
  const result = {};
  const ls = hhLSLoad();
  const need = [];
  for(const nm of uniq){
    const k = `${lawd}|${nm}`;
    if(k in hhMem){ result[nm] = hhMem[k]; continue; }
    const cached = ls[k];
    if(cached && Date.now() - cached.t < (cached.v ? HH_TTL_FOUND_MS : HH_TTL_MISS_MS)){
      hhMem[k] = cached.v; result[nm] = cached.v; continue;
    }
    need.push(nm);
  }
  if(need.length){
    try{
      const r = await fetch('/api/hhcnt', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ lawd, names: need }) });
      const d = await r.json();
      const map = (d && d.results) || {};
      for(const nm of need){
        const raw = map[nm];
        const v = (raw && raw.found) ? raw : null;
        const k = `${lawd}|${nm}`;
        hhMem[k] = v; ls[k] = { v, t: Date.now() };
        result[nm] = v;
      }
      hhLSSave();
    }catch(e){ for(const nm of need) result[nm] = null; } // 네트워크 오류 — 캐시하지 않고 다음 조회 시 재시도
  }
  return result;
}

// 매매 단지명(officialName)과 분양권 데이터를 매칭 — 표기가 완전히 같지 않을 수 있어 exact→substring 순으로 시도
// ═══ 분석 엔진 (클라이언트) ═══
const R1 = x => Math.round(x*10)/10;
const avgA = arr => arr.length ? arr.reduce((s,t)=>s+t.amt,0)/arr.length : null;
const dkey = t => `${t.ym}${t.d}`;
const median = a => { const s=a.slice().sort((x,y)=>x-y); const m=s.length>>1; return s.length%2? s[m] : (s[m-1]+s[m])/2; };
// 계약일(ym+d) 기준 조회 시점으로부터 최근 30일 이내인지 — "신규" 배지용
// (국토부 API는 신고일자를 안 주므로 계약일 기준 근사치, 신고 지연이 있는 거래는 놓칠 수 있음)
function isRecentDeal(t){
  const y = +t.ym.slice(0,4), mo = +t.ym.slice(4,6), da = +t.d;
  if(!y || !mo || !da) return false;
  const dealDate = new Date(y, mo-1, da);
  return (Date.now() - dealDate.getTime()) <= 30*24*3600*1000 && dealDate.getTime() <= Date.now();
}

function markOutliers(arr, months){
  for(const t of arr){
    // ⚠️ 여기서 t.ex를 캐싱해 재계산을 건너뛰면 안 됨 — 거래 객체(t)는 monthCache에서 여러 화면(단지 분석/등락 랭킹/저평가)이
    // 공유 참조로 재사용하는데, 화면마다 arr(층 필터)·months(기간)가 달라 같은 거래라도 판정 기준(비교군)이 달라진다.
    // 이전 화면에서 계산된 값을 그대로 스킵하면 탭 진입 순서에 따라 결과가 달라지는 버그가 생기므로 매번 새로 계산한다.
    if(t.direct){ t.ex='직거래'; continue; }
    const mi = months.indexOf(t.ym);
    const win = arr.filter(o=>o!==t && !o.direct && Math.abs(months.indexOf(o.ym)-mi)<=3).map(o=>o.amt);
    if(win.length>=2){
      const ref = median(win);
      if(t.amt < ref*0.7){ t.ex='저가'; continue; }
    }
    t.ex = null;
  }
  return arr.filter(t=>!t.ex);
}

// ── 층별 가격 프리미엄 (저층/중층/고층 비교, 관측 범위 5등분: 1구간 저층·2~4구간 중층·5구간 고층) ──
// arr: 이미 이상치(직거래·저가)가 제외된 동일 단지·평형 거래 배열
// 필터로 설정한 floorMin과 무관하게 "관측된 최저~최고 층"을 5등분해 나누므로,
// 층수 필터를 걸어도(예: 10층 이상) 저층 구간이 사라지지 않도록 raw(필터 이전) 데이터로 계산한다.
function floorBands(arr){
  const pts = arr.map(t=>({t, f:parseInt(t.floor,10)})).filter(x=>Number.isFinite(x.f) && x.f>0);
  if(pts.length < 6) return null; // 표본 부족
  const fs = pts.map(x=>x.f);
  const min = Math.min(...fs), max = Math.max(...fs);
  if(max===min) return null; // 전 거래가 같은 층 → 비교 불가
  const b1 = min + (max-min)/5, b2 = min + (max-min)*4/5; // 관측 층 범위를 5등분: 1구간=저층, 2~4구간=중층, 5구간=고층
  const low = pts.filter(x=>x.f<=b1), mid = pts.filter(x=>x.f>b1 && x.f<=b2), high = pts.filter(x=>x.f>b2);
  const band = list => list.length? { v:R1(avgA(list.map(x=>x.t))), n:list.length,
    fmin:Math.min(...list.map(x=>x.f)), fmax:Math.max(...list.map(x=>x.f)) } : null;
  const L=band(low), M=band(mid), H=band(high);
  if(!L || !H || L.n<2 || H.n<2) return null; // 저층·고층 각 2건 이상 필요
  return { low:L, mid:M, high:H, premiumPct:Math.round((H.v-L.v)/L.v*100) };
}

// 사업 진행 중 개명된 단지(옛 이름으로 등록된 과거 실거래도 함께 찾도록) — 공백 제거 기준, canonical: [옛 이름들]
const APT_ALIASES = {
  '흑석자이': ['흑석리버파크자이'],
};
const APT_ALIAS_CANON = {}; // 별칭 → canonical 정규화 키
Object.entries(APT_ALIASES).forEach(([canon, arr])=>{ arr.forEach(a=>{ APT_ALIAS_CANON[a.replace(/\s/g,'')] = canon; }); });
function canonNorm(norm){ return APT_ALIAS_CANON[norm] || norm; }
function aliasesFor(qn){
  const canon = APT_ALIAS_CANON[qn] || qn;
  const arr = APT_ALIASES[canon] || [];
  return [...new Set([canon, qn, ...arr.map(a=>a.replace(/\s/g,''))])];
}
function matchComplex(all, name){
  const qn = name.replace(/\s/g,'');
  const qnList = aliasesFor(qn); // 검색어 본인 + 알려진 개명 이력 별칭까지 함께 매칭
  const exact = all.filter(t=>qnList.includes(t.apt.replace(/\s/g,'')));
  if(exact.length) return {hits:exact};
  const cand = all.filter(t=>{ const a=t.apt.replace(/\s/g,''); return qnList.some(q=>a.includes(q)||q.includes(a)); });
  const names = [...new Set(cand.map(t=>t.apt))];
  if(names.length===1) return {hits:cand};
  if(names.length>1){
    const cnt={}; cand.forEach(t=>cnt[t.apt]=(cnt[t.apt]||0)+1);
    return {multi: names.sort((a,b)=>cnt[b]-cnt[a])};
  }
  return {hits:[]};
}

function analyzeComplex(all, name, months, rawAll){
  const q = name.replace(/\s/g,'');
  const m = matchComplex(all, name);
  if(m.multi) return {found:false, multi:true, suggest:m.multi.slice(0,8)};
  const hits = m.hits;
  if(!hits.length){
    const names = [...new Set(all.map(t=>t.apt))];
    const grams=[]; for(let i=0;i+2<=q.length;i++) grams.push(q.slice(i,i+2));
    const sugg = names.map(n=>[n, grams.filter(g=>n.replace(/\s/g,'').includes(g)).length])
      .filter(([,s])=>s>0).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([n])=>n);
    return {found:false, suggest:sugg};
  }
  const nameCnt={}; hits.forEach(t=>nameCnt[t.apt]=(nameCnt[t.apt]||0)+1);
  const officialName = Object.entries(nameCnt).sort((a,b)=>b[1]-a[1])[0][0];
  hits.sort((a,b)=>dkey(b).localeCompare(dkey(a)));
  const groups={}; for(const t of hits)(groups[t.py]=groups[t.py]||[]).push(t);
  const monthsAsc = months.slice().reverse();
  const m3=months.slice(0,2), p3v=months.slice(2,4);
  const periodAvg=(arr,ms)=>{ const a=arr.filter(t=>ms.includes(t.ym)); return a.length? {v:R1(avgA(a)), n:a.length} : null; };
  // 평형별 요약표: 최근 4개 "역법 분기"(달력 기준 1~3월/4~6월/7~9월/10~12월) 평균 — 롤링 기간이 아니라 실제 분기 단위
  const qKeyOf = ym => { const y=+ym.slice(0,4), mo=+ym.slice(4,6); return `${y}Q${Math.ceil(mo/3)}`; };
  const qLabelOf = key => { const [y,qn]=key.split('Q'); return `${y.slice(2)}년\n${qn}분기`; };
  const qMap = {};
  months.forEach(ym=>{ const k=qKeyOf(ym); (qMap[k]=qMap[k]||[]).push(ym); });
  const last4Q = [...new Set(months.map(qKeyOf))].slice(0,4).reverse(); // 오래된→최신 순
  const byPy = Object.entries(groups).map(([py, arrRaw])=>{
    const clean = markOutliers(arrRaw, months);
    const arr = clean.length? clean : arrRaw;
    const max = Math.max(...arr.map(t=>t.amt));
    const maxTrade = arr.find(t=>t.amt===max); // arr는 최신순 정렬 → 동가 시 최근 거래 채택
    const maxDate = `${maxTrade.ym.slice(0,4)}.${maxTrade.ym.slice(4)}`;
    const recent = arr[0];
    const quarters = last4Q.map(qk => ({ label: qLabelOf(qk), avg: periodAvg(arr, qMap[qk]) }));
    // 단기 추세는 1~4층(저층 할인 왜곡 방지) 제외한 별도 데이터로 계산 — 평형별 요약표의 분기 평균과는 무관 (2026.07 등락 랭킹·저평가 탭과 동일 기준으로 통일)
    const arrTrend = arr.filter(t=>parseInt(t.floor,10)>=5);
    const avg3t = periodAvg(arrTrend,m3), pv3t = periodAvg(arrTrend,p3v);
    const trend = avg3t&&pv3t? {pct:Math.round((avg3t.v-pv3t.v)/pv3t.v*100), recentAvg:avg3t.v, prevAvg:pv3t.v} : null;
    const monthly = monthsAsc.map(ym=>{
      const mA = arr.filter(t=>t.ym===ym);
      return mA.length? {ym:ymLabel(ym), avg:R1(avgA(mA)), n:mA.length} : null;
    }).filter(Boolean);
    // 층별 프리미엄: 층수 필터 이전(raw) 데이터 전체에서 같은 단지·평형 거래를 다시 모아 계산
    let floorBand = null;
    if(rawAll){
      // 층별 프리미엄은 조회 기간과 무관하게 최근 6개월 고정 — 기간이 길면 시세 상승분이 층 프리미엄에 섞여 왜곡되므로
      const recentMonths = months.slice(0,6);
      const recentSet = new Set(recentMonths);
      const rawMatch = rawAll.filter(t=>t.apt===officialName && String(t.py)===py && recentSet.has(t.ym));
      const rawClean = markOutliers(rawMatch, recentMonths);
      floorBand = floorBands(rawClean);
    }
    return { py:`${py}평`, area:`전용 ${Math.round(recent.area)}㎡`, n:arr.length,
      excluded: arrRaw.length-arr.length, // arr = clean이 비면 arrRaw로 폴백되므로, 실제 표시 데이터 기준으로 계산해야 폴백 시 0건으로 정확히 나옴
      recent:{amt:recent.amt, ym:ymLabel(recent.ym), floor:recent.floor},
      max, maxDate, quarters, trend,
      // 최고가 배지: 가장 최근 거래가 곧 최고가일 때만 표시
      isNewHigh: recent.amt>=max && arr.length>=3, monthly, floorBand };
  }).sort((a,b)=>parseInt(a.py)-parseInt(b.py));
  return { found:true, mode:'complex', name:officialName, umd:hits[0].umd, build:hits[0].build,
    count:hits.length,
    period:`${ymLabel(months[months.length-1])} ~ ${ymLabel(months[0])}`,
    byPy,
    trades: hits.map(t=>({date:`${ymLabel(t.ym)}.${String(t.d).padStart(2,'0')}`, py:`${t.py}평`, area:t.area, amt:t.amt, floor:t.floor, ex:t.ex||null, kind:t.kind||null})) };
}

function analyzeRegion(all, months){
  const byApt={};
  // 시·도 전체 통합 조회에서는 서로 다른 구에 같은 단지명이 존재할 수 있으므로 구까지 키에 포함한다
  for(const t of all){ const k=`${t.apt}|${t.umd}|${t.gu||''}`; (byApt[k]=byApt[k]||[]).push(t); }
  const r3set = new Set(months.slice(0,3)), p3set = new Set(months.slice(3,6));
  const topVolume = Object.entries(byApt).map(([k,arr])=>{
    const sorted = arr.slice().sort((a,b)=>dkey(b).localeCompare(dkey(a)));
    const pyCnt={}; sorted.forEach(t=>pyCnt[t.py]=(pyCnt[t.py]||0)+1);
    const mainPy = Object.entries(pyCnt).sort((a,b)=>b[1]-a[1])[0][0];
    const [apt,umd,gu]=k.split('|');
    const r3n = arr.filter(t=>r3set.has(t.ym)).length;
    const p3n = arr.filter(t=>p3set.has(t.ym)).length;
    const surge = r3n>=6 && r3n >= p3n*2; // 최근 3개월이 이전 3개월의 2배 이상
    return {apt, umd, gu:gu||null, n:sorted.length, mainPy:`${mainPy}평`, recentAmt:sorted[0].amt, surge, build:(sorted.find(t=>t.build)||{}).build || ''};
  }).sort((a,b)=>b.n-a.n).slice(0,100);
  const seen=new Set(); const highDeals=[];
  for(const t of all.slice().sort((a,b)=>b.amt-a.amt || dkey(b).localeCompare(dkey(a)))){
    const k=`${t.apt}|${t.umd}|${t.gu||''}`;
    if(seen.has(k)) continue;
    seen.add(k);
    highDeals.push({apt:t.apt, umd:t.umd, gu:t.gu||null, py:`${t.py}평`, amt:t.amt, date:`${ymLabel(t.ym)}.${t.d}`, floor:t.floor, build:t.build, kind:t.kind||null, isNew:isRecentDeal(t)});
    if(highDeals.length>=100) break;
  }
  return { found:true, mode:'region', total:all.length,
    period:`${ymLabel(months[months.length-1])} ~ ${ymLabel(months[0])}`,
    topVolume, highDeals };
}

// 평형별 등락률 대표행(단지당 거래량 최다 평형 1개) 계산 — analyzeUpDown 내부에서 공용으로 사용
function buildRepRows(all, months){
  const eligible = all.filter(t=>parseInt(t.floor,10)>=5); // 1~4층 제외 (2026.07 저평가/peak 탭과 동일 기준으로 강화 — 4층까지만 걸러서는 저층 할인 왜곡이 통계에 새어 들어와 실제로는 시세 변동이 없는 단지가 등락 랭킹·초단기 저평가 단지에 허위로 잡히는 사례 발견)
  const byAptPy = {};
  for(const t of eligible){ const k=`${t.apt}|${t.umd}|${t.py}`; (byAptPy[k]=byAptPy[k]||[]).push(t); }
  const r3set = new Set(months.slice(0,2)), p3set = new Set(months.slice(2,4));
  const pyRows = Object.entries(byAptPy).map(([k,arrRaw])=>{
    const arr = markOutliers(arrRaw, months);
    const [apt,umd,py] = k.split('|');
    const r3 = arr.filter(t=>r3set.has(t.ym));
    const p3 = arr.filter(t=>p3set.has(t.ym));
    if(r3.length<2 || p3.length<2) return null;
    const r3avg = avgA(r3), p3avg = avgA(p3);
    if(!p3avg) return null;
    const pct = Math.round((r3avg-p3avg)/p3avg*100);
    const areaCnt={}; arr.forEach(t=>areaCnt[Math.round(t.area)]=(areaCnt[Math.round(t.area)]||0)+1); // 그룹 내 가장 흔한 전용면적을 대표값으로
    const area = +Object.entries(areaCnt).sort((a,b)=>b[1]-a[1])[0][0];
    return { apt, umd, py, area, build:arr[0].build, pct, r3avg:R1(r3avg), p3avg:R1(p3avg), n:arr.length, r3n:r3.length, p3n:p3.length };
  }).filter(Boolean);
  const byApt = {};
  pyRows.forEach(r=>{
    const k = r.apt+'|'+r.umd;
    if(!byApt[k] || r.n > byApt[k].n) byApt[k] = r;
  });
  return Object.values(byApt).map(r=>({ ...r, mainPy:`${r.py}평(전용 ${r.area}㎡)` }));
}

// all: 평형 필터가 적용된 데이터(상승률·하락률 랭킹용) / allUnfiltered: 필터 적용 전 원본(초단기 저평가 단지용)
// → 초단기 저평가 단지는 "가격"이 기준이라 화면상 "평형" 필터와는 성격이 달라서, 필터 선택과 무관하게 항상 20~39평 구간(국민평형 중심)으로 고정 계산
function analyzeUpDown(all, months, allUnfiltered){
  const rows = buildRepRows(all, months);
  const up = rows.filter(r=>r.pct>0).sort((a,b)=>b.pct-a.pct).slice(0,10);
  const down = rows.filter(r=>r.pct<0).sort((a,b)=>a.pct-b.pct).slice(0,10);

  // 초단기 저평가 단지
  // - 매매 실거래만 사용(분양권·입주권은 준공 전 시세·전매 이슈 등 매매와 무관한 요인으로 움직여서 왜곡 소지가 큼 → 완전히 제외)
  // - 20~39평 구간만 비교(초소형·초대형은 표본이 적고 가격 스케일이 달라 같은 비교군으로 묶기 부적절)
  // - 단지마다 "이전 2개월 평균가가 나와 ±2% 이내인 단지 중 가격이 가장 가까운 최대 5개"를 비교군으로 구성
  //   (고정 구간 대신 상대 비율 기준이라, 경계값 근처에서 억지로 갈리는 문제가 없음)
  // → "최근 2개월 평균가"가 그 비교군 중앙값보다 5% 이상 낮아진 단지를 표시 (본인 포함 그룹원 3명 이상만 비교)
  const tradeOnly = (allUnfiltered||all).filter(t=>{
    if(t.kind) return false;
    const py = parseInt(t.py,10);
    return py>=20 && py<=39;
  });
  const rowsAll = buildRepRows(tradeOnly, months);
  const median = arr => { // 표준 중앙값 (짝수 개수일 때 가운데 두 값의 평균)
    const s = arr.slice().sort((a,b)=>a-b), n = s.length, mid = n>>1;
    return n%2 ? s[mid] : (s[mid-1]+s[mid])/2;
  };
  const divergence = [];
  const MIN_PEER_N = 2; // 비교군은 최근·이전 2개월 구간 각각 최소 2건 이상 거래된 단지만 인정 (직거래·저가 이상치는 이미 markOutliers에서 제외된 뒤라 완화, 전체 단지 기준 최소치와 동일)
  rowsAll.forEach(r=>{
    const nearest = rowsAll
      .filter(o=> o!==r && o.r3n>=MIN_PEER_N && o.p3n>=MIN_PEER_N && Math.abs(o.p3avg - r.p3avg) / r.p3avg <= 0.02)
      .sort((a,b)=> Math.abs(a.p3avg-r.p3avg) - Math.abs(b.p3avg-r.p3avg))
      .slice(0,5); // 가격이 제일 가까운 단지 최대 5개까지
    const group = [r, ...nearest]; // groupN 표시용(본인 포함 표본수) — 중앙값 계산에는 본인 제외
    if(group.length < 3) return;
    const r3median = median(nearest.map(o=>o.r3avg));
    const gapPct = Math.round((r.r3avg - r3median)/r3median*100);
    if(gapPct <= -5){
      const peers = nearest.map(o=>({apt:o.apt, py:o.py, p3avg:o.p3avg, r3avg:o.r3avg})).sort((a,b)=>b.r3avg-a.r3avg); // 비교 대상 단지 상세(표 정리용) · 최근가 높은순 정렬
      divergence.push({ ...r, r3median:R1(r3median), gapAmt:R1(r3median-r.r3avg), gapPct, groupN:group.length, peers }); // gapAmt는 항상 양수(중앙값-내값) — 화면에 "OO억 낮음"으로 표시되므로
    }
  });
  // 가장 많이 벌어진 순(금액 기준, 억 단위 격차가 큰 순)으로 정렬, 동률이면 표본(n)이 더 많은 쪽을 우선(신뢰도 반영)
  divergence.sort((a,b)=> b.gapAmt-a.gapAmt || b.n-a.n);

  return { found:true, mode:'updown', total:all.length,
    period:`${ymLabel(months[months.length-1])} ~ ${ymLabel(months[0])}`,
    up, down, divergence };
}

// ═══ 저평가 (내부 검토용, 비번 잠금 탭 전용) ═══
// 등락 랭킹의 "초단기 저평가 단지"(2개월 평균 기준)와는 완전히 별개 로직.
// 평균가 대신 최고가, 2개월 구간 대신 3개월 구간을 사용 — "또래 대비 덜 오른" 단지가 아니라
// "동일 시세대에서 신고가 흐름을 못 따라간" 단지를 잡아내려는 실험적 지표.
// 등락 랭킹과 달리 분양권·입주권까지 전부 포함하되, 저층 할인 왜곡 방지를 위해 5층 이상 거래만 집계(2026.07 변경) — 20~39평 구간 제한과 함께 적용
// (분양권 등 층 정보가 없는 거래는 parseInt(floor)가 NaN이 되어 자동으로 제외됨)
function buildPeakRows(all, months){
  const byAptPy = {};
  for(const t of all){ const k=`${t.apt}|${t.umd}|${t.py}`; (byAptPy[k]=byAptPy[k]||[]).push(t); }
  const r3set = new Set(months.slice(0,3)), p3set = new Set(months.slice(3,6));
  const pyRows = Object.entries(byAptPy).map(([k,arrRaw])=>{
    const arr = markOutliers(arrRaw, months);
    const [apt,umd,py] = k.split('|');
    const r3 = arr.filter(t=>r3set.has(t.ym));
    const p3 = arr.filter(t=>p3set.has(t.ym));
    if(r3.length<2 || p3.length<2) return null;
    const r3max = Math.max(...r3.map(t=>t.amt)), p3max = Math.max(...p3.map(t=>t.amt));
    if(!p3max) return null;
    const areaCnt={}; arr.forEach(t=>areaCnt[Math.round(t.area)]=(areaCnt[Math.round(t.area)]||0)+1);
    const area = +Object.entries(areaCnt).sort((a,b)=>b[1]-a[1])[0][0];
    return { apt, umd, py, area, build:arr[0].build, r3max:R1(r3max), p3max:R1(p3max), n:arr.length, r3n:r3.length, p3n:p3.length };
  }).filter(Boolean);
  const byApt = {};
  pyRows.forEach(r=>{
    const k = r.apt+'|'+r.umd;
    if(!byApt[k] || r.n > byApt[k].n) byApt[k] = r;
  });
  return Object.values(byApt).map(r=>({ ...r, mainPy:`${r.py}평(전용 ${r.area}㎡)` }));
}

function analyzePeakUndervalue(all, months, allUnfiltered){
  const tradeOnly = (allUnfiltered||all).filter(t=>{
    const py = parseInt(t.py,10);
    const floor = parseInt(t.floor,10);
    return py>=20 && py<=39 && floor>=5; // 5층 이상 거래만 최고가 계산에 포함(저층 할인으로 최고가가 낮게 잡히는 왜곡 방지)
  });
  const rowsAll = buildPeakRows(tradeOnly, months);
  const median = arr => {
    const s = arr.slice().sort((a,b)=>a-b), n = s.length, mid = n>>1;
    return n%2 ? s[mid] : (s[mid-1]+s[mid])/2;
  };
  const divergence = [];
  const MIN_PEER_N = 2;
  rowsAll.forEach(r=>{
    const nearest = rowsAll
      .filter(o=> o!==r && o.r3n>=MIN_PEER_N && o.p3n>=MIN_PEER_N && Math.abs(o.p3max - r.p3max) / r.p3max <= 0.02
        && (o.r3max - r.r3max) / r.r3max > 0.02) // 비교군은 "이전엔 비슷했지만 최근엔 나보다 확실히(2% 초과) 더 오른" 단지만 인정 — 나와 비슷하게 움직인 단지(오르지도 처지지도 않은)는 저평가 판단에 참고가 안 되므로 제외
      .sort((a,b)=> Math.abs(a.p3max-r.p3max) - Math.abs(b.p3max-r.p3max))
      .slice(0,5);
    const group = [r, ...nearest]; // groupN 표시용(본인 포함 표본수) — 중앙값 계산에는 본인 제외
    if(group.length < 3) return;
    const r3median = median(nearest.map(o=>o.r3max));
    const gapPct = Math.round((r.r3max - r3median)/r3median*100);
    if(gapPct <= -5){
      const peers = nearest.map(o=>({apt:o.apt, py:o.py, p3max:o.p3max, r3max:o.r3max})).sort((a,b)=>b.r3max-a.r3max); // 최근가 높은순 정렬
      divergence.push({ ...r, r3median:R1(r3median), gapAmt:R1(r3median-r.r3max), gapPct, groupN:group.length, peers }); // gapAmt는 항상 양수(중앙값-내값) — 화면에 "OO억 낮음"으로 표시되므로
    }
  });
  // 가장 많이 벌어진 순(금액 기준, 억 단위 격차가 큰 순)으로 정렬, 동률이면 표본(n)이 더 많은 쪽을 우선(신뢰도 반영)
  divergence.sort((a,b)=> b.gapAmt-a.gapAmt || b.n-a.n);

  return { found:true, mode:'peak', total:all.length,
    period:`${ymLabel(months[months.length-1])} ~ ${ymLabel(months[0])}`,
    divergence };
}

// ═══ 연간 저평가 — "분기 저평가"(peak)와 완전히 동일한 로직, 3개월 구간(3vs3) 대신 1년 구간(올해 vs 작년, 12개월씩)만 다름 ═══
// 분기 저평가가 "최근 신고가 흐름"을 못 따라간 단지를 잡는다면, 연간 저평가는 "지난 1년간 신고가 흐름"을 못 따라간 단지를 잡아내는 버전.
// 5층 이상·20~39평 제한, 비교군 구성(±2% 이내 최대 5개, 3명 이상), 5% 이상 격차 기준 등 나머지 조건은 모두 동일.
function buildLongPeakRows(all, months){
  const byAptPy = {};
  for(const t of all){ const k=`${t.apt}|${t.umd}|${t.py}`; (byAptPy[k]=byAptPy[k]||[]).push(t); }
  // 올해 1월~현재월(curN개월) vs 작년 1~12월(12개월) — months.length는 항상 curN+12 (호출부 effMN 계산과 짝)
  const curN = months.length - 12;
  const r12set = new Set(months.slice(0,curN)), p12set = new Set(months.slice(curN,curN+12));
  const pyRows = Object.entries(byAptPy).map(([k,arrRaw])=>{
    const arr = markOutliers(arrRaw, months);
    const [apt,umd,py] = k.split('|');
    const r12 = arr.filter(t=>r12set.has(t.ym));
    const p12 = arr.filter(t=>p12set.has(t.ym));
    if(r12.length<2 || p12.length<2) return null;
    const r12max = Math.max(...r12.map(t=>t.amt)), p12max = Math.max(...p12.map(t=>t.amt));
    if(!p12max) return null;
    const areaCnt={}; arr.forEach(t=>areaCnt[Math.round(t.area)]=(areaCnt[Math.round(t.area)]||0)+1);
    const area = +Object.entries(areaCnt).sort((a,b)=>b[1]-a[1])[0][0];
    return { apt, umd, py, area, build:arr[0].build, r3max:R1(r12max), p3max:R1(p12max), n:arr.length, r3n:r12.length, p3n:p12.length };
  }).filter(Boolean);
  const byApt = {};
  pyRows.forEach(r=>{
    const k = r.apt+'|'+r.umd;
    if(!byApt[k] || r.n > byApt[k].n) byApt[k] = r;
  });
  return Object.values(byApt).map(r=>({ ...r, mainPy:`${r.py}평(전용 ${r.area}㎡)` }));
}

function analyzeLongPeakUndervalue(all, months, allUnfiltered){
  const tradeOnly = (allUnfiltered||all).filter(t=>{
    const py = parseInt(t.py,10);
    const floor = parseInt(t.floor,10);
    return py>=20 && py<=39 && floor>=5; // 5층 이상 거래만 최고가 계산에 포함(저층 할인으로 최고가가 낮게 잡히는 왜곡 방지)
  });
  const rowsAll = buildLongPeakRows(tradeOnly, months);
  const median = arr => {
    const s = arr.slice().sort((a,b)=>a-b), n = s.length, mid = n>>1;
    return n%2 ? s[mid] : (s[mid-1]+s[mid])/2;
  };
  const divergence = [];
  const MIN_PEER_N = 2;
  rowsAll.forEach(r=>{
    const nearest = rowsAll
      .filter(o=> o!==r && o.r3n>=MIN_PEER_N && o.p3n>=MIN_PEER_N && Math.abs(o.p3max - r.p3max) / r.p3max <= 0.02
        && (o.r3max - r.r3max) / r.r3max > 0.02) // 비교군은 "이전엔 비슷했지만 최근엔 나보다 확실히(2% 초과) 더 오른" 단지만 인정 — 나와 비슷하게 움직인 단지(오르지도 처지지도 않은)는 저평가 판단에 참고가 안 되므로 제외
      .sort((a,b)=> Math.abs(a.p3max-r.p3max) - Math.abs(b.p3max-r.p3max))
      .slice(0,5);
    const group = [r, ...nearest]; // groupN 표시용(본인 포함 표본수) — 중앙값 계산에는 본인 제외
    if(group.length < 3) return;
    const r3median = median(nearest.map(o=>o.r3max));
    const gapPct = Math.round((r.r3max - r3median)/r3median*100);
    if(gapPct <= -5){
      const peers = nearest.map(o=>({apt:o.apt, py:o.py, p3max:o.p3max, r3max:o.r3max})).sort((a,b)=>b.r3max-a.r3max); // 최근가 높은순 정렬
      divergence.push({ ...r, r3median:R1(r3median), gapAmt:R1(r3median-r.r3max), gapPct, groupN:group.length, peers });
    }
  });
  divergence.sort((a,b)=> b.gapAmt-a.gapAmt || b.n-a.n);

  // 최근/이전 1년 라벨 자동 계산 — months[0]이 최신월(YYYYMM)이므로 그 해를 "최근", 그 전해를 "이전"으로 표시.
  // 날짜가 바뀌어도(해가 넘어가도) 수동 수정 없이 항상 현재 기준으로 자동 갱신됨.
  const recentYearNum = parseInt(months[0].slice(0,4),10);
  const recentYearLabel = `${String(recentYearNum).slice(-2)}년`;
  const prevYearLabel = `${String(recentYearNum-1).slice(-2)}년`;

  return { found:true, mode:'longpeak', total:all.length,
    period:`${ymLabel(months[months.length-1])} ~ ${ymLabel(months[0])}`,
    recentYearLabel, prevYearLabel,
    divergence };
}

function analyzeCompare(itemsByLawd, targets, months){
  const monthsAsc = months.slice().reverse();
  const m3 = months.slice(0,3);
  const complexes=[], missing=[];
  for(const tg of targets){
    const all = itemsByLawd[tg.lawd] || [];
    const m = matchComplex(all, tg.name);
    if(m.multi){ missing.push(`${tg.name}(여러 단지 일치 — 정확한 단지명 입력)`); continue; }
    const hits = m.hits || [];
    if(!hits.length){ missing.push(tg.name); continue; }
    const nameCnt={}; hits.forEach(t=>nameCnt[t.apt]=(nameCnt[t.apt]||0)+1);
    const officialName = Object.entries(nameCnt).sort((a,b)=>b[1]-a[1])[0][0];
    const groups={}; for(const t of hits)(groups[t.py]=groups[t.py]||[]).push(t);
    const pys = Object.entries(groups).map(([py, arrRaw])=>{
      const clean = markOutliers(arrRaw, months);
      const arr = clean.length? clean : arrRaw;
      const a3 = arr.filter(t=>m3.includes(t.ym));
      const monthly = monthsAsc.map(ym=>{
        const mA = arr.filter(t=>t.ym===ym);
        return mA.length? {ym:ymLabel(ym), avg:R1(avgA(mA)), n:mA.length} : null;
      }).filter(Boolean);
      const areaCnt={}; arr.forEach(t=>areaCnt[Math.round(t.area)]=(areaCnt[Math.round(t.area)]||0)+1); // 그룹 내 가장 흔한 전용면적을 대표값으로
      const area = +Object.entries(areaCnt).sort((a,b)=>b[1]-a[1])[0][0];
      return { py:`${py}평`, area, n:arr.length,
        avg3: a3.length? {v:R1(avgA(a3)), n:a3.length} : null,
        max: Math.max(...arr.map(t=>t.amt)), monthly };
    }).sort((a,b)=>parseInt(a.py)-parseInt(b.py));
    if(!pys.length){ missing.push(tg.name); continue; }
    complexes.push({name:officialName, umd:hits[0].umd, count:hits.length, pys, lawd:tg.lawd});
  }
  return { found:complexes.length>0, mode:'compare',
    period:`${ymLabel(months[months.length-1])} ~ ${ymLabel(months[0])}`,
    complexes, missing };
}

function esc(s){ return String(s??'').replace(/[<>&"']/g, c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c])); }

// ── 단지명 자동완성 ──
const aptMem = {}; // lawd → apts
let acInput = null, acTimer = null;

async function getApts(lawd){
  if(aptMem[lawd]) return aptMem[lawd];
  const items = await ensureMonths(lawd, 12);
  // 표기(공백 등)가 달라도 같은 단지는 하나로 합치기 위해, 공백 제거한 문자열을 그룹 키로 사용
  // (예: "아크로 베스티뉴" vs "아크로베스티뉴"가 자동완성에 별개로 뜨던 문제 방지)
  const groups = {}; // norm -> { umd, presaleOnly, variants: {원문표기: 건수} }
  for(const t of items){
    const norm = canonNorm(t.apt.replace(/\s/g,'')); // 개명 이력 있는 단지는 옛 이름 표기도 같은 그룹으로 합침
    if(!groups[norm]) groups[norm] = { umd:t.umd, presaleOnly:false, variants:{} };
    groups[norm].presaleOnly = false;
    groups[norm].variants[t.apt] = (groups[norm].variants[t.apt]||0)+1;
  }
  // 분양권·입주권 전용(매매 실거래 없는 신축) 단지도 자동완성에 뜨도록 함께 조회
  try{
    const itemsP = await ensureMonthsP(lawd, 12);
    for(const t of itemsP){
      const norm = canonNorm(t.apt.replace(/\s/g,''));
      if(!groups[norm]) groups[norm] = { umd:t.umd, presaleOnly:true, variants:{} };
      // presaleOnly 여부와 무관하게 항상 카운트해야 매매+분양권 합산 단지의 자동완성 건수(n)가 실제 합계로 표시됨
      // (이전에는 presaleOnly가 true인 그룹에서만 카운트해, 매매 실거래가 이미 있는 단지는 분양권 건수가 누락되었음)
      groups[norm].variants[t.apt] = (groups[norm].variants[t.apt]||0)+1;
    }
  }catch(e){}
  aptMem[lawd] = Object.values(groups).map(g=>{
    const name = Object.entries(g.variants).sort((a,b)=>b[1]-a[1])[0][0]; // 가장 많이 등장한 표기를 대표 이름으로
    const n = Object.values(g.variants).reduce((s,c)=>s+c,0);
    return { name, umd:g.umd, n, presaleOnly:g.presaleOnly };
  }).sort((a,b)=>b.n-a.n);
  return aptMem[lawd];
}

function acHide(){ document.getElementById('ac').classList.remove('on'); acInput=null; }
function acPos(input){
  const r = input.getBoundingClientRect();
  const ac = document.getElementById('ac');
  const w = Math.max(r.width, 260); // 비교 모드처럼 입력창이 좁을 때 팝업까지 좁아져 글자가 세로로 쌓이는 것 방지
  let left = r.left;
  if(left + w > window.innerWidth - 8) left = Math.max(8, window.innerWidth - 8 - w);
  ac.style.left = left+'px';
  ac.style.top = (r.bottom + 4)+'px'; // position:fixed — 뷰포트 기준
  ac.style.width = w+'px';
}

async function acShow(input){

  const hits = apts.filter(a=>a.name.replace(/\s/g,'').includes(q)).slice(0,12);
  if(!hits.length){ ac.innerHTML = '<div class="ac-msg">매매·분양권 실거래 신고 내역이 없는 단지입니다. 단지명을 다시 확인해 주세요</div>'; return; }
  const re = new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')');
  ac.innerHTML = hits.map(a=>
    `<div class="ac-item" onmousedown="acPick('${esc(a.name)}')">
      <span>${esc(a.name).replace(re,'<b>$1</b>')}</span>

async function search(){
  updateRegionFavBtn();
  renderFavRegions();
  const name = document.getElementById('q').value.trim();
  const lawd = sel.value;
  let cmpItems = [];
  if(mode==='compare'){
    cmpItems = [...document.querySelectorAll('.cmp-row')].map(r=>({

    })).filter(x=>x.name.length>=2);
