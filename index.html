<!DOCTYPE html>

<meta name="theme-color" content="#0F2B3D">

<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">

<meta property="og:type" content="website">
<meta property="og:site_name" content="아파트썸 실거래 분석">
<meta property="og:title" content="아파트썸 실거래 분석 — 국토부 실거래가 기반 무료 시세 분석">
<meta property="og:description" content="단지 분석·비교, 지역/거래량/등락 랭킹, 신고가·신저가, 저평가 단지까지 국토부 공공 데이터로 무료 제공합니다.">

<meta name="twitter:title" content="아파트썸 실거래 분석">
<meta name="twitter:description" content="단지 분석·비교, 지역/거래량/등락 랭킹, 신고가·신저가, 저평가 단지까지 국토부 실거래가 기반 무료 시세 분석">

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --teal:#00828A; --teal-dark:#00565C; --teal-soft:#E0F2F3; --teal-light:#A8E0E4; --teal-light-soft:#F2FBFB;
    --navy:#0F2B3D; --slate-bg:#F1F5F9; --ink:#1E293B; --sub:#64748B;
    --line:#E2E8F0; --red:#DC2626; --yellow:#F5B400;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Noto Sans KR',sans-serif;background:var(--slate-bg);color:var(--ink);line-height:1.6;font-variant-numeric:tabular-nums;min-height:100vh;word-break:keep-all;overflow-wrap:break-word}
  .wrap{max-width:420px;margin:0 auto;padding:0 16px 60px;position:relative}
  header{padding:16px 14px;text-align:center;background:var(--navy);border-radius:16px;margin:10px 0 14px;box-shadow:0 2px 14px rgba(15,43,61,.18);position:relative}
  .header-share{position:absolute;top:50%;right:14px;transform:translateY(-50%);
    background:rgba(255,255,255,.14);border:none;border-radius:8px;width:32px;height:32px;
    color:#fff;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .header-share:active{background:rgba(255,255,255,.28)}
  .logo{display:inline-flex;align-items:center;gap:8px;font-weight:900;font-size:19px;color:#fff;letter-spacing:-.5px}
  header p{font-size:11.5px;color:rgba(255,255,255,.7);margin-top:4px}

  .tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px;background:var(--teal-light-soft);border:1.5px solid var(--teal-light);border-radius:16px;padding:10px}
  .tab{flex:none;display:flex;align-items:center;gap:4px;white-space:nowrap;font-size:12px;font-weight:700;color:var(--sub);padding:7px 10px;border-radius:16px;cursor:pointer;transition:background .15s,color .15s,border-color .15s;background:#fff;border:1.5px solid var(--line)}
  .tab svg{flex:none;width:13px;height:13px;stroke:currentColor}
  .tab.on{background:var(--teal);color:#fff;border-color:var(--teal);box-shadow:0 3px 10px rgba(0,130,138,.28)}
  .tab:not(.on):active{background:var(--teal-soft)}
  /* 구독 전용 탭(역세권) 구분선 + 라벨 — 운영자 확인용 비밀탭(하락 거래·연간 저평가(동일 동))과 섞이지 않도록
     시각적으로 분리(2026.08, 수민 요청) */
  .tab-divider{flex-basis:100%;display:flex;align-items:center;gap:6px;margin:2px 0 0;font-size:10px;font-weight:700;color:var(--sub)}
  .tab-divider::before{content:'';flex:none;width:10px;height:1.5px;background:var(--line)}
  .tab-divider::after{content:'';flex:1;height:1.5px;background:var(--line)}
  .tab.subscriber{border-color:#E0B84D;background:#FFF8E8}
  .tab.subscriber:not(.on){color:#8A6D1F}
  .tab.subscriber.on{background:#E0B84D;border-color:#E0B84D;box-shadow:0 3px 10px rgba(224,184,77,.35)}

  .search-box{display:grid;gap:8px;margin-bottom:8px;background:#fff;border-radius:16px;padding:14px;box-shadow:0 2px 14px rgba(15,43,61,.07)}
  .search-box > *{min-width:0}
  .row2{display:flex;gap:8px}
  select,input.q{border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;font-family:inherit;background:#fff}
  #optRow select{font-size:13px;padding:11px 6px 11px 10px}
  select:focus,input.q:focus{outline:none;border-color:var(--teal)}
  select{flex:0 0 138px;width:100%}
  input.q{flex:1;min-width:0}
  .go{background:var(--teal);color:#fff;border:none;border-radius:12px;padding:13px;font-size:14px;font-weight:700;font-family:inherit;cursor:pointer}
  .go:disabled{background:#93C9CC}

  .loading{display:none;text-align:center;padding:40px 0}
  .loading.on{display:block}
  .spinner{width:34px;height:34px;border:4px solid var(--teal-soft);border-top-color:var(--teal);border-radius:50%;margin:0 auto 12px;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading div{font-size:12.5px;color:var(--sub)}

  .error{display:none;background:#FEF2F2;border:1px solid #FECACA;border-radius:12px;padding:13px 15px;font-size:12.5px;color:var(--red);margin-top:12px;line-height:1.7}
  .error.on{display:block}
  .error a{color:var(--teal);cursor:pointer;text-decoration:underline}

  #result{display:none;margin-top:14px}
  #result.on{display:block;animation:fade .4s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .card{background:#fff;border-radius:16px;box-shadow:0 2px 14px rgba(15,43,61,.07);margin-bottom:12px}
  .card-hd{background:var(--navy);color:#fff;padding:15px 18px;border-radius:16px 16px 0 0;position:sticky;top:0;z-index:5;box-shadow:0 2px 6px rgba(15,43,61,.15)}
  .card-hd h2{font-size:20px;font-weight:900;letter-spacing:-.5px;text-align:center;margin-bottom:2px}
  .card-hd .meta{font-size:11px;color:#fff;opacity:.6;text-align:center}
  .hd-top{position:relative;display:flex;align-items:center;justify-content:center;min-height:22px;margin-bottom:5px}
  .hd-logo{position:absolute;left:0;display:inline-flex;align-items:center;gap:4px}
  .hd-logo span{font-size:13px;font-weight:800;color:#00C2C2}
  .hd-badge{font-size:13px;font-weight:800;color:#fff;background:var(--teal);padding:6px 13px;border-radius:16px}
  .hd-vs{background:rgba(127,212,217,.12);border-radius:8px;padding:8px 10px;display:flex;align-items:center;justify-content:center;gap:6px;margin-top:10px}
  .hd-vs span{font-size:13px;font-weight:500;color:#7FD4D9}
  .sec{padding:14px 18px}
  .sec+.sec{border-top:1px solid var(--line)}
  .sec h3{display:inline-block;font-size:11.5px;font-weight:900;color:#fff;background:var(--teal);letter-spacing:.4px;padding:4px 10px;border-radius:6px;margin-bottom:9px}

  table{width:100%;border-collapse:collapse;font-size:11.5px}
  th{color:var(--sub);font-weight:500;font-size:10.5px;text-align:left;padding:3px 4px;border-bottom:1px solid var(--line);white-space:pre-line}
  td{padding:6px 4px;border-bottom:1px dashed var(--line)}
  .peer-table{table-layout:fixed}
  .peer-table th{padding:2px 4px;font-size:9.5px;overflow-wrap:break-word}
  .peer-table td{padding:1px 4px;font-size:10px;border-bottom:1px dashed var(--line);overflow-wrap:break-word}
  .peer-table th:nth-child(1),.peer-table td:nth-child(1){width:38%;word-break:break-all}
  .peer-table th:nth-child(2),.peer-table td:nth-child(2){width:24%;white-space:nowrap}
  .peer-table th:nth-child(3),.peer-table td:nth-child(3),
  .peer-table th:nth-child(4),.peer-table td:nth-child(4){width:19%}
  .peer-table tr:last-child td{border-bottom:none}
  .tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  tr:last-child td{border-bottom:none}
  td b{font-size:12.5px;color:var(--navy)}
  .tr-r{text-align:right}
  .rng{color:var(--sub);font-size:10.5px}
  .th-recent{color:var(--teal-dark);font-weight:700}
  .td-recent b{color:var(--teal-dark)}
  .th-max{color:#fff;background:var(--red);border-radius:6px 6px 0 0;border-bottom:2px solid var(--red)}
  .td-max{background:#FEF2F2}
  .td-max b{color:var(--red);font-size:13px}
  .th-teal{color:#fff;background:var(--teal);border-radius:6px 6px 0 0;border-bottom:2px solid var(--teal)}
  .td-teal{background:var(--teal-soft)}
  .td-teal b{color:var(--teal-dark);font-size:13px}
  .th-teal2{color:var(--teal-dark);background:var(--teal-light);border-radius:6px 6px 0 0;border-bottom:2px solid var(--teal)}
  .td-teal2{background:var(--teal-light-soft)}
  .td-teal2 b{color:var(--teal-dark);font-size:13px}
  .nh{display:inline-block;font-size:7.5px;font-weight:700;color:#fff;background:var(--red);border-radius:2.5px;padding:1px 4px;margin-left:4px;vertical-align:1px}
  .extag{display:inline-block;font-size:9px;font-weight:700;color:var(--sub);background:var(--slate-bg);border:1px solid var(--line);border-radius:3px;padding:0 5px;margin-left:4px;vertical-align:1px}
  tr.exrow td{opacity:.45}

  .trend{display:flex;align-items:center;gap:10px;background:var(--slate-bg);border-radius:10px;padding:11px 14px}
  .trend .pct{font-size:14px;font-weight:900}
  .up{color:var(--teal)} .down{color:var(--red)}
  .trend .d{font-size:11px;color:var(--sub);line-height:1.5}
  .trend .d b{font-size:13px;color:var(--navy);font-weight:900}

  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .chip{font-size:11px;font-weight:700;border:1.5px solid var(--line);color:var(--sub);border-radius:20px;padding:4px 12px;cursor:pointer}
  .chip.on{border-color:var(--teal);color:var(--teal-dark);background:var(--teal-soft)}
  .channels-links{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0 2px}
  .channels-links .chip{display:inline-flex;align-items:center;gap:4px;text-decoration:none;white-space:nowrap;font-size:10px;padding:3px 9px}
  .channels-links .chip-icon{flex:none;display:block;width:13px;height:13px}
  .channels-links .chip:hover{border-color:var(--teal);color:var(--teal-dark)}
  #pwaInstallBtn{display:none;align-items:center;gap:5px;font-size:11px;font-weight:700;color:var(--teal-dark);background:#fff;border:1.4px solid var(--teal);border-radius:8px;padding:5px 10px;cursor:pointer;white-space:nowrap;box-shadow:0 1px 4px rgba(0,130,138,.12)}
  #pwaInstallBtn:hover{background:var(--teal-light-soft)}
  #pwaInstallBtn svg{flex:none;width:14px;height:14px}
  #pwaModalBg{display:none;position:fixed;inset:0;background:rgba(15,43,61,.55);z-index:999;align-items:center;justify-content:center;padding:20px}
  #pwaModal{background:#fff;border-radius:14px;max-width:340px;width:100%;padding:20px 18px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
  #pwaModal h3{margin:0 0 10px;font-size:15px;color:var(--navy)}
  #pwaModal p{margin:0 0 8px;font-size:13px;color:var(--ink);line-height:1.55}
  #pwaModal .step{display:flex;gap:8px;align-items:flex-start;margin-bottom:10px}
  #pwaModal .step-num{flex:none;width:20px;height:20px;border-radius:50%;background:var(--teal);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
  #pwaModal button{margin-top:6px;width:100%;padding:9px;border:none;border-radius:8px;background:var(--teal);color:#fff;font-size:13px;font-weight:700;cursor:pointer}
  .chart-wrap{overflow:hidden}
  .chart-note{font-size:10px;color:var(--sub);text-align:right;margin-top:2px}
  circle[data-tip]{touch-action:none}
  .chart-hover-capture{touch-action:none;cursor:crosshair}

  .rk{display:flex;align-items:center;gap:10px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:12px}
  .rk:last-child{border-bottom:none}
  .rk .no{flex:none;width:20px;height:20px;border-radius:6px;background:var(--slate-bg);color:var(--sub);font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .rk:nth-child(-n+3) .no{background:var(--teal);color:#fff}
  .rk .nm{flex:1;min-width:0;font-weight:500;display:flex;flex-direction:column;gap:1px}
  .rk .nm .nm-title{white-space:normal;word-break:keep-all;line-height:1.2}
  .rk .nm .nm-title .nh{flex:none;vertical-align:1px}
  .rk .nm small{color:var(--sub);font-weight:400;font-size:10px;line-height:1.3}
  .rk .val{flex:none;text-align:right;font-weight:700;font-size:12px}
  .rk .val small{display:block;font-weight:400;color:var(--sub);font-size:10px;line-height:1.3}
  .rk .nm .clickable{cursor:pointer;border-bottom:1px dotted var(--sub)}

  .cmp-row{display:flex;gap:8px;margin-bottom:8px}
  .cmp-row select{flex:0 0 128px}
  .cmp-row input{flex:1;min-width:0;border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;font-family:inherit}
  .cmp-row input:focus{outline:none;border-color:var(--teal)}
  .cmp-row .rm{flex:none;width:40px;border:none;background:var(--slate-bg);border-radius:12px;color:var(--sub);font-size:16px;cursor:pointer}
  .legend{display:flex;flex-wrap:wrap;gap:8px 14px;margin:8px 0 4px}
  .legend span{font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:5px}
  .legend i{width:14px;height:3.5px;border-radius:2px;display:inline-block}
  .toggle2{display:inline-flex;background:var(--slate-bg);border-radius:8px;padding:3px;margin-left:auto}
  .toggle2 span{font-size:10.5px;font-weight:700;color:var(--sub);padding:4px 10px;border-radius:6px;cursor:pointer}
  .toggle2 span.on{background:#fff;color:var(--teal-dark);box-shadow:0 1px 3px rgba(15,43,61,.12)}
  .ctl-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  #ac{position:fixed;z-index:60;background:#fff;border:1.5px solid var(--line);border-radius:12px;box-shadow:0 6px 20px rgba(15,43,61,.14);max-height:280px;overflow-y:auto;display:none}
  #ac.on{display:block}
  .ac-item{padding:10px 14px;font-size:13px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #F1F5F9}
  .ac-item:last-child{border-bottom:none}
  .ac-item:hover,.ac-item.hl{background:var(--teal-soft)}
  .ac-item b{color:var(--teal-dark)}
  .ac-item small{color:var(--sub);font-size:10.5px;white-space:nowrap;align-self:center}
  .ac-msg{padding:12px 14px;font-size:12px;color:var(--sub)}
  #tip{position:fixed;z-index:90;background:var(--navy);color:#fff;font-size:11px;line-height:1.5;border-radius:8px;padding:7px 10px;pointer-events:none;display:none;box-shadow:0 4px 14px rgba(15,43,61,.3);max-width:230px}
  #tip b{color:#7FD4D9}
  #mpop{position:fixed;inset:0;z-index:80;background:rgba(15,43,61,.45);display:none;align-items:center;justify-content:center;padding:20px}
  #mpop.on{display:flex}
  .mpop-box{background:#fff;border-radius:16px;box-shadow:0 10px 40px rgba(15,43,61,.3);max-width:380px;width:100%;padding:16px 18px;animation:fade .25s ease}
  .mpop-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .mpop-hd h3{font-size:13px;font-weight:900;color:var(--navy)}
  .mpop-hd button{border:none;background:var(--slate-bg);border-radius:8px;width:28px;height:28px;font-size:15px;color:var(--sub);cursor:pointer}
  .mpop-note{font-size:10px;color:var(--sub);margin-top:6px;text-align:right}
  .src-note{font-size:10px;color:var(--sub);text-align:center;padding:4px 0 20px;line-height:1.6}

  .fbar-row{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .fbar-lb{flex:0 0 64px;display:flex;flex-direction:column;gap:1px}
  .fbar-lb b{font-size:11.5px;color:var(--navy)}
  .fbar-lb .rng{font-size:9px}
  .fbar-track{flex:1;background:var(--slate-bg);border-radius:6px;height:15px;overflow:hidden}
  .fbar-fill{height:100%;border-radius:6px;transition:width .3s ease}
  .fbar-v{flex:0 0 44px;text-align:right;font-weight:700;font-size:12px;color:var(--navy)}

  /* ── 우클릭/드래그/복사 방지 (입력창은 예외) ── */
  body{ -webkit-user-select:none; -moz-user-select:none; user-select:none; -webkit-touch-callout:none; }
  input, textarea, select{ -webkit-user-select:auto; -moz-user-select:auto; user-select:auto; -webkit-touch-callout:default; }
  img{ -webkit-user-drag:none; user-drag:none; pointer-events:auto; }
  /* 커스텀 지역 선택 — 네이티브 select 드롭다운은 행 높이를 OS가 그려서 CSS로 못 줄이므로 직접 그린다 */
  #lawd{position:absolute;opacity:0;pointer-events:none;width:0;height:0}
  .rgpick{flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:6px;
    background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;
    font-family:inherit;font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;text-align:left}
  .rgpick span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rgpick b{flex:0 0 auto;font-size:10px;color:var(--sub)}
  .pybm-panel{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1.5px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(15,43,61,.14);z-index:50;padding:6px;max-height:260px;overflow-y:auto}
  .pybm-opt{display:flex;align-items:center;gap:8px;padding:9px 8px;border-radius:8px;cursor:pointer;font-size:13.5px;font-weight:600;color:var(--ink)}
  .pybm-opt:active{background:var(--slate-bg)}
  .pybm-opt input{width:16px;height:16px;accent-color:var(--teal)}
  .pybm-sep{height:1px;background:var(--line);margin:4px 2px}
  .rgdim{position:fixed;inset:0;background:rgba(15,43,61,.45);z-index:120;display:none}
  .rgdim.on{display:block}
  .rgpanel{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:460px;
    background:#fff;border-radius:16px 16px 0 0;z-index:121;display:none;flex-direction:column;max-height:82vh;overflow:hidden}
  .rgpanel.on{display:flex}
  .rghd{flex:0 0 auto;padding:12px 14px 8px;border-bottom:1px solid var(--line)}
  .rghd h4{margin:0 0 8px;font-size:14px;font-weight:800;color:var(--ink)}
  .rgsearch{width:100%;box-sizing:border-box;border:1.5px solid var(--line);border-radius:10px;
    padding:8px 10px;font-family:inherit;font-size:13px;outline:none}
  .rgsearch:focus{border-color:var(--teal)}
  .rgbody{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 10px 10px}
  .rggrp{position:sticky;top:0;background:#fff;color:var(--sub);
    font-size:11px;font-weight:800;padding:10px 4px 6px;letter-spacing:.3px;z-index:1}
  .rgall{display:block;width:100%;box-sizing:border-box;text-align:left;font-family:inherit;
    border:1.5px dashed var(--teal);border-radius:10px;background:var(--teal-light-soft);

      document.getElementById('dailyBadge').src = `https://visitor-badge.laobi.icu/badge?page_id=aptsum.netlify.app-daily-${ymd}&text=Today`;
    })();
  </script>
  <script>
    // ---- PWA 설치: 서비스워커 등록 + 홈 화면 추가 버튼 ----
    (function(){
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }

      const btn = document.getElementById('pwaInstallBtn');
      const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
      // 인스타그램·쓰레드·페이스북·카카오톡 등은 자체 인앱 브라우저(WebView)로 링크를 열어서
      // beforeinstallprompt 자체가 발생하지 않음(Android) — 정식 브라우저로 열어야만 설치 가능
      const isInAppBrowser = /Instagram|Threads|FBAN|FBAV|KAKAOTALK|NAVER\(inapp/i.test(navigator.userAgent);
      window.__pwaIsInAppBrowser = isInAppBrowser;

      if (isStandalone) {
        // 이미 앱으로 설치되어 실행 중이면 버튼 자체를 숨김
        window.__pwaDeferredPrompt = null;
      } else if (isInAppBrowser) {
        // 인앱 브라우저에서는 beforeinstallprompt가 안 뜨므로, 버튼을 항상 노출해
        // 눌렀을 때 "정식 브라우저로 열어주세요" 안내로 대체(아래 handlePwaInstallClick)
        // (2026.08 수민 요청으로 자동 노출 경고 배너는 제거 — 안내는 설치 버튼 클릭 시 모달로만 표시)
        btn.style.display = 'inline-flex';
      } else if (isIOS) {
        // iOS Safari는 beforeinstallprompt를 지원하지 않아 안내 모달로 대체
        btn.style.display = 'inline-flex';
      } else {
        // 안드로이드/데스크톱 Chrome 등: 브라우저가 설치 가능하다고 판단하면 이벤트 발생
        window.addEventListener('beforeinstallprompt', (e) => {
          e.preventDefault();
          window.__pwaDeferredPrompt = e;
          btn.style.display = 'inline-flex';
        });
        window.addEventListener('appinstalled', () => {
          btn.style.display = 'none';
          window.__pwaDeferredPrompt = null;
        });
      }
    })();

    async function handlePwaInstallClick(){
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
      if (window.__pwaIsInAppBrowser) {
        // 인스타/쓰레드 등 인앱 브라우저에서는 설치 자체가 불가 — 정식 브라우저로 열도록 안내
        document.getElementById('pwaModalBody').innerHTML =
          '<div class="step"><div class="step-num">1</div><div>화면 오른쪽 위 <b>점 3개(⋮)</b> 또는 <b>공유 아이콘</b>을 눌러주세요.</div></div>' +
          '<div class="step"><div class="step-num">2</div><div><b>\'다른 브라우저에서 열기\'</b> (또는 \'Safari에서 열기\' / \'Chrome에서 열기\')를 선택해주세요.</div></div>' +
          '<div class="step"><div class="step-num">3</div><div>정식 브라우저로 열리면 다시 <b>\'홈 화면에 추가\'</b> 버튼을 눌러주세요.</div></div>';
        document.getElementById('pwaModalBg').style.display = 'flex';
        return;
      }
      if (window.__pwaDeferredPrompt) {
        window.__pwaDeferredPrompt.prompt();
        await window.__pwaDeferredPrompt.userChoice;
        window.__pwaDeferredPrompt = null;
        document.getElementById('pwaInstallBtn').style.display = 'none';
        return;
      }
      if (isIOS) {
        document.getElementById('pwaModalBody').innerHTML =
          '<div class="step"><div class="step-num">1</div><div>하단 <b>공유 버튼</b>(<svg style="display:inline;vertical-align:-3px" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#00828A" stroke-width="2"><path d="M12 3v12M8 7l4-4 4 4M5 12v7a2 2 0 002 2h10a2 2 0 002-2v-7"/></svg>)을 눌러주세요.</div></div>' +
          '<div class="step"><div class="step-num">2</div><div>메뉴에서 <b>\'홈 화면에 추가\'</b>를 선택해주세요.</div></div>' +
          '<div class="step"><div class="step-num">3</div><div>오른쪽 위 <b>\'추가\'</b>를 누르면 완료!</div></div>';
        document.getElementById('pwaModalBg').style.display = 'flex';
        return;
      }
      // 이벤트가 아직 안 온 브라우저(설치 조건 미충족 등) 대비 안내
      document.getElementById('pwaModalBody').innerHTML =
        '<div>브라우저 메뉴(⋮)에서 <b>\'앱 설치\'</b> 또는 <b>\'홈 화면에 추가\'</b>를 선택해주세요.</div>';
      document.getElementById('pwaModalBg').style.display = 'flex';
    }

    function closePwaModal(){
      document.getElementById('pwaModalBg').style.display = 'none';
    }
    // ---- 구독 전용 탭 3종(하락 거래·연간 저평가(동일 동)·역세권): 로고 5번 빠르게 탭 + 코드 입력하면 노출 ----
    // 인스타 구독(2,600원/월) 전용 콘텐츠라, 탭에 상시 노출하지 않고 이 제스처+코드로만 접근한다.
    // 한 번 해제하면 이 브라우저에서는 계속 노출(localStorage) — 새로고침·재방문 때마다 다시 입력할 필요 없음.
    // (2026.08 — 원래 하락 거래·연간 저평가(동일 동)는 "운영자 확인용"이라 코드 없이 탭만으로 풀리게
    // 짜놨었는데, 수민 정정으로 셋 다 구독 전용 콘텐츠였음이 확인돼 하나의 게이트로 통합)
    // header/tabs 마크업이 이 스크립트보다 뒤에 나오므로(아직 DOM에 없음) DOMContentLoaded 이후에 바인딩한다.
    document.addEventListener('DOMContentLoaded', function(){
      const SUBSCRIBER_KEY = 'apc:subscriberSub'; // 세 탭 공용 — 비밀번호 확인 후에만 세팅됨
      const SUBSCRIBER_CODE = 'aptsum26'; // 구독자에게만 공유하는 코드(인스타 구독 전용 피드에 안내)
      const subTabs = ['tabNL', 'tabLPD', 'tabSub'].map(id => document.getElementById(id)).filter(Boolean);
      const subDivider = document.getElementById('tabSubDivider');
      if (!subTabs.length) return;
      const reveal = () => { subTabs.forEach(t => { t.style.display = ''; }); if (subDivider) subDivider.style.display = ''; };
      if (localStorage.getItem(SUBSCRIBER_KEY) === '1') { reveal(); }

      let taps = 0, lastTap = 0;
      const zone = document.getElementById('logoTapZone');
      if (zone) {
        zone.addEventListener('click', () => {
          const now = Date.now();
          taps = (now - lastTap > 1500) ? 1 : taps + 1;
          lastTap = now;
          if (taps >= 5) {
            taps = 0;
            if (localStorage.getItem(SUBSCRIBER_KEY) !== '1') {
              const code = prompt('구독자 전용 코드를 입력하세요');
              if (code === SUBSCRIBER_CODE) {
                reveal();
                try{ localStorage.setItem(SUBSCRIBER_KEY, '1'); }catch(e){}
              }
            }
          }
        });
      }
    });
  </script>

const viewStack = [];
function pushView(){
  const inputs = {
    mode, lawd: sel.value,
    q: document.getElementById('q').value,
    mN: document.getElementById('monthsN').value,
    fM: document.getElementById('floorMin').value,
    pym: pyBandMultiSel.slice(), // 평형 다중 선택 상태 — 2026.08부터 평형 선택 있는 탭 전부(region/volume/updown/gap/newhigh/newlow/pyprice) 공통

  };
  viewStack.push({data:lastData, inputs});
  try{ history.pushState({vi: viewStack.length-1}, '', buildShareURL(inputs)); }catch(e){} // 샌드박스 미리보기(about:blank 등) 등 History API를 못 쓰는 환경에서도 앱 동작에 지장 없게
}
function buildShareURL(inp){
  const p = new URLSearchParams();
  p.set('m', inp.mode); p.set('p', inp.mN); p.set('f', inp.fM);
  if(inp.mode==='compare'){
    p.set('c', inp.cmp.filter(x=>x.name.trim()).map(x=>x.lawd+':'+x.name.trim()).join('|'));
  } else {
    p.set('r', inp.lawd);
    if(inp.mode==='complex') p.set('q', inp.q);
    // 복수 지역(칩) 선택 상태 — sel.value만으론 칩 선택이 안 잡히므로 별도 파라미터로 인코딩(2026.07)
    if(inp.regionSel && inp.regionSel.length) p.set('rs', inp.regionSel.map(x=>x.lawd+':'+x.name).join('|'));
    // 평형 다중 선택(2026.08부터 평형 선택 있는 탭 전부 공통)
    if(inp.pym && inp.pym.length) p.set('pym', inp.pym.join(','));
  }
  return location.pathname + '?' + p.toString();
}

function initFromURL(){
  const p = new URLSearchParams(location.search);
  const m = p.get('m');
  if(!m) return;
  setMode(m==='compare'?'compare':(m==='region'?'region':(m==='volume'?'volume':(m==='updown'?'updown':(m==='shortval'?'shortval':(m==='peak'?'peak':(m==='longpeak'?'longpeak':(m==='newhigh'?'newhigh':(m==='newlow'?'newlow':(m==='gap'?'gap':(m==='subway'?'subway':'complex')))))))))));
  if(p.get('p')) document.getElementById('monthsN').value = p.get('p');
  if(p.get('f')!==null) document.getElementById('floorMin').value = p.get('f');
  if(m==='compare'){
    const items = (p.get('c')||'').split('|').map(s=>{ const i=s.indexOf(':'); return {lawd:s.slice(0,i), name:s.slice(i+1)}; }).filter(x=>x.name);
    document.getElementById('cmpRows').innerHTML='';
    items.forEach(c=>{ addCmpRow(); const rows=document.querySelectorAll('.cmp-row'); const r=rows[rows.length-1]; setCmpRowLawd(r, c.lawd); r.querySelector('input').value=c.name; });
    if(items.length>=2) search();
  } else {
    if(p.get('r')) sel.value = p.get('r');
    // 복수 지역(칩) 선택 상태 복원 — setMode()가 이 탭들에 새로 진입할 때 칩을 비우므로 그 다음에 복원해야 함
    if(p.get('rs')){
      regionSel = p.get('rs').split('|').map(s=>{ const i=s.indexOf(':'); return {lawd:s.slice(0,i), name:s.slice(i+1)}; }).filter(x=>x.name);
      saveRegionSel(); renderRegionChips();
    }
    if(typeof syncRegionPickBtn === 'function') syncRegionPickBtn(); // sel.value 직접 변경은 change 이벤트가 안 나서 화면 라벨을 따로 갱신해야 함
    if(p.get('pym')){ pyBandMultiSel = p.get('pym').split(',').filter(Boolean); renderPyBandMultiBtn(); } // 2026.08 — 평형 다중 선택 있는 탭 전부(region/volume/updown/gap/newhigh/newlow/pyprice) 공통 복원
    if(m==='region'||m==='volume'||m==='updown'||m==='shortval'||m==='peak'||m==='longpeak'||m==='newhigh'||m==='newlow'||m==='pyprice'||m==='gap'){ search(); }
    else if(m==='subway'){ search(); } // 2026.08 추가 — 역세권 공유 링크로 진입해도 자동 조회되도록(기존엔 이 분기가 없어 단지 분석으로 열렸음)
    else if(p.get('q')){ document.getElementById('q').value = p.get('q'); search(); }
  }
}
async function shareCurrent(){
  const url = location.origin + location.pathname + location.search;
  // 데스크톱 웹(특히 Windows Chrome/Edge)에서 navigator.share()를 부르면 OS 자체 공유 패널이 뜨는데,
  // 공유 대상 앱 목록을 불러오다 로딩 스피너에서 멈추거나 아예 안 뜨는 경우가 있어(2026.08 리포트) —
  // 모바일(터치 기기)에서만 네이티브 공유 시트를 쓰고, 데스크톱은 항상 클립보드 복사로 처리한다.
  const isMobile = matchMedia('(pointer: coarse)').matches;
  try{
    if(isMobile && navigator.share){ await navigator.share({title:'아파트썸 실거래 분석', url}); return; }
    await navigator.clipboard.writeText(url);
    alert('분석 링크가 복사되었습니다');
  }catch(e){}
}

function getFavs(){ try{ return JSON.parse(localStorage.getItem('apc:favs')||'[]'); }catch(e){ return []; } }
function isFav(lawd, name){ return getFavs().some(x=>x.lawd===lawd && x.name===name); }
function toggleFav(lawd, name){
  let favs = getFavs();
  if(isFav(lawd,name)){
    favs = favs.filter(x=>!(x.lawd===lawd && x.name===name));
    clearFavSeen(lawd, name);
  } else {
    const label = [...sel.options].find(o=>o.value===lawd)?.textContent || '';
    favs.unshift({lawd, name, label});
    favs = favs.slice(0,10);
    // 방금 추가한 즐겨찾기는 "지금까지의 거래건수"를 기준선으로 저장 → 다음 방문부터만 신규 거래 배지 표시
    favTradeCount(lawd, name).then(n=>setFavSeenCount(lawd, name, n)).catch(()=>{});
  }
  try{ localStorage.setItem('apc:favs', JSON.stringify(favs)); }catch(e){}
  renderFavs();
  const btn = document.getElementById('favBtn');
  if(btn) btn.textContent = isFav(lawd,name)? '★':'☆';
}
function renderFavs(){
  const favs = getFavs();
  const el = document.getElementById('favs');
  el.innerHTML = favs.map(x=>{
    const nb = favBadges[favKey(x.lawd,x.name)];
    const badge = nb>0 ? `<span class="nh">신규 ${nb}</span>` : '';
    return `<span class="chip" onclick="favGo('${esc(x.lawd)}','${esc(x.name)}')">★ ${esc(x.name)}<span style="font-weight:400;color:var(--sub)"> ${esc(x.label)}</span>${badge}</span>`;
  }).join('');

      let itemsP = [];
      try{ itemsP = await ensureMonthsP(f.lawd, 12); }catch(e){} // 매매 실거래가 없는 분양권 전용 즐겨찾기 단지도 요약에 반영
      const merged = mergeTradeAndPresaleForRanking(items, itemsP);
      const m = matchComplex(merged, f.name);
      if(!m.hits || !m.hits.length) return { ...f, state:'nodata' };
      const rows = buildRepRows(m.hits, months);
      if(!rows.length){
        // 최근 2+2개월 비교가 안 나올 만큼 거래가 뜸한 단지는 등락률 대신 가장 최근 단건 거래만 보여준다
        const sorted = m.hits.slice().sort((a,b)=>dkey(b).localeCompare(dkey(a)));
        const last = sorted[0];
        return { ...f, state:'sparse', last };
      }
      const rep = rows.slice().sort((a,b)=> (b.r3n+b.p3n) - (a.r3n+a.p3n))[0];
      return { ...f, state:'ok', rep };
    }catch(e){ return { ...f, state:'error' }; }
  }));
  body.innerHTML = results.map(r=>{
    if(r.state==='error') return favDashCard(r, `<span style="color:var(--sub);font-size:12px">조회 실패 · 눌러서 다시 확인</span>`);
    if(r.state==='nodata') return favDashCard(r, `<span style="color:var(--sub);font-size:12px">최근 12개월 거래 없음</span>`);
    if(r.state==='sparse'){
      const last = r.last;
      return favDashCard(r, last
        ? `<b style="font-size:15px;color:var(--navy)">${last.amt.toFixed(1)}억</b>
           <span style="font-size:11px;color:var(--sub);margin-left:6px">${esc(last.py)}평${last.area?`(전용 ${Math.floor(last.area)}㎡)`:''} · ${esc(ymLabel(last.ym))}.${esc(last.d)}</span>
           <div style="font-size:10.5px;color:var(--sub);margin-top:2px">최근 등락 산출 불가(거래 부족)</div>`
        : `<span style="color:var(--sub);font-size:12px">거래 데이터 부족</span>`);
    }
    const x = r.rep;
    const dir = x.pct>0?'up':(x.pct<0?'down':'');
    return favDashCard(r, `
      <b style="font-size:16px;color:var(--navy)">${x.r3avg.toFixed(1)}억</b>
      <span class="${dir}" style="font-weight:800;font-size:13px;margin-left:6px">${x.pct>0?'+':''}${x.pct}%</span>
      <div style="font-size:10.5px;color:var(--sub);margin-top:2px">${esc(x.mainPy)} 대표 · 최근 2개월 ${x.r3n}건 (이전 ${x.p3avg.toFixed(1)}억→최근 ${x.r3avg.toFixed(1)}억)</div>
    `);
  }).join('');
}

// ── 즐겨찾기 "신규 거래" 배지: 최근 12개월 거래건수를 마지막 확인 시점과 비교 ──
const favBadges = {}; // "lawd|name" → 신규 거래 건수
function favKey(lawd, name){ return lawd+'|'+name; }
function getFavSeen(){ try{ return JSON.parse(localStorage.getItem('apc:favSeen')||'{}'); }catch(e){ return {}; } }
function setFavSeenCount(lawd, name, n){
  try{
    const seen = getFavSeen();
    seen[favKey(lawd,name)] = n;
    localStorage.setItem('apc:favSeen', JSON.stringify(seen));
  }catch(e){}
  delete favBadges[favKey(lawd,name)];
}
function clearFavSeen(lawd, name){
  try{
    const seen = getFavSeen();
    delete seen[favKey(lawd,name)];
    localStorage.setItem('apc:favSeen', JSON.stringify(seen));
  }catch(e){}
  delete favBadges[favKey(lawd,name)];
}
async function favTradeCount(lawd, name){
  const items = await ensureMonths(lawd, 12); // 층수 필터와 무관하게 표준 12개월 기준으로 비교
  let itemsP = [];
  try{ itemsP = await ensureMonthsP(lawd, 12); }catch(e){} // 분양권 전용(매매 실거래 없는) 단지도 신규 거래 배지 대상에 포함
  const m = matchComplex(items, name);
  if(m.hits && m.hits.length) return m.hits.length + (matchComplex(itemsP, name).hits || []).length;
  const mp = matchComplex(itemsP, name);
  return mp.hits ? mp.hits.length : 0;
}
// 재방문 시(앱 로드 시) 즐겨찾기별로 마지막 확인 이후 늘어난 거래건수를 조회해 배지 표시
function refreshFavBadges(){
  const favs = getFavs();
  if(!favs.length) return;
  const seen = getFavSeen();
  favs.forEach(f=>{
    favTradeCount(f.lawd, f.name).then(n=>{
      const key = favKey(f.lawd, f.name);
      const prev = seen[key];
      if(prev===undefined){ setFavSeenCount(f.lawd, f.name, n); return; } // 최초 기준선
      const diff = n - prev;
      if(diff > 0){ favBadges[key] = diff; renderFavs(); }
    }).catch(()=>{}); // 배지는 부가 기능이므로 조회 실패는 조용히 무시
  });
}

function toggleFavRegion(){
  // 지역 랭킹에서 칩(복수 선택)이 쌓여 있으면 그 조합 전체를 즐겨찾기 대상으로 삼는다.
  // 전부 이미 즐겨찾기 상태면 전부 해제, 하나라도 아니면 전부 추가(누락분만 채움).
  const useMulti = ((mode==='region'||mode==='shortval'||mode==='peak'||mode==='longpeak'||mode==='longpeakdong'||mode==='newhigh'||mode==='newlow'||mode==='pyprice') && regionSel.length>0);
  const targets = useMulti
    ? regionSel.map(x=>({code:x.lawd, label:x.name}))
    : [{code: sel.value, label: [...sel.options].find(o=>o.value===sel.value)?.textContent || sel.value}];
  let favs = getFavRegions();
  const allFav = targets.every(t=>favs.some(f=>f.code===t.code));
  if(allFav){
    const codes = new Set(targets.map(t=>t.code));
    favs = favs.filter(x=>!codes.has(x.code));
  } else {
    targets.forEach(t=>{
      favs = favs.filter(x=>x.code!==t.code); // 중복 방지 후 맨 앞으로
      favs.unshift(t);
    });
    favs = favs.slice(0,20);

  lastData = v.data;

  else if(v.data.mode==='newlow') renderNewLow(v.data);

const sel = document.getElementById('lawd');

function lawdsOfScope(v){
  const g = String(v).slice(ALL_PREFIX.length);

  return hit ? hit[1].map(([n,c])=>({name:n, lawd:c})) : [];

// ── 지역 랭킹 복수 선택 ──
// 지역 셀렉트를 "추가기"로 쓴다: 구를 고르면 칩으로 쌓이고, '○○ 전체'를 고르면 그 시·도의 모든 구가 한 번에 추가된다.
// 칩이 비어 있으면 기존과 동일하게 셀렉트에 표시된 단일 지역만 조회한다.
let regionSel = []; // [{name, lawd}]
const REGION_MAX = 45; // 서울25·경기39·인천10 — 시·도 하나를 통째로 담을 수 있는 여유치(localStorage 복원 시 상한 캡용, 실제 선택 상한은 아래 regionSelMax() 참고)
const REGION_MAX_RANK = 25; // 지역 랭킹·신고가·신저가 공통 상한(2026.08) — '○○ 전체'로 서울(25개 구)은 한 번에 담기지만 경기(39)·인천(10) 전체는 25개에서 끊김
const REGION_MAX_UNDERVALUE = 5; // 저평가(단기/반기/연간)는 지역 랭킹과 달리 단지별로 세대수까지 조회하는 무거운 계산이라 상한을 낮게 잡음(2026.07)
function regionSelMax(){ return (mode==='shortval'||mode==='peak'||mode==='longpeak') ? REGION_MAX_UNDERVALUE : (mode==='region'||mode==='newhigh'||mode==='newlow'||mode==='pyprice'||mode==='longpeakdong') ? REGION_MAX_RANK : REGION_MAX; } // 연간 저평가(동일 동)만 2026.08부터 25개로 상향(수민 요청) — 나머지 저평가 3탭(단기/반기/연간)은 무거운 계산이라 5개 유지
function saveRegionSel(){ try{ localStorage.setItem('apc:regionSel', JSON.stringify(regionSel)); }catch(e){} }
function loadRegionSel(){
  try{
    const v = JSON.parse(localStorage.getItem('apc:regionSel')||'[]');
    if(Array.isArray(v)) regionSel = v.filter(x=>x && x.lawd && x.name).slice(0, REGION_MAX);
  }catch(e){ regionSel = []; }
}
function addRegion(v){
  const add = isAllScope(v) ? lawdsOfScope(v) : (()=>{
    const o = [...sel.options].find(x=>x.value===v);
    return o ? [{name:o.textContent, lawd:o.value}] : [];
  })();
  let over = false;
  const max = regionSelMax();
  add.forEach(t=>{
    if(regionSel.some(x=>x.lawd===t.lawd)) return;
    if(regionSel.length >= max){ over = true; return; }
    regionSel.push(t);
  });
  if(over) showError(`지역은 최대 ${max}개까지 선택할 수 있습니다.`);
  // 싱글 전용 탭(단지분석·단지비교·거래량·등락)도 방금 칩에 추가한 지역으로 바로 갱신되도록 sel.value까지 맞춰준다
  // (2026.08 — 전에는 칩만 갱신되고 sel.value는 그대로라 다른 탭으로 넘어가면 예전 지역이 남아있었음)
  if(!isAllScope(v) && add.length) sel.value = v;
  saveRegionSel(); renderRegionChips();
}
function removeRegion(lawd){
  regionSel = regionSel.filter(x=>x.lawd!==lawd);
  saveRegionSel(); renderRegionChips();
}
function clearRegions(){ regionSel = []; saveRegionSel(); renderRegionChips(); }

    return;
  }
  box.innerHTML = `
    <div style="display:flex;flex-wrap:wrap;gap:5px;align-items:center;padding:2px 0">
      ${regionSel.map(x=>`<span style="display:inline-flex;align-items:center;gap:4px;background:var(--teal-soft);border:1px solid #B9E4E6;color:var(--teal-dark);border-radius:999px;padding:3px 6px 3px 9px;font-size:11px;font-weight:700">${esc(x.name)}<b onclick="removeRegion('${esc(x.lawd)}')" style="cursor:pointer;font-size:13px;line-height:1;padding:0 2px;color:#00565C">×</b></span>`).join('')}
      <span onclick="clearRegions()" style="cursor:pointer;font-size:11px;font-weight:700;color:var(--sub);text-decoration:underline;margin-left:2px">전체 해제</span>
    </div>
    <div class="rng" style="padding:0 2px">${regionSel.length}개 지역 통합 조회</div>`;
}
loadRegionSel();

// ── 커스텀 지역 선택 패널 ──
// 네이티브 select 드롭다운은 행 높이를 OS가 그려서 CSS로 못 줄이므로(안드로이드에서 특히 넓게 나옴)
// 목록을 직접 그린다. 단, 기존 코드가 전부 sel.value/sel.options를 참조하므로 select 요소 자체는
// DOM에 그대로 두고(화면에서만 숨김) 여기서 값을 세팅한 뒤 change 이벤트를 발생시킨다.
function regionPickerLabel(){
  if((mode==='region'||mode==='shortval'||mode==='peak'||mode==='longpeak'||mode==='longpeakdong'||mode==='newhigh'||mode==='newlow'||mode==='pyprice') && regionSel.length){
    return regionSel.length===1 ? regionSel[0].name
      : (regionSel.length<=4 ? regionSel.map(x=>x.name).join(' · ') : `${regionSel[0].name} 외 ${regionSel.length-1}곳`);
  }
  const o = sel.options[sel.selectedIndex];
  return o ? o.textContent : '지역 선택';
}
function syncRegionPickBtn(){
  const el = document.getElementById('rgPickTxt');
  if(el) el.textContent = regionPickerLabel();
}
function buildRegionPicker(){
  const multi = (mode==='region'||mode==='shortval'||mode==='peak'||mode==='longpeak'||mode==='longpeakdong'||mode==='newhigh'||mode==='newlow'||mode==='pyprice');
  const q = (document.getElementById('rgSearch').value||'').trim();
  const body = document.getElementById('rgBody');
  document.getElementById('rgTitle').textContent = multi ? `지역 선택 (최대 ${regionSelMax()}개)` : '지역 선택';
  document.getElementById('rgFt').style.display = multi ? '' : 'none';
  const picked = new Set(regionSel.map(x=>x.lawd));
  let html = '';
  REGIONS.forEach(([g,arr])=>{
    const hits = arr.filter(([n])=> !q || n.includes(q) || g.includes(q));
    if(!hits.length) return;
    html += `<div class="rggrp">${esc(g)}</div>`;
    // 상한 25개인 탭에서만 '전체' 버튼 노출(2026.08) — 상한 5개(단기/반기/연간 저평가)는 서울(25구)조차
    // 다 못 담아서 이 버튼 자체가 실효성 없음(수민 요청으로 제외). supportsAllScopeOption(setMode 쪽)과
    // 동일 기준이라 regionSelMax()로 판단.
    if(multi && !q && regionSelMax()>=REGION_MAX_RANK){
      html += `<button type="button" class="rgall" onclick="pickRegion('${ALL_PREFIX}${esc(g)}')">+ ${esc(g)} 전체 한번에 추가</button>`;
    }
    html += `<div class="rggrid">` + hits.map(([n,c])=>{
      const on = multi ? picked.has(c) : (cmpPickerRow ? cmpPickerRow.value===c : sel.value===c);
      return `<button type="button" class="rgitem${on?' sel':''}" onclick="pickRegion('${esc(c)}')"><span class="tick">✓</span>${esc(n)}</button>`;
    }).join('') + `</div>`;
  });
  body.innerHTML = html || '<div class="rng" style="padding:12px 4px">검색 결과가 없습니다</div>';
}
let cmpPickerRow = null; // 단지 비교 탭에서 특정 행(cmp-row)의 지역을 고르는 중이면 그 행의 hidden select를 가리킴(2026.08 추가)
function regionNameByLawd(code){
  for(const [,arr] of REGIONS){ const hit = arr.find(([,c])=>c===code); if(hit) return hit[0]; }
  return code ? code : '지역 선택';
}
// 단지 비교 탭 각 행의 hidden select 값 + 눈에 보이는 버튼 라벨을 함께 맞춘다(값만 바꾸고 라벨을 안 맞추면
// "지역 선택" 버튼에 옛 지역명이 계속 남아있게 됨 — URL 공유 복원(p.get('c'))·즐겨찾기 복원 양쪽에서 사용)
function setCmpRowLawd(row, lawd){
  const selEl = row.querySelector('select');
  selEl.value = lawd;
  const label = row.querySelector('.rgpick-txt');
  if(label) label.textContent = lawd ? regionNameByLawd(lawd) : '지역 선택';
}
function pickRegion(v){
  if(cmpPickerRow){
    setCmpRowLawd(cmpPickerRow.closest('.cmp-row'), v);
    closeRegionPicker(); // cmpPickerRow=null 리셋은 closeRegionPicker 안에서 처리
    return;
  }
  if(mode==='region'||mode==='shortval'||mode==='peak'||mode==='longpeak'||mode==='longpeakdong'||mode==='newhigh'||mode==='newlow'||mode==='pyprice'){
    // 복수 선택: 이미 담긴 지역을 다시 누르면 해제(토글). 패널은 계속 열어둔다.
    if(!isAllScope(v) && regionSel.some(x=>x.lawd===v)) removeRegion(v);
    else addRegion(v);
    buildRegionPicker();
    syncRegionPickBtn();
    return;
  }
  sel.value = v;
  sel.dispatchEvent(new Event('change'));
  syncRegionPickBtn();
  closeRegionPicker();
}
function openRegionPicker(rowSelectEl){
  cmpPickerRow = rowSelectEl || null; // 단지 비교 탭 행 버튼에서 호출되면 그 행의 select를 넘겨받음
  document.getElementById('rgSearch').value = '';
  buildRegionPicker();
  document.getElementById('rgDim').classList.add('on');
  document.getElementById('rgPanel').classList.add('on');
}
function closeRegionPicker(){
  document.getElementById('rgDim').classList.remove('on');
  document.getElementById('rgPanel').classList.remove('on');
  syncRegionPickBtn();
  cmpPickerRow = null; // 다음에 singleRow의 "지역 선택"을 열 때 cmp 모드로 잘못 남아있지 않도록 항상 리셋
}

sel.value = (lastRegionPref && [...sel.options].some(o=>o.value===lastRegionPref)) ? lastRegionPref : '';
sel.addEventListener('change', ()=>{
  updateRegionFavBtn(); renderFavRegions();
  // 지역 랭킹·저평가(단기/반기/연간)에서는 셀렉트가 "추가기" 역할 — 고른 지역을 칩으로 쌓는다
  if(mode==='region'||mode==='shortval'||mode==='peak'||mode==='longpeak'||mode==='longpeakdong'||mode==='newhigh'||mode==='newlow'||mode==='pyprice'){
    addRegion(sel.value);
  } else if(sel.value){
    // 싱글 전용 탭(단지분석·단지비교·거래량·등락)에서 지역을 바꾸면, 멀티 탭 칩도 이 지역 하나로 맞춰서
    // 나중에 그 탭으로 넘어갔을 때 예전 칩이 아니라 방금 고른 지역이 보이게 한다(2026.08)
    const opt = [...sel.options].find(o=>o.value===sel.value);
    regionSel = opt ? [{lawd:sel.value, name:opt.textContent}] : [];
    saveRegionSel(); renderRegionChips();
  }
  if(typeof syncRegionPickBtn === 'function') syncRegionPickBtn();
});

// 평형 다중 선택 마지막 값 기억 — 지역 랭킹만 기억(다른 탭들의 선택은 그 탭 안에서만 적용, 매번 "전체 평형"로
// 시작). 2026.08 이전엔 단일 select라 문자열 하나("32-36")로 저장했는데, 이제 다중 선택이라 배열로 저장
// — 예전 버전이 남긴 순수 문자열 값도 JSON.parse 실패 시 그 문자열 하나짜리 배열로 취급해 계속 읽는다.
function getPyBandMultiPref(){
  let raw; try{ raw = localStorage.getItem('apc:pyBand'); }catch(e){ return null; }
  if(raw==null) return null; // 저장된 적 없음 → 호출부에서 디폴트(32~36평) 적용
  try{ const parsed = JSON.parse(raw); return Array.isArray(parsed) ? parsed : [String(parsed)]; }
  catch(e){ return raw ? [raw] : []; } // 예전 단일-select 시절 순수 문자열 포맷 호환
}
function savePyBandMultiPref(arr){ try{ localStorage.setItem('apc:pyBand', JSON.stringify(arr)); }catch(e){} }

// 평형 다중 선택 — 여러 구간을 동시에 볼 수 있다(예: "23~27평"과 "37~41평"을 동시에, 그 사이 "28~36평"은
// 빼고 보고 싶은 경우 등). 2026.08부터 평형 선택 있는 탭 전부(region/volume/updown/gap/newhigh/newlow/
// pyprice) 공통 — 예전엔 region/volume/updown/gap은 구간 하나만 고르는 단일 select였음.
// 지역 랭킹만 마지막 선택을 기억하고, 나머지 탭은 탭을 나갔다 오면 기억하지 않음(항상 "전체 평형"로 시작).
const PY_BANDS = [
  {v:'17-22', l:'17~22평'}, {v:'23-27', l:'23~27평'}, {v:'28-31', l:'28~31평'},
  {v:'32-36', l:'32~36평'}, {v:'37-41', l:'37~41평'}, {v:'42-46', l:'42~46평'}, {v:'47-51', l:'47~51평'},
];
let pyBandMultiSel = []; // 선택된 band value 문자열들("23-27" 등), 비어있으면 "전체 평형"
function pyBandMultiLabel(){
  if(!pyBandMultiSel.length) return '전체 평형';
  const labels = PY_BANDS.filter(b=>pyBandMultiSel.includes(b.v)).map(b=>b.l);
  return labels.length<=2 ? labels.join(', ') : `${labels[0]} 외 ${labels.length-1}개`;
}
function renderPyBandMultiBtn(){
  const el = document.getElementById('pyBandMultiTxt');
  if(el) el.textContent = pyBandMultiLabel();
}
function buildPyBandPanel(){
  const panel = document.getElementById('pyBandMultiPanel');
  const allOn = pyBandMultiSel.length===0;
  let html = `<label class="pybm-opt"><input type="checkbox" ${allOn?'checked':''} onclick="clearPyBandMulti()">전체 평형</label><div class="pybm-sep"></div>`;
  html += PY_BANDS.map(b=>`<label class="pybm-opt"><input type="checkbox" ${pyBandMultiSel.includes(b.v)?'checked':''} onclick="togglePyBandMulti('${b.v}')">${b.l}</label>`).join('');
  panel.innerHTML = html;
}
function togglePyBandPanel(){
  const panel = document.getElementById('pyBandMultiPanel');
  const opening = panel.style.display === 'none';
  if(opening){ buildPyBandPanel(); panel.style.display = ''; }
  else panel.style.display = 'none';
}
function togglePyBandMulti(v){
  const i = pyBandMultiSel.indexOf(v);
  if(i>=0) pyBandMultiSel.splice(i,1); else pyBandMultiSel.push(v);
  if(mode==='region') savePyBandMultiPref(pyBandMultiSel); // 지역 랭킹에서의 선택만 기억(다른 탭은 그 탭 안에서만 적용)
  buildPyBandPanel(); renderPyBandMultiBtn();
}
function clearPyBandMulti(){ pyBandMultiSel = []; if(mode==='region') savePyBandMultiPref(pyBandMultiSel); buildPyBandPanel(); renderPyBandMultiBtn(); }
document.addEventListener('click', e=>{
  const wrap = document.getElementById('pyBandMultiWrap');
  const panel = document.getElementById('pyBandMultiPanel');
  if(panel && panel.style.display!=='none' && wrap && !wrap.contains(e.target)) panel.style.display = 'none';
});
// 선택된 평형 구간들 중 하나라도 걸치면 통과시키는 필터 함수 — 평형 선택 있는 탭 전부에서 공용으로 사용(search()에서 사용)
function pyBandMultiFilter(items){
  if(!pyBandMultiSel.length) return items;
  const ranges = pyBandMultiSel.map(v=>v.split('-').map(Number));
  return items.filter(t=> ranges.some(([mn,mx])=>t.py>=mn && t.py<=mx));
}

// 게이트
function setMode(m){
  // 탭 전환 시 이전 탭에서 아직 응답을 기다리는 중인 검색이 있다면 무효화 —
  // 안 그러면 그 결과가 늦게 도착했을 때 지금 막 전환한 새 탭 화면을 덮어쓸 수 있음.
  searchToken++;
  mode = m;
  document.getElementById('tabC').classList.toggle('on', m==='complex');
  document.getElementById('tabCmp').classList.toggle('on', m==='compare');
  document.getElementById('tabR').classList.toggle('on', m==='region');
  document.getElementById('tabNH').classList.toggle('on', m==='newhigh');
  document.getElementById('tabNL').classList.toggle('on', m==='newlow');
  document.getElementById('tabPP').classList.toggle('on', m==='pyprice');
  document.getElementById('tabV').classList.toggle('on', m==='volume');
  document.getElementById('tabU').classList.toggle('on', m==='updown');
  document.getElementById('tabSU').classList.toggle('on', m==='shortval');
  document.getElementById('tabP').classList.toggle('on', m==='peak');
  document.getElementById('tabLP').classList.toggle('on', m==='longpeak');
  document.getElementById('tabLPD').classList.toggle('on', m==='longpeakdong');
  document.getElementById('tabGap').classList.toggle('on', m==='gap');
  document.getElementById('tabSub').classList.toggle('on', m==='subway');
  document.getElementById('singleRow').style.display = m==='compare' ? 'none' : '';
  document.getElementById('cmpRows').style.display = m==='compare' ? '' : 'none';
  document.getElementById('addRow').style.display = m==='compare' ? '' : 'none';
  document.getElementById('q').style.display = m==='complex' ? '' : 'none';
  // 평형 필터는 계산에 실제로 반영되는 탭에서만 노출 — 저평가(단기/반기/연간)는 항상 20~39평(20평대/30평대 평대별) 고정 계산이라 셀렉트를 아예 숨긴다(2026.07)
  // '○○ 전체' 옵션 — 모든 복수선택 탭(지역 랭킹·저평가 3종·신고가·하락거래·전용면적 평단가)에서 노출(2026.08,
  // 수민 요청으로 지역 랭킹 전용에서 확장). 저평가(상한 5)처럼 시/도 전체 개수보다 낮은 상한을 가진 탭에서는
  // addRegion()의 기존 over-limit 경고("지역은 최대 N개까지 선택할 수 있습니다")가 그대로 안내해주므로,
  // 상한을 넘는 시/도를 선택해도 조용히 잘리지 않고 명확히 알려짐 — 그래서 안전하게 전체 탭에 노출 가능.
  // '○○ 전체' 옵션 — 상한 25개인 탭에서만 노출(2026.08 재조정): 지역 랭킹·신고가·하락 거래·전용면적 평단가·
  // 연간 저평가(동일 동, 2026.08 25로 상향). 상한 5개인 단기/반기/연간 저평가는 서울(25)조차 다 못 담아서
  // '전체' 버튼 자체가 실효성 없다고 판단해 제외(수민 요청) — 개별 구를 여러 개 골라 담는 칩 방식(최대 5개)은 그대로 지원.
  const supportsAllScopeOption = (m==='region'||m==='longpeakdong'||m==='newhigh'||m==='newlow'||m==='pyprice');
  [...sel.options].forEach(o=>{ if(o.dataset && o.dataset.scope==='all') o.hidden = !supportsAllScopeOption; });
  if(!supportsAllScopeOption && isAllScope(sel.value)){
    const first = lawdsOfScope(sel.value)[0];
    if(first) sel.value = first.lawd;
  }
  // 모든 탭이 선택 지역을 공유·고정 기억한다(2026.08 변경) — 탭을 넘나들어도 regionSel/sel.value를 그대로 유지.
  // 단, 지역 선택 방식이 탭마다 다르다: 지역랭킹·저평가 3탭·신고가는 칩(regionSel, 복수), 단지분석·단지비교·거래량·등락은 단일 셀렉트(sel.value) —
  // 그동안 이 둘을 서로 이어주는 로직이 없어서 한쪽에서 고른 지역이 다른 쪽 탭엔 전혀 안 보이는 문제가 있었음(2026.08 수정).
  const multiModes = ['region','shortval','peak','longpeak','newhigh','newlow','pyprice'];
  const maxNow = regionSelMax();
  if(regionSel.length > maxNow){ regionSel = regionSel.slice(0, maxNow); saveRegionSel(); }
  if(multiModes.includes(m)){
    // 칩이 비어있고 단일 셀렉트 쪽에 지역이 있으면 그걸 첫 칩으로 이어받는다
    if(!regionSel.length && sel.value && !isAllScope(sel.value)) addRegion(sel.value);
  } else {
    // 싱글 전용 탭(단지분석·단지비교·거래량·등락) 진입 시 셀렉트가 비어있고 칩이 있으면 그 중 첫 지역을 이어받는다
    if(!sel.value && regionSel.length) sel.value = regionSel[0].lawd;
    if(!sel.value){
      sel.value = (lastRegionPref && [...sel.options].some(o=>o.value===lastRegionPref)) ? lastRegionPref : '';
    }
  }
  renderRegionChips();
  // 평형 다중 선택 UI — 2026.08부터 평형 선택 있는 탭 전부(region/volume/updown/gap/newhigh/newlow/pyprice)
  // 공통으로 이 체크박스 패널을 쓴다(예전엔 region/volume/updown/gap은 단일 select였음).
  document.getElementById('pyBandMultiWrap').style.display = (m==='region'||m==='volume'||m==='updown'||m==='gap'||m==='newhigh'||m==='newlow'||m==='pyprice') ? '' : 'none';
  document.getElementById('pyBandMultiPanel').style.display = 'none';
  // 지역 랭킹만 마지막 선택을 기억(없으면 32~36평 디폴트), 나머지는 재진입 시 항상 "전체 평형"으로 시작
  pyBandMultiSel = m==='region' ? (getPyBandMultiPref() ?? ['32-36']) : [];
  renderPyBandMultiBtn();
  document.getElementById('buildYear').style.display = (m==='region'||m==='volume'||m==='updown'||m==='newhigh'||m==='newlow'||m==='pyprice') ? '' : 'none';
  document.getElementById('floorMin').style.display = (m==='region'||m==='volume'||m==='updown'||m==='peak'||m==='longpeak'||m==='longpeakdong'||m==='newhigh'||m==='newlow'||m==='pyprice'||m==='shortval'||m==='gap'||m==='subway') ? 'none' : '';
  document.getElementById('monthsN').style.display = (m==='updown'||m==='peak'||m==='longpeak'||m==='longpeakdong'||m==='newhigh'||m==='newlow'||m==='pyprice'||m==='shortval'||m==='gap'||m==='subway') ? 'none' : '';
  document.getElementById('subwayRow').style.display = m==='subway' ? '' : 'none';
  // 탭별 디폴트: 단지분석·단지비교·지역랭킹은 2년, 거래량은 1년 · 모든 탭 전체 층 (지역랭킹만 32~36평 기본 적용, 거래량·등락·저평가·신고가는 전체 평형)
  document.getElementById('monthsN').value = (m==='region'||m==='complex'||m==='compare') ? '24' : '12';
  document.getElementById('floorMin').value = '0';
  document.getElementById('btn').textContent = m==='complex' ? '분석' : (m==='compare' ? '비교 분석' : (m==='subway' ? '검색' : ((m==='updown'||m==='peak'||m==='longpeak'||m==='shortval') ? '등락 조회' : '랭킹 조회')));
  if(m==='compare'){
    if(!document.querySelector('.cmp-row')){ addCmpRow(); addCmpRow(); }
    else document.querySelectorAll('.cmp-row').forEach(r=>{
      // 단지명을 아직 안 적은(비어있는) 행만 최신 지역으로 갱신 — 이미 입력한 행은 건드리지 않음
      if(!r.querySelector('input').value.trim()) r.querySelector('select').value = sel.value;
    });
  }
}

function regionSelectHTML(){
  // 메인 지역 select(#lawd)에는 빈 값용 플레이스홀더 옵션("지역을 선택하세요")이 있는데
  // 비교 탭 행의 select는 REGIONS만으로 만들어져 그 옵션이 없었음 — sel.value가 ''일 때

(function cleanupOldCache(){

const monthCache = {}; // lawd → { ym: {t, items} }

const STALE_RETRY_TTL_MS = 604800000; // 과거월이 0건이 아니어도(=거래는 있었지만) 캐시가 7일 넘게 지났으면 한 번 재확인 (2026.07 추가 — 조회 시점엔 일부만 신고돼 있다가 나중에 추가·정정 신고되는 경우, "4개월 신선 구간"을 벗어난 뒤엔 영구 고정돼 못 잡던 문제 보완. 재확인 후 캐시 시각(t)이 갱신되므로 이후 다시 7일 주기로 반복 확인됨(완전한 1회성은 아님) — 신고 지연이 통상 며칠~한 달 단위라 7일이면 대부분 커버되면서도 과도한 재호출은 피하는 절충)
function lastMonthsYm(n){
  // ⚠️ day=31(등 말일)인 채로 setMonth(-1)을 반복하면, 다음 달 일수가 31일보다 적을 때
  // JS Date가 그 다음 달로 자동 이월돼버려 같은 달이 중복 생성되는 버그가 있었음
  // (예: 7/31 → setMonth(6-1=5,June) 했는데 6월엔 31일이 없어서 7/1로 튕겨나감 → 다음 반복에서 7월이 또 나옴).
  // 매달 29~31일에 재현되며, 실제로 이 중복 때문에 API 요청 개월수 범위가 한 달씩 밀리고 불필요한 중복 조회가 발생했음(2026.07 발견·수정).
  // → 첫 반복 이후 day를 1로 고정해서 이월 자체가 안 생기게 함(1일은 어떤 달에서 빼도 항상 유효).
  const out=[]; const d=new Date();
  for(let i=0;i<n;i++){
    out.push(`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}`);
    if(i===0) d.setDate(1);
    d.setMonth(d.getMonth()-1);
  }
  return out; // 최신→과거
}

const LS_FIELDS = ['apt','umd','area','py','amt','ym','d','floor','build','direct'];
const lsLoaded = {};

    for(const [ym, e] of Object.entries(raw)){

function lsSave(lawd){

    try{

// 월 샤드(chunks)를 한 번에 다 병렬로 쏘지 않고 최대 CHUNK_CONCURRENCY개씩만 동시에 요청 —
// 다른 탭은 2년치(3개 조각), 신고가 탭은 3년치(최대 4개 조각, 2026.07 5년→3년으로 축소)라
// 완전 병렬이면 국토부 API·Netlify 함수에 순간적으로 동시 요청이 몰려 레이트리밋·타임아웃 위험이 있음(2026.07).
// 4로 잡아서 신고가의 4개 조각은 한 번에(1라운드), 그 이상 조각이 필요한 경우(복수 지역 조회 등)만 여러 라운드로 나눔.
const CHUNK_CONCURRENCY = 4;
async function fetchChunksLimited(chunks, fetchFn, lawd){
  const results = [];
  for(let i=0; i<chunks.length; i+=CHUNK_CONCURRENCY){
    const batch = chunks.slice(i, i+CHUNK_CONCURRENCY);
    results.push(...await Promise.all(batch.map(c=>fetchFn(lawd, c))));
  }
  return results;
}

async function ensureMonths(lawd, n){
  lsLoad(lawd);
  const yms = lastMonthsYm(n);
  const cache = monthCache[lawd] = monthCache[lawd] || {};
  const now = Date.now();
  const fresh = new Set(yms.slice(0,4)); // 최신 4개월: 1시간 TTL (2026.07 2→4개월 확대 — 국토부 신고기한(최대 30일)으로 실거래가 계약월보다 늦게, 심지어 다다음달에도 뒤늦게 등록되는 경우가 있어 2개월로는 놓치는 경우 발생. "저평가" 탭처럼 과거월 최고가를 고정값으로 쓰는 계산은 뒤늦게 반영된 신고가를 못 따라잡을 수 있어 확대)
  // 과거월이라도 캐시된 결과가 0건이면 API 일시 오류(레이트리밋 등)로 빈 캐시가 영구 박제될 수 있으므로
  // 30분 경과 시 한 번 더 재확인한다. 실제로 거래가 없는 달은 다시 0건으로 채워질 뿐이라 안전하다.
  // 0건이 아니어도(거래는 있었지만 조회 시점엔 일부만 신고돼 있던 경우) 7일 지나면 한 번 더 재확인
  const missing = yms.filter(ym =>
    !cache[ym] ||
    (fresh.has(ym) && now - cache[ym].t > FRESH_TTL_MS) ||
    (cache[ym].items.length === 0 && now - cache[ym].t > EMPTY_RETRY_TTL_MS) ||
    (!fresh.has(ym) && cache[ym].items.length > 0 && now - cache[ym].t > STALE_RETRY_TTL_MS)
  );
  if(missing.length){
    // CDN 캐시 효율: 최신월 요청과 과거월 요청 분리 (과거월 샤드는 30일 캐시 대상)
    const freshMs = missing.filter(ym => fresh.has(ym));
    const stableMs = missing.filter(ym => !fresh.has(ym));
    const chunks = [];
    if(freshMs.length) chunks.push(freshMs);
    for(let i=0;i<stableMs.length;i+=12) chunks.push(stableMs.slice(i,i+12));
    const results = await fetchChunksLimited(chunks, postFetch, lawd);
    chunks.forEach(c => c.forEach(ym => { cache[ym] = {t: now, items: []}; }));
    results.flat().forEach(t => { if(cache[t.ym]) cache[t.ym].items.push(t); });
    lsSave(lawd);
  }
  return yms.flatMap(ym => cache[ym] ? cache[ym].items : []);
}
