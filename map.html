<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>아파트썸 | 단지 지도 탐색</title>
  <meta name="description" content="아파트썸 단지 가격 지도에서 지역과 조건별 아파트를 찾아보세요.">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
  <style>
    :root{--navy:#0F2B3D;--teal:#00828A;--teal-dark:#00565C;--soft:#E0F2F3;--line:#D9E4E8;--ink:#1E293B;--sub:#64748B;--red:#DC2626;--blue:#2563EB;--yellow:#F5B400}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:'Noto Sans KR',sans-serif;background:#F1F5F9;color:var(--ink)}
    body{overflow:hidden}.shell{max-width:1180px;height:100dvh;margin:0 auto;background:#fff;display:flex;flex-direction:column;box-shadow:0 0 26px #0f2b3d12}
    header{height:58px;flex:none;padding:9px 18px;background:linear-gradient(120deg,#102D3F,#17394B);color:#fff;display:flex;align-items:center;gap:11px}
    header a{color:#fff;text-decoration:none;display:flex;align-items:center;gap:8px;font-weight:900;font-size:18px}header small{color:#B7CBD5;font-size:11px;font-weight:500}
    .head-link{margin-left:auto;color:#D5E6EC;text-decoration:none;font-size:12px;border:1px solid #ffffff44;border-radius:8px;padding:6px 9px}
    .workspace{min-height:0;flex:1;display:grid;grid-template-columns:340px 1fr}.panel{min-width:0;overflow:auto;padding:14px;border-right:1px solid var(--line);background:#F8FBFC}.map-wrap{position:relative;min-width:0;min-height:0;background:#E8F0F2}.map{position:absolute;inset:0}
    .card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:12px;margin-bottom:10px;box-shadow:0 2px 10px #0f2b3d0b}.card h1{font-size:18px;margin:0 0 4px;color:var(--navy)}.muted{color:var(--sub);font-size:11px;line-height:1.6}
    label{display:block;margin:9px 0 4px;color:var(--sub);font-size:11px;font-weight:700}input,select{width:100%;min-height:36px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font:inherit;font-size:12px}input:focus,select:focus{outline:2px solid #A8E0E4;outline-offset:1px}
    .row{display:flex;gap:6px}.row>*{flex:1;min-width:0}.actions{display:flex;gap:6px;margin-top:10px}.btn{border:1px solid var(--line);border-radius:8px;padding:8px 9px;background:#fff;color:var(--navy);font:inherit;font-size:11px;font-weight:800;cursor:pointer}.btn.primary{flex:1;background:var(--teal);color:#fff;border-color:var(--teal)}.btn.active{background:var(--soft);border-color:#73C9CD;color:var(--teal-dark)}
    .layers{display:grid;grid-template-columns:1fr 1fr;gap:6px}.layers .btn{width:100%;text-align:center}.legend{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;font-size:10px;color:var(--sub)}.legend span{display:inline-flex;align-items:center;gap:4px}.dot{width:9px;height:9px;border-radius:50%;display:inline-block}.count{font-size:11px;font-weight:800;color:var(--teal-dark);margin-top:10px}.result-list{display:grid;gap:6px;margin-top:10px}.result-item{width:100%;padding:9px;text-align:left;border:1px solid var(--line);border-radius:9px;background:#fff;cursor:pointer}.result-item:hover,.result-item:focus{border-color:#73C9CD;background:#F2FBFB;outline:none}.result-item b{display:block;color:var(--navy);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.result-item span{display:block;color:var(--sub);font-size:10px;margin-top:2px}.empty{padding:16px 5px;color:var(--sub);font-size:11px;text-align:center}
    .price-marker{min-width:46px;padding:4px 6px;border:2px solid #fff;border-radius:14px;background:var(--teal);box-shadow:0 2px 6px #0f2b3d55;color:#fff;text-align:center;font:900 10px/1.15 'Noto Sans KR',sans-serif;white-space:nowrap;cursor:pointer}.price-marker.high{background:var(--red)}.price-marker.low{background:var(--blue)}.price-marker.empty{background:#64748B}.price-marker small{display:block;font-size:8px;font-weight:500;opacity:.86}.info-window{min-width:190px;max-width:250px;padding:10px 11px;background:#fff;border:1px solid var(--teal);border-radius:10px;box-shadow:0 3px 12px #0f2b3d33;font-size:11px;line-height:1.45}.info-window b{display:block;color:var(--navy);font-size:13px;margin-bottom:3px}.info-window .price{font-weight:900;color:var(--teal-dark);font-size:15px}.info-window button{margin-top:7px;border:0;border-radius:7px;padding:6px 8px;background:var(--teal);color:#fff;font:inherit;font-weight:800;cursor:pointer}.map-tip{position:absolute;left:12px;bottom:12px;padding:7px 9px;border-radius:8px;background:#ffffffec;color:var(--sub);font-size:10px;box-shadow:0 2px 7px #0f2b3d22;pointer-events:none}.loading{position:absolute;inset:0;display:grid;place-items:center;background:#ffffffb8;color:var(--teal-dark);font-size:13px;font-weight:800;z-index:4}.loading[hidden]{display:none}
    @media(max-width:700px){body{overflow:auto}.shell{height:100dvh}.workspace{display:flex;flex-direction:column}.panel{height:49dvh;flex:none;order:2;border-right:0;border-top:1px solid var(--line);padding:10px}.map-wrap{height:51dvh;flex:none;order:1}.map{inset:0}header{height:52px;padding:8px 12px}header a{font-size:16px}.head-link{font-size:10px;padding:5px 7px}.card{padding:10px;margin-bottom:8px}.card h1{font-size:16px}.result-list{grid-template-columns:1fr 1fr}.result-item{padding:8px}.layers{grid-template-columns:repeat(4,1fr)}.layers .btn{padding:7px 3px;font-size:10px}}
  </style>
</head>
<body>
<div class="shell">
  <header><a href="./index.html" aria-label="아파트썸 메인으로 돌아가기"><svg width="23" height="23" viewBox="0 0 28 28" aria-hidden="true"><rect x="2" y="15" width="5" height="11" rx="1" fill="#83D1D2" opacity=".55"/><rect x="11" y="9" width="5" height="17" rx="1" fill="#83D1D2" opacity=".8"/><rect x="20" y="2" width="5" height="24" rx="1" fill="#83D1D2"/></svg>아파트썸</a><small>단지 지도 탐색</small><a class="head-link" href="./index.html?m=complex">기존 분석 탭</a></header>
  <main class="workspace">
    <aside class="panel" aria-label="지도 필터와 단지 목록">
      <section class="card"><h1>단지 찾기</h1><p class="muted">지도에서 단지를 누르면 기존 단지분석 상세 화면으로 연결됩니다.</p>
        <label for="region">지역</label><select id="region"><option value="11710">송파구</option></select>
        <label for="query">단지 검색</label><input id="query" type="search" placeholder="단지명·동 검색" autocomplete="off">
        <div class="row"><div><label for="priceMin">가격 최소 (억)</label><input id="priceMin" type="number" min="0" step="0.1" placeholder="0"></div><div><label for="priceMax">가격 최대 (억)</label><input id="priceMax" type="number" min="0" step="0.1" placeholder="무제한"></div></div>
        <div class="row"><div><label for="py">평형</label><select id="py"><option value="">전체 평형</option><option value="20">20평대</option><option value="30">30평대</option><option value="40">40평대</option><option value="50">50평 이상</option></select></div><div><label for="age">연식</label><select id="age"><option value="">전체 연식</option><option value="5">신축 5년 이내</option><option value="10">10년 이내</option><option value="20">20년 이내</option></select></div></div>
        <div class="actions"><button class="btn primary" id="apply" type="button">조건 적용</button><button class="btn" id="reset" type="button">초기화</button></div>
      </section>
      <section class="card"><h1 style="font-size:14px">지도 레이어</h1><div class="layers"><button class="btn active" data-layer="price" type="button">가격</button><button class="btn" data-layer="high" type="button">신고가</button><button class="btn" data-layer="low" type="button">저평가</button><button class="btn" data-layer="traffic" type="button">교통</button></div><div class="legend"><span><i class="dot" style="background:#00828A"></i>일반</span><span><i class="dot" style="background:#DC2626"></i>신고가 후보</span><span><i class="dot" style="background:#2563EB"></i>저평가 후보</span></div></section>
      <section class="card"><div class="count" id="count">단지를 불러오는 중…</div><div class="result-list" id="list"></div></section>
    </aside>
    <section class="map-wrap"><div id="map" class="map" aria-label="단지 가격 지도"></div><div class="loading" id="loading">지도와 단지 자료를 불러오는 중…</div><div class="map-tip">마커를 누르면 단지 상세 분석으로 이동합니다</div></section>
  </main>
</div>
<script>
  const state={maps:null,map:null,region:'11710',all:[],visible:[],layer:'price',markers:[],overlays:[],info:null,config:null};
  const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const valid=x=>Number.isFinite(+x.lat)&&Number.isFinite(+x.lng)&&+x.lat>=25&&+x.lat<=45&&+x.lng>=120&&+x.lng<=135;
  const compactPrice=v=>v>0?(v>=10?v.toFixed(1):v.toFixed(1))+'억':'가격 없음';
  function latestChange(data,name,umd){const months=Object.keys(data?.all||{}).sort().reverse();for(const ym of months){const row=(data.all[ym]||[]).find(x=>x.name===name&&(!umd||x.umd===umd)&&Number(x.currentPrice)>0);if(row)return {...row,ym};}return null;}
  function yearFromUseDate(v){const n=String(v||'').slice(0,4);return /^19|^20/.test(n)?+n:null;}
  function uniqueRegions(entries){const m=new Map(entries.map(x=>[x.lawd,x.region]).filter(x=>x[0]&&x[1]));return [...m].sort((a,b)=>a[1].localeCompare(b[1],'ko')).map(([value,label])=>({value,label}));}
  async function loadRegion(lawd){
    state.region=lawd; const [near,hh,change]=await Promise.all([fetch(`/data/nearby-schools/${encodeURIComponent(lawd)}.json`).then(r=>r.ok?r.json():{items:[]}),fetch(`/data/hhcnt/${encodeURIComponent(lawd)}.json`).then(r=>r.ok?r.json():{items:[]}),fetch(`/data/regional-change-details/${encodeURIComponent(lawd)}.json`).then(r=>r.ok?r.json():{all:{}})]);
    const hhMap=new Map((hh.items||[]).map(x=>[x.name,x]));
    state.all=(near.items||[]).filter(valid).map(x=>{const h=hhMap.get(x.name)||{};const c=latestChange(change,x.name,x.umd);const py=c?.py||0;const price=c?.currentPrice&&py?c.currentPrice*py:0;const rate=Number(c?.rate)||0;const built=yearFromUseDate(h.useDate);return {...x,price,py,rate,built,hhcnt:Number(h.hhcnt)||Number(x.hh)||0,subwayLines:h.subwayLines||[],region:document.querySelector('#region option:checked')?.textContent||''};});
    applyFilters();
  }
  function applyFilters(){const q=$('query').value.trim().replace(/\s/g,'').toLowerCase(),min=Number($('priceMin').value)||0,max=Number($('priceMax').value)||Infinity,py=Number($('py').value)||0,age=Number($('age').value)||0,now=new Date().getFullYear();state.visible=state.all.filter(x=>(!q||(x.name+x.umd).replace(/\s/g,'').toLowerCase().includes(q))&&x.price>=min&&x.price<=max&&(!py||x.py>=py&&x.py<py+10)&&(!age||(!x.built||now-x.built<=age)));renderMap();renderList();}
  function clearMap(){state.markers.forEach(x=>x.setMap(null));state.overlays.forEach(x=>x.setMap(null));state.markers=[];state.overlays=[];if(state.info){state.info.setMap(null);state.info=null;}}
  function markerClass(x){if(state.layer==='high'&&x.rate<=0)return 'empty';if(state.layer==='low'&&x.rate>-5)return 'empty';return state.layer==='high'?'high':state.layer==='low'?'low':'';}
  function openInfo(x){if(state.info)state.info.setMap(null);const el=document.createElement('div');el.className='info-window';el.innerHTML=`<b>${esc(x.name)}</b><span>${esc(x.umd)} · ${x.hhcnt?x.hhcnt.toLocaleString()+'세대':'세대수 미상'}</span><br><span class="price">${compactPrice(x.price)}</span>${x.py?` <span>${x.py}평 기준</span>`:''}${x.rate?`<br><span style="color:${x.rate>0?'#DC2626':'#2563EB'}">최근 변동 ${x.rate>0?'▲':'▼'} ${Math.abs(x.rate).toFixed(1)}%</span>`:''}<button type="button">단지분석 상세 보기 →</button>`;el.querySelector('button').onclick=()=>location.href=`./index.html?m=complex&r=${encodeURIComponent(state.region)}&q=${encodeURIComponent(x.name)}`;state.info=new state.maps.CustomOverlay({map:state.map,position:new state.maps.LatLng(x.lat,x.lng),content:el,yAnchor:1.25,zIndex:20});}
  function renderMap(){if(!state.map||!state.maps)return;clearMap();const bounds=new state.maps.LatLngBounds();for(const x of state.visible){const pos=new state.maps.LatLng(+x.lat,+x.lng);bounds.extend(pos);const marker=document.createElement('button');marker.type='button';marker.className='price-marker '+markerClass(x);marker.innerHTML=`${x.price?compactPrice(x.price):'가격 없음'}<small>${x.name.length>9?esc(x.name.slice(0,8))+'…':esc(x.name)}</small>`;marker.setAttribute('aria-label',`${x.name} ${x.price?compactPrice(x.price):'가격 없음'}`);marker.onclick=()=>openInfo(x);const overlay=new state.maps.CustomOverlay({map:state.map,position:pos,content:marker,yAnchor:1,zIndex:3});state.overlays.push(overlay);}if(state.visible.length)state.map.setBounds(bounds,35,35,35,35);}
  function renderList(){$('count').textContent=`${state.visible.length.toLocaleString()}개 단지 · ${state.layer==='high'?'신고가 후보':state.layer==='low'?'저평가 후보':'현재 조건'}`;$('list').innerHTML=state.visible.slice(0,80).map((x,i)=>`<button type="button" class="result-item" data-index="${i}"><b>${esc(x.name)}</b><span>${esc(x.umd)} · ${x.price?compactPrice(x.price):'가격 없음'}${x.py?` · ${x.py}평`:''}</span></button>`).join('')||'<div class="empty">조건에 맞는 단지가 없습니다.</div>';$('list').querySelectorAll('[data-index]').forEach(b=>b.onclick=()=>{const x=state.visible[+b.dataset.index];state.map.setCenter(new state.maps.LatLng(x.lat,x.lng));state.map.setLevel(4);openInfo(x);});}
  async function loadSDK(){const config=await fetch('/data/map-config.json').then(r=>r.json());if(!/^[a-f0-9]{32}$/i.test(config.kakaoJavaScriptKey||''))throw Error('map key');return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=`https://dapi.kakao.com/v2/maps/sdk.js?appkey=${encodeURIComponent(config.kakaoJavaScriptKey)}&autoload=false`;s.onload=()=>window.kakao.maps.load(()=>resolve(window.kakao.maps));s.onerror=reject;document.head.append(s);});}
  async function init(){try{const entries=await fetch('/data/complex-index.json').then(r=>r.json()).then(x=>x.entries||[]);const regions=uniqueRegions(entries);$('region').innerHTML=regions.map(x=>`<option value="${esc(x.value)}" ${x.value==='11710'?'selected':''}>${esc(x.label)}</option>`).join('');state.maps=await loadSDK();state.map=new state.maps.Map($('map'),{center:new state.maps.LatLng(37.514,127.105),level:7});state.map.addControl(new state.maps.ZoomControl(),state.maps.ControlPosition.RIGHT);await loadRegion($('region').value);$('loading').hidden=true;}catch(e){$('loading').textContent='지도를 불러오지 못했습니다. 카카오 지도 키와 도메인 설정을 확인해 주세요.';}}
  $('apply').onclick=applyFilters;$('reset').onclick=()=>{$('query').value='';$('priceMin').value='';$('priceMax').value='';$('py').value='';$('age').value='';applyFilters();};$('region').onchange=()=>{ $('loading').hidden=false;loadRegion($('region').value).finally(()=>{$('loading').hidden=true;});};$('query').oninput=()=>applyFilters();document.querySelectorAll('[data-layer]').forEach(b=>b.onclick=()=>{state.layer=b.dataset.layer;document.querySelectorAll('[data-layer]').forEach(x=>x.classList.toggle('active',x===b));if(state.layer==='traffic'){if(state.map)state.map.addOverlayMapTypeId(state.maps.MapTypeId.TRAFFIC);}else if(state.map)state.map.removeOverlayMapTypeId(state.maps.MapTypeId.TRAFFIC);applyFilters();});
  init();
</script>
</body>
</html>
