<style>
:root{--navy:#102d3f;--teal:#00828a;--dark:#00565c;--aqua:#83d1d2;--ink:#17283b;--sub:#687c95;--line:#dfe6ef;--soft:#f0f5fa;--pale:#f0fafb}*{box-sizing:border-box}body{margin:0;background:var(--soft);color:var(--ink);font-family:'Noto Sans KR',sans-serif;font-size:14px}.wrap{max-width:760px;margin:auto;padding:12px 16px 50px}header{margin:10px 0 14px!important;padding:10px 54px!important;text-align:center;background:linear-gradient(120deg,#102d3f,#17394b);border:1px solid #ffffff1f;border-radius:17px;box-shadow:0 8px 22px #0f2b3d1a;position:relative;color:white}.logo{display:inline-flex;align-items:center;gap:11px;color:#fff;text-align:left}.brand-mark{flex:none;width:27px;height:27px;color:#83d1d2}.brand-copy{display:flex;flex-direction:column;gap:1px;text-align:left}.brand-name{font-weight:700;font-size:21px;line-height:1.35;letter-spacing:-.8px}.brand-description{font-weight:500;font-size:10.5px;line-height:1.6;letter-spacing:.3px;color:#b7cbd5}.analysis-back{display:flex;position:absolute;left:15px;top:50%;transform:translateY(-50%);color:#fff!important;text-decoration:none!important;width:36px;height:36px;border:1px solid #ffffff59;border-radius:10px;background:#ffffff1f;align-items:center;justify-content:center}.header-share{position:absolute;top:50%;right:15px;transform:translateY(-50%);padding:0;background:#ffffff0a;border:1px solid #ffffff33;border-radius:10px;width:36px;height:36px;color:#d5e6ec;cursor:pointer;display:flex;align-items:center;justify-content:center}.header-share svg{display:block;width:18px;height:18px}.mode-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.mode-tabs button,.chip{font:inherit;font-weight:700;cursor:pointer}.mode-tabs button{padding:11px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--dark)}.mode-tabs button[aria-pressed=true]{border-color:var(--teal);background:var(--teal);color:#fff}.panel{margin:12px 0;padding:16px;background:#fff;border:1px solid var(--line);border-radius: nd:#e0b84d}.bar-item.selected .bar-value,.bar-item.selected .bar-month{color:#8a6d1f;font-weight:900}.bar-month{padding-bottom:5px;color:var(--sub);font-size:10px}.list-head{display:flex;justify-content:space-between;align-items:center;gap:9px;margin-bottom:10px}.list-head .panel-title{margin:0}.search{width:min(220px,52%);height:38px;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit;font-size:12px}.month-group{margin-top:9px;border:1px solid var(--line);border-radius:12px;overflow:hidden}.month-heading{display:flex;justify-content:space-between;gap:8px;padding:10px 12px;background:#f2f8fa;color:var(--dark);font-weight:900}.month-heading small{color:var(--sub);font-size:10px}.project{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:9px;padding:11px 12px;border-top:1px solid #edf1f5}.project-name{font-size:13px;font-weight:800;line-height:1.45;overflow-wrap:anywhere}.project-address{margin-top:3px;color:var(--sub);font-size:11px;line-height:1.5;overflow-wrap:anywhere}.project-meta{display:flex;gap:6px;margin-top:5px}.project-type,.project-region{font-size:10px;color:var(--sub)}.project-units{align-self:center;color:var(--dark);font-size:14px;font-weight:900;white-space:nowrap}.history-table{width:100%;border-collapse:collapse}.history-table th,.history-table td{padding:9px 7px;border-bottom:1px solid var(--line);text-align:right}.history-table th:first-child,.history-table td:first-child{text-align:left}.history-table th{color:var(--sub);font-size:11px}.history-table td:first-child{font-weight:700}.empty,.lock,.status{padding:25px 14px;text-align:center;color:var(--sub);line-height:1.8}.lock{margin:32px auto;max-width:480px;border:1px solid var(--line);border-radius:16px;background:white}.lock a{color:var(--dark);font-weight:800}.note{margin:10px 3px;color:var(--sub);font-size:11px;line-height:1.8}.source{padding-top:9px;border-top:1px solid var(--line);color:var(--sub);font-size:10px;line-height:1.8}.source a{color:var(--dark)}[hidden]{display:none!important}@media(max-width:480px){.wrap{padding:8px 12px 35px}.panel{padding:14px}.region-totals{gap:5px}.region-total{padding:9px 2px}.region-total strong{font-size:13px}.stat-value{font-size:22px}.list-head{align-items:flex-start;flex-direction:column}.search{width:100%}.history-table th,.history-table td{padding:8px 4px;font-size:12px}}
</style></head>
<body><main class="wrap">

<div id="content" hidden><section class="panel"><div id="modeTabs" class="mode-tabs" role="group" aria-label="자료 구분"><button type="button" data-mode="planned" aria-pressed="true">입주 예정</button><button type="button" data-mode="history" aria-pressed="false">과거 준공 실적</button></div><div id="periodLine" class="note"></div><h2 class="panel-title">지역 선택 <small id="regionHint">4개 지역 합계</small></h2><div id="regionChips" class="chips" role="group" aria-label="지역"></div></section>

<section class="panel"><div class="list-head"><h2 id="chartTitle" class="panel-title">연도별 입주 예정 합계</h2><button type="button" id="yearBack" class="chip" hidden>연도별 합계</button></div><div class="chart-scroll"><div id="chart" class="chart"></div></div><p id="chartHint" class="note">연도를 누르면 월별 물량을 확인할 수 있습니다.</p></section>

<section class="panel" id="historyList" hidden><h2 class="panel-title">월별 준공 실적</h2><div id="historyRows"></div></section>
<p id="unknownSummary" class="note"></p><p class="note" id="basisNote"></p><p id="sourceNote" class="source"></p></div>
</main>
<script>
(()=>{const REGIONS=['서울','경기','인천','부산'], $=id=>document.getElementById(id), fmt=n=>Number(n||0).toLocaleString('ko-KR'), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const s={mode:'planned',region:null,yearFocus:null,month:null,items:[],history:[],years:[],histYears:[]};
const regionLabel=()=>s.region||'4개 지역 합계';
function scopedRows(){const source=s.mode==='history'?s.history:s.items;return source.filter(x=>(!s.region||x.region===s.region)&&x.month)}
function render(){const historical=s.mode==='history';document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===s.mode)));$('regionHint').textContent=regionLabel();$('regionChips').innerHTML=REGIONS.map(r=>`<button type="button" class="chip${s.region===r?' on':''}" aria-pressed="${s.region===r}" data-region="${r}">${r}</button>`).join('');$('regionChips').querySelectorAll('[data-region]').forEach(b=>b.onclick=()=>{s.region=s.region===b.dataset.region?null:b.dataset.region;s.yearFocus=null;s.month=null;render()});const rows=scopedRows(),years=[...new Set(rows.map(x=>x.month.slice(0,4)))].sort(),annualMode=!s.yearFocus;const displayed=annualMode?rows:rows.filter(x=>x.month.startsWith(s.yearFocus));const chartKeys=annualMode?years:[...new Set(displayed.map(x=>x.month))].sort();const chartValues=new Map(chartKeys.map(k=>[k,0]));rows.forEach(x=>{const key=annualMode?x.month.slice(0,4):x.month;if(chartValues.has(key))chartValues.set(key,chartValues.get(key)+x.households)});const detailRows=displayed.filter(x=>!s.month||x.month===s.month);const total=detailRows.reduce((n,x)=>n+x.households,0);
$('totalUnits').textContent=fmt(total);$('complexCount').textContent=fmt(detailRows.length);$('countUnit').textContent=historical?'개월·지역':'개 단지';$('totalLabel').textContent=historical?(s.yearFocus?`${s.yearFocus}년 준공 실적`:'전체 기간 준공 실적'):(s.yearFocus?`${s.yearFocus}년 입주 예정 합계`:'조회 기간 입주 예정 합계');$('countLabel').textContent=historical?'월별 자료 행':'입주 예정 단지';$('chartTitle').textContent=annualMode?`연도별 ${historical?'아파트 준공 실적':'입주 예정 합계'} · ${regionLabel()}`:`${s.yearFocus}년 월별 ${historical?'아파트 준공 실적':'입주 예정'} · ${regionLabel()}`;$('yearBack').hidden=annualMode;$('chartHint').textContent=annualMode?'연도를 누르면 해당 연도의 월별 물량을 확인할 수 있습니다.':s.month?`${s.month} 자료 선택됨 · 월을 다시 누르면 선택 해제`:'월을 누르면 해당 월의 상세 자료를 확인할 수 있습니다.';
const max=Math.max(1,...chartValues.values());$('chart').style.gridTemplateColumns=`repeat(${chartKeys.length},minmax(36px,1fr))`;$('chart').style.minWidth=Math.max(460,chartKeys.length*42)+'px';$('chart').innerHTML=chartKeys.map(key=>{const v=chartValues.get(key)||0,h=v?Math.max(3,v/max*100):1,label=annualMode?`${key}년`:Number(key.slice(5))+'월',selected=!annualMode&&s.month===key;return `<button type="button" class="bar-item${selected?' selected':''}" data-chart-key="${key}" aria-pressed="${selected}" aria-label="${label} ${historical?'준공':'입주 예정'} ${fmt(v)}세대"><span class="bar-value">${v?fmt(v):''}</span><span class="bar" style="height:${h}%"></span><span class="bar-month">${label}</span></button>`}).join('');$('chart').querySelectorAll('[data-chart-key]').forEach(b=>b.onclick=()=>{if(annualMode){s.yearFocus=b.dataset.chartKey;s.month=null}else{s.month=s.month===b.dataset.chartKey?null:b.dataset.chartKey}render()});$('yearBack').onclick=()=>{s.yearFocus=null;s.month=null;render()};
$('plannedList').hidden=historical||annualMode;$('historyList').hidden=!historical||annualMode;$('unknownSummary').hidden=historical||annualMode;$('basisNote').textContent=historical?'과거 실적은 실제 이사 날짜가 아니라 국토교통부 월별 아파트 준공 실적(사용검사 기준)입니다. 최근 통계는 잠정치이며 추후 수정될 수 있습니다.':'입주예정월 기준 30세대 이상 공동주택입니다. 공개 자료의 예정 일정은 변경될 수 있습니다.';
if(historical&&!annualMode){const selectedRows=detailRows,months=[...new Set(selectedRows.map(x=>x.month))].sort().reverse(),shownRegions=s.region?[s.region]:REGIONS;$('historyRows').innerHTML=`<table class="history-table"><thead><tr><th>월</th>${shownRegions.map(r=>`<th>${r}</th>`).join('')}<th>합계</th></tr></thead><tbody>${months.map(m=>{const ar=selectedRows.filter(x=>x.month===m),vals=shownRegions.map(r=>ar.find(x=>x.region===r)?.households||0);return `<tr><td>${m}</td>${vals.map(v=>`<td>${v?fmt(v):'—'}</td>`).join('')}<td><b>${fmt(vals.reduce((a,b)=>a+b,0))}</b></td></tr>`}).join('')}</tbody></table>`}
if(!historical&&!annualMode){const undated=s.items.filter(x=>(!s.region||x.region===s.region)&&!x.month),query=$('search').value.trim().toLocaleLowerCase('ko-KR'),visible=[...s.items.filter(x=>(!s.region||x.region===s.region)&&x.month?.startsWith(s.yearFocus)),...undated].filter(x=>(!s.month||x.month===s.month)&&(!query||`${x.name} ${x.address}`.toLocaleLowerCase('ko-KR').includes(query))).sort((a,b)=>(a.month||'9999-99').localeCompare(b.month||'9999-99')||b.households-a.households||a.name.localeCompare(b.name,'ko'));$('unknownSummary').textContent=undated.length?`입주월 미정 ${fmt(undated.length)}개 단지 · ${fmt(undated.reduce((n,x)=>n+x.households,0))}세대 (연도별 그래프에서 제외)`:'입주월 미정 자료 없음';$('listTitle').textContent=s.month?`${s.month} 입주 예정 단지`:`${s.yearFocus}년 입주 예정 단지`;const groups=new Map();visible.forEach(x=>{const k=x.month||'미정';if(!groups.has(k))groups.set(k,[]);groups.get(k).push(x)});$('projects').innerHTML=groups.size?[...groups].map(([m,a])=>`<section class="month-group"><div class="month-heading"><span>${m==='미정'?'입주월 미정':m+'월'}</span><small>${fmt(a.reduce((n,x)=>n+x.households,0))}세대 · ${fmt(a.length)}개 단지</small></div>${a.map(x=>`<article class="project"><div><div class="project-name">${esc(x.name)}</div><div class="project-address">${esc(x.address)}</div><div class="project-meta"><span class="project-type">${esc(x.type||'공동주택')}</span><span class="project-region">${esc(x.region)}</span></div></div><div class="project-units">${fmt(x.households)}세대</div></article>`).join('')}</section>`).join(''):'<div class="empty">조건에 맞는 입주 예정 단지가 없습니다.</div>'}}
async function init(){try{const session=await window.aptsumSession.check();if(!session.ok){$('loading').hidden=true;$('locked').hidden=false;return}const access=await session.json();if(access.subscribed!==true||access.master!==true){$('loading').hidden=true;$('locked').hidden=false;return}const response=await fetch('/data/move-in.json',{cache:'no-cache'});if(!response.ok)throw Error();const d=await response.json();s.items=(d.items||[]).filter(x=>REGIONS.includes(x.region)&&Number.isFinite(x.households)&&x.households>=30);s.history=(d.history||[]).filter(x=>REGIONS.includes(x.region)&&Number.isFinite(x.households));s.years=[...new Set(s.items.map(x=>x.month?.slice(0,4)).filter(Boolean))].sort();s.histYears=[...new Set(s.history.map(x=>x.month.slice(0,4)))].sort();if(!s.years.length||!s.histYears.length)throw Error('입주물량 자료를 불러오지 못했습니다.');$('periodLine').textContent=`과거 준공 실적 ${s.histYears[0]}~${s.histYears.at(-1)} · 입주 예정 ${s.years[0]}~${s.years.at(-1)} · 서울·경기·인천·부산`;$('sourceNote').innerHTML=`예정 출처: <a href="https://www.data.go.kr/data/15111714/fileData.do" target="_blank" rel="noopener">한국부동산원·부동산R114 공동주택 입주예정물량</a> (기준일 ${esc(d.sourceAsOf||'확인 필요')}, 반기 갱신)<br>과거 출처: <a href="${esc(d.historicalSourceUrl||'https://stat.molit.go.kr/portal/cate/statView.do?hRsId=468')}" target="_blank" rel="noopener">국토교통부 주택건설실적통계(준공)</a> (최신월 ${esc(d.historicalAsOf||'확인 중')}, 월간 갱신)`;$('loading').hidden=true;$('content').hidden=false;$('modeTabs').onclick=e=>{const b=e.target.closest('[data-mode]');if(!b)return;s.mode=b.dataset.mode;s.yearFocus=null;s.month=null;render()};$('search').addEventListener('input',render);$('sharePage').onclick=async()=>{try{if(navigator.share)await navigator.share({title:document.title,url:location.href});else await navigator.clipboard.writeText(location.href)}catch{}};render()}catch{$('loading').textContent='입주물량 자료를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.'}}
init()})();
</script></body></html>
