<!doctype html>
<html lang="ko">

<title>아파트썸 | 입주물량</title><link rel="icon" type="image/svg+xml" href="/assets/favicon.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="/assets/page-header.css"><script src="/assets/subscriber-session.js?v=1"></script>
<style>
:root{--navy:#102d3f;--teal:#00828a;--dark:#00565c;--aqua:#83d1d2;--ink:#17283b;--sub:#687c95;--line:#dfe6ef;--soft:#f0f5fa;--pale:#f0fafb}*{box-sizing:border-box}body{margin:0;background:var(--soft);color:var(--ink);font-family:'Noto Sans KR',sans-serif;font-size:14px}.wrap{max-width:760px;margin:auto;padding:12px 16px 50px}header{margin:10px 0 14px!important}.mode-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.mode-tabs button,.chip{font:inherit;font-weight:700;cursor:pointer}.mode-tabs button{padding:11px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--dark)}.mode-tabs button[aria-pressed=true]{border-color:var(--teal);background:var(--teal);color:#fff}.panel{margin:12px 0;padding:16px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 20px #102d3f08}.panel-title{margin:0 0 12px;color:var(--navy);font-size:16px;font-weight:900}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{min-height:36px;padding:6px 13px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--sub)}.chip.on{border-color:var(--teal);background:#e0f3f4;color:var(--dark)}.year-row{display:flex;align-items:center;gap:8px;margin-top:13px}.year-row .label{color:var(--sub);font-weight:700;white-space:nowrap}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.stat{padding:13px;border:1px solid var(--line);border-radius:13px;background:linear-gradient(145deg,#fff,#f8fbfd)}.stat-label{color:var(--sub);font-size:11px;font-weight:700}.stat-value{margin-top:3px;color:var(--navy);font-size:24px;font-weight:900}.stat-value small{margin-left:4px;color:var(--sub);font-size:12px}.region-totals{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.region-total{padding:10px 4px;border:1px solid var(--line);border-radius:11px;background:var(--pale);text-align:center}.region-total b,.region-total strong,.region-total small{display:block}.region-total b{color:var(--dark);font-size:12px}.region-total strong{margin-top:3px;color:var(--navy);font-size:15px}.region-total small{color:var(--sub);font-size:10px}.chart-scroll{overflow-x:auto;padding:2px 0 7px;-webkit-overflow-scrolling:touch}.chart{display:grid;grid-template-columns:repeat(12,minmax(34px,1fr));align-items:end;gap:5px;min-width:460px;height:175px;padding:17px 4px 0;border-bottom:1px solid var(--line)}.bar-item{display:flex;min-width:0;height:100%;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;padding:0;border:0;background:transparent;font:inherit;cursor:pointer}.bar-value{min-height:14px;color:var(--sub);font-size:9px;font-weight:700}.bar{width:min(23px,70%);min-height:2px;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,#26a4aa,var(--teal))}.bar-item.selected .bar{background:#e0b84d}.bar-item.selected .bar-value,.bar-item.selected .bar-month{color:#8a6d1f;font-weight:900}.bar-month{padding-bottom:5px;color:var(--sub);font-size:10px}.list-head{display:flex;justify-content:space-between;align-items:center;gap:9px;margin-bottom:10px}.list-head .panel-title{margin:0}.search{width:min(220px,52%);height:38px;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit;font-size:12px}.month-group{margin-top:9px;border:1px solid var(--line);border-radius:12px;overflow:hidden}.month-heading{display:flex;justify-content:space-between;gap:8px;padding:10px 12px;background:#f2f8fa;color:var(--dark);font-weight:900}.month-heading small{color:var(--sub);font-size:10px}.project{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:9px;padding:11px 12px;border-top:1px solid #edf1f5}.project-name{font-size:13px;font-weight:800;line-height:1.45;overflow-wrap:anywhere}.project-address{margin-top:3px;color:var(--sub);font-size:11px;line-height:1.5;overflow-wrap:anywhere}.project-meta{display:flex;gap:6px;margin-top:5px}.project-type,.project-region{font-size:10px;color:var(--sub)}.project-units{align-self:center;color:var(--dark);font-size:14px;font-weight:900;white-space:nowrap}.history-table{width:100%;border-collapse:collapse}.history-table th,.history-table td{padding:9px 7px;border-bottom:1px solid var(--line);text-align:right}.history-table th:first-child,.history-table td:first-child{text-align:left}.history-table th{color:var(--sub);font-size:11px}.history-table td:first-child{font-weight:700}.empty,.lock,.status{padding:25px 14px;text-align:center;color:var(--sub);line-height:1.8}.lock{margin:32px auto;max-width:480px;border:1px solid var(--line);border-radius:16px;background:white}.lock a{color:var(--dark);font-weight:800}.note{margin:10px 3px;color:var(--sub);font-size:11px;line-height:1.8}.source{padding-top:9px;border-top:1px solid var(--line);color:var(--sub);font-size:10px;line-height:1.8}.source a{color:var(--dark)}[hidden]{display:none!important}@media(max-width:480px){.wrap{padding:8px 12px 35px}.panel{padding:14px}.region-totals{gap:5px}.region-total{padding:9px 2px}.region-total strong{font-size:13px}.stat-value{font-size:22px}.list-head{align-items:flex-start;flex-direction:column}.search{width:100%}.history-table th,.history-table td{padding:8px 4px;font-size:12px}}
</style></head>
<body><main class="wrap">
<header>
 <a class="analysis-back" href="./index.html" aria-label="메인으로 돌아가기" title="메인으로 돌아가기"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5m7-7-7 7 7 7"/></svg></a>
 <div class="logo"><svg class="brand-mark" viewBox="0 0 28 28" aria-hidden="true"><rect x="2" y="15" width="5" height="11" rx="1" fill="currentColor" opacity=".55"/><rect x="11" y="9" width="5" height="17" rx="1" fill="currentColor" opacity=".8"/><rect x="20" y="2" width="5" height="24" rx="1" fill="currentColor"/></svg><div class="brand-copy"><span class="brand-name">아파트썸</span><span class="brand-description">아파트 입주물량</span></div></div>
 <button class="header-share" id="sharePage" title="공유" aria-label="현재 분석 공유"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3m-4 4 4-4 4 4M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg></button>
</header>
<section id="locked" class="lock" hidden>비공개 탭입니다. <a href="./index.html">메인 화면</a>에서 운영자 인증 후 이용해 주세요.</section><section id="loading" class="panel status">입주물량 자료를 불러오는 중입니다.</section>
<div id="content" hidden><section class="panel"><div id="modeTabs" class="mode-tabs" role="group" aria-label="자료 구분"><button type="button" data-mode="planned" aria-pressed="true">입주 예정</button><button type="button" data-mode="history" aria-pressed="false">과거 준공 실적</button></div><div id="periodLine" class="note"></div><h2 class="panel-title">지역 선택</h2><div id="regionChips" class="chips" role="group" aria-label="지역"></div><div class="year-row"><span class="label" id="yearLabel">입주 연도</span><div id="yearChips" class="chips" role="group" aria-label="연도"></div></div></section>
<section class="stats"><article class="stat"><div class="stat-label" id="totalLabel">선택 지역 · 연도 입주 예정</div><div class="stat-value"><span id="totalUnits">—</span><small>세대</small></div></article><article class="stat"><div class="stat-label" id="countLabel">입주 예정 단지</div><div class="stat-value"><span id="complexCount">—</span><small id="countUnit">개</small></div></article></section>
<section class="panel"><h2 class="panel-title" id="regionTotalsTitle">지역별 입주 예정 합계</h2><div id="regionTotals" class="region-totals"></div></section>
<section class="panel"><h2 id="chartTitle" class="panel-title">월별 입주 예정</h2><div class="chart-scroll"><div id="chart" class="chart"></div></div></section>
<section class="panel" id="plannedList"><div class="list-head"><h2 id="listTitle" class="panel-title">입주 예정 단지</h2><input id="search" class="search" type="search" placeholder="단지명·주소 검색" aria-label="단지명 또는 주소 검색"></div><div id="projects"></div></section>
<section class="panel" id="historyList" hidden><h2 class="panel-title">월별 준공 실적</h2><div id="historyRows"></div></section>
<p id="unknownSummary" class="note"></p><p class="note" id="basisNote"></p><p id="sourceNote" class="source"></p></div>
</main>
<script>
(()=>{const REGIONS=['전체','서울','경기','인천','부산'], $=id=>document.getElementById(id), fmt=n=>Number(n||0).toLocaleString('ko-KR'), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const s={mode:'planned',region:'전체',year:'',month:'',items:[],history:[],years:[],histYears:[]};
function render(){const historical=s.mode==='history';document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===s.mode)));$('yearLabel').textContent=historical?'준공 연도':'입주 연도';$('regionChips').innerHTML=REGIONS.map(r=>`<button type="button" class="chip${s.region===r?' on':''}" aria-pressed="${s.region===r}" data-region="${r}">${r}</button>`).join('');$('regionChips').querySelectorAll('[data-region]').forEach(b=>b.onclick=()=>{s.region=b.dataset.region;s.month='';render()});const years=historical?s.histYears:s.years;$('yearChips').innerHTML=years.map(y=>`<button type="button" class="chip${s.year===y?' on':''}" aria-pressed="${s.year===y}" data-year="${y}">${y}년</button>`).join('');$('yearChips').querySelectorAll('[data-year]').forEach(b=>b.onclick=()=>{s.year=b.dataset.year;s.month='';render()});
const histRows=s.history.filter(x=>(s.region==='전체'||x.region===s.region)&&x.month.startsWith(s.year));const planned=s.items.filter(x=>(s.region==='전체'||x.region===s.region)&&x.month?.startsWith(s.year));const undated=s.items.filter(x=>(s.region==='전체'||x.region===s.region)&&!x.month);const rows=historical?histRows:planned;const per=new Map(Array.from({length:12},(_,i)=>[`${s.year}-${String(i+1).padStart(2,'0')}`,0]));rows.forEach(x=>per.set(x.month,(per.get(x.month)||0)+(historical?x.households:x.households)));const total=rows.reduce((n,x)=>n+x.households,0);$('totalUnits').textContent=fmt(total);$('complexCount').textContent=fmt(historical?rows.length:planned.length);$('countUnit').textContent=historical?'개월·지역':'개';$('totalLabel').textContent=historical?'선택 지역 · 연도 준공 실적':'선택 지역 · 연도 입주 예정';$('countLabel').textContent=historical?'월별 자료 건수':'입주 예정 단지';$('regionTotalsTitle').textContent=historical?'지역별 아파트 준공 실적':'지역별 입주 예정 합계';$('chartTitle').textContent=`${s.year}년 월별 ${historical?'아파트 준공 실적':'입주 예정'}`;
const months=[...per.keys()],max=Math.max(1,...per.values());$('chart').innerHTML=months.map(m=>{const v=per.get(m)||0,h=v?Math.max(3,v/max*100):1;return `<button type="button" class="bar-item${s.month===m?' selected':''}" data-month="${m}" aria-pressed="${s.month===m}" aria-label="${m} ${historical?'준공':'입주 예정'} ${fmt(v)}세대"><span class="bar-value">${v?fmt(v):''}</span><span class="bar" style="height:${h}%"></span><span class="bar-month">${Number(m.slice(5))}월</span></button>`}).join('');$('chart').querySelectorAll('[data-month]').forEach(b=>b.onclick=()=>{s.month=s.month===b.dataset.month?'':b.dataset.month;render()});$('regionTotals').innerHTML=REGIONS.slice(1).map(r=>{const list=(historical?s.history:s.items).filter(x=>x.region===r&&x.month?.startsWith(s.year));return `<div class="region-total"><b>${r}</b><strong>${fmt(list.reduce((n,x)=>n+x.households,0))}</strong><small>${historical?fmt(list.length)+'개월·지역':fmt(list.length)+'개 단지'}</small></div>`}).join('');
$('plannedList').hidden=historical;$('historyList').hidden=!historical;$('unknownSummary').hidden=historical;$('basisNote').textContent=historical?'과거 실적은 실제 이사 날짜가 아니라 국토교통부 월별 아파트 준공 실적(사용검사 기준)입니다. 최근 통계는 잠정치이며 추후 수정될 수 있습니다.':'입주예정월을 누르면 해당 월의 단지만 볼 수 있습니다. 30세대 이상 공동주택 기준이며, 입주 일정은 변경될 수 있습니다.';
if(historical){const byMonth=new Map(months.map(m=>[m,[]]));histRows.forEach(x=>{if(byMonth.has(x.month))byMonth.get(x.month).push(x)});$('historyRows').innerHTML=`<table class="history-table"><thead><tr><th>월</th><th>서울</th><th>경기</th><th>인천</th><th>부산</th><th>합계</th></tr></thead><tbody>${months.filter(m=>!s.month||m===s.month).reverse().map(m=>{const ar=byMonth.get(m)||[],vals=REGIONS.slice(1).map(r=>ar.find(x=>x.region===r)?.households||0);return `<tr><td>${m}</td>${vals.map(v=>`<td>${v?fmt(v):'—'}</td>`).join('')}<td><b>${fmt(vals.reduce((a,b)=>a+b,0))}</b></td></tr>`}).join('')}</tbody></table>`;$('unknownSummary').textContent='';}
else{const q=$('search').value.trim().toLocaleLowerCase('ko-KR'),visible=[...planned,...undated].filter(x=>(!s.month||x.month===s.month)&&(!q||`${x.name} ${x.address}`.toLocaleLowerCase('ko-KR').includes(q))).sort((a,b)=>(a.month||'9999-99').localeCompare(b.month||'9999-99')||b.households-a.households||a.name.localeCompare(b.name,'ko'));$('unknownSummary').textContent=undated.length?`입주월 미정 ${fmt(undated.length)}개 단지 · ${fmt(undated.reduce((n,x)=>n+x.households,0))}세대 (연도별 합계에서 제외)`:'입주월 미정 자료 없음';$('listTitle').textContent=s.month?`${s.month} 입주 예정 단지`:`${s.year}년 입주 예정 단지`;const groups=new Map();visible.forEach(x=>{const k=x.month||'미정';if(!groups.has(k))groups.set(k,[]);groups.get(k).push(x)});$('projects').innerHTML=groups.size?[...groups].map(([m,a])=>`<section class="month-group"><div class="month-heading"><span>${m==='미정'?'입주월 미정':m+'월'}</span><small>${fmt(a.reduce((n,x)=>n+x.households,0))}세대 · ${fmt(a.length)}개 단지</small></div>${a.map(x=>`<article class="project"><div><div class="project-name">${esc(x.name)}</div><div class="project-address">${esc(x.address)}</div><div class="project-meta"><span class="project-type">${esc(x.type||'공동주택')}</span><span class="project-region">${esc(x.region)}</span></div></div><div class="project-units">${fmt(x.households)}세대</div></article>`).join('')}</section>`).join(''):'<div class="empty">조건에 맞는 입주 예정 단지가 없습니다.</div>';}
}
async function init(){try{const session=await window.aptsumSession.check();if(!session.ok){$('loading').hidden=true;$('locked').hidden=false;return}const access=await session.json();if(access.subscribed!==true||access.master!==true){$('loading').hidden=true;$('locked').hidden=false;return}const response=await fetch('/data/move-in.json',{cache:'no-cache'});if(!response.ok)throw Error();const d=await response.json();s.items=(d.items||[]).filter(x=>REGIONS.includes(x.region)&&Number.isFinite(x.households)&&x.households>=30);s.history=(d.history||[]).filter(x=>REGIONS.includes(x.region)&&Number.isFinite(x.households));s.years=[...new Set(s.items.map(x=>x.month?.slice(0,4)).filter(Boolean))].sort();s.histYears=[...new Set(s.history.map(x=>x.month.slice(0,4)))].sort();if(!s.years.length||!s.histYears.length)throw Error('입주물량 자료를 불러오지 못했습니다.');s.year=s.years.includes(String(new Date().getFullYear()))?String(new Date().getFullYear()):s.years[0];$('periodLine').textContent=`과거 준공 실적 ${s.histYears[0]}~${s.histYears.at(-1)} · 입주 예정 ${s.items.map(x=>x.month).filter(Boolean).sort()[0].replace('-','.')}~${s.items.map(x=>x.month).filter(Boolean).sort().at(-1).replace('-','.')} · 서울·경기·인천·부산`;$('sourceNote').innerHTML=`예정 출처: <a href="https://www.data.go.kr/data/15111714/fileData.do" target="_blank" rel="noopener">한국부동산원·부동산R114 공동주택 입주예정물량</a> (기준일 ${esc(d.sourceAsOf||'확인 필요')}, 반기 갱신)<br>과거 출처: <a href="${esc(d.historicalSourceUrl||'https://stat.molit.go.kr/portal/cate/statView.do?hRsId=468')}" target="_blank" rel="noopener">국토교통부 주택건설실적통계(준공)</a> (최신월 ${esc(d.historicalAsOf||'확인 중')}, 월간 갱신)`;$('loading').hidden=true;$('content').hidden=false;$('modeTabs').onclick=e=>{const b=e.target.closest('[data-mode]');if(!b)return;s.mode=b.dataset.mode;s.month='';s.year=s.mode==='history'?s.histYears.at(-1):(s.years.includes(String(new Date().getFullYear()))?String(new Date().getFullYear()):s.years[0]);render()};$('search').addEventListener('input',render);$('sharePage').onclick=async()=>{try{if(navigator.share)await navigator.share({title:document.title,url:location.href});else await navigator.clipboard.writeText(location.href)}catch{}};render()}catch{$('loading').textContent='입주물량 자료를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.'}}
init()})();
</script></body></html>
