<style>
:root{--navy:#102d3f;--teal:#00828a;--dark:#00565c;--aqua:#83d1d2;--ink:#17283b;--sub:#687c95;--line:#dfe6ef;--soft:#f0f5fa;--pale:#f0fafb}*{box-sizing:border-box}body{margin:0;background:var(--soft);color:var(--ink);font-family:'Noto Sans KR',sans-serif;font-size:14px}.wrap{max-width:760px;margin:auto;padding:12px 16px 50px}header{margin:10px 0 14px!important;padding:10px 54px!important;text-align:center;background:linear-gradient(120deg,#102d3f,#17394b);border:1px solid #ffffff1f;border-radius:17px;box-shadow:0 8px 22px #0f2b3d1a;position:relative;color:white}.logo{display:inline-flex;align-items:center;gap:11px;color:#fff;text-align:left}.brand-mark{flex:none;width:27px;height:27px;color:#83d1d2}.brand-copy{display:flex;flex-direction:column;gap:1px;text-align:left}.brand-name{font-weight:700;font-size:21px;line-height:1.35;letter-spacing:-.8px}.brand-description{font-weight:500;font-size:10.5px;line-height:1.6;letter-spacing:.3px;color:#b7cbd5}.analysis-back{display:flex;position:absolute;left:15px;top:50%;transform:translateY(-50%);color:#fff!important;text-decoration:none!important;width:36px;height:36px;border:1px solid #ffffff59;border-radius:10px;background:#ffffff1f;align-items:center;justify-content:center}.header-share{position:absolute;top:50%;right:15px;transform:translateY(-50%);padding:0;background:#ffffff0a;border:1px solid #ffffff33;border-radius:10px;width:36px;height:36px;color:#d5e6ec;cursor:pointer;display:flex;align-items:center;justify-content:center}.header-share svg{display:block;width:18px;height:18px}.mode-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.mode-tabs button,.chip{font:inherit;font-weight:700;cursor:pointer}.mode-tabs button{padding:11px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--dark)}.mode-tabs button[aria-pressed=true]{border-color:var(--teal);background:var(--teal);color:#fff}.panel{margin:12px 0;padding:16px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 20px #102d3f08}.panel-title{margin:0 0 12px;color:var(--navy);font-size:16px;font-weight:900}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{min-height:36px;padding:6px 13px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--sub)}.chip.on{border-color:var(--teal);background:#e0f3f4;color:var(--dark)}.year-row{display:flex;align-items:center;gap:8px;margin-top:13px}.year-row .label{color:var(--sub);font-weight:700;white-space:nowrap}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.stat{padding:13px;border:1px solid var(--line);border-radius:13px;background:linear-gradient(145deg,#fff,#f8fbfd)}.stat-label{color:var(--sub);font-size:11px;font-weight:700}.stat-value{margin-top:3px;color:var(--navy);font-size:24px;font-weight:900}.stat-value small{margin-left:4px;color:var(--sub);font-size:12px}.region-totals{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.region-total{padding:10px 4px;border:1px solid var(--line);border-radius:11px;background:var(--pale);text-align:center}.region-total b,.region-total strong,.region-total small{display:block}.region-total b{color:var(--dark);font-size:12px}.region-total strong{margin-top:3px;color:var(--navy);font-size:15px}.region-total small{color:var(--sub);font-size:10px}.chart-scroll{overflow-x:auto;padding:2px 0 7px;-webkit-overflow-scrolling:touch}.chart{display:grid;grid-template-columns:repeat(12,minmax(34px,1fr));align-items:end;gap:5px;min-width:460px;height:175px;padding:17px 4px 0;border-bottom:1px solid var(--line)}.bar-item{display:flex;min-width:0;height:100%;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;padding:0;border:0;background:transparent;font:inherit;cursor:pointer}.bar-value{min-height:14px;color:var(--sub);font-size:9px;font-weight:700}.bar{width:min(23px,70%);min-height:2px;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,#26a4aa,var(--teal))}.bar-item.selected .bar{background:#e0b84d}.bar-item.selected .bar-value,.bar-item.selected .bar-month{color:#8a6d1f;font-weight:900}.bar-month{padding-bottom:5px;color:var(--sub);font-size:10px}.list-head{display:flex;justify-content:space-between;align-items:center;gap:9px;margin-bottom:10px}.list-head .panel-title{margin:0}.search{width:min(220px,52%);height:38px;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit;font-size:12px}.month-group{margin-top:9px;border:1px solid var(--line);border-radius:12px;overflow:hidden}.month-heading{display:flex;justify-content:space-between;gap:8px;padding:10px 12px;background:#f2f8fa;color:var(--dark);font-weight:900}.month-heading small{color:var(--sub);font-size:10px}.project{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:9px;padding:11px 12px;border-top:1px solid #edf1f5}.project-name{font-size:13px;font-weight:800;line-height:1.45;overflow-wrap:anywhere}.project-address{margin-top:3px;color:var(--sub);font-size:11px;line-height:1.5;overflow-wrap:anywhere}.project-meta{display:flex;gap:6px;margin-top:5px}.project-type,.project-region{font-size:10px;color:var(--sub)}.project-units{align-self:center;color:var(--dark);font-size:14px;font-weight:900;white-space:nowrap}.history-table{width:100%;border-collapse:collapse}.history-table th,.history-table td{padding:9px 7px;border-bottom:1px solid var(--line);text-align:right}.history-table th:first-child,.history-table td:first-child{text-align:left}.history-table th{color:var(--sub);font-size:11px}.history-table td:first-child{font-weight:700}.empty,.lock,.status{padding:25px 14px;text-align:center;color:var(--sub);line-height:1.8}.lock{margin:32px auto;max-width:480px;border:1px solid var(--line);border-radius:16px;background:white}.lock a{color:var(--dark);font-weight:800}.note{margin:10px 3px;color:var(--sub);font-size:11px;line-height:1.8}.source{padding-top:9px;border-top:1px solid var(--line);color:var(--sub);font-size:10px;line-height:1.8}.source a{color:var(--dark)}.legend-dot{display:inline-block;width:8px;height:8px;margin:0 3px 0 6px;border-radius:50%;background:var(--teal)}.legend-dot.forecast{background:#e0b84d}.month-bar.selected{background:var(--navy)}.year-table{width:100%;border-collapse:collapse;table-layout:fixed}.year-table th,.year-table td{border-bottom:1px solid var(--line);padding:8px 6px}.year-table thead th{background:#f2f8fa;color:var(--sub);font-size:11px}.year-table th:first-child{width:68px;text-align:center}.year-table tbody th{color:var(--navy);font-size:14px;text-align:center;vertical-align:middle}.year-total{display:block;margin-top:3px;color:var(--dark);font-size:10px;white-space:nowrap}.year-graph{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:3px;align-items:end;height:68px}.month-column{display:flex;min-width:0;height:100%;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;border:0;background:transparent;padding:0 0 2px;cursor:pointer}.month-bar-track{display:flex;width:100%;height:47px;align-items:flex-end;justify-content:center}.month-bar{display:block;width:min(16px,75%);min-height:2px;border-radius:4px 4px 1px 1px;background:var(--teal)}.month-bar.forecast{background:#e0b84d}.month-column:focus-visible{outline:2px solid var(--teal);outline-offset:1px}.month-number{color:var(--sub);font-size:8px;line-height:1}.meta{color:var(--sub);font-size:10px}.detail-summary{margin:0 0 10px;color:var(--dark);font-weight:700}.detail-list{display:grid;gap:6px}.detail-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:9px 10px;border:1px solid var(--line);border-radius:10px}.detail-item b{font-size:12px;overflow-wrap:anywhere}.detail-item small{display:block;margin-top:2px;color:var(--sub);font-size:10px}.detail-units{align-self:center;color:var(--dark);font-weight:900;white-space:nowrap}.year-table .empty-month{background:#f5f7fa;border-radius:2px}.year-table-scroll{overflow-x:auto}.source{margin-top:12px}@media(max-width:480px){.year-table th:first-child{width:55px;padding:6px 2px}.year-table th,.year-table td{padding:7px 3px}.year-table tbody th{font-size:12px}.year-total{font-size:9px}.year-graph{gap:1px;height:62px}.month-bar-track{height:43px}.month-bar{width:min(13px,75%)}.month-number{font-size:7px}.chartLegend{font-size:9px}}
[hidden]{display:none!important}@media(max-width:480px){.wrap{padding:8px 12px 35px}.panel{padding:14px}.region-totals{gap:5px}.region-total{padding:9px 2px}.region-total strong{font-size:13px}.stat-value{font-size:22px}.list-head{align-items:flex-start;flex-direction:column}.search{width:100%}.history-table th,.history-table td{padding:8px 4px;font-size:12px}}
</style></head>
<body><main class="wrap">
<header>
 <a class="analysis-back" href="./index.html" aria-label="메인으로 돌아가기" title="메인으로 돌아가기"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5m7-7-7 7 7 7"/></svg></a>
 <div class="logo"><svg class="brand-mark" viewBox="0 0 28 28" aria-hidden="true"><rect x="2" y="15" width="5" height="11" rx="1" fill="currentColor" opacity=".55"/><rect x="11" y="9" width="5" height="17" rx="1" fill="currentColor" opacity=".8"/><rect x="20" y="2" width="5" height="24" rx="1" fill="currentColor"/></svg><div class="brand-copy"><span class="brand-name">아파트썸</span><span class="brand-description">아파트 입주물량</span></div></div>
 <button class="header-share" id="sharePage" title="공유" aria-label="현재 분석 공유"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3m-4 4 4-4 4 4M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg></button>
</header>
<section id="locked" class="lock" hidden>비공개 탭입니다. <a href="./index.html">메인 화면</a>에서 운영자 인증 후 이용해 주세요.</section><section id="loading" class="panel status">입주물량 자료를 불러오는 중입니다.</section>
<div id="content" hidden>
<section class="panel"><h2 class="panel-title">지역 선택 <small id="regionHint">4개 지역 합계</small></h2><div id="regionChips" class="chips" role="group" aria-label="지역"></div></section>
<section class="panel"><div class="list-head"><h2 class="panel-title">연도별 입주물량</h2><span id="chartLegend" class="meta"><i class="legend-dot actual"></i>준공 실적 <i class="legend-dot forecast"></i>입주 예정</span></div><div class="chart-scroll"><table class="year-table"><thead><tr><th scope="col">연도</th><th scope="col">월별 물량 그래프</th></tr></thead><tbody id="yearRows"></tbody></table></div><p id="basisNote" class="note"></p><p id="periodLine" class="note"></p></section>
<section id="monthDetail" class="panel" hidden><div class="list-head"><h2 id="detailTitle" class="panel-title"></h2><button type="button" id="clearMonth" class="chip">닫기</button></div><div id="detailContent"></div></section>
<p id="sourceNote" class="source"></p></div>
</main>
<script>
(()=>{const REGIONS=['서울','경기','인천','부산'], $=id=>document.getElementById(id),fmt=n=>Number(n||0).toLocaleString('ko-KR'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const s={region:null,selectedMonth:null,items:[],history:[],historicalAsOf:'',years:[]};
const regionLabel=()=>s.region||'4개 지역 합계';
function monthData(month){const past=month<=s.historicalAsOf;const selectedRegions=s.region?[s.region]:REGIONS;if(past){const vals=selectedRegions.map(region=>s.history.find(x=>x.month===month&&x.region===region)?.households||0);return{value:vals.reduce((a,b)=>a+b,0),past:true,projects:[]}}const projects=s.items.filter(x=>x.month===month&&(!s.region||x.region===s.region));return{value:projects.reduce((a,x)=>a+x.households,0),past:false,projects}}
function render(){ $('regionHint').textContent=regionLabel();$('regionChips').innerHTML=REGIONS.map(r=>`<button type="button" class="chip${s.region===r?' on':''}" aria-pressed="${s.region===r}" data-region="${r}">${r}</button>`).join('');$('regionChips').querySelectorAll('[data-region]').forEach(b=>b.onclick=()=>{s.region=s.region===b.dataset.region?null:b.dataset.region;render()});const monthsByYear=new Map(s.years.map(y=>[y,Array.from({length:12},(_,i)=>`${y}-${String(i+1).padStart(2,'0')}`)]));const totals=new Map();for(const [year,months] of monthsByYear){totals.set(year,months.reduce((sum,m)=>sum+monthData(m).value,0))}const maxByYear=new Map();for(const [year,months] of monthsByYear)maxByYear.set(year,Math.max(1,...months.map(m=>monthData(m).value)));$('yearRows').innerHTML=[...s.years].reverse().map(year=>{const months=monthsByYear.get(year);const bars=months.map(month=>{const d=monthData(month),n=Number(month.slice(5)),height=d.value?Math.max(3,d.value/maxByYear.get(year)*100):0;const title=`${month} · ${fmt(d.value)}세대 · ${d.past?'준공 실적':'입주 예정'}`;return `<button type="button" class="month-column" data-month="${month}" title="${esc(title)}" aria-label="${esc(title)}"><span class="month-bar-track"><span class="month-bar${d.past?'':' forecast'}${d.value?'':' empty-month'}${s.selectedMonth===month?' selected':''}" style="height:${height}%"></span></span><span class="month-number">${n}</span></button>`}).join('');return `<tr><th scope="row">${year}<span class="year-total">${fmt(totals.get(year))}</span></th><td><div class="year-graph">${bars}</div></td></tr>`}).join('');$('yearRows').querySelectorAll('[data-month]').forEach(b=>b.onclick=()=>showMonth(b.dataset.month));$('basisNote').textContent=`과거는 ${s.historicalAsOf}월까지 국토교통부 아파트 준공 실적, 이후는 입주 예정 물량으로 이어서 표시합니다. 겹치는 달은 준공 실적을 우선해 중복 합산하지 않습니다.`;$('periodLine').textContent='세로 표의 1열은 연도·연간 합계, 2열은 1~12월 그래프입니다. 막대를 누르면 해당 월의 상세 자료를 볼 수 있습니다.';if(s.selectedMonth)showMonth(s.selectedMonth)}
function showMonth(month){s.selectedMonth=month;const past=month<=s.historicalAsOf;const selectedRegions=s.region?[s.region]:REGIONS;$('detailTitle').textContent=`${month} · ${past?'아파트 준공 실적':'입주 예정 물량'}`;if(past){const values=selectedRegions.map(region=>({region,households:s.history.find(x=>x.month===month&&x.region===region)?.households||0}));$('detailContent').innerHTML=`<p class="detail-summary">${regionLabel()} · 합계 ${fmt(values.reduce((n,x)=>n+x.households,0))}세대</p><div class="detail-list">${values.map(x=>`<div class="detail-item"><b>${x.region}</b><span class="detail-units">${fmt(x.households)}세대</span></div>`).join('')}</div>`}else{const projects=s.items.filter(x=>x.month===month&&(!s.region||x.region===s.region)).sort((a,b)=>b.households-a.households);$('detailContent').innerHTML=projects.length?`<p class="detail-summary">${regionLabel()} · ${fmt(projects.reduce((n,x)=>n+x.households,0))}세대 · ${projects.length}개 단지</p><div class="detail-list">${projects.map(x=>`<div class="detail-item"><div><b>${esc(x.name)}</b><small>${esc(x.region)} · ${esc(x.address)}</small></div><span class="detail-units">${fmt(x.households)}세대</span></div>`).join('')}</div>`:'<div class="empty">해당 월의 입주 예정 자료가 없습니다.</div>'}$('monthDetail').hidden=false;$('monthDetail').scrollIntoView({behavior:'smooth',block:'nearest'})}
async function init(){try{const session=await window.aptsumSession.check();if(!session.ok){$('loading').hidden=true;$('locked').hidden=false;return}const access=await session.json();if(access.subscribed!==true||access.master!==true){$('loading').hidden=true;$('locked').hidden=false;return}const response=await fetch('/data/move-in.json',{cache:'no-cache'});if(!response.ok)throw Error();const d=await response.json();s.items=(d.items||[]).filter(x=>REGIONS.includes(x.region)&&Number.isFinite(x.households)&&x.households>=30);s.history=(d.history||[]).filter(x=>REGIONS.includes(x.region)&&Number.isFinite(x.households));s.historicalAsOf=d.historicalAsOf||'';s.years=[...new Set([...s.items.map(x=>x.month?.slice(0,4)),...s.history.map(x=>x.month.slice(0,4))].filter(Boolean))].sort();if(!s.years.length)throw Error('입주물량 자료가 없습니다.');$('periodLine').textContent=`${s.years[0]}~${s.years.at(-1)} · 서울·경기·인천·부산`;$('sourceNote').innerHTML=`과거 준공 실적: <a href="${esc(d.historicalSourceUrl||'https://stat.molit.go.kr/portal/cate/statView.do?hRsId=468')}" target="_blank" rel="noopener">국토교통부 주택건설실적통계</a> · 최신 ${esc(s.historicalAsOf||'확인 중')}<br>입주 예정: <a href="https://www.data.go.kr/data/15111714/fileData.do" target="_blank" rel="noopener">한국부동산원·부동산R114 공동주택 입주예정물량</a> · 기준일 ${esc(d.sourceAsOf||'확인 필요')} · 30세대 이상`;$('loading').hidden=true;$('content').hidden=false;$('clearMonth').onclick=()=>{$('monthDetail').hidden=true;s.selectedMonth=null};$('sharePage').onclick=async()=>{try{if(navigator.share)await navigator.share({title:document.title,url:location.href});else await navigator.clipboard.writeText(location.href)}catch{}};render()}catch{$('loading').textContent='입주물량 자료를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.'}}
init()})();
</script></body></html>
