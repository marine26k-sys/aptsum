<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#102d3f">
<title>아파트썸 | 입주물량</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="/assets/subscriber-session.js?v=1"></script>
<style>
:root{--navy:#102d3f;--navy2:#17394b;--teal:#00828a;--dark:#00565c;--aqua:#83d1d2;--ink:#17283b;--sub:#687c95;--line:#dfe6ef;--soft:#f0f5fa;--pale:#f0fafb;--white:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--soft);color:var(--ink);font-family:'Noto Sans KR',sans-serif;font-size:14px}.wrap{max-width:760px;margin:auto;padding:12px 16px 50px}
.hero{position:relative;margin-bottom:14px;padding:20px 20px 22px 66px;border-radius:22px;background:linear-gradient(125deg,var(--navy),var(--navy2));color:#fff;box-shadow:0 10px 24px #102d3f1a}.back{position:absolute;left:15px;top:18px;display:grid;place-items:center;width:38px;height:38px;border:1px solid #ffffff55;border-radius:11px;background:#ffffff16;color:#fff;text-decoration:none;font-size:24px}.brand{display:flex;align-items:center;gap:8px;color:#b7cbd5;font-size:12px;font-weight:700}.brand svg{width:22px;height:22px;color:var(--aqua)}.badge{display:inline-flex;margin-top:12px;padding:6px 14px;border-radius:999px;background:var(--teal);font-size:12px;font-weight:800}.hero h1{margin:9px 0 4px;font-size:27px;line-height:1.3;letter-spacing:-.8px}.hero p{margin:0;color:#b7cbd5;font-size:12px;line-height:1.7}.panel{margin:12px 0;padding:18px;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 20px #102d3f08}.filter-title,.panel-title{margin:0 0 14px;color:var(--navy);font-size:17px;font-weight:900}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{min-height:38px;padding:7px 14px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--sub);font:inherit;font-weight:700;cursor:pointer}.chip.on{border-color:var(--teal);background:#e0f3f4;color:var(--dark)}.year-row{display:flex;align-items:center;gap:8px;margin-top:14px}.year-row .label{margin-right:4px;color:var(--sub);font-weight:700}.year-row .chip{min-height:34px;padding:5px 12px;font-size:12px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.stat{padding:15px;border:1px solid var(--line);border-radius:14px;background:linear-gradient(145deg,#fff,#f8fbfd)}.stat-label{color:var(--sub);font-size:12px;font-weight:700}.stat-value{display:flex;align-items:baseline;gap:5px;margin-top:5px;color:var(--navy);font-size:26px;font-weight:900;letter-spacing:-.6px}.stat-value small{font-size:12px;color:var(--sub)}.region-totals{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.region-total{padding:12px 9px;border:1px solid var(--line);border-radius:12px;background:var(--pale);text-align:center}.region-total b{display:block;color:var(--dark);font-size:13px}.region-total strong{display:block;margin-top:3px;color:var(--navy);font-size:17px}.region-total small{color:var(--sub);font-size:10px}
.chart-scroll{overflow-x:auto;padding:2px 0 8px;-webkit-overflow-scrolling:touch}.chart{display:grid;grid-template-columns:repeat(12,minmax(36px,1fr));align-items:end;gap:5px;min-width:500px;height:176px;padding:18px 4px 0;border-bottom:1px solid var(--line)}.bar-item{appearance:none;-webkit-appearance:none;display:flex;min-width:0;height:100%;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;padding:0;border:0;background:transparent;font:inherit;cursor:pointer}.bar-value{min-height:14px;color:var(--sub);font-size:9px;font-weight:700}.bar{width:min(24px,70%);min-height:3px;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,#26a4aa,var(--teal));transition:height .2s}.bar-item.selected .bar{background:#e0b84d}.bar-item.selected .bar-value,.bar-item.selected .bar-month{color:#8a6d1f;font-weight:900}.bar-month{padding-bottom:5px;color:var(--sub);font-size:10px}.chart-empty{display:grid;place-items:center;min-width:450px;height:150px;color:var(--sub);font-size:12px}.list-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.list-head .panel-title{margin:0}.search{width:min(220px,48%);height:38px;padding:7px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit;font-size:12px}.month-group{margin-top:10px;border:1px solid var(--line);border-radius:13px;background:white;overflow:hidden}.month-heading{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 13px;background:#f2f8fa;color:var(--dark);font-weight:900}.month-heading small{color:var(--sub);font-size:11px;font-weight:700}.project{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:12px 13px;border-top:1px solid #edf1f5}.project-name{font-size:13px;font-weight:800;line-height:1.45;overflow-wrap:anywhere}.project-address{margin-top:3px;color:var(--sub);font-size:11px;line-height:1.5;overflow-wrap:anywhere}.project-meta{display:flex;align-items:center;gap:6px;margin-top:6px}.project-type{padding:2px 7px;border-radius:999px;background:#edf3f7;color:var(--sub);font-size:10px}.project-region{font-size:10px;color:var(--sub)}.project-units{align-self:center;color:var(--dark);font-size:15px;font-weight:900;white-space:nowrap}.empty,.lock{padding:28px 16px;text-align:center;color:var(--sub);line-height:1.8}.lock{margin:35px auto;max-width:480px;border:1px solid var(--line);border-radius:18px;background:#fff}.lock a{color:var(--dark);font-weight:800}.note{margin:12px 4px;color:var(--sub);font-size:11px;line-height:1.8}.source{padding-top:10px;border-top:1px solid var(--line);color:var(--sub);font-size:10px;line-height:1.8}.status{padding:13px;text-align:center;color:var(--sub);font-size:13px}[hidden]{display:none!important}
@media(max-width:480px){.wrap{padding:10px 12px 36px}.hero{padding:18px 14px 18px 60px;border-radius:18px}.hero h1{font-size:22px}.panel{padding:15px}.region-totals{gap:6px}.region-total{padding:10px 4px}.region-total strong{font-size:14px}.stat-value{font-size:23px}.chart{min-width:440px}.list-head{align-items:flex-start;flex-direction:column}.search{width:100%}}
</style>
</head>
<body>
<main class="wrap">
  <header class="hero">
    <a class="back" href="./index.html" aria-label="메인으로 돌아가기">←</a>
    <div class="brand"><svg viewBox="0 0 28 28" aria-hidden="true"><rect x="2" y="15" width="5" height="11" rx="1" fill="currentColor" opacity=".55"/><rect x="11" y="9" width="5" height="17" rx="1" fill="currentColor" opacity=".8"/><rect x="20" y="2" width="5" height="24" rx="1" fill="currentColor"/></svg>아파트썸</div>
    <span class="badge">아파트 입주물량</span>
    <h1>서울 · 경기 · 인천 · 부산</h1>
    <p id="periodLine">입주예정 자료를 불러오는 중입니다.</p>
  </header>

  <section id="locked" class="lock" hidden>비공개 탭입니다. <a href="./index.html">메인 화면</a>에서 운영자 인증 후 이용해 주세요.</section>
  <section id="loading" class="panel status">입주예정 자료를 불러오는 중입니다.</section>
  <div id="content" hidden>
    <section class="panel" aria-label="지역 및 연도 선택">
      <h2 class="filter-title">지역 선택</h2>
      <div id="regionChips" class="chips" role="group" aria-label="지역"></div>
      <div class="year-row"><span class="label">입주 연도</span><div id="yearChips" class="chips" role="group" aria-label="입주 연도"></div></div>
    </section>
    <section class="stats" aria-label="입주 예정 합계">
      <article class="stat"><div class="stat-label">선택 지역 · 연도 입주 예정</div><div class="stat-value"><span id="totalUnits">—</span><small>세대</small></div></article>
      <article class="stat"><div class="stat-label">입주 예정 단지</div><div class="stat-value"><span id="complexCount">—</span><small>개</small></div></article>
    </section>
    <section class="panel"><h2 class="panel-title">지역별 입주 예정 합계</h2><div id="regionTotals" class="region-totals"></div></section>
    <section class="panel"><h2 id="chartTitle" class="panel-title">월별 입주 예정</h2><div class="chart-scroll"><div id="chart" class="chart"></div></div></section>
    <section class="panel">
      <div class="list-head"><h2 id="listTitle" class="panel-title">입주 예정 단지</h2><input id="search" class="search" type="search" placeholder="단지명·주소 검색" aria-label="단지명 또는 주소 검색"></div>
      <div id="projects"></div>
    </section>
    <p id="unknownSummary" class="note"></p>
    <p class="note">입주예정월을 누르면 해당 월의 단지만 볼 수 있습니다. 자료 기준은 30세대 이상 공동주택이며, 입주 일정은 기준일 이후 변경될 수 있습니다.</p>
    <p id="sourceNote" class="source"></p>
  </div>
</main>
<script>
(() => {
  const REGIONS=['전체','서울','경기','인천','부산'];
  const $=id=>document.getElementById(id);
  const state={region:'전체',year:'',month:'',items:[],sourceAsOf:'',years:[]};
  const fmt=n=>Number(n||0).toLocaleString('ko-KR');
  const monthLabel=value=>value?`${Number(value.slice(5))}월`:'입주월 미정';
  const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  const authMessage=()=>{ $('loading').hidden=true; $('locked').hidden=false; };
  function selectRegion(region){state.region=region;state.month='';render();}
  function selectYear(year){state.year=year;state.month='';render();}
  function render(){
    $('regionChips').innerHTML=REGIONS.map(region=>`<button type="button" class="chip${state.region===region?' on':''}" aria-pressed="${state.region===region}" data-region="${region}">${region}</button>`).join('');
    $('regionChips').querySelectorAll('[data-region]').forEach(button=>button.addEventListener('click',()=>selectRegion(button.dataset.region)));
    $('yearChips').innerHTML=state.years.map(year=>`<button type="button" class="chip${state.year===year?' on':''}" aria-pressed="${state.year===year}" data-year="${year}">${year}년</button>`).join('');
    $('yearChips').querySelectorAll('[data-year]').forEach(button=>button.addEventListener('click',()=>selectYear(button.dataset.year)));
    const regionItems=state.items.filter(item=>state.region==='전체'||item.region===state.region);
    const scoped=regionItems.filter(item=>item.month?.slice(0,4)===state.year);
    const undated=regionItems.filter(item=>!item.month);
    $('unknownSummary').textContent=undated.length?`입주월 미정: ${fmt(undated.length)}개 단지 · ${fmt(undated.reduce((sum,item)=>sum+item.households,0))}세대 (연도별 합계에서 제외)`:'입주월 미정 자료 없음';
    const dated=scoped;
    const months=Array.from({length:12},(_,index)=>`${state.year}-${String(index+1).padStart(2,'0')}`);
    const perMonth=new Map(months.map(month=>[month,[]]));
    for(const item of dated){if(perMonth.has(item.month))perMonth.get(item.month).push(item);}
    const total=scoped.reduce((sum,item)=>sum+item.households,0);
    $('totalUnits').textContent=fmt(total);$('complexCount').textContent=fmt(scoped.length);
    $('chartTitle').textContent=`${state.year}년 월별 입주 예정`;
    const max=Math.max(1,...months.map(month=>perMonth.get(month).reduce((sum,item)=>sum+item.households,0)));
    $('chart').innerHTML=months.map(month=>{
      const value=perMonth.get(month).reduce((sum,item)=>sum+item.households,0),height=value?Math.max(3,value/max*100):1;
      return `<button type="button" class="bar-item${state.month===month?' selected':''}" data-month="${month}" aria-pressed="${state.month===month}" aria-label="${month} 입주 예정 ${fmt(value)}세대"><span class="bar-value">${value?fmt(value):''}</span><span class="bar" style="height:${height}%"></span><span class="bar-month">${Number(month.slice(5))}월</span></button>`;
    }).join('');
    $('chart').querySelectorAll('[data-month]').forEach(button=>button.addEventListener('click',()=>{state.month=state.month===button.dataset.month?'':button.dataset.month;render();}));
    $('regionTotals').innerHTML=REGIONS.filter(region=>region!=='전체').map(region=>{
      const rows=state.items.filter(item=>item.region===region&&item.month?.slice(0,4)===state.year);
      return `<div class="region-total"><b>${region}</b><strong>${fmt(rows.reduce((sum,item)=>sum+item.households,0))}</strong><small>${fmt(rows.length)}개 단지</small></div>`;
    }).join('');
    const query=$('search').value.trim().toLocaleLowerCase('ko-KR');
    const visible=[...scoped,...undated].filter(item=>(!state.month||item.month===state.month)&&(!query||`${item.name} ${item.address}`.toLocaleLowerCase('ko-KR').includes(query)))
      .sort((a,b)=>(a.month||'9999-99').localeCompare(b.month||'9999-99')||b.households-a.households||a.name.localeCompare(b.name,'ko'));
    $('listTitle').textContent=state.month?`${state.year}년 ${monthLabel(state.month)} 입주 예정 단지`:`${state.year}년 입주 예정 단지`;
    const groups=new Map();for(const item of visible){const key=item.month||'미정';if(!groups.has(key))groups.set(key,[]);groups.get(key).push(item);}
    $('projects').innerHTML=groups.size?[...groups].map(([month,items])=>{
      const label=month==='미정'?'입주월 미정':`${month.slice(0,4)}년 ${monthLabel(month)}`;
      return `<section class="month-group"><div class="month-heading"><span>${label}</span><small>${fmt(items.reduce((sum,item)=>sum+item.households,0))}세대 · ${fmt(items.length)}개 단지</small></div>${items.map(item=>`<article class="project"><div><div class="project-name">${escapeHtml(item.name)}</div><div class="project-address">${escapeHtml(item.address)}</div><div class="project-meta"><span class="project-type">${escapeHtml(item.type||'공동주택')}</span><span class="project-region">${escapeHtml(item.region)}</span></div></div><div class="project-units">${fmt(item.households)}세대</div></article>`).join('')}</section>`;
    }).join(''):`<div class="empty">조건에 맞는 입주 예정 단지가 없습니다.</div>`;
  }
  async function init(){
    try{
      const session=await window.aptsumSession.check();
      if(!session.ok){authMessage();return;}
      const access=await session.json();
      if(access.subscribed!==true||access.master!==true){authMessage();return;}
      const response=await fetch('/data/move-in.json',{cache:'no-cache'});
      if(!response.ok)throw new Error('입주물량 자료를 불러오지 못했습니다.');
      const data=await response.json();
      state.items=(Array.isArray(data.items)?data.items:[]).filter(item=>REGIONS.includes(item.region)&&Number.isFinite(item.households)&&item.households>=30);
      state.sourceAsOf=data.sourceAsOf||'';
      state.years=[...new Set(state.items.map(item=>item.month?.slice(0,4)).filter(Boolean))].sort();
      if(!state.years.length)throw new Error('표시할 입주예정 자료가 없습니다.');
      const nowYear=String(new Date().getFullYear());state.year=state.years.includes(nowYear)?nowYear:state.years[0];
      const plannedMonths=state.items.map(item=>item.month).filter(Boolean).sort();
      $('periodLine').textContent=`${plannedMonths[0].replace('-', '.')} ~ ${plannedMonths.at(-1).replace('-', '.')} · 30세대 이상 공동주택`;
      $('sourceNote').innerHTML=`자료 기준일: <b>${state.sourceAsOf||'확인 필요'}</b> · 출처: <a href="https://www.data.go.kr/data/15111714/fileData.do" target="_blank" rel="noopener">한국부동산원·부동산R114 공동주택 입주예정물량</a> · 반기 갱신`;
      $('loading').hidden=true;$('content').hidden=false;render();
      $('search').addEventListener('input',render);
    }catch(error){$('loading').textContent=error.message||'자료를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.';}
  }
  init();
})();
</script>
</body>
</html>
