<script>
(()=>{const REGIONS=['서울','경기','인천','부산'], $=id=>document.getElementById(id),fmt=n=>Number(n||0).toLocaleString('ko-KR'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const s={region:'서울',yearFocus:null,selectedMonth:null,items:[],history:[],historicalAsOf:'',years:[]};const stateKey='aptsum-move-in-state';const snapshot=()=>({region:s.region,yearFocus:s.yearFocus,selectedMonth:s.selectedMonth});function saveState(push=false){const prior=history.state||{},depth=push?Number(prior.moveInDepth||0)+1:(prior.moveIn?Number(prior.moveInDepth||0):0);const state={...prior,moveIn:snapshot(),moveInDepth:depth};try{sessionStorage.setItem(stateKey,JSON.stringify(state.moveIn));if(push)history.pushState(state,'',location.href);else history.replaceState(state,'',location.href)}catch{}}function restoreState(value){if(!value||!REGIONS.includes(value.region))return;s.region=value.region;s.yearFocus=value.yearFocus||null;s.selectedMonth=value.selectedMonth||null;$('monthDetail').hidden=!s.selectedMonth;}
const regionLabel=()=>s.region;
function monthData(month){const past=month<=s.historicalAsOf,regions=s.region?[s.region]:REGIONS;if(past){const values=regions.map(region=>s.history.find(x=>x.month===month&&x.region===region)?.households||0);return{value:values.reduce((a,b)=>a+b,0),past:true}}const projects=s.items.filter(x=>x.month===month&&(!s.region||x.region===s.region));return{value:projects.reduce((a,x)=>a+x.households,0),past:false}}
function render(){const annualMode=!s.yearFocus;$('regionHint').textContent=regionLabel();$('regionChips').innerHTML=REGIONS.map(r=>`<button type="button" class="chip${s.region===r?' on':''}" aria-pressed="${s.region===r}" data-region="${r}">${r}</button>`).join('');$('regionChips').querySelectorAll('[data-region]').forEach(b=>b.onclick=()=>{s.region=b.dataset.region;s.selectedMonth=null;s.yearFocus=null;$('monthDetail').hidden=true;saveState();render()});const years=[...new Set([...s.items.map(x=>x.month?.slice(0,4)),...s.history.map(x=>x.month.slice(0,4))].filter(Boolean))].sort().reverse();const coverageMonths=[...s.items.map(x=>x.month),...s.history.map(x=>x.month)].filter(Boolean).sort();const coverageStart=coverageMonths[0],coverageEnd=coverageMonths.at(-1);let keys=annualMode?years:Array.from({length:12},(_,i)=>`${s.yearFocus}-${String(i+1).padStart(2,'0')}`).filter(m=>m>=coverageStart&&m<=coverageEnd);const series=keys.map(key=>{if(annualMode){const months=Array.from({length:12},(_,i)=>`${key}-${String(i+1).padStart(2,'0')}`);return{key,label:`${key}년`,value:months.reduce((sum,m)=>sum+monthData(m).value,0)}}return{key,label:`${Number(key.slice(5))}월`,value:monthData(key).value}});const max=Math.max(1,...series.map(x=>x.value)),average=series.length?series.reduce((sum,x)=>sum+x.value,0)/series.length:0;const averageLabel=annualMode?'전체 연도 평균':'월평균';$('chartTitle').textContent=annualMode?`연도별 입주물량 합계 · ${regionLabel()}`:`${s.yearFocus}년 월별 입주물량 · ${regionLabel()}`;$('yearBack').hidden=annualMode;$('chartHint').innerHTML=`${annualMode?'연도 막대를 누르면 월별로 이동':'월별 막대를 누르면 상세 자료 표시'} · <span class="average-caption"><i></i>${averageLabel} ${fmt(Math.round(average))}세대</span>`;$('chart').innerHTML=series.length?series.map(row=>`<button type="button" role="listitem" class="compare-row${annualMode?'':' month-row'}${s.selectedMonth===row.key?' selected':''}" data-key="${row.key}" aria-label="${row.label} ${fmt(row.value)}세대"><span class="compare-label">${row.label}</span><span class="compare-track"><span class="compare-bar" style="width:${row.value?Math.max(1,row.value/max*100):0}%"></span><span class="mean-line" style="left:${Math.min(100,average/max*100)}%" aria-hidden="true"></span></span><strong class="compare-value">${fmt(row.value)}세대</strong></button>`).join(''):'<div class="graph-empty">표시할 물량 자료가 없습니다.</div>';$('chart').querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{if(annualMode){s.yearFocus=b.dataset.key;s.selectedMonth=null;$('monthDetail').hidden=true;saveState(true);render()}else showMonth(b.dataset.key)});$('periodLine').textContent=`${years.at(-1)||''}~${years[0]||''} · 서울·경기·인천·부산`;if(s.selectedMonth)showMonth(s.selectedMonth,{scroll:false,push:false})}
function showMonth(month,{scroll=true,push=true}={}){s.selectedMonth=month;if(push)saveState(true);const past=month<=s.historicalAsOf,regions=s.region?[s.region]:REGIONS;$('detailTitle').textContent=`${month} · ${past?'아파트 준공 실적':'입주 예정 물량'}`;if(past){const values=regions.map(region=>({region,households:s.history.find(x=>x.month===month&&x.region===region)?.households||0}));$('detailContent').innerHTML=`<p class="detail-summary">${regionLabel()} · 합계 ${fmt(values.reduce((n,x)=>n+x.households,0))}세대</p><div class="detail-list">${values.map(x=>`<div class="detail-item"><b>${x.region}</b><span class="detail-units">${fmt(x.households)}세대</span></div>`).join('')}</div>`}else{const projects=s.items.filter(x=>x.month===month&&(!s.region||x.region===s.region)).sort((a,b)=>b.households-a.households);$('detailContent').innerHTML=projects.length?`<p class="detail-summary">${regionLabel()} · ${fmt(projects.reduce((n,x)=>n+x.households,0))}세대 · ${projects.length}개 단지</p><div class="detail-list">${projects.map(x=>`<div class="detail-item"><div><b>${esc(x.name)}</b><small>${esc(x.region)} · ${esc(x.address)}</small></div><span class="detail-units">${fmt(x.households)}세대</span></div>`).join('')}</div>`:'<div class="empty">해당 월의 입주 예정 자료가 없습니다.</div>'}$('monthDetail').hidden=false;renderMonthSelection();if(scroll)$('monthDetail').scrollIntoView({behavior:'smooth',block:'nearest'})}
function renderMonthSelection(){document.querySelectorAll('.month-row').forEach(row=>row.classList.toggle('selected',row.dataset.key===s.selectedMonth))}
async function init(){try{const response=await fetch('/data/move-in.json',{cache:'no-cache'});if(!response.ok)throw Error();const data=await response.json();try{const saved=JSON.parse(sessionStorage.getItem(stateKey)||'null');if(saved)restoreState(saved)}catch{}s.items=(data.items||[]).filter(x=>x.month&&REGIONS.includes(x.region)&&Number.isFinite(x.households)&&x.households>=30);s.history=(data.history||[]).filter(x=>REGIONS.includes(x.region)&&Number.isFinite(x.households));s.historicalAsOf=data.historicalAsOf||'';const years=[...new Set([...s.items.map(x=>x.month?.slice(0,4)),...s.history.map(x=>x.month.slice(0,4))].filter(Boolean))].sort();if(!years.length)throw Error('입주물량 자료가 없습니다.');$('periodLine').textContent=`조회 기간 ${years[0]}~${years.at(-1)} · ${s.region} 기본 선택`;$('sourceNote').innerHTML=`과거 준공 실적: <a href="${esc(data.historicalSourceUrl||'https://stat.molit.go.kr/portal/cate/statView.do?hRsId=468')}" target="_blank" rel="noopener">국토교통부 주택건설실적통계</a> · 최신 ${esc(s.historicalAsOf||'확인 중')} · 잠정치 포함, 해당 월까지 준공 실적 우선<br>입주 예정: <a href="https://www.data.go.kr/data/15111714/fileData.do" target="_blank" rel="noopener">한국부동산원·부동산R114 공동주택 입주예정물량</a> · 기준일 ${esc(data.sourceAsOf||'확인 필요')} · 30세대 이상`;$('loading').hidden=true;$('content').hidden=false;$('yearBack').onclick=()=>{if(s.yearFocus&&Number(history.state?.moveInDepth||0)>0)history.back();else{s.yearFocus=null;s.selectedMonth=null;$('monthDetail').hidden=true;saveState();render()}};$('clearMonth').onclick=()=>{if(s.selectedMonth&&Number(history.state?.moveInDepth||0)>0)history.back();else{$('monthDetail').hidden=true;s.selectedMonth=null;saveState();renderMonthSelection()}};window.addEventListener('popstate',event=>{const value=event.state?.moveIn;restoreState(value||{region:'서울'});render()});saveState();$('sharePage').onclick=async()=>{try{if(navigator.share)await navigator.share({title:document.title,url:location.href});else await navigator.clipboard.writeText(location.href)}catch{}};render()}catch{$('loading').textContent='입주물량 자료를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.'}}
init()})();
</script></body></html>
