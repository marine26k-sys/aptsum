<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102d3f">
<title>아파트썸 | 아파트 매매가격 통계</title><link rel="icon" type="image/svg+xml" href="/assets/favicon.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="/assets/page-header.css"><script src="/assets/subscriber-session.js?v=1"></script>
<style>
:root{--navy:#102d3f;--teal:#00828a;--dark:#00565c;--red:#e34a4a;--ink:#17283b;--sub:#687c95;--line:#dfe6ef;--soft:#f0f5fa;--pale:#f0fafb}*{box-sizing:border-box}body{margin:0;background:var(--soft);color:var(--ink);font-family:'Noto Sans KR',sans-serif;font-size:14px}.wrap{max-width:760px;margin:auto;padding:12px 16px 50px}header{margin:10px 0 14px!important;padding:10px 54px!important;text-align:center;background:linear-gradient(120deg,#102d3f,#17394b);border:1px solid #ffffff1f;border-radius:17px;box-shadow:0 8px 22px #0f2b3d1a;position:relative;color:white}.logo{display:inline-flex;align-items:center;gap:11px;color:#fff;text-align:left}.brand-mark{flex:none;width:27px;height:27px;color:#83d1d2}.brand-copy{display:flex;flex-direction:column;gap:1px;text-align:left}.brand-name{font-weight:700;font-size:21px;line-height:1.35;letter-spacing:-.8px}.brand-description{font-weight:500;font-size:10.5px;line-height:1.6;letter-spacing:.3px;color:#b7cbd5}.analysis-back{display:flex;position:absolute;left:15px;top:50%;transform:translateY(-50%);color:#fff!important;text-decoration:none!important;width:36px;height:36px;border:1px solid #ffffff59;border-radius:10px;background:#ffffff1f;align-items:center;justify-content:center}.panel{margin:12px 0;padding:16px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 20px #102d3f08}.title{margin:0 0 12px;color:var(--navy);font-size:16px;font-weight:900}.region-select{width:100%;height:44px;padding:0 12px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);font:inherit;font-weight:700}.legend{display:flex;flex-wrap:wrap;gap:16px;margin:4px 0 12px;color:var(--sub);font-weight:700}.legend span{display:inline-flex;align-items:center;gap:7px}.legend i{width:12px;height:12px;border-radius:50%;background:var(--teal)}.legend .median i{background:var(--red)}.chart-wrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}.chart{display:block;width:100%;min-width:520px;height:auto}.chart text{font-family:'Noto Sans KR',sans-serif}.note,.source{color:var(--sub);font-size:11px;line-height:1.7}.status{padding:32px 18px;text-align:center;color:var(--sub)}.source a{color:var(--dark)}.empty{padding:34px 8px;text-align:center;color:var(--sub)}.summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:0 0 12px}.summary div{padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--pale)}.summary small,.summary strong{display:block}.summary small{color:var(--sub);font-weight:700}.summary strong{margin-top:3px;color:var(--dark);font-size:18px}@media(max-width:480px){.wrap{padding:8px 11px 36px}.panel{padding:13px}.summary strong{font-size:16px}}
</style>
</head>
<body><main class="wrap">
<header><a class="analysis-back" href="./index.html" aria-label="메인으로 돌아가기"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6M9 12h11"/></svg></a><div class="logo"><svg class="brand-mark" viewBox="0 0 28 28" aria-hidden="true"><rect x="2" y="15" width="5" height="11" rx="1" fill="currentColor" opacity=".55"/><rect x="11" y="9" width="5" height="17" rx="1" fill="currentColor" opacity=".8"/><rect x="20" y="2" width="5" height="24" rx="1" fill="currentColor"/></svg><div class="brand-copy"><span class="brand-name">아파트썸</span><span class="brand-description">아파트 매매가격 통계</span></div></div></header>
<section id="locked" class="panel status" hidden>비공개 탭입니다. <a href="./index.html">메인 화면</a>에서 운영자 인증 후 이용해 주세요.</section><section id="loading" class="panel status">한국부동산원 통계를 불러오는 중입니다.</section>
<div id="content" hidden><section class="panel"><h1 class="title">아파트 매매가격 · 연도별</h1><select id="region" class="region-select" aria-label="지역 선택"></select></section><section class="panel"><div class="summary"><div><small id="avgLabel">연평균 매매 평균가격</small><strong id="avgValue">-</strong></div><div><small id="medianLabel">연평균 매매 중위가격</small><strong id="medianValue">-</strong></div></div><div class="legend"><span><i></i>평균가격</span><span class="median"><i></i>중위가격</span></div><div class="chart-wrap"><svg id="chart" class="chart" viewBox="0 0 680 340" role="img" aria-label="연도별 아파트 매매 평균·중위가격 그래프"></svg></div><p id="period" class="note"></p></section><p id="source" class="source"></p></div>
</main>
<script>
(()=>{const $=id=>document.getElementById(id),fmt=n=>Number(n).toLocaleString('ko-KR',{maximumFractionDigits:0}),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),stateKey='aptsum-reb-apartment-prices-state';let data=null,region='전국';
function render(){const values=data.regions[region]||[];if(!values.length){$('chart').innerHTML='<text x="340" y="170" text-anchor="middle" fill="#687c95" font-size="15">선택한 지역 자료가 없습니다.</text>';$('avgValue').textContent='자료 없음';$('medianValue').textContent='자료 없음';$('period').textContent='';return}const latest=values.at(-1),years=values.map(x=>x.year),all=[...values.map(x=>x.average),...values.map(x=>x.median)],lo=Math.floor(Math.min(...all)/100)*100,hi=Math.ceil(Math.max(...all)/100)*100,range=Math.max(1,hi-lo),left=52,right=668,top=18,bottom=286,w=right-left,h=bottom-top,x=i=>left+(years.length<2?w/2:i*w/(years.length-1)),y=v=>bottom-(v-lo)/range*h;let svg='';for(let i=0;i<=4;i++){const val=lo+range*i/4,yy=y(val);svg+=`<line x1="${left}" y1="${yy}" x2="${right}" y2="${yy}" stroke="#e4eaf0"/><text x="${left-8}" y="${yy+4}" text-anchor="end" fill="#687c95" font-size="10">${fmt(val)}</text>`}const labelStep=Math.max(1,Math.ceil(years.length/8));years.forEach((year,i)=>{if(i%labelStep===0||i===years.length-1)svg+=`<text x="${x(i)}" y="${bottom+22}" text-anchor="middle" fill="#687c95" font-size="10">${year}</text>`});for(const [key,color] of [['average','#00828a'],['median','#e34a4a']]){const points=values.map((v,i)=>`${x(i)},${y(v[key])}`);svg+=`<polyline points="${points.join(' ')}" fill="none" stroke="${color}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;values.forEach((v,i)=>svg+=`<circle cx="${x(i)}" cy="${y(v[key])}" r="3.2" fill="${color}"><title>${v.year}년 ${key==='average'?'평균':'중위'} ${fmt(v[key])}만원/㎡ · ${v.months}개월</title></circle>`)}$('chart').innerHTML=svg;$('avgValue').textContent=`${fmt(latest.average)}만원/㎡`;$('medianValue').textContent=`${fmt(latest.median)}만원/㎡`;$('avgLabel').textContent=`${latest.year}년 평균가격 (${latest.months}개월)`;$('medianLabel').textContent=`${latest.year}년 중위가격 (${latest.months}개월)`;$('period').textContent=`${years[0]}~${years.at(-1)}년 · 연도별 값은 해당 연도 월별 통계의 산술평균 · 단위 ${data.unit}`}
async function init(){try{const session=await window.aptsumSession.check();if(!session.ok)throw Error('locked');const access=await session.json();if(access.subscribed!==true||access.master!==true)throw Error('locked');const response=await fetch('/data/reb-apartment-prices.json',{cache:'no-cache'});if(!response.ok)throw Error('data');data=await response.json();const regions=Object.keys(data.regions).sort((a,b)=>a==='전국'?-1:b==='전국'?1:a.localeCompare(b,'ko'));if(!regions.length)throw Error('data');try{const saved=JSON.parse(sessionStorage.getItem(stateKey)||'null');if(regions.includes(saved?.region))region=saved.region}catch{}$('region').innerHTML=regions.map(r=>`<option value="${esc(r)}"${r===region?' selected':''}>${esc(r)}</option>`).join('');$('region').onchange=()=>{region=$('region').value;try{sessionStorage.setItem(stateKey,JSON.stringify({region}))}catch{}render()};$('source').innerHTML=`출처: <a href="${esc(data.sourceUrl)}" target="_blank" rel="noopener">${esc(data.source)}</a> · 기준 ${esc(data.asOf)} · ${esc(data.aggregation)}`;$('loading').hidden=true;$('content').hidden=false;render()}catch(e){$('loading').hidden=true;if(e.message==='locked')$('locked').hidden=false;else{$('loading').hidden=false;$('loading').textContent='통계 자료를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.'}}}init()})();
</script></body></html>
