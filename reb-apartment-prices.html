<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102d3f">
<title>아파트썸 | 아파트 매매가격 통계</title><link rel="icon" type="image/svg+xml" href="/assets/favicon.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="/assets/page-header.css"><script src="/assets/subscriber-session.js?v=1"></script>
<style>
:root{--navy:#102d3f;--teal:#00828a;--dark:#00565c;--red:#e34a4a;--ink:#17283b;--sub:#687c95;--line:#dfe6ef;--soft:#f0f5fa;--pale:#f0fafb}*{box-sizing:border-box}body{margin:0;background:var(--soft);color:var(--ink);font-family:'Noto Sans KR',sans-serif;font-size:14px}.wrap{max-width:760px;margin:auto;padding:12px 16px 50px}header{margin:10px 0 14px!important;padding:10px 54px!important;text-align:center;background:linear-gradient(120deg,#102d3f,#17394b);border:1px solid #ffffff1f;border-radius:17px;box-shadow:0 8px 22px #0f2b3d1a;position:relative;color:white}.logo{display:inline-flex;align-items:center;gap:11px;color:#fff;text-align:left}.brand-mark{flex:none;width:27px;height:27px;color:#83d1d2}.brand-copy{display:flex;flex-direction:column;gap:1px;text-align:left}.brand-name{font-weight:700;font-size:21px;line-height:1.35;letter-spacing:-.8px}.brand-description{font-weight:500;font-size:10.5px;line-height:1.6;letter-spacing:.3px;color:#b7cbd5}.analysis-back{display:flex;position:absolute;left:15px;top:50%;transform:translateY(-50%);color:#fff!important;text-decoration:none!important;width:36px;height:36px;border:1px solid #ffffff59;border-radius:10px;background:#ffffff1f;align-items:center;justify-content:center}.panel{margin:12px 0;padding:16px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 20px #102d3f08}.panel-title{margin:0 0 12px;color:var(--navy);font-size:16px;font-weight:900}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{min-height:36px;padding:6px 13px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--sub);font:inherit;font-weight:700;cursor:pointer}.chip.on{border-color:var(--teal);background:#e0f3f4;color:var(--dark)}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-bottom:12px}.stat{padding:13px;border:1px solid var(--line);border-radius:13px;background:linear-gradient(145deg,#fff,#f8fbfd)}.stat-label{color:var(--sub);font-size:11px;font-weight:700}.stat-value{margin-top:3px;color:var(--navy);font-size:21px;font-weight:900;overflow-wrap:anywhere}.stat-value small{margin-left:4px;color:var(--sub);font-size:11px}.legend{display:flex;flex-wrap:wrap;gap:14px;margin:0 0 10px;color:var(--sub);font-size:11px;font-weight:700}.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:9px;height:9px;border-radius:50%;background:var(--teal)}.legend .median i{background:var(--red)}.annual-chart{display:grid;gap:0}.price-year{padding:4px 0 6px;border-bottom:1px dashed #e7edf2}.compare-row{display:grid;width:100%;grid-template-columns:54px minmax(0,1fr) 108px;align-items:center;gap:9px;padding:2px 0;border:0;background:transparent;color:var(--ink);font:inherit;text-align:left}.compare-label{font-weight:800;font-size:12px;white-space:nowrap}.compare-track{height:15px;overflow:hidden;border-radius:999px;background:#edf2f6}.compare-bar{display:block;height:100%;min-width:0;border-radius:999px;background:linear-gradient(90deg,#26a4aa,var(--teal))}.compare-row.median-row .compare-label{font-weight:600;color:var(--sub)}.compare-row.median-row .compare-track{height:13px}.compare-row.median-row .compare-bar{background:linear-gradient(90deg,#f08080,var(--red))}.compare-value{min-width:108px;text-align:right;color:var(--dark);font-size:11px;font-weight:900;white-space:nowrap}.compare-row.median-row .compare-value{color:#b64242}.note{margin:10px 3px;color:var(--sub);font-size:11px;line-height:1.8}.source{margin-top:12px;padding-top:9px;border-top:1px solid var(--line);color:var(--sub);font-size:10px;line-height:1.8}.source a{color:var(--dark)}.status,.lock{padding:25px 14px;text-align:center;color:var(--sub);line-height:1.8}.lock{margin:32px auto;max-width:480px;border:1px solid var(--line);border-radius:16px;background:white}.lock a{color:var(--dark);font-weight:800}@media(max-width:480px){.wrap{padding:8px 12px 35px}.panel{padding:14px}.stat-value{font-size:18px}.compare-row{grid-template-columns:48px minmax(0,1fr) 96px;gap:6px}.compare-value{min-width:96px;font-size:10px}.compare-label{font-size:11px}}
</style>
</head>
<body><main class="wrap">
<header><a class="analysis-back" href="./index.html" aria-label="메인으로 돌아가기"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6M9 12h11"/></svg></a><div class="logo"><svg class="brand-mark" viewBox="0 0 28 28" aria-hidden="true"><rect x="2" y="15" width="5" height="11" rx="1" fill="currentColor" opacity=".55"/><rect x="11" y="9" width="5" height="17" rx="1" fill="currentColor" opacity=".8"/><rect x="20" y="2" width="5" height="24" rx="1" fill="currentColor"/></svg><div class="brand-copy"><span class="brand-name">아파트썸</span><span class="brand-description">아파트 매매가격 통계</span></div></div></header>
<section id="locked" class="panel status" hidden>비공개 탭입니다. <a href="./index.html">메인 화면</a>에서 운영자 인증 후 이용해 주세요.</section><section id="loading" class="panel status">한국부동산원 통계를 불러오는 중입니다.</section>
<div id="content" hidden><section class="panel"><h2 class="panel-title">지역 선택 <small id="regionHint">전국</small></h2><div id="regionChips" class="chips" role="group" aria-label="지역 선택"></div></section><section class="panel"><h2 id="chartTitle" class="panel-title">연도별 아파트 매매가격</h2><div class="stats"><div class="stat"><div id="avgLabel" class="stat-label">최근 평균가격</div><div id="avgValue" class="stat-value">-</div></div><div class="stat"><div id="medianLabel" class="stat-label">최근 중위가격</div><div id="medianValue" class="stat-value">-</div></div></div><div class="legend"><span><i></i>평균가격</span><span class="median"><i></i>중위가격</span></div><div id="chart" class="annual-chart" role="list" aria-label="연도별 아파트 매매 평균·중위가격 그래프"></div><p id="period" class="note"></p></section><p id="source" class="source"></p></div>
</main>
<script>
(()=>{const $=id=>document.getElementById(id),fmt=n=>Number(n).toLocaleString('ko-KR',{maximumFractionDigits:1}),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),stateKey='aptsum-reb-apartment-prices-state';let data=null,region='전국';
function render(){const values=[...(data.regions[region]||[])].sort((a,b)=>b.year-a.year);$('regionHint').textContent=region;$('chartTitle').textContent=`연도별 아파트 매매가격 · ${region}`;$('regionChips').innerHTML=Object.keys(data.regions).sort((a,b)=>a==='전국'?-1:b==='전국'?1:a.localeCompare(b,'ko')).map(r=>`<button type="button" class="chip${r===region?' on':''}" aria-pressed="${r===region}" data-region="${esc(r)}">${esc(r)}</button>`).join('');$('regionChips').querySelectorAll('[data-region]').forEach(button=>button.onclick=()=>{region=button.dataset.region;try{sessionStorage.setItem(stateKey,JSON.stringify({region}))}catch{}render()});if(!values.length){$('chart').innerHTML='<div class="empty">선택한 지역의 가격 자료가 없습니다.</div>';$('avgValue').textContent='자료 없음';$('medianValue').textContent='자료 없음';$('period').textContent='';return}const latest=values[0],max=Math.max(...values.flatMap(x=>[x.average,x.median]));$('avgValue').innerHTML=`${fmt(latest.average)}<small>만원/㎡</small>`;$('medianValue').innerHTML=`${fmt(latest.median)}<small>만원/㎡</small>`;$('avgLabel').textContent=`${latest.year}년 평균가격 · ${latest.months}개월`;$('medianLabel').textContent=`${latest.year}년 중위가격 · ${latest.months}개월`;$('chart').innerHTML=values.map(item=>`<div class="price-year" role="listitem" aria-label="${item.year}년 평균 ${fmt(item.average)}, 중위 ${fmt(item.median)}만원/제곱미터"><div class="compare-row"><span class="compare-label">${item.year}년</span><span class="compare-track"><span class="compare-bar" style="width:${Math.max(1,item.average/max*100)}%"></span></span><strong class="compare-value">${fmt(item.average)}만원/㎡</strong></div><div class="compare-row median-row"><span class="compare-label" aria-hidden="true"></span><span class="compare-track"><span class="compare-bar" style="width:${Math.max(1,item.median/max*100)}%"></span></span><strong class="compare-value">${fmt(item.median)}만원/㎡</strong></div></div>`).join('');$('period').textContent=`${values.at(-1).year}~${latest.year}년 · 연도별 월평균 통계의 산술평균 · 단위 ${data.unit}`}
async function init(){try{const session=await window.aptsumSession.check();if(!session.ok)throw Error('locked');const access=await session.json();if(access.subscribed!==true||access.master!==true)throw Error('locked');const response=await fetch('/data/reb-apartment-prices.json',{cache:'no-cache'});if(!response.ok)throw Error('data');data=await response.json();const regions=Object.keys(data.regions);if(!regions.length)throw Error('data');try{const saved=JSON.parse(sessionStorage.getItem(stateKey)||'null');if(regions.includes(saved?.region))region=saved.region}catch{}$('source').innerHTML=`출처: <a href="${esc(data.sourceUrl)}" target="_blank" rel="noopener">${esc(data.source)}</a> · 기준 ${esc(data.asOf)} · ${esc(data.aggregation)}`;$('loading').hidden=true;$('content').hidden=false;render()}catch(e){$('loading').hidden=true;if(e.message==='locked')$('locked').hidden=false;else{$('loading').hidden=false;$('loading').textContent='통계 자료를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.'}}}init()})();
</script></body></html>
