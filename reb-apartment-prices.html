<style>
:root{--navy:#102d3f;--teal:#00828a;--dark:#00565c;--red:#e34a4a;--ink:#17283b;--sub:#687c95;--line:#dfe6ef;--soft:#f0f5fa;--pale:#f0fafb}*{box-sizing:border-box}body{margin:0;background:var(--soft);color:var(--ink);font-family:'Noto Sans KR',sans-serif;font-size:14px}.wrap{max-width:760px;margin:auto;padding:12px 16px 50px}header{margin:10px 0 14px!important;padding:10px 54px!important;text-align:center;background:linear-gradient(120deg,#102d3f,#17394b);border:1px solid #ffffff1f;border-radius:17px;box-shadow:0 8px 22px #0f2b3d1a;position:relative;color:white}.logo{display:inline-flex;align-items:center;gap:11px;color:#fff;text-align:left}.brand-mark{flex:none;width:27px;height:27px;color:#83d1d2}.brand-copy{display:flex;flex-direction:column;gap:1px;text-align:left}.brand-name{font-weight:700;font-size:21px;line-height:1.35;letter-spacing:-.8px}.brand-description{font-weight:500;font-size:10.5px;line-height:1.6;letter-spacing:.3px;color:#b7cbd5}.analysis-back{display:flex;position:absolute;left:15px;top:50%;transform:translateY(-50%);color:#fff!important;text-decoration:none!important;width:36px;height:36px;border:1px solid #ffffff59;border-radius:10px;background:#ffffff1f;align-items:center;justify-content:center}.header-share{position:absolute;top:50%;right:15px;transform:translateY(-50%);padding:0;background:#ffffff0a;border:1px solid #ffffff33;border-radius:10px;width:36px;height:36px;color:#d5e6ec;cursor:pointer;display:flex;align-items:center;justify-content:center}.header-share svg{display:block;width:18px;height:18px}.panel{margin:12px 0;padding:16px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 20px #102d3f08}.panel-title{margin:0 0 12px;color:var(--navy);font-size:16px;font-weight:900}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{min-height:36px;padding:6px 13px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--sub);font:inherit;font-weight:700;cursor:pointer}.chip.on{border-color:var(--teal);background:#e0f3f4;color:var(--dark)}.metric-toggle{display:inline-flex;gap:0;margin:0 0 10px;padding:3px;border:1px solid var(--line);border-radius:999px;background:#f0f5f8}.metric-toggle button{min-height:34px;padding:5px 14px;border:0;border-radius:999px;background:transparent;color:var(--sub);font:inherit;font-weight:800;cursor:pointer}.metric-toggle button.on{background:var(--teal);color:white}.annual-chart{display:grid;gap:0}.price-year{padding:4px 0 6px;border-bottom:1px dashed #e7edf2}.compare-row{display:grid;width:100%;grid-template-columns:54px minmax(0,1fr) 48px 70px;align-items:center;gap:7px;padding:2px 0;border:0;background:transparent;color:var(--ink);font:inherit;text-align:left}.compare-label{font-weight:800;font-size:12px;white-space:nowrap}.compare-track{height:15px;overflow:hidden;border-radius:999px;background:#edf2f6}.compare-bar{display:block;height:100%;min-width:0;border-radius:999px;background:linear-gradient(90deg,#26a4aa,var(--teal))}.compare-bar.median{background:linear-gradient(90deg,#f08080,var(--red))}.compare-value{min-width:70px;text-align:right;color:var(--dark);font-size:11px;font-weight:900;white-space:nowrap}.compare-value.median{color:#b64242}.note{margin:10px 3px;color:var(--sub);font-size:11px;line-height:1.8}.source{margin-top:12px;padding-top:9px;border-top:1px solid var(--line);color:var(--sub);font-size:10px;line-height:1.8}.source a{color:var(--dark)}.status,.lock{padding:25px 14px;text-align:center;color:var(--sub);line-height:1.8}.lock{margin:32px auto;max-width:480px;border:1px solid var(--line);border-radius:16px;background:white}.lock a{color:var(--dark);font-weight:800}@media(max-width:480px){.wrap{padding:8px 12px 35px}.panel{padding:14px}.compare-row{grid-template-columns:48px minmax(0,1fr) 42px 58px;gap:5px}.compare-value{min-width:58px;font-size:10px}.compare-label{font-size:11px}}
</style>

<style>

<body><main class="wrap">

iceMapTitle" class="panel-title">지역별 아파트 매매가격</h2><div class="stats-chart-subtitle">한국부동산원 통계</div></div><p class="price-map-note">단위: 억원 · 색이 진할수록 높은 가격</p><div id="priceMap" class="price-map-grid" aria-label="지역별 아파트 매매가격 지도"></div></section><p id="source" class="source"></p></div>

<script>
(()=>{const $=id=>document.getElementById(id),eok=n=>(Number(n)/100000).toLocaleString('ko-KR',{minimumFractionDigits:1,maximumFractionDigits:1}),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),stateKey='aptsum-reb-apartment-prices-state';let data=null,region='서울',metric='median',regions=[],view='map';
function saveState(){try{sessionStorage.setItem(stateKey,JSON.stringify({region,metric,view}))}catch{}}
function renderPriceMap(){const rows=data.districtMonthly||[],select=$('priceMapPeriod'),periods=[...new Set(rows.map(r=>r.period))].sort().reverse(),selected=periods.includes(select.value)?select.value:periods[0];select.innerHTML=periods.map(p=>`<option value="${p}"${p===selected?' selected':''}>${p.replace('-','년 ')}월</option>`).join('');select.onchange=renderPriceMap;const current=rows.filter(r=>r.period===selected&&Number.isFinite(r[metric])),max=Math.max(1,...current.map(r=>r[metric])),placements=window.APTSUM_METRO_TILE_MAP.flatMap((row,y)=>row.map(([x,p,n])=>({x,y,p,n}))),available=placements.filter(t=>current.some(r=>r.province===t.p&&r.name===t.n));$('priceMapTitle').textContent=`${selected||''} 아파트 매매${metric==='median'?'중위':'평균'}가격`;$('priceMap').innerHTML=available.map(t=>{const r=current.find(r=>r.province===t.p&&r.name===t.n),outline=t.n===t.p?null:{서울:'#00484c',인천:'#477dd0',부산:'#d38a2d'}[t.p];let edges=t.n===t.p?'border:1px solid #9aabba;':'';if(outline)for(const [side,dx,dy] of [['top',0,-1],['right',1,0],['bottom',0,1],['left',-1,0]])if(!available.some(n=>n.x===t.x+dx&&n.y===t.y+dy&&n.p===t.p))edges+=`border-${side}:2px solid ${outline};`;return `<div class="price-map-tile" style="grid-column:${t.x+1};grid-row:${t.y+1};background:rgba(0,139,145,${.08+.72*Math.pow(r[metric]/max,.65)});${edges}" title="${esc(t.p+' '+t.n)} ${eok(r[metric])}억원"><span>${esc(window.APTSUM_METRO_TILE_NAME(t.n))}</span><strong>${eok(r[metric])}</strong></div>`}).join('');}
function render(){document.querySelectorAll('[data-view]').forEach(button=>{button.setAttribute('aria-pressed',String(button.dataset.view===view));button.onclick=()=>{view=button.dataset.view;saveState();render()}});$('annualRegions').hidden=view!=='annual';$('annualPanel').hidden=view!=='annual';$('mapPanel').hidden=view!=='map';$('mapPeriodControls').hidden=view!=='map';renderPriceMap();const values=[...(data.regions[region]||[])].sort((a,b)=>b.year-a.year),byYear=new Map(values.map(item=>[Number(item.year),item]));$('regionHint').textContent=region;$('chartTitle').textContent=`연도별 아파트 매매${metric==='median'?'중위':'평균'}가격 · ${region}`;$('regionChips').innerHTML=regions.map(r=>`<button type="button" class="chip${r===region?' on':''}" aria-pressed="${r===region}" data-region="${esc(r)}">${esc(r)}</button>`).join('');$('regionChips').querySelectorAll('[data-region]').forEach(button=>button.onclick=()=>{region=button.dataset.region;saveState();render()});$('metricToggle').querySelectorAll('[data-metric]').forEach(button=>{const selected=button.dataset.metric===metric;button.classList.toggle('on',selected);button.setAttribute('aria-pressed',String(selected));button.onclick=()=>{metric=button.dataset.metric;saveState();render()}});if(!values.length){$('chart').innerHTML='<div class="empty">선택한 지역의 가격 자료가 없습니다.</div>';return}const latest=values[0],max=Math.max(...values.map(item=>item[metric]));$('chart').innerHTML=values.map(item=>{const value=eok(item[metric]),previous=byYear.get(Number(item.year)-1),change=previous&&Number(previous[metric])?((Number(item[metric])-Number(previous[metric]))/Number(previous[metric]))*100:null,changeText=change===null?'<small class="year-change empty" aria-hidden="true"></small>':`<small class="year-change ${change>0?'up':change<0?'down':'flat'}">${change>0?'+':''}${change.toFixed(0)}%</small>`,changeAria=change===null?'':`, 전년 대비 ${change.toFixed(1)}퍼센트`;return`<div class="price-year" role="listitem" aria-label="${item.year}년 아파트 ${metric==='median'?'중위':'평균'}가격 ${value}억원${changeAria}"><div class="compare-row"><span class="compare-label">${item.year}년</span><span class="compare-track"><span class="compare-bar${metric==='median'?' median':''}" style="width:${Math.max(1,item[metric]/max*100)}%"></span></span>${changeText}<strong class="compare-value${metric==='median'?' median':''}">${value}억</strong></div></div>`}).join('')}
async function init(){try{const response=await fetch('https://raw.githubusercontent.com/marine26k-sys/aptsum/reb-weekly-data/data/reb-apartment-prices.json?v='+Date.now(),{cache:'no-store'});if(!response.ok)throw Error('data');data=await response.json();regions=['서울','경기','인천','부산'].filter(r=>Object.hasOwn(data.regions,r));if(!regions.length)throw Error('data');try{const saved=JSON.parse(sessionStorage.getItem(stateKey)||'null');if(['annual','map'].includes(saved?.view))view=saved.view;if(regions.includes(saved?.region))region=saved.region;if(['average','median'].includes(saved?.metric))metric=saved.metric}catch{}$('source').innerHTML=`출처: <a href="${esc(data.sourceUrl)}" target="_blank" rel="noopener">${esc(data.source)}</a> · 기준 ${esc(data.asOf)} · ${esc(data.aggregation)}`;$('loading').hidden=true;$('content').hidden=false;$('sharePage').onclick=async()=>{try{if(navigator.share)await navigator.share({title:document.title,url:location.href});else await navigator.clipboard.writeText(location.href)}catch{}};render()}catch(e){$('loading').hidden=true;$('content').hidden=true;$('loading').hidden=false;$('loading').textContent='통계 자료를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.'}}init()})();
</script><script src="/assets/tab-click-tracking.js"></script></body></html>
