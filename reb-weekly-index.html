<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102d3f">
<title>아파트썸 | 주간 매매가격지수</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="/assets/page-header.css"><script src="/assets/subscriber-session.js?v=1"></script>
<style>
:root{--navy:#102d3f;--teal:#008b91;--dark:#00565c;--ink:#17283b;--sub:#687c95;--line:#dfe6ef;--soft:#f0f5fa;--pale:#f0fafb}*{box-sizing:border-box}body{margin:0;background:var(--soft);color:var(--ink);font-family:'Noto Sans KR',sans-serif;font-size:14px}.wrap{max-width:760px;margin:auto;padding:12px 16px 50px}header{margin:10px 0 14px!important;padding:10px 54px!important;background:linear-gradient(120deg,#102d3f,#17394b);border:1px solid #ffffff1f;border-radius:17px;box-shadow:0 8px 22px #0f2b3d1a;position:relative;color:white}.logo{display:inline-flex;align-items:center;gap:11px;color:#fff;text-align:left}.brand-mark{flex:none;width:27px;height:27px;color:#83d1d2}.brand-copy{display:flex;flex-direction:column;gap:1px}.brand-name{font-weight:700;font-size:21px;line-height:1.35;letter-spacing:-.8px}.brand-description{font-weight:500;font-size:10.5px;line-height:1.6;letter-spacing:.3px;color:#b7cbd5}.analysis-back{display:flex;position:absolute;left:15px;top:50%;transform:translateY(-50%);color:#fff!important;text-decoration:none!important;width:36px;height:36px;border:1px solid #ffffff59;border-radius:10px;background:#ffffff1f;align-items:center;justify-content:center}.header-share{position:absolute;top:50%;right:15px;transform:translateY(-50%);padding:0;background:#ffffff0a;border:1px solid #ffffff33;border-radius:10px;width:36px;height:36px;color:#d5e6ec;cursor:pointer;display:flex;align-items:center;justify-content:center}.header-share svg{display:block;width:18px;height:18px}.panel{margin:12px 0;padding:16px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 20px #102d3f08}.panel-title{margin:0 0 12px;color:var(--navy);font-size:16px;font-weight:900}.region-panel{text-align:center}.region-panel>.panel-title{text-align:center}.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:7px}.chip{min-height:36px;padding:6px 13px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--sub);font:inherit;font-weight:700;cursor:pointer}.chip.on{border-color:var(--teal);background:#e0f3f4;color:var(--dark)}.chart-panel{position:relative}.chart-brand{display:flex;align-items:center;justify-content:center;gap:6px;margin:0 0 7px;color:var(--teal);font-size:12px;font-weight:900}.chart-brand-mark{width:19px;height:19px;flex:none;fill:var(--teal)}.chart-panel>#chartTitle{text-align:center}.range{display:flex;justify-content:center;gap:6px;margin:0 auto 12px}.range .chip{min-width:56px}.chart-wrap{width:100%;overflow:hidden}.chart-wrap svg{display:block;width:100%;height:auto;overflow:visible}.gridline{stroke:#dfe6ef;stroke-width:1}.chart-line{fill:none;stroke:var(--teal);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.chart-dot{fill:var(--teal);stroke:#fff;stroke-width:1.5}.axis-label{fill:#8394aa;font-size:11px;font-family:'Noto Sans KR',sans-serif}.note{margin:10px 3px 0;color:var(--sub);font-size:11px;line-height:1.8;text-align:center}.source{margin-top:12px;padding-top:9px;border-top:1px solid var(--line);color:var(--sub);font-size:10px;line-height:1.8}.source a{color:var(--dark)}.status,.lock{padding:25px 14px;text-align:center;color:var(--sub);line-height:1.8}.lock{margin:32px auto;max-width:480px;border:1px solid var(--line);border-radius:16px;background:white}.lock a{color:var(--dark);font-weight:800}.latest{margin:0 0 10px;text-align:center;color:var(--dark);font-size:13px;font-weight:800}.metric-caption{text-align:center;color:var(--sub);font-size:11px}.empty{padding:32px 10px;text-align:center;color:var(--sub)}[hidden]{display:none!important}@media(max-width:480px){.wrap{padding:8px 12px 35px}.panel{padding:14px}}
</style>
</head>
<body><main class="wrap">
<header><a class="analysis-back" href="./index.html" aria-label="메인으로 돌아가기"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6M9 12h11"/></svg></a><div class="logo"><svg class="brand-mark" viewBox="0 0 28 28" aria-hidden="true"><rect x="2" y="15" width="5" height="11" rx="1" fill="currentColor" opacity=".55"/><rect x="11" y="9" width="5" height="17" rx="1" fill="currentColor" opacity=".8"/><rect x="20" y="2" width="5" height="24" rx="1" fill="currentColor"/></svg><div class="brand-copy"><span class="brand-name">아파트썸</span><span class="brand-description">주간 매매가격지수</span></div></div><button class="header-share" id="sharePage" title="공유" aria-label="현재 통계 공유"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3m-4 4 4-4 4 4M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg></button></header>
<section id="locked" class="panel lock" hidden>비공개 탭입니다. <a href="./index.html">메인 화면</a>에서 운영자 인증 후 이용해 주세요.</section><section id="loading" class="panel status">한국부동산원 주간 통계를 불러오는 중입니다.</section>
<div id="content" hidden><section class="panel region-panel"><h2 class="panel-title">지역 선택 <small id="regionHint">서울</small></h2><div id="regionChips" class="chips" role="group" aria-label="지역"></div></section><section class="panel chart-panel"><div class="chart-brand"><svg class="chart-brand-mark" viewBox="0 0 28 28" aria-hidden="true"><rect x="3" y="15" width="5" height="10" rx="1"/><rect x="11" y="9" width="5" height="16" rx="1" opacity=".8"/><rect x="19" y="3" width="5" height="22" rx="1" opacity=".65"/></svg><span>아파트썸</span></div><h2 id="chartTitle" class="panel-title">주간 아파트 매매가격지수 · 서울</h2><div id="range" class="range" role="group" aria-label="조회 기간"><button class="chip" data-years="1">1년</button><button class="chip" data-years="3">3년</button><button class="chip" data-years="5">5년</button><button class="chip" data-years="all">전체</button></div><div id="latest" class="latest"></div><div id="chart" class="chart-wrap" role="img" aria-label="주간 아파트 매매가격지수 그래프"></div><p class="metric-caption">주간 지수 · 기준시점 2021.06.28 = 100</p><p class="note">한국부동산원 주택가격동향조사에 따른 지수이며, 실제 매매 거래가격 자체를 뜻하지 않습니다.</p></section><p id="source" class="source"></p></div>
</main>
<script>
(()=>{const $=id=>document.getElementById(id),REGIONS=['서울','경기','인천','부산'],STATE_KEY='aptsum-reb-weekly-index-state';let data,region='서울',years='3';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{sessionStorage.setItem(STATE_KEY,JSON.stringify({region,years}))}catch{}}function render(){const all=data.regions[region]||[],last=all.at(-1),cut=years==='all'?0:Date.parse(`${Number(last.date.slice(0,4))-Number(years)}-01-01`),rows=all.filter(x=>years==='all'||Date.parse(x.date)>=cut);$('regionHint').textContent=region;$('chartTitle').textContent=`주간 아파트 매매가격지수 · ${region}`;$('regionChips').innerHTML=REGIONS.map(x=>`<button type="button" class="chip${x===region?' on':''}" data-region="${x}" aria-pressed="${x===region}">${x}</button>`).join('');$('regionChips').querySelectorAll('[data-region]').forEach(b=>b.onclick=()=>{region=b.dataset.region;save();render()});$('range').querySelectorAll('[data-years]').forEach(b=>{b.classList.toggle('on',b.dataset.years===years);b.setAttribute('aria-pressed',b.dataset.years===years);b.onclick=()=>{years=b.dataset.years;save();render()}});if(!rows.length){$('chart').innerHTML='<div class="empty">표시할 자료가 없습니다.</div>';return}const W=680,H=300,L=52,R=10,T=12,B=34,vals=rows.map(x=>x.index),min=Math.floor(Math.min(...vals)*10)/10,max=Math.ceil(Math.max(...vals)*10)/10,span=max-min||1,innerW=W-L-R,innerH=H-T-B,x=i=>L+(rows.length===1?innerW/2:i/(rows.length-1)*innerW),y=v=>T+(max-v)/span*innerH;const points=rows.map((p,i)=>`${x(i).toFixed(1)},${y(p.index).toFixed(1)}`).join(' '),ticks=[0,.5,1].map(r=>{const v=max-span*r,yy=T+innerH*r;return `<line class="gridline" x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}"/><text class="axis-label" x="${L-7}" y="${yy+4}" text-anchor="end">${v.toFixed(1)}</text>`}).join(''),labels=[0,.25,.5,.75,1].map(r=>{const i=Math.round((rows.length-1)*r),label=rows[i]?.date?.slice(2,7);return `<text class="axis-label" x="${x(i)}" y="${H-8}" text-anchor="middle">${esc(label)}</text>`}).join(''),dots=rows.map((p,i)=>`<circle class="chart-dot" cx="${x(i)}" cy="${y(p.index)}" r="2.2"><title>${esc(p.date)} · ${p.index.toFixed(3)}</title></circle>`).join('');$('chart').innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(region)} 주간 매매가격지수 ${esc(rows[0].date)}부터 ${esc(last.date)}까지">${ticks}<polyline class="chart-line" points="${points}"/>${dots}${labels}</svg>`;$('latest').textContent=`최근 기준 ${last.date} · ${last.index.toFixed(3)}`;save()}async function init(){try{const session=await window.aptsumSession.check();if(!session.ok){$('loading').hidden=true;$('locked').hidden=false;return}const access=await session.json();if(access.subscribed!==true||access.master!==true){$('loading').hidden=true;$('locked').hidden=false;return}const saved=JSON.parse(sessionStorage.getItem(STATE_KEY)||'null');if(saved&&REGIONS.includes(saved.region))region=saved.region;if(saved&&['1','3','5','all'].includes(String(saved.years)))years=String(saved.years);const response=await fetch('/data/reb-weekly-index.json',{cache:'no-cache'});if(!response.ok)throw Error();data=await response.json();$('loading').hidden=true;$('content').hidden=false;$('source').innerHTML=`출처: <a href="${esc(data.sourceUrl)}" target="_blank" rel="noopener">한국부동산원 R-ONE Open API</a> · 주간 아파트 매매가격지수 · 기준시점 ${esc(data.unit)} · 최신 자료 ${esc(data.asOf||'')}`;$('sharePage').onclick=async()=>{try{if(navigator.share)await navigator.share({title:document.title,url:location.href});else await navigator.clipboard.writeText(location.href)}catch{}};render()}catch{$('loading').textContent='주간 지수 자료를 불러오지 못했습니다. 자료 갱신 후 다시 시도해 주세요.'}}init()})();
</script></body></html>
