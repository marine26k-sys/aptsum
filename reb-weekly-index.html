<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="/assets/page-header.css"><script src="/assets/subscriber-session.js?v=1"></script>
<style>
:root{--navy:#102d3f;--teal:#008b91;--dark:#00565c;--ink:#17283b;--sub:#687c95;--line:#dfe6ef;--soft:#f0f5fa;--pale:#f0fafb}*{box-sizing:border-box}body{margin:0;background:var(--soft);color:var(--ink);font-family:'Noto Sans KR',sans-serif;font-size:14px;line-height:1.6}.wrap{max-width:760px;margin:auto;padding:0 16px 50px}header{margin:10px 0 14px!important;padding:10px 54px!important;background:linear-gradient(120deg,#102d3f,#17394b);border:1px solid #ffffff1f;border-radius:17px;box-shadow:0 8px 22px #0f2b3d1a;position:relative;color:white}.logo{display:inline-flex;align-items:center;gap:11px;color:#fff;text-align:left}.brand-mark{flex:none;width:27px;height:27px;color:#83d1d2}.brand-copy{display:flex;flex-direction:column;gap:1px}.brand-name{font-weight:700;font-size:21px;line-height:1.35;letter-spacing:-.8px}.brand-description{font-weight:500;font-size:10.5px;line-height:1.6;letter-spacing:.3px;color:#b7cbd5}.analysis-back{display:flex;position:absolute;left:15px;top:50%;transform:translateY(-50%);color:#fff!important;text-decoration:none!important;width:36px;height:36px;border:1px solid #ffffff59;border-radius:10px;background:#ffffff1f;align-items:center;justify-content:center}.header-share{position:absolute;top:50%;right:15px;transform:translateY(-50%);padding:0;background:#ffffff0a;border:1px solid #ffffff33;border-radius:10px;width:36px;height:36px;color:#d5e6ec;cursor:pointer;display:flex;align-items:center;justify-content:center}.header-share svg{display:block;width:18px;height:18px}.controls{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.controls button,.controls select{font:inherit;min-height:40px;padding:8px 14px;border:1px solid #a8e0e4;border-radius:10px;background:#fff;color:#00565c;cursor:pointer}.controls button[aria-pressed=true]{background:#00828a;color:#fff}.controls select{min-width:150px}.cycle-label{display:inline-flex;align-items:center;min-height:40px;padding:8px 14px;border:1px solid #a8e0e4;border-radius:10px;background:#00828a;color:white;font-weight:700}.meta{margin:4px 0 8px;color:var(--sub);font-size:12px}.card{position:relative;background:#fff;border:1px solid #a8e0e4;border-radius:16px;overflow:clip}.card-hd{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:15px 18px;border-radius:16px 16px 0 0;box-shadow:0 2px 6px #102d3f26}.hd-top{position:relative;display:flex;align-items:center;justify-content:center;min-height:22px;margin-bottom:5px}.hd-logo{position:absolute;left:0;display:inline-flex;align-items:center;gap:4px;color:#fff}.hd-logo svg{width:12px;height:12px;flex:none}.hd-logo span{font-size:13px;font-weight:800;line-height:1.3}.hd-badge{font-size:13px;font-weight:800;color:#fff;background:#00828a;padding:6px 13px;border-radius:16px}.card-hd h2{margin:0 0 2px;padding:0;background:none;color:#fff;text-align:center;font-size:20px;font-weight:900;letter-spacing:-.5px}.regional-basis{margin-top:2px;text-align:center;color:#b7cbd5;font-size:11px;line-height:1.4}.regional-vs{background:#ffffff12;border-radius:8px;padding:7px 10px;display:flex;align-items:center;justify-content:center;gap:5px;margin-top:10px;color:#7fd4d9;font-size:12px;font-weight:700;line-height:1.5}.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:#d6e0e7}.group{grid-column:1/-1;padding:8px 12px;background:var(--navy);color:#fff;font-size:13px;font-weight:900}.province-grid{grid-column:1/-1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px}.empty{height:60px;min-height:60px;background:#edf2f6}.cell{height:60px;min-width:0;padding:3px 1px;border:0;border-radius:0;background:white;color:var(--ink);text-align:center;line-height:1.2;cursor:default}.cell b{display:flex;min-height:23px;align-items:center;justify-content:center;padding:0 2px;font-size:9px;line-height:1.15;letter-spacing:-.4px;white-space:normal;overflow-wrap:anywhere;word-break:keep-all}.cell strong{display:block;margin-top:1px;font-size:12px}.cell small{display:block;margin-top:1px;color:#526375;font-size:8px}.cell.insufficient{background:#f1f5f9!important}.cell.insufficient strong{font-size:8px;font-weight:500;color:#64748b;white-space:nowrap}.legend{padding:12px;text-align:center;color:var(--sub);font-size:11px}.source{margin-top:12px;padding-top:9px;border-top:1px solid var(--line);color:var(--sub);font-size:10px;line-height:1.8}.source a{color:var(--dark)}.status,.lock{padding:25px 14px;text-align:center;color:var(--sub);line-height:1.8}.lock{margin:32px auto;max-width:480px;border:1px solid var(--line);border-radius:16px;background:white}.lock a{color:var(--dark);font-weight:800}.empty-message{padding:32px 10px;text-align:center;color:var(--sub)}[hidden]{display:none!important}@media(max-width:480px){.wrap{padding:0 12px 35px}.cell b{font-size:8px}.cell strong{font-size:11px}.controls select{min-width:130px}}
</style>
</head>
<body><main class="wrap">
<header><a class="analysis-back" href="./index.html" aria-label="메인으로 돌아가기"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6M9 12h11"/></svg></a><div class="logo"><svg class="brand-mark" viewBox="0 0 28 28" aria-hidden="true"><rect x="2" y="15" width="5" height="11" rx="1" fill="currentColor" opacity=".55"/><rect x="11" y="9" width="5" height="17" rx="1" fill="currentColor" opacity=".8"/><rect x="20" y="2" width="5" height="24" rx="1" fill="currentColor"/></svg><div class="brand-copy"><span class="brand-name">아파트썸</span><span class="brand-description">매매가격지수 변동률</span></div></div><button class="header-share" id="sharePage" title="공유" aria-label="현재 통계 공유"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3m-4 4 4-4 4 4M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg></button></header>
<section id="locked" class="card lock" hidden>비공개 탭입니다. <a href="./index.html">메인 화면</a>에서 운영자 인증 후 이용해 주세요.</section><section id="loading" class="card status">한국부동산원 매매가격지수 자료를 불러오는 중입니다.</section>
<div id="content" hidden><div class="controls" role="group" aria-label="조회 주기"><button id="monthlyMode" type="button" aria-pressed="true">월간 변동률</button><button id="weeklyMode" type="button" aria-pressed="false">주간 변동률</button></div><div class="controls" aria-label="기준 기간"><span id="cycleLabel" class="cycle-label">월간</span><select id="period" aria-label="기준 기간"></select></div><p class="meta" id="updated"></p><section class="card"><div class="card-hd"><div class="hd-top"><span class="hd-logo"><svg viewBox="0 0 28 28" aria-hidden="true"><rect x="2" y="15" width="5" height="11" rx="1" fill="#83D1D2" opacity=".55"/><rect x="11" y="9" width="5" height="17" rx="1" fill="#83D1D2" opacity=".8"/><rect x="20" y="2" width="5" height="24" fill="#83D1D2"/></svg><span>아파트썸</span></span><span class="hd-badge">한국부동산원 지수</span></div><h2 id="title">불러오는 중…</h2><div id="basis" class="regional-basis"></div><div id="vs" class="regional-vs"></div></div><div class="grid" id="grid"></div><div class="legend"><span style="color:#2563eb">■ 하락</span> · □ 보합 · <span style="color:#ef4444">■ 상승</span> · 직전 월/주 대비 지수 변동률</div></section><p id="source" class="source"></p></div>
</main><script type="module">
import {REGIONAL_LAYOUT} from '/shared/regional-layout.mjs';
(()=>{
 const $=id=>document.getElementById(id),PROVINCES=['서울','경기','인천','부산'],KEY='aptsum-reb-price-index-state';
 let data,kind='monthly',selectedPeriod='';const grid=$('grid'),period=$('period');
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 function listPeriods(){return [...new Set(data.regions.flatMap(region=>(region[kind]||[]).map(row=>row.period)))].sort((a,b)=>b.localeCompare(a));}
 function formatPeriod(key,row){if(row?.date)return row.date;if(!key)return '이전 자료 없음';return kind==='monthly'?`${key.slice(0,4)}년 ${Number(key.slice(4))}월`:`${key.slice(0,4)}년 ${key.slice(4)}주`;}
 function fillPeriod(){const periods=listPeriods();if(!periods.includes(selectedPeriod))selectedPeriod=periods[0]||'';period.replaceChildren(...periods.map(key=>{const option=document.createElement('option');option.value=key;option.textContent=formatPeriod(key);option.selected=key===selectedPeriod;return option;}));}
 function compare(region){const rows=region[kind]||[];const i=rows.findIndex(row=>row.period===selectedPeriod);if(i<0)return null;const current=rows[i],previous=rows.slice(0,i).at(-1);return {current,previous,rate:previous&&previous.index!==0?(current.index/previous.index-1)*100:null};}
 function color(rate){if(rate==null)return '#f1f5f9';if(Math.abs(rate)<.005)return '#fff';const alpha=Math.min(.68,.09+Math.abs(rate)/12);return rate>0?`rgba(239,68,68,${alpha})`:`rgba(59,130,246,${alpha})`;}
 function render(){
  const periods=listPeriods();if(!periods.length){grid.innerHTML='<div class="empty-message">선택한 주기의 자료가 없습니다.</div>';return;}if(!periods.includes(selectedPeriod))selectedPeriod=periods[0];fillPeriod();
  const first=data.regions.find(r=>(r[kind]||[]).some(x=>x.period===selectedPeriod));const firstSeries=first?.[kind]||[];const selectedIndex=firstSeries.findIndex(x=>x.period===selectedPeriod);const selected=firstSeries[selectedIndex];const previous=firstSeries.slice(0,selectedIndex).at(-1);
  $('title').textContent=formatPeriod(selectedPeriod,selected);$('basis').textContent=`자료 기준일 ${data.meta[kind].asOf} · 지수 기준시점 ${kind==='monthly'?'2026년 6월':'2026년 7월 6일'} = 100`;
  $('vs').innerHTML=`<span>${formatPeriod(previous?.period,previous)}</span><span class="vs">vs</span><span>${formatPeriod(selectedPeriod,selected)}</span>`;grid.replaceChildren();
  for(const province of PROVINCES){const label=document.createElement('div');label.className='group';label.textContent=province;grid.append(label);
   for(const row of REGIONAL_LAYOUT[province]){const rowGrid=document.createElement('div');rowGrid.className='province-grid';grid.append(rowGrid);
    for(const district of row){if(!district){const blank=document.createElement('div');blank.className='empty';blank.setAttribute('aria-hidden','true');rowGrid.append(blank);continue;}
     const region=data.regions.find(r=>r.province===province&&r.name===district),metric=region&&compare(region),cell=document.createElement('div');cell.className='cell'+(metric?.rate==null?' insufficient':'');cell.style.background=color(metric?.rate??null);
     const name=document.createElement('b');name.textContent=district;const value=document.createElement('strong');value.textContent=metric?.rate==null?'자료 없음':`${metric.rate>0?'+':''}${metric.rate.toFixed(1)}%`;
     const note=document.createElement('small');note.textContent=metric?.rate==null?'':`${metric.previous.index.toFixed(1)} → ${metric.current.index.toFixed(1)}`;cell.append(name,value,note);cell.setAttribute('aria-label',`${province} ${district} ${value.textContent}`);rowGrid.append(cell);
    }
   }
  }
  $('cycleLabel').textContent=kind==='monthly'?'월간':'주간';try{sessionStorage.setItem(KEY,JSON.stringify({kind,selectedPeriod}));}catch{}
 }
 function setKind(next){kind=next;selectedPeriod=listPeriods()[0]||'';$('monthlyMode').setAttribute('aria-pressed',String(kind==='monthly'));$('weeklyMode').setAttribute('aria-pressed',String(kind==='weekly'));render();}
 async function init(){try{
  const session=await window.aptsumSession.check();if(!session.ok){$('loading').hidden=true;$('locked').hidden=false;return;}const access=await session.json();if(access.subscribed!==true||access.master!==true){$('loading').hidden=true;$('locked').hidden=false;return;}
  try{const saved=JSON.parse(sessionStorage.getItem(KEY)||'null');if(saved?.kind==='weekly')kind='weekly';if(saved?.selectedPeriod)selectedPeriod=saved.selectedPeriod;}catch{}
  const response=await fetch('https://raw.githubusercontent.com/marine26k-sys/aptsum/refs/heads/reb-weekly-data/data/reb-weekly-index.json',{cache:'no-cache'});if(!response.ok)throw new Error('data fetch');data=await response.json();
  $('loading').hidden=true;$('content').hidden=false;$('monthlyMode').onclick=()=>setKind('monthly');$('weeklyMode').onclick=()=>setKind('weekly');period.onchange=()=>{selectedPeriod=period.value;render();};
  $('updated').textContent=`월간 최신 자료 ${data.meta.monthly.asOf} · 주간 최신 자료 ${data.meta.weekly.asOf} · 갱신 ${new Date(data.updatedAt).toLocaleString('ko-KR',{timeZone:'Asia/Seoul'})} (한국시간)`;
  $('source').innerHTML=`출처: <a href="${esc(data.sourceUrl)}" target="_blank" rel="noopener">한국부동산원 R-ONE Open API</a> · 월간 기준시점 2026.06=100 · 주간 기준시점 2026.07.06=100 · 지수 수준보다 전월/전주 변동률을 비교합니다.`;
  $('sharePage').onclick=async()=>{try{if(navigator.share)await navigator.share({title:document.title,url:location.href});else await navigator.clipboard.writeText(location.href);}catch{}};
  if(!listPeriods().includes(selectedPeriod))selectedPeriod=listPeriods()[0]||'';render();
 }catch{$('loading').textContent='매매가격지수 자료를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.';}}
 init();
})();
</script></body></html>
