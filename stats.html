<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>방문자 통계 — 아파트썸</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --teal:#00828A; --teal-dark:#00565C; --teal-soft:#E0F2F3; --teal-light-soft:#F2FBFB;
    --navy:#0F2B3D; --slate-bg:#F1F5F9; --ink:#1E293B; --sub:#64748B; --line:#E2E8F0;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Noto Sans KR',sans-serif;background:var(--slate-bg);color:var(--ink);line-height:1.6;font-variant-numeric:tabular-nums;min-height:100vh;word-break:keep-all}
  .wrap{max-width:420px;margin:0 auto;padding:0 16px 60px;position:relative}
  header{padding:16px 14px;text-align:center;background:var(--navy);border-radius:16px;margin:10px 0 14px;box-shadow:0 2px 14px rgba(15,43,61,.18);position:relative}
  .logo{display:inline-flex;align-items:center;gap:8px;font-weight:900;font-size:19px;color:#fff;letter-spacing:-.5px}
  header p{font-size:11.5px;color:rgba(255,255,255,.7);margin-top:4px}
  .back{position:absolute;top:50%;left:14px;transform:translateY(-50%);background:rgba(255,255,255,.14);border:none;border-radius:8px;width:32px;height:32px;color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none}
  .back:active{background:rgba(255,255,255,.28)}

  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .stat-card{background:#fff;border-radius:16px;padding:14px 16px;border:1.5px solid var(--line)}
  .stat-card .lbl{font-size:11.5px;color:var(--sub);font-weight:700;margin-bottom:4px}
  .stat-card .val{font-size:24px;font-weight:900;color:var(--navy)}
  .stat-card .val span{font-size:12px;font-weight:700;color:var(--sub);margin-left:2px}

  .card{background:#fff;border-radius:16px;padding:14px 16px 16px;border:1.5px solid var(--line);margin-bottom:14px}
  .card-title{font-size:13px;font-weight:800;color:var(--navy);margin-bottom:10px}

  .chart{display:flex;align-items:flex-end;gap:4px;height:126px;margin-bottom:6px}
  .chart-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
  .chart-val{font-size:8.5px;font-weight:700;color:var(--ink);margin-bottom:3px;white-space:nowrap}
  .chart-val.today{color:var(--navy)}
  .chart-bar{width:100%;max-width:20px;background:var(--teal);border-radius:4px 4px 2px 2px;transition:height .4s ease}
  .chart-bar.today{background:var(--navy)}
  .chart-labels{display:flex;gap:4px}
  .chart-lbl{flex:1;text-align:center;font-size:8.5px;color:var(--sub);min-width:0;overflow:hidden;white-space:nowrap}

  .page-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--slate-bg)}
  .page-row:last-child{border-bottom:none}
  .page-dot{flex:none;width:9px;height:9px;border-radius:3px;background:var(--teal)}
  .page-main{flex:1;min-width:0}
  .page-name{font-size:12.5px;font-weight:700;color:var(--ink)}
  .page-bar-track{margin-top:5px;height:6px;background:var(--slate-bg);border-radius:3px;overflow:hidden}
  .page-bar-fill{height:100%;background:var(--teal);border-radius:3px;transition:width .4s ease}
  .page-nums{flex:none;text-align:right}
  .page-nums b{font-size:13px;color:var(--navy)}
  .page-nums div{font-size:9.5px;color:var(--sub)}

  .note{font-size:10px;color:var(--sub);text-align:center;margin-top:6px;line-height:1.6}
  .loading,.err{text-align:center;padding:60px 20px;color:var(--sub);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="back" href="./index.html" aria-label="메인으로">←</a>
    <span class="logo"><svg width="14" height="14" viewBox="0 0 20 20"><rect x="2" y="10" width="4" height="8" fill="#00A9B4"/><rect x="8" y="6" width="4" height="12" fill="#7FD4D9"/><rect x="14" y="2" width="4" height="16" fill="#00A9B4"/></svg>방문자 통계</span>
    <p>아파트썸 3개 페이지 방문 현황</p>
  </header>

  <div id="app"><div class="loading">불러오는 중…</div></div>
</div>

<script>
const $ = (sel, el=document) => el.querySelector(sel);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function showLogin(error = ""){
  $("#app").innerHTML = `
    <div class="card">
      <div class="card-title">관리자 인증</div>
      <p style="margin:0 0 14px;color:var(--muted);font-size:13px;line-height:1.65">방문자 통계는 관리자만 볼 수 있습니다. Netlify에 설정한 통계 관리자 코드를 입력하세요.</p>
      <form id="statsLoginForm">
        <input id="statsCode" type="password" autocomplete="current-password" placeholder="통계 관리자 코드" aria-label="통계 관리자 코드" style="box-sizing:border-box;width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font:inherit">
        <button type="submit" style="margin-top:10px;padding:10px 15px;border:0;border-radius:8px;background:var(--accent);color:#fff;font:inherit;font-weight:700;cursor:pointer">통계 보기</button>
      </form>
      <div id="statsLoginError" role="alert" style="min-height:18px;margin-top:10px;color:#d95d5d;font-size:12px">${esc(error)}</div>
    </div>
  `;

  $("#statsLoginForm").addEventListener("submit", submitStatsCode);
  $("#statsCode").focus();
}

function showConfigError(){
  $("#app").innerHTML = `<div class="err">통계 관리자 인증이 아직 설정되지 않았습니다.<br>Netlify 환경 변수에 <b>STATS_ACCESS_CODE</b>를 추가한 뒤 다시 배포하세요.</div>`;
}

async function submitStatsCode(event){
  event.preventDefault();
  const code = $("#statsCode").value;
  const error = $("#statsLoginError");

  if(!code){
    error.textContent = "관리자 코드를 입력하세요.";
    return;
  }

  const button = $("#statsLoginForm button");
  button.disabled = true;
  button.textContent = "확인 중…";

  try{
    const res = await fetch("/api/stats-auth", {
      method: "POST",
      cache: "no-store",
      credentials: "same-origin",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ code }),
    });

    if(res.ok){
      await load();
      return;
    }

    const data = await res.json().catch(() => ({}));
    error.textContent = data.error === "stats_auth_not_configured"
      ? "Netlify에 STATS_ACCESS_CODE가 설정되지 않았습니다."
      : data.error === "too_many_attempts"
        ? `관리자 코드를 여러 번 틀려 잠시 잠겼습니다. 약 ${Math.ceil((data.retryAfter || 1800) / 60)}분 후 다시 시도하세요.`
        : Number.isInteger(data.remaining)
          ? `관리자 코드가 올바르지 않습니다. (남은 시도 ${data.remaining}회)`
          : "관리자 코드가 올바르지 않습니다.";
  }catch(e){
    error.textContent = "인증 요청에 실패했습니다. 잠시 후 다시 시도하세요.";
  }finally{
    if($("#statsLoginForm")){
      button.disabled = false;
      button.textContent = "통계 보기";
    }
  }
}

async function load(){
  try{
    const res = await fetch("/api/stats", { cache: "no-store", credentials: "same-origin" });

    if(res.status === 401){
      showLogin();
      return;
    }

    if(res.status === 503){
      showConfigError();
      return;
    }

    if(!res.ok) throw new Error("failed");
    render(await res.json());
    loadBookClicks();
    loadListingMeta();
    initSubscribers();
    initApplications();
  }catch(e){
    $("#app").innerHTML = `<div class="err">통계를 불러오지 못했습니다.<br>잠시 후 다시 시도해주세요.</div>`;
  }
}

function render(d){
  const maxTrend = Math.max(...d.trend.map(t => t.count), 1);
  const maxPage = Math.max(...d.pages.map(p => p.total), 1);
  const todayStr = d.trend[d.trend.length - 1].date;

  $("#app").innerHTML = `
    <div class="stat-grid">
      <div class="stat-card"><div class="lbl">전체 방문</div><div class="val">${d.total.toLocaleString()}<span>회</span></div></div>
      <div class="stat-card"><div class="lbl">오늘 방문</div><div class="val">${d.today.toLocaleString()}<span>회</span></div></div>
    </div>

    <div class="card">
      <div class="card-title">최근 14일 추이</div>
      <div class="chart">
        ${d.trend.map(t => `
          <div class="chart-col">
            <div class="chart-val ${t.date===todayStr?"today":""}">${t.count.toLocaleString()}</div>
            <div class="chart-bar ${t.date===todayStr?"today":""}" style="height:${Math.max((t.count/maxTrend*82), t.count>0?4:2)}%" title="${t.date} · ${t.count}회"></div>
          </div>
        `).join("")}
      </div>
      <div class="chart-labels">
        ${d.trend.map((t,i) => `<div class="chart-lbl">${(i%2===0||i===d.trend.length-1)?esc(t.date.slice(5).replace("-", "/")):""}</div>`).join("")}
      </div>
    </div>

    <div class="card">
      <div class="card-title">페이지별 방문</div>
      ${d.pages.map(p => `
        <div class="page-row">
          <div class="page-dot"></div>
          <div class="page-main">
            <div class="page-name">${esc(p.label)}</div>
            <div class="page-bar-track"><div class="page-bar-fill" style="width:${(p.total/maxPage*100).toFixed(1)}%"></div></div>
          </div>
          <div class="page-nums"><b>${p.total.toLocaleString()}</b><div>오늘 ${p.today.toLocaleString()}</div></div>
        </div>
      `).join("")}
    </div>

    <div class="card" id="bookCard">
      <div class="card-title">추천 서적 클릭 <span style="font-size:10.5px;font-weight:700;color:var(--sub)">· 쿠팡 파트너스 배너</span></div>
      <div id="bookBody" style="font-size:12px;color:var(--sub)">불러오는 중…</div>
    </div>

    <div class="card" id="listingCard">
      <div class="card-title">실매물 엑셀 업로드 <span style="font-size:10.5px;font-weight:700;color:var(--teal-dark)">· 비공개 탭 "저평가 실매물 (입주가능, 중층 이상)"</span></div>
      <div id="listingMeta" style="font-size:12px;color:var(--sub);margin-bottom:10px">현재 데이터 확인 중…</div>
      <label style="display:block;padding:11px 12px;border:1.5px dashed var(--line);border-radius:10px;text-align:center;font-size:12.5px;font-weight:700;color:var(--teal-dark);cursor:pointer">
        엑셀 파일 선택 (.xlsx)
        <input id="listingFile" type="file" accept=".xlsx,.xls,.csv" style="display:none">
      </label>
      <div id="listingStatus" role="status" style="min-height:18px;margin-top:8px;font-size:12px;color:var(--ink);white-space:pre-line"></div>
      <div style="font-size:10px;color:var(--sub);margin-top:6px;line-height:1.6">엑셀은 이 브라우저 안에서만 읽고, 단지·전용면적별 요약(최근 3년 실거래 최고가, 입주가능·중층 이상 매물의 최저 호가)만 서버에 저장합니다. 새로 올리면 이전 데이터를 통째로 교체합니다.</div>
    </div>

    <div class="card" id="appCard">
      <div class="card-title">이용 신청 · 결제 <span style="font-size:10.5px;font-weight:700;color:var(--teal-dark)">· apply.html 원스톱 신청</span></div>
      <div style="font-size:10px;color:var(--sub);margin-bottom:8px;line-height:1.6">결제가 완료되면(PayApp 공통 통보 URL로 확인) 결제창에 넣은 휴대폰 번호로 신청서를 찾아 접근 코드가 자동 발급되고(아래 구독자 코드 목록에 "신청 뒷번호"로 표시), 신청자는 바로 비공개 탭을 쓸 수 있습니다. 맞춤 선별 메일을 보낸 뒤 "메일 보냄"을 눌러 표시해 두세요.</div>
      <div id="appList" style="font-size:12px;color:var(--sub)">불러오는 중…</div>
    </div>

    <div class="card" id="subCard">
      <div class="card-title">구독자 코드 <span style="font-size:10.5px;font-weight:700;color:var(--teal-dark)">· 비공개 탭 개인 접근 코드</span></div>
      <form id="subForm" style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px">
        <input id="subName" maxlength="40" placeholder="구독자 이름" aria-label="구독자 이름" style="flex:1 1 120px;min-width:0;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;font:inherit;font-size:12.5px">
        <input id="subExpires" type="date" aria-label="만료일(비우면 무기한)" style="flex:0 1 140px;padding:7px 8px;border:1.5px solid var(--line);border-radius:8px;font:inherit;font-size:12px">
        <button type="submit" style="flex:none;padding:8px 12px;border:0;border-radius:8px;background:var(--teal);color:#fff;font:inherit;font-size:12.5px;font-weight:800;cursor:pointer">+ 새 코드 발급</button>
      </form>
      <div style="font-size:10px;color:var(--sub);margin-bottom:8px">만료일을 비우면 무기한입니다. 만료일이 지나면 그날 밤 12시에 자동으로 막힙니다.</div>
      <div id="subStatus" role="status" style="min-height:16px;font-size:12px;color:var(--teal-dark);margin-bottom:4px"></div>
      <div id="subList" style="font-size:12px;color:var(--sub)">불러오는 중…</div>
    </div>

    <div class="note">배포 전 누적치는 페이지 로드 수 기준입니다. 배포 후에는 같은 IP·브라우저의 같은 페이지 요청을 KST 하루에 한 번만 반영합니다.<br>공유 네트워크·브라우저 변경 등에 따라 실제 유니크 방문자 수와는 다를 수 있습니다.</div>
  `;
}

// ═══ 구독자별 개인 코드(2026.09 신규) ═══
// 사람마다 다른 코드를 발급해 해지·재발급·만료일을 따로 관리한다(netlify/functions/subscribers.mjs).
const fmtDay = (ms) => { const d = new Date(ms + 9*3600000); return `${d.getUTCMonth()+1}/${d.getUTCDate()}`; };
const toDateInput = (ms) => ms ? new Date(ms + 9*3600000).toISOString().slice(0,10) : "";
function agoText(ms){
  if(!ms) return "접속 기록 없음";
  const m = Math.floor((Date.now() - ms) / 60000);
  if(m < 60) return "방금 전";
  if(m < 1440) return `${Math.floor(m/60)}시간 전`;
  return `${Math.floor(m/1440)}일 전`;
}
async function subApi(body){
  const res = await fetch("/api/subscribers", {
    method: body ? "POST" : "GET", cache: "no-store", credentials: "same-origin",
    headers: body ? { "content-type": "application/json" } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  if(res.status === 401) throw new Error("관리자 인증이 만료됐습니다. 새로고침 후 다시 로그인하세요.");
  const d = await res.json().catch(() => ({}));
  if(!res.ok) throw new Error({ name_required:"이름을 입력하세요.", invalid_expires:"만료일 형식이 올바르지 않습니다.", not_found:"이미 삭제된 구독자입니다." }[d.error] || "처리하지 못했습니다. 잠시 후 다시 시도하세요.");
  return d;
}
function subRow(s){
  const now = Date.now();
  const expired = s.expiresAt && s.expiresAt <= now;
  const state = s.revoked ? ["해지됨","#d95d5d"] : expired ? ["만료됨","#d95d5d"] : ["사용 중","var(--teal-dark)"];
  const warn = s.devices >= 4 ? ` <b style="color:#d95d5d">· 공유 의심</b>` : "";
  const btn = (act, label, color="var(--sub)") => `<button data-act="${act}" data-id="${esc(s.id)}" style="padding:4px 6px;border:1.5px solid var(--line);border-radius:6px;background:#fff;color:${color};font:inherit;font-size:10.5px;font-weight:700;cursor:pointer">${label}</button>`;
  return `
    <div class="page-row" style="display:block">
      <div style="display:flex;align-items:center;gap:8px">
        <b style="font-size:13px;color:var(--ink)">${esc(s.name)}</b>
        <span style="font-size:10.5px;font-weight:800;color:${state[1]}">${state[0]}</span>
        <code style="margin-left:auto;font-size:13px;font-weight:800;letter-spacing:.5px;color:var(--navy)${s.revoked?";text-decoration:line-through;opacity:.5":""}">${esc(s.code)}</code>
      </div>
      <div style="font-size:11px;color:var(--sub);margin:3px 0 6px">
        만료 ${s.expiresAt ? fmtDay(s.expiresAt) : "무기한"} · 최근 30일 기기 ${s.devices}대${warn} · ${agoText(s.lastSeen)}
      </div>
      <div style="display:flex;gap:4px;flex-wrap:wrap;align-items:center">
        <input type="date" value="${toDateInput(s.expiresAt)}" data-exp="${esc(s.id)}" aria-label="${esc(s.name)} 만료일" style="width:112px;padding:3px 4px;border:1.5px solid var(--line);border-radius:6px;font:inherit;font-size:11px">
        ${btn("expires","저장")}
        ${btn("reissue","재발급")}
        ${s.revoked ? btn("restore","해지 취소") : btn("revoke","해지","#d95d5d")}
        ${btn("delete","삭제")}
      </div>
    </div>`;
}
async function loadSubscribers(msg = ""){
  const box = $("#subList");
  if(!box) return;
  try{
    const d = await subApi();
    box.innerHTML = (d.subscribers.length
      ? d.subscribers.map(subRow).join("")
      : `<div style="padding:8px 0">아직 발급한 코드가 없습니다.</div>`)
      + `<div style="font-size:10px;color:var(--sub);margin-top:8px;line-height:1.6">`
      + (d.sharedCodeEnabled
        ? `공용 비번(SUBSCRIBER_CODE)도 아직 쓸 수 있습니다. 모두 개인 코드로 옮기면 Netlify 환경변수에서 SUBSCRIBER_CODE를 지우고 재배포하세요. 그러면 공용 비번으로 로그인한 기기는 로그아웃됩니다.`
        : `공용 비번은 꺼져 있어 개인 코드로만 들어올 수 있습니다.`)
      + `</div>`;
    if(msg) $("#subStatus").textContent = msg;
  }catch(e){
    box.textContent = e.message || "구독자 목록을 불러오지 못했습니다.";
  }
}
function initSubscribers(){
  const form = $("#subForm");
  if(!form) return;
  form.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const btn = form.querySelector("button");
    btn.disabled = true;
    try{
      const d = await subApi({ action:"create", name: $("#subName").value, expires: $("#subExpires").value });
      $("#subName").value = ""; $("#subExpires").value = "";
      await loadSubscribers(`${d.subscriber.name}님 코드 발급: ${d.subscriber.code} — 이 코드를 구독자에게 전달하세요.`);
    }catch(e){ $("#subStatus").textContent = e.message; }
    finally{ btn.disabled = false; }
  });
  $("#subList").addEventListener("click", async (ev) => {

      reissue: `${name}님 코드를 새로 바꿀까요? 기존 코드와 이미 로그인한 기기는 모두 막힙니다.`,
      revoke: `${name}님을 해지할까요? 바로 로그아웃되고 이 코드로 다시 들어올 수 없습니다.`,
      delete: `${name}님을 목록에서 삭제할까요? 이 코드는 더 이상 쓸 수 없습니다.`,
    }[act];
    if(confirmText && !confirm(confirmText)) return;
    const body = { action: act, id };
    if(act === "expires") body.expires = $(`input[data-exp="${CSS.escape(id)}"]`).value;

    if(!res.ok) throw new Error("신청 목록을 불러오지 못했습니다.");

  }catch(e){ box.textContent = e.message; }
}

// ═══ 실매물 엑셀 업로드(2026.09 신규) ═══
// 구독 전용 "저평가 실매물 (입주가능, 중층 이상)" 탭 데이터. 엑셀 원본은 서버·GitHub 어디에도 올리지 않고, 여기서 단지·전용면적
// 단위로 요약한 결과만 /api/listings로 보낸다(서버가 "시|구"를 지역코드로 바꿔 Netlify Blobs에 저장).
// 필요한 컬럼: 시, 구, 법정동, 단지명, 매매가(억), 실거래최고가(억), 실거래최고_시점, 면적(평), 전용면적(㎡),
//             층, 층구분, 동, 매물링크, 단지ID, 세대수, 준공년월, 확인일, 급매
const LISTING_COLS = ["시","구","법정동","단지명","매매가(억)","실거래최고가(억)","면적(평)","전용면적(㎡)","층구분","입주구분","단지ID"];
const MID_UP = new Set(["중층","고층"]); // "중층 이상" — 저층·1층 매물은 호가가 구조적으로 낮아 제외
// 호가는 "입주가능" 매물만 — 세안고(세입자 낀) 매물은 실입주가 안 돼 호가가 낮게 나오므로 같은 선에서 비교할 수 없다(운영자 요청).
// 최고가(실거래최고가)는 매물 상태와 무관한 평형 단위 값이라 모든 행에서 그대로 모은다.
const MOVE_IN = "입주가능";

async function loadListingMeta(){
  const box = $("#listingMeta");
  if(!box) return;
  try{
    const res = await fetch("/api/listings?meta=1", { cache:"no-store", credentials:"same-origin" });
    const m = res.ok ? await res.json() : null;
    box.innerHTML = m
      ? `현재 데이터: <b style="color:var(--navy)">${esc(m.asOf||"-")} 기준</b> · ${m.regions}개 지역 · ${(m.types||0).toLocaleString()}개 평형<br>업로드 ${esc(new Date(m.uploadedAt).toLocaleString("ko-KR"))}${m.fileName?` · ${esc(m.fileName)}`:""}`
      : "아직 업로드된 데이터가 없습니다.";
  }catch(e){ box.textContent = "현재 데이터 정보를 불러오지 못했습니다."; }
}

function loadSheetJS(){
  if(window.XLSX) return Promise.resolve();
  return new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js";
    s.onload = resolve; s.onerror = () => reject(new Error("엑셀 읽기 도구를 불러오지 못했습니다."));
    document.head.appendChild(s);
  });
}

// 단지ID+전용면적(㎡) 단위로 묶는다 — 엑셀의 실거래최고가는 전용면적 단위로 붙어 있다(같은 단지·같은 전용면적이면 항상 같은 값).
function summarizeListings(rows){
  const groups = new Map(); // "시|구" -> Map(단지ID|전용 -> 집계)
  let asOf = "";
  for(const r of rows){
    const region = `${String(r["시"]).trim()}|${String(r["구"]).trim()}`;
    const d = String(r["확인일"] ?? "").trim();
    if(d > asOf) asOf = d;
    const ex = Math.round(+r["전용면적(㎡)"]);
    if(!(ex > 0)) continue;
    const g = groups.get(region) || new Map();
    groups.set(region, g);
    const k = `${r["단지ID"]}|${ex}`;
    const x = g.get(k) || { nid:String(r["단지ID"]), apt:String(r["단지명"]), umd:String(r["법정동"]), hh:+r["세대수"]||null,
      built:String(r["준공년월"]??""), ex, pyCnt:{}, peak:0, peakYm:"", ask:Infinity, n:0 };
    g.set(k, x);
    const py = +r["면적(평)"];
    if(py) x.pyCnt[py] = (x.pyCnt[py]||0) + 1;
    const peak = +r["실거래최고가(억)"];
    if(peak > x.peak){ x.peak = peak; x.peakYm = String(r["실거래최고_시점"] ?? ""); }
    if(!MID_UP.has(String(r["층구분"]).trim()) || String(r["입주구분"]).trim() !== MOVE_IN) continue;
    const ask = +r["매매가(억)"];
    if(!(ask > 0)) continue;
    x.n++;
    if(ask < x.ask) Object.assign(x, { ask, fl:String(r["층"]??""), dong:String(r["동"]??""), url:String(r["매물링크"]??""), d, urgent: r["급매"]==="급매"?1:0 });
  }
  const regions = {};
  let types = 0;
  for(const [region, g] of groups){
    const items = [];
    for(const x of g.values()){
      if(!x.peak || !Number.isFinite(x.ask)) continue; // 최고가(거래 이력) 없거나 입주가능·중층 이상 매물이 없는 평형은 비교 불가
      const py = +(Object.entries(x.pyCnt).sort((a,b)=>b[1]-a[1])[0]||[])[0] || null;
      const { pyCnt, ...rest } = x;
      items.push({ ...rest, py });
    }
    if(items.length){ regions[region] = items; types += items.length; }
  }
  const asOfLabel = asOf.length===8 ? `${asOf.slice(0,4)}.${asOf.slice(4,6)}.${asOf.slice(6)}` : asOf;
  return { regions, types, asOf: asOfLabel };
}

async function postListings(body){
  const res = await fetch("/api/listings", { method:"POST", cache:"no-store", credentials:"same-origin",
    headers:{ "content-type":"application/json" }, body: JSON.stringify(body) });
  if(res.status === 401) throw new Error("관리자 인증이 만료됐습니다. 새로고침 후 다시 로그인하세요.");
  if(!res.ok) throw new Error(`업로드 실패 (HTTP ${res.status})`);
  return res.json();
}

async function uploadListingFile(file){
  const status = $("#listingStatus");
  const input = $("#listingFile");
  input.disabled = true;
  try{
    status.textContent = "엑셀 읽는 중…";
    await loadSheetJS();
    const wb = XLSX.read(await file.arrayBuffer(), { type:"array" });
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval:"" });
    const missing = LISTING_COLS.filter(c => !(rows[0] && c in rows[0]));
    if(!rows.length || missing.length) throw new Error(`필요한 컬럼이 없습니다: ${missing.join(", ") || "(데이터 없음)"}`);

    const { regions, types, asOf } = summarizeListings(rows);
    const keys = Object.keys(regions);
    if(!keys.length) throw new Error("비교 가능한 평형이 없습니다(실거래최고가·입주가능 중층 이상 매물 확인 필요).");

    const uploadId = `${Date.now().toString(36)}-${Math.random().toString(36).slice(2,8)}`;
    // 요청 본문 한도(약 6MB)를 넉넉히 피하도록 약 1MB씩 묶어서 보낸다.
    const batches = []; let cur = {}, size = 0;
    for(const k of keys){
      const len = JSON.stringify(regions[k]).length;
      if(size && size + len > 1_000_000){ batches.push(cur); cur = {}; size = 0; }
      cur[k] = regions[k]; size += len;
    }
    if(size) batches.push(cur);

    const lawds = [], unknown = [];
    for(let i=0;i<batches.length;i++){
      status.textContent = `${rows.length.toLocaleString()}행 → ${types.toLocaleString()}개 평형 요약 완료\n서버에 저장 중… (${i+1}/${batches.length})`;
      const r = await postListings({ action:"put", uploadId, asOf, regions: batches[i] });
      lawds.push(...r.saved); unknown.push(...r.unknown);
    }
    const fin = await postListings({ action:"finish", uploadId, asOf, lawds, rows: rows.length, types, fileName: file.name });
    status.innerHTML = `<b style="color:var(--teal-dark)">업로드 완료</b> — ${esc(asOf)} 기준 · ${lawds.length}개 지역 · ${types.toLocaleString()}개 평형`
      + (unknown.length ? `<br><span style="color:#d95d5d">지역코드를 못 찾아 제외: ${esc(unknown.join(", "))}</span>` : "")
      + (fin.removed && fin.removed.length ? `<br>이번 파일에 없어 삭제된 지역 ${fin.removed.length}곳` : "");
    loadListingMeta();
  }catch(e){
    status.innerHTML = `<span style="color:#d95d5d">${esc(e.message || "업로드 실패")}</span>`;
  }finally{
    input.disabled = false;
    input.value = "";
  }
}

document.addEventListener("change", (e) => {
  if(e.target && e.target.id === "listingFile" && e.target.files[0]) uploadListingFile(e.target.files[0]);
});

load();
</script>
