<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>급지 분석 — 아파트썸</title>
<meta name="description" content="서울·경기·인천·부산 아파트 단지를 평단가(공급면적 3.3㎡당 가격) 기준 6단계 급지로 나눠 한눈에 보는 지도">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --teal:#00828A; --teal-dark:#00565C; --teal-soft:#E0F2F3; --teal-light:#A8E0E4; --teal-light-soft:#F2FBFB;
    --navy:#0F2B3D; --slate-bg:#F1F5F9; --ink:#1E293B; --sub:#64748B;
    --line:#E2E8F0; --red:#DC2626; --yellow:#F5B400;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Noto Sans KR',sans-serif;background:var(--slate-bg);color:var(--ink);line-height:1.6;font-variant-numeric:tabular-nums;min-height:100vh;word-break:keep-all;overflow-wrap:break-word}
  .wrap{max-width:420px;margin:0 auto;padding:0 16px 60px;position:relative}
  header{padding:16px 14px;text-align:center;background:var(--navy);border-radius:16px;margin:10px 0 14px;box-shadow:0 2px 14px rgba(15,43,61,.18);position:relative}
  .logo{display:inline-flex;align-items:center;gap:8px;font-weight:900;font-size:19px;color:#fff;letter-spacing:-.5px}
  header p{font-size:11.5px;color:rgba(255,255,255,.7);margin-top:4px}
  .back{position:absolute;top:50%;left:14px;transform:translateY(-50%);background:rgba(255,255,255,.14);border:none;border-radius:8px;width:32px;height:32px;color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none}
  .back:active{background:rgba(255,255,255,.28)}

  .tier-prov-tabs{display:flex;gap:6px;margin-bottom:10px}
  .tier-prov-tab{flex:1;text-align:center;padding:9px 0;border-radius:10px;border:1.5px solid var(--line);background:#fff;color:var(--sub);font-size:12.5px;font-weight:700;cursor:pointer}
  .tier-prov-tab.on{background:var(--navy);border-color:var(--navy);color:#fff}
  .tier-prov-tab:active{opacity:.85}
  .tier-dongrank-banner{display:flex;align-items:center;justify-content:space-between;gap:8px;background:linear-gradient(135deg,var(--teal),var(--teal-dark));color:#fff;border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:12.5px;font-weight:700;cursor:pointer}
  .tier-dongrank-banner span{font-size:10.5px;font-weight:600;opacity:.9;white-space:nowrap}
  .tier-dongrank-banner:active{opacity:.9}
  .tier-back-btn{display:inline-flex;align-items:center;gap:4px;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12px;font-weight:700;color:var(--ink);cursor:pointer;margin-bottom:12px;font-family:inherit}
  .tier-back-btn:active{background:var(--slate-bg)}
  .tier-dongrank-group{margin-bottom:14px}
  .tier-dongrank-group-hd{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--ink);margin-bottom:6px}
  .tier-dongrank-group-hd .tier-rung-dot{width:10px;height:10px}
  .tier-dongrank-group-band{font-size:10px;font-weight:500;color:var(--sub);margin-right:auto}
  .tier-meta-line{font-size:11px;color:var(--sub);text-align:center;margin-bottom:10px}
  .tier-meta-line b{color:var(--ink)}
  .tier-ladder{background:#fff;border-radius:16px;padding:10px 14px 2px;margin-bottom:12px;border:1.5px solid var(--line)}
  .tier-ladder-title{font-size:13px;font-weight:700;color:var(--navy);margin-bottom:6px}
  .tier-rung{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--slate-bg);cursor:pointer;transition:background .12s}
  .tier-rung:last-child{border-bottom:none}
  .tier-rung:active{background:var(--teal-light-soft)}
  .tier-rung.on{background:var(--teal-light-soft)}
  .tier-rung-dot{flex:none;width:11px;height:11px;border-radius:3px}
  .tier-rung-info{flex:none;width:76px}
  .tier-rung-label{font-size:12px;font-weight:700;color:var(--ink);line-height:1.3}
  .tier-rung-band{font-size:9px;color:var(--sub);line-height:1.3}
  .tier-rung-bar-track{flex:1;height:20px;background:var(--slate-bg);border-radius:6px;overflow:hidden;position:relative}
  .tier-rung-bar-fill{height:100%;border-radius:6px;transition:width .5s ease}
  .tier-rung-count{flex:none;width:80px;text-align:right;font-size:11px;color:var(--sub);line-height:1.3}
  .tier-rung-count b{color:var(--ink);font-size:12.5px}
  .tier-rung-panel{padding:2px 0 10px;border-bottom:1px solid var(--slate-bg)}
  .tier-rung-panel .tier-list{border-color:var(--slate-bg)}
  .tier-filters{display:flex;gap:6px;margin-bottom:10px}
  .tier-filters select,.tier-filters input{flex:1;font-size:12px;padding:8px 9px;border-radius:10px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font-family:inherit}
  .tier-filters input{flex:1.4}
  .tier-filters select:focus,.tier-filters input:focus{outline:none;border-color:var(--teal)}
  .tier-section-hd{display:flex;align-items:center;justify-content:space-between;margin:14px 0 6px}
  .tier-section-hd h2{font-size:13px;font-weight:700;color:var(--navy)}
  .tier-section-hd .cnt{font-size:11px;color:var(--sub)}
  .tier-heat-group{margin-bottom:10px}
  .tier-heat-group-title{font-size:11.5px;font-weight:700;color:var(--sub);margin-bottom:6px;padding-left:2px}
  .tier-heatmap{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
  .tier-heat-cell{border-radius:10px;padding:8px 8px 7px;color:#fff;cursor:pointer;min-height:90px;min-width:0;display:flex;flex-direction:column;justify-content:space-between}
  .tier-heat-cell.on{box-shadow:0 0 0 3px var(--navy) inset}
  .tier-heat-cell:active{opacity:.85}
  .tier-heat-region{font-size:14px;font-weight:800;opacity:1;overflow-wrap:anywhere}
  .tier-heat-name{font-size:11px;font-weight:700;line-height:1.2;margin:2px 0;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
  .tier-heat-price{font-size:15px;font-weight:900;margin-top:2px}
  .tier-heat-price span{font-size:10px;font-weight:600;opacity:.85;margin-left:1px}
  .tier-heat-amt{font-size:11px;font-weight:600;opacity:.92;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tier-list{background:#fff;border-radius:16px;overflow:hidden;border:1.5px solid var(--line)}
  .tier-row{display:flex;align-items:center;gap:10px;padding:4px 13px;border-bottom:1px solid var(--slate-bg)}
  .tier-row:last-child{border-bottom:none}
  .tier-row-no{flex:none;width:20px;font-size:11px;color:var(--sub);text-align:center}
  .tier-row-main{flex:1;min-width:0}
  .tier-row-name{font-size:12.5px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.15}
  .tier-presale-badge{font-size:9.5px;font-weight:700;color:#00565C;background:#e3f4f4;border-radius:5px;padding:1px 5px;vertical-align:1px}
  .tier-row-sub{font-size:10px;color:var(--sub);margin-top:0;line-height:1.15}
  .tier-row-price{flex:none;text-align:right}
  .tier-row-price b{font-size:13px;color:var(--navy)}
  .tier-row-price span{font-size:9.5px;color:var(--sub)}
  .tier-row-amt{font-size:9.5px;color:var(--sub);margin-top:0;line-height:1.15}
  .tier-more-btn{display:block;width:100%;margin-top:10px;padding:11px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--teal-dark);font-weight:700;font-size:12px;cursor:pointer;font-family:inherit}
  .tier-more-btn:active{background:var(--teal-light-soft)}
  .tier-empty{text-align:center;padding:40px 20px;color:var(--sub);font-size:12.5px}
  .tier-disclaimer{font-size:10px;color:var(--sub);text-align:center;margin-top:16px;padding:0 10px;line-height:1.5}
  .tier-disclaimer a{color:var(--teal-dark)}
  .tier-loading-box{text-align:center;padding:60px 20px;color:var(--sub);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a class="back" href="./index.html" aria-label="메인으로">←</a>
    <span class="logo"><svg width="14" height="14" viewBox="0 0 20 20"><rect x="2" y="10" width="4" height="8" fill="#00A9B4"/><rect x="8" y="6" width="4" height="12" fill="#7FD4D9"/><rect x="14" y="2" width="4" height="16" fill="#00A9B4"/></svg>급지 분석</span>
    <p>서울·경기·인천·부산 아파트, 평단가 기준 6단계</p>
  </header>

  <div id="app"><div class="tier-loading-box">불러오는 중…</div></div>
</div>

<script>
const $ = (sel, el=document) => el.querySelector(sel);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const tierFmtPy = (manwon) => (manwon / 10000).toFixed(2) + "억";
const tierFmtAmt = (manwon) => (manwon / 10000).toFixed(1) + "억";
const TIER_PROVINCES = ["서울", "경기", "인천", "부산"];

let tierData = null;
let tierState = { province: "", grade: null, region: "", dong: "", q: "", shown: 30, view: "main" };

async function load(){
  try{
    const res = await fetch("./data/tier-map.json", { cache: "no-store" });
    if(!res.ok) throw new Error("no data");
    tierData = await res.json();
    render();
  }catch(e){
    $("#app").innerHTML = `<div class="tier-empty">아직 급지 데이터가 없습니다.<br>배치가 한 번 돈 뒤에 다시 확인해주세요.</div>`;
  }
}

function tierScoped(){
  return tierData.complexes.filter(c => !tierState.province || c.province === tierState.province);
}
// 지역 select는 "시·도::구/시" 복합키 — 서울/부산처럼 구 이름이 같은 시·도가 있어 구 이름만으로는 구분이 안 됨.
function tierRegionOptions(){
  const scoped = tierScoped();
  const groups = tierState.province ? [tierState.province] : TIER_PROVINCES;
  let html = `<option value="">전체 지역</option>`;
  for (const p of groups) {
    const regions = [...new Set(scoped.filter(c => c.province === p).map(c => c.gu))].sort((a,b) => a.localeCompare(b, "ko"));
    if (!regions.length) continue;
    html += `<optgroup label="${esc(p)}">` + regions.map(r => {
      const key = `${p}::${r}`;
      return `<option value="${esc(key)}" ${tierState.region===key?'selected':''}>${esc(r)}</option>`;
    }).join("") + `</optgroup>`;
  }
  return html;
}
function tierFiltered(){
  return tierScoped().filter(c =>
    (!tierState.grade || c.g === tierState.grade) &&
    (!tierState.region || `${c.province}::${c.gu}` === tierState.region) &&
    (!tierState.dong || c.dong === tierState.dong) &&
    (!tierState.q || c.nm.includes(tierState.q))
  );
}
// 검색창 입력마다 이 함수만 다시 그림(#tierListArea만 갱신) — 검색창 포커스를 유지하기 위함.
function renderList(){
  const list = tierFiltered();
  const shown = list.slice(0, tierState.shown);
  $("#tierListCnt").textContent = `${list.length.toLocaleString()}개`;
  $("#tierListArea").innerHTML = shown.length ? `
    <div class="tier-list">
      ${shown.map((c,i) => `
        <div class="tier-row">
          <div class="tier-row-no">${i+1}</div>
          <div class="tier-row-main">
            <div class="tier-row-name">${esc(c.nm)}${c.presaleOnly?' <span class="tier-presale-badge">분양권</span>':''}</div>
            <div class="tier-row-sub">${esc(c.gu)} ${esc(c.dong)}${c.by?` · ${c.by}년`:''}${c.hh?` · ${c.hh.toLocaleString()}세대`:''}</div>
          </div>
          <div class="tier-row-price"><b>${tierFmtPy(c.ppy)}</b><span>/평</span><div class="tier-row-amt">${tierFmtAmt(c.amt)} (${c.py}평${c.ar?`, 전용 ${c.ar}㎡`:''})</div></div>
        </div>
      `).join("")}
    </div>
    ${list.length > shown.length ? `<button class="tier-more-btn" onclick="showMore()">${list.length - shown.length}개 더 보기</button>` : ""}
  ` : `<div class="tier-empty">조건에 맞는 단지가 없습니다.</div>`;
}
// 지역(구/시)별 대장주 히트맵 — 칸 색은 그 단지의 급지 등급색을 그대로 재사용.
function heatmapHTML(){
  const flags = tierData.flagships.filter(f => !tierState.province || f.province === tierState.province);
  const groups = tierState.province ? [tierState.province] : TIER_PROVINCES;
  return groups.map(p => {
    const items = flags.filter(f => f.province === p).sort((a,b) => b.ppy - a.ppy);
    if(!items.length) return "";
    return `
      <div class="tier-heat-group">
        ${!tierState.province ? `<div class="tier-heat-group-title">${esc(p)} · ${items.length}개 지역</div>` : ""}
        <div class="tier-heatmap">
          ${items.map(f => {
            const grade = tierData.grades.find(g => g.g === f.g);
            return `
              <div class="tier-heat-cell" style="background:${grade.color}" onclick="setRegionFromHeat('${esc(f.province)}','${esc(f.gu)}')">
                <div class="tier-heat-region">${esc(f.gu)}</div>
                <div class="tier-heat-name">${esc(f.nm)}</div>
                <div class="tier-heat-amt">${tierFmtAmt(f.amt)} (${f.py}평${f.ar?`, 전용 ${f.ar}㎡`:''})</div>
                <div class="tier-heat-price">${tierFmtPy(f.ppy)}<span>/평</span></div>
              </div>
            `;
          }).join("")}
        </div>
      </div>
    `;
  }).join("");
}
function scopedFlagshipCount(){
  return tierData.flagships.filter(f => !tierState.province || f.province === tierState.province).length;
}
// 동별 순위 — 서울·경기·인천·부산 통합(또는 시·도 탭 선택 시 그 시·도 안)에서 동 단위로 대장주를 뽑아
// 그 동의 급지 등급(6분위)별로 묶어서 보여줌. 등급은 그 동 대장주 단지의 등급(g)을 그대로 씀 — 등급
// 사다리(6단계)와 같은 기준. 전부 다 보여주고 자르지 않음(수민 요청, 기존 TOP 30 제한 삭제).
function dongRankGroups(){
  const base = tierScoped();
  const byDong = new Map();
  for (const c of base) {
    const key = `${c.province}::${c.gu}::${c.dong}`;
    if (!byDong.has(key) || byDong.get(key).ppy < c.ppy) byDong.set(key, c);
  }
  const items = [...byDong.values()].sort((a,b) => b.ppy - a.ppy);
  return tierData.grades.map(g => ({ grade: g, items: items.filter(c => c.g === g.g) }));
}
// 등급 사다리에서 한 등급(rung)을 탭하면 그 밑에 바로 펼쳐지는 동 순위 아코디언 — 처음엔 20개만
// 보여주고, 그보다 많으면 "동별 순위" 전용 화면(급지 6분위 전체 보기)으로 넘어가는 링크를 붙인다.
function gradeRungDongListHTML(gradeNum){
  const group = dongRankGroups().find(g => g.grade.g === gradeNum);
  if(!group || !group.items.length) return `<div class="tier-rung-panel"><div class="tier-empty" style="padding:16px 0">이 등급에 해당하는 동이 없습니다.</div></div>`;
  const LIMIT = 20;
  const shown = group.items.slice(0, LIMIT);
  return `
    <div class="tier-rung-panel">
      <div class="tier-list">
        ${shown.map((c,i) => `
          <div class="tier-row" style="cursor:pointer" onclick="event.stopPropagation();setRegionFromHeat('${esc(c.province)}','${esc(c.gu)}');setDong('${esc(c.dong)}')">
            <div class="tier-row-no">${i+1}</div>
            <div class="tier-row-main">
              <div class="tier-row-name">${esc(c.dong)}</div>
              <div class="tier-row-sub">${esc(c.province)} ${esc(c.gu)} · ${esc(c.nm)}</div>
            </div>
            <div class="tier-row-price"><b>${tierFmtPy(c.ppy)}</b><span>/평</span></div>
          </div>
        `).join("")}
      </div>
      ${group.items.length > LIMIT ? `<button type="button" class="tier-more-btn" onclick="event.stopPropagation();setView('dongrank')">${group.items.length - LIMIT}개 더 보기 (전체 동별 순위로)</button>` : ""}
    </div>
  `;
}
function dongRankBannerHTML(){
  const label = tierState.province ? `${tierState.province} 동별 순위` : '동별 순위 (전국 통합)';
  const count = dongRankGroups().reduce((s,g) => s + g.items.length, 0);
  return `<div class="tier-dongrank-banner" onclick="setView('dongrank')">📊 ${esc(label)} <span>${count.toLocaleString()}개 동 전체 보기 ›</span></div>`;
}
function dongRankFullHTML(){
  const groups = dongRankGroups();
  const total = groups.reduce((s,g) => s + g.items.length, 0);
  return `
    <div class="tier-section-hd"><h2>${tierState.province ? esc(tierState.province) : '전국 통합'} 동별 순위 (급지 6분위)</h2><span class="cnt">${total.toLocaleString()}개 동</span></div>
    ${groups.map(({grade, items}) => !items.length ? "" : `
      <div class="tier-dongrank-group">
        <div class="tier-dongrank-group-hd"><span class="tier-rung-dot" style="background:${grade.color}"></span>${esc(grade.label)} <span class="tier-dongrank-group-band">${esc(grade.band)}</span><span class="cnt">${items.length}개 동</span></div>
        <div class="tier-list">
          ${items.map((c,i) => `
            <div class="tier-row" style="cursor:pointer" onclick="setView('main');setRegionFromHeat('${esc(c.province)}','${esc(c.gu)}');setDong('${esc(c.dong)}')">
              <div class="tier-row-no">${i+1}</div>
              <div class="tier-row-main">
                <div class="tier-row-name">${esc(c.dong)}</div>
                <div class="tier-row-sub">${esc(c.province)} ${esc(c.gu)} · ${esc(c.nm)}</div>
              </div>
              <div class="tier-row-price"><b>${tierFmtPy(c.ppy)}</b><span>/평</span></div>
            </div>
          `).join("")}
        </div>
      </div>
    `).join("")}
  `;
}
// 동별 평단가 히트맵 — 구/시를 선택했을 때만 노출. 동별 대장주(그 동에서 평단가가 가장 높은 단지) 1개씩 보여줌.
function dongHeatmapHTML(){
  if (!tierState.region) return "";
  const [province, gu] = tierState.region.split("::");
  const inGu = tierData.complexes.filter(c => c.province === province && c.gu === gu);
  const byDong = new Map();
  for (const c of inGu) {
    if (!byDong.has(c.dong) || byDong.get(c.dong).ppy < c.ppy) byDong.set(c.dong, c);
  }
  const items = [...byDong.values()].sort((a,b) => b.ppy - a.ppy);
  if (!items.length) return "";
  return `
    <div class="tier-section-hd"><h2>${esc(gu)} 동별 평단가</h2><span class="cnt">${items.length}개 동</span></div>
    <div class="tier-heatmap">
      ${items.map(c => {
        const grade = tierData.grades.find(g => g.g === c.g);
        return `
        <div class="tier-heat-cell ${tierState.dong===c.dong?'on':''}" style="background:${grade.color}" onclick="setDong('${esc(c.dong)}')">
          <div class="tier-heat-region">${esc(c.dong)}</div>
          <div class="tier-heat-name">${esc(c.nm)}</div>
          <div class="tier-heat-amt">${tierFmtAmt(c.amt)} (${c.py}평${c.ar?`, 전용 ${c.ar}㎡`:''})</div>
          <div class="tier-heat-price">${tierFmtPy(c.ppy)}<span>/평</span></div>
        </div>
      `;
      }).join("")}
    </div>
  `;
}
function render(){
  const provTabsHTML = `
    <div class="tier-prov-tabs">
      <div class="tier-prov-tab ${tierState.province===''?'on':''}" onclick="setProvince('')">전체</div>
      ${TIER_PROVINCES.map(p => `<div class="tier-prov-tab ${tierState.province===p?'on':''}" onclick="setProvince('${p}')">${p}</div>`).join("")}
    </div>
  `;

  // 동별 순위 전용 화면 — 배너를 누르면 등급 사다리·히트맵·단지 목록 없이 전체 동을 급지 6분위로 묶어 다 보여줌.
  if(tierState.view === 'dongrank'){
    $("#app").innerHTML = `
      ${provTabsHTML}
      <button type="button" class="tier-back-btn" onclick="setView('main')">← 목록으로</button>
      ${dongRankFullHTML()}
    `;
    return;
  }

  const base = tierScoped();
  const gradeStats = tierData.grades.map(g => {
    const inGrade = base.filter(c => c.g === g.g);
    const avg = inGrade.length ? Math.round(inGrade.reduce((s,c) => s + c.ppy, 0) / inGrade.length) : 0;
    return { ...g, count: inGrade.length, avg };
  });
  const maxCount = Math.max(...gradeStats.map(g => g.count), 1);

  $("#app").innerHTML = `
    ${provTabsHTML}
    ${dongRankBannerHTML()}

    <div class="tier-meta-line">단지 <b>${base.length.toLocaleString()}</b>개 · 최근 ${tierData.meta.months}개월 거래 기준</div>

    <div class="tier-ladder">
      <div class="tier-ladder-title">등급별 단지 분포 (탭하면 동 순위가 펼쳐집니다)</div>
      ${gradeStats.map(g => `
        <div class="tier-rung ${tierState.grade===g.g?'on':''}" onclick="setGrade(${g.g})">
          <div class="tier-rung-dot" style="background:${g.color}"></div>
          <div class="tier-rung-info"><div class="tier-rung-label">${esc(g.label)}</div><div class="tier-rung-band">${esc(g.band)}</div></div>
          <div class="tier-rung-bar-track"><div class="tier-rung-bar-fill" style="width:${(g.count/maxCount*100).toFixed(1)}%;background:${g.color}"></div></div>
          <div class="tier-rung-count"><b>${g.count}</b>개<br>평균 ${tierFmtPy(g.avg)}</div>
        </div>
        ${tierState.grade===g.g ? gradeRungDongListHTML(g.g) : ""}
      `).join("")}
    </div>

    ${!tierState.grade && !tierState.region && !tierState.q ? `
    <div class="tier-section-hd"><h2>지역별 대장주</h2><span class="cnt">${scopedFlagshipCount()}개 지역</span></div>
    ${heatmapHTML()}
    ` : ""}

    ${tierState.region ? dongHeatmapHTML() : ""}

    <div class="tier-section-hd"><h2>${tierState.grade ? esc(tierData.grades.find(g=>g.g===tierState.grade).label) : (tierState.dong ? esc(tierState.dong) : '전체 단지')}</h2><span class="cnt" id="tierListCnt"></span></div>
    <div class="tier-filters">
      <select id="tierRegionSel" onchange="setRegion(this.value)">${tierRegionOptions()}</select>
      <input id="tierQInput" type="text" placeholder="단지명 검색" value="${esc(tierState.q)}" oninput="setQuery(this.value)">
    </div>

    <div id="tierListArea"></div>

    <div class="tier-disclaimer">
      ${esc(tierData.meta.basis)}.<br>
      단지마다 여러 평형(목록의 "○○평" 표기) 중 평단가가 가장 높은 평형 하나를 대표로 골라 등급을 매긴 값이라, 그 단지의 다른 평형은 실제 체감 시세와 다를 수 있습니다. 2년 내 같은 평형 거래가 2건 미만이면 이상치 방지를 위해 집계에서 제외되므로, 거래가 드문 단지는 목록에 없을 수 있습니다 — 참고용으로만 활용하세요.<br>
      <a href="./index.html">단지별 상세 분석 보기</a>
    </div>
  `;
  renderList();
}
function setView(v){ tierState.view = v; render(); }

function setProvince(p){ tierState.province = p; tierState.region = ""; tierState.dong = ""; tierState.grade = null; tierState.shown = 30; render(); }
function setGrade(g){ tierState.grade = tierState.grade === g ? null : g; tierState.shown = 30; render(); }
function setRegion(v){ tierState.region = v; tierState.dong = ""; tierState.shown = 30; render(); }
function setRegionFromHeat(province, gu){ tierState.region = `${province}::${gu}`; tierState.dong = ""; tierState.shown = 30; render(); }
function setDong(dong){ tierState.dong = tierState.dong === dong ? "" : dong; tierState.shown = 30; render(); }
function setQuery(v){ tierState.q = v; tierState.shown = 30; renderList(); }
function showMore(){ tierState.shown += 50; renderList(); }

load();
</script>
</body>
</html>
