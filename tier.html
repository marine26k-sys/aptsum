<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>급지 분석 — 아파트썸</title>
<link rel="canonical" href="https://aptsum.kr/tier.html">
<meta name="description" content="서울·경기·인천·부산 아파트 단지를 평단가(공급면적 3.3㎡당 가격) 기준 6단계 급지로 나눠 한눈에 보는 지도">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --teal:#00828A; --teal-dark:#00565C; --teal-soft:#E0F2F3; --teal-light:#A8E0E4; --teal-light-soft:#F2FBFB;
    --navy:#0F2B3D; --slate-bg:#F1F5F9; --ink:#1E293B; --sub:#64748B;
    --line:#E2E8F0; --red:#DC2626; --yellow:#F5B400;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Noto Sans KR',sans-serif;background:var(--slate-bg);color:var(--ink);line-height:1.6;font-variant-numeric:tabular-nums;min-height:100vh;word-break:keep-all;overflow-wrap:break-word;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  input,textarea{-webkit-user-select:text;user-select:text}
  .wrap{max-width:420px;margin:0 auto;padding:0 16px 60px;position:relative}
  header{padding:16px 14px;text-align:center;background:var(--navy);border-radius:16px;margin:10px 0 14px;box-shadow:0 2px 14px rgba(15,43,61,.18);position:relative}
  .logo{display:inline-flex;align-items:center;gap:8px;font-weight:900;font-size:19px;color:#fff;letter-spacing:-.5px}
  header p{font-size:11.5px;color:rgba(255,255,255,.7);margin-top:4px}
  .back{position:absolute;top:50%;left:14px;transform:translateY(-50%);background:rgba(255,255,255,.14);border:none;border-radius:8px;width:32px;height:32px;color:#fff;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none}
  .back:active{background:rgba(255,255,255,.28)}

  .tier-prov-tabs{display:flex;gap:6px;margin-bottom:10px}
  .tier-prov-tab{flex:1;text-align:center;padding:9px 0;border-radius:10px;border:1.5px solid var(--line);background:#fff;color:var(--sub);font-size:12.5px;font-weight:700;cursor:pointer}
  .tier-prov-tab.on{background:var(--navy);border-color:var(--navy);color:#fff}
  .tier-prov-tab:active{opacity:.85}
  .tier-analysis-tabs{display:flex;gap:8px;margin-bottom:14px;border-bottom:1.5px solid var(--line)}
  .tier-analysis-tab{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;text-align:center;padding:11px 0;color:var(--sub);font-size:13px;font-weight:700;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1.5px;transition:color .15s,border-color .15s;-webkit-tap-highlight-color:transparent}
  .tier-analysis-tab svg{flex:none;opacity:.7;transition:opacity .15s}
  .tier-analysis-tab.on{color:var(--teal-dark);border-color:var(--teal)}
  .tier-analysis-tab.on svg{opacity:1}
  .tier-analysis-tab:active{background:var(--teal-light-soft)}
  .tier-meta-line{font-size:11px;color:var(--sub);text-align:center;margin-bottom:10px}
  .tier-meta-line b{color:var(--ink)}
  .tier-ladder{background:#fff;border-radius:16px;padding:10px 14px 2px;margin-bottom:12px;border:1.5px solid var(--line)}
  .tier-ladder-title{font-size:13px;font-weight:700;color:var(--navy);margin-bottom:6px}
  .tier-rung{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--slate-bg);cursor:pointer;transition:background .12s}
  .tier-rung:last-child{border-bottom:none}
  .tier-rung:active{background:var(--teal-light-soft)}
  .tier-rung.on{background:var(--teal-light-soft)}
  .tier-rung-dot{flex:none;width:11px;height:11px;border-radius:3px}
  .tier-rung-info{flex:none;width:76px}
  .tier-rung-label{font-size:12px;font-weight:700;color:var(--ink);line-height:1.3}
  .tier-rung-band{font-size:9px;color:var(--sub);line-height:1.3}
  .tier-rung-bar-track{flex:1;height:20px;background:var(--slate-bg);border-radius:6px;overflow:hidden;position:relative}
  .tier-rung-bar-fill{height:100%;border-radius:6px;transition:width .5s ease}
  .tier-rung-count{flex:none;width:80px;text-align:right;font-size:11px;color:var(--sub);line-height:1.3}
  .tier-rung-count b{color:var(--ink);font-size:12.5px}
  .tier-rung-panel{padding:2px 0 10px;border-bottom:1px solid var(--slate-bg)}
  .tier-rung-panel .tier-list{border-color:var(--slate-bg)}
  .tier-filters{display:flex;gap:6px;margin-bottom:10px}
  .tier-filters select,.tier-filters input{flex:1;font-size:12px;padding:8px 9px;border-radius:10px;border:1.5px solid var(--line);background:#fff;color:var(--ink);font-family:inherit}
  .tier-filters input{flex:1.4}
  .tier-filters select:focus,.tier-filters input:focus{outline:none;border-color:var(--teal)}
  .tier-section-hd{display:flex;align-items:center;justify-content:space-between;margin:14px 0 6px}
  .tier-section-hd h2{font-size:13px;font-weight:700;color:var(--navy)}
  .tier-section-hd .cnt{font-size:11px;color:var(--sub)}
  .tier-heat-group{margin-bottom:10px}
  .tier-heat-group-title{font-size:11.5px;font-weight:700;color:var(--sub);margin-bottom:6px;padding-left:2px}
  .tier-heatmap{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
  .tier-heat-cell{border-radius:10px;padding:8px 8px 7px;color:#fff;cursor:pointer;min-height:90px;min-width:0;display:flex;flex-direction:column;justify-content:space-between}
  .tier-heat-cell.on{box-shadow:0 0 0 3px var(--navy) inset}
  .tier-heat-cell:active{opacity:.85}
  .tier-heat-region{font-size:14px;font-weight:800;opacity:1;overflow-wrap:anywhere}
  .tier-heat-name{font-size:11px;font-weight:700;line-height:1.2;margin:2px 0;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
  .tier-heat-price{font-size:15px;font-weight:900;margin-top:2px}
  .tier-heat-price span{font-size:10px;font-weight:600;opacity:.85;margin-left:1px}
  .tier-heat-amt{font-size:11px;font-weight:600;opacity:.92;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tier-list{background:#fff;border-radius:16px;overflow:hidden;border:1.5px solid var(--line)}
  .tier-row{display:flex;align-items:flex-start;gap:10px;padding:6px 13px;border-bottom:1px solid var(--slate-bg)}
  .tier-row:last-child{border-bottom:none}
  .tier-row-no{flex:none;width:31px;font-size:10.5px;color:var(--sub);text-align:center;white-space:nowrap;letter-spacing:-.3px;font-variant-numeric:tabular-nums} /* 순위가 이어지면서(최대 5자리) 줄바꿈되지 않게 — 2026.09 */
  .tier-row-main{flex:1;min-width:0}
  .tier-row-name{font-size:11.5px;font-weight:700;color:var(--ink);line-height:1.3;overflow-wrap:anywhere}
  .tier-presale-badge{font-size:9.5px;font-weight:700;color:#00565C;background:#e3f4f4;border-radius:5px;padding:1px 5px;vertical-align:1px}
  .tier-grade-badge{display:inline-block;font-size:9px;font-weight:700;color:#fff;border-radius:5px;padding:1px 5px;margin-right:5px;vertical-align:1px;white-space:nowrap}
  .tier-row-sub{font-size:10px;color:var(--sub);margin-top:0;line-height:1.15}
  .tier-row-price{flex:none;text-align:right}
  .tier-row-price b{font-size:13px;color:var(--navy)}
  .tier-row-price span{font-size:9.5px;color:var(--sub)}
  .tier-row-amt{font-size:9.5px;color:var(--sub);margin-top:0;line-height:1.15}
  .tier-more-btn{display:block;width:100%;margin-top:10px;padding:11px;border-radius:12px;border:1.5px solid var(--line);background:#fff;color:var(--teal-dark);font-weight:700;font-size:12px;cursor:pointer;font-family:inherit}
  .tier-more-btn:active{background:var(--teal-light-soft)}
  .tier-toggle-btn{flex:none;font-size:12px;font-weight:800;color:#fff;background:var(--teal);border:1.5px solid var(--teal);border-radius:999px;padding:7px 13px;cursor:pointer;font-family:inherit;white-space:nowrap;box-shadow:0 2px 6px rgba(0,130,138,.28)}
  .tier-toggle-btn:active{background:var(--teal-dark);border-color:var(--teal-dark)}
  .tier-empty{text-align:center;padding:40px 20px;color:var(--sub);font-size:12.5px}
  .tier-disclaimer{font-size:10px;color:var(--sub);text-align:center;margin-top:16px;padding:0 10px;line-height:1.5}
  .tier-disclaimer a{color:var(--teal-dark)}
  .tier-loading-box{text-align:center;padding:60px 20px;color:var(--sub);font-size:13px}
  .coupang-ad{display:flex;flex-direction:column;align-items:center;gap:5px;margin-top:14px;padding:12px 10px;border:1.5px dashed var(--teal);border-radius:12px;background:var(--teal-light-soft)}
  .coupang-ad-title{font-size:14px;font-weight:800;color:var(--navy);margin-bottom:2px}
  .coupang-ad-row{display:flex;gap:6px;justify-content:center;flex-wrap:nowrap}
  .coupang-ad-item{width:104px;height:208px;overflow:hidden;border-radius:8px;flex:none}
  .coupang-ad-item iframe{width:120px;height:240px;border:none;transform:scale(.8667);transform-origin:top left}
  .coupang-disclosure{font-size:12.5px;font-weight:800;color:#333;text-align:center;max-width:280px;line-height:1.45}
</style>
<!-- Google AdSense(2026.09) — 사이트 연결·자동 광고용 코드. 광고 표시 여부·위치는 애드센스 관리 화면(광고 → 자동 광고)에서 켜고 끈다. -->
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8856204814619199" crossorigin="anonymous"></script>
</head>
<body>
<div class="wrap">
  <header>
    <a class="back" href="./index.html" aria-label="메인으로">←</a>
    <span class="logo"><svg width="14" height="14" viewBox="0 0 20 20"><rect x="2" y="10" width="4" height="8" fill="#00A9B4"/><rect x="8" y="6" width="4" height="12" fill="#7FD4D9"/><rect x="14" y="2" width="4" height="16" fill="#00A9B4"/></svg><span style="color:#00C2C2">아파트썸</span>&nbsp;급지 분석</span>
    <p>서울·경기·인천·부산 아파트, 평단가 기준 6단계</p>
  </header>

  <div id="app"><div class="tier-loading-box">불러오는 중…</div></div>
</div>

<script>
// 준공연도 → 연식 표기(2026.09) — index.html의 buildAgeLabel()과 동일 규칙.
// 년차는 준공한 해를 1년차로 세는 1-based 표기(2026년 준공 = 1년차, 2002년 준공 = 25년차).
// 아직 준공 전(미래 연도)은 년차로 셀 수 없으므로 "2027년 준공"처럼 연도를 그대로 보여준다.
function buildAgeLabel(build){
  const by = parseInt(build, 10);
  if(!by) return '';
  const age = new Date().getFullYear() - by + 1;
  return age < 1 ? `${by}년 준공` : `${age}년차`;
}
// 쿠팡 파트너스 배너 — index.html의 couponBannerHTML()과 동일. 공정거래위원회 추천·보증 심사지침에 따라
// 광고 배너와 고지문을 하나의 블록으로 묶어, 고지문 없이 배너만 노출되는 일이 없게 한다.
function couponBannerHTML(){
  return `<div class="coupang-ad">
    <div class="coupang-ad-title">아파트썸 추천 부동산 서적</div>
    <div class="coupang-ad-row">
      <div class="coupang-ad-item">
        <iframe src="https://coupa.ng/cpwXdE" frameborder="0" scrolling="no" referrerpolicy="unsafe-url" loading="lazy" title="쿠팡 파트너스 광고"></iframe>
      </div>
      <div class="coupang-ad-item">
        <iframe src="https://coupa.ng/cpwXWl" frameborder="0" scrolling="no" referrerpolicy="unsafe-url" loading="lazy" title="쿠팡 파트너스 광고"></iframe>
      </div>
      <div class="coupang-ad-item">
        <iframe src="https://coupa.ng/cpwYpC" frameborder="0" scrolling="no" referrerpolicy="unsafe-url" loading="lazy" title="쿠팡 파트너스 광고"></iframe>
      </div>
    </div>
    <p class="coupang-disclosure">이 배너는 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</p>
  </div>`;
}

const $ = (sel, el=document) => el.querySelector(sel);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const tierFmtPy = (manwon) => (manwon / 10000).toFixed(2) + "억";
// 목록 배지는 "최상급지" 대신 "최상"처럼 짧게 — 단지명과 한 줄에 놓이다 보니 "급지"가 매 줄 반복돼
// 정작 읽어야 할 이름을 방해했음(운영자 요청, 2026.09). 등급 사다리(범례)는 원래 라벨을 그대로 쓴다.
const gradeShort = (label) => String(label || "").replace(/급지$/, "");
const tierFmtAmt = (manwon) => (manwon / 10000).toFixed(1) + "억";
const TIER_PROVINCES = ["서울", "경기", "인천", "부산"];

let tierData = null;
let tierState = { province: "", grade: null, region: "", dong: "", q: "", shown: 30, tab: "complex", dongRankGrade: null, dongShown: 30, dongQ: "", flagshipsOpen: false };

async function load(){
  try{
    const res = await fetch("./data/tier-map.json", { cache: "no-store" });
    if(!res.ok) throw new Error("no data");
    tierData = await res.json();
    history.replaceState({ tier: tierSnapshot() }, "");
    render();
  }catch(e){
    $("#app").innerHTML = `<div class="tier-empty">아직 급지 데이터가 없습니다.<br>배치가 한 번 돈 뒤에 다시 확인해주세요.</div>`;
  }
}

function tierScoped(){
  return tierData.complexes.filter(c => !tierState.province || c.province === tierState.province);
}
// 지역 select는 "시·도::구/시" 복합키 — 서울/부산처럼 구 이름이 같은 시·도가 있어 구 이름만으로는 구분이 안 됨.
function tierRegionOptions(){
  const scoped = tierScoped();
  const groups = tierState.province ? [tierState.province] : TIER_PROVINCES;
  let html = `<option value="">전체 지역</option>`;
  for (const p of groups) {
    const regions = [...new Set(scoped.filter(c => c.province === p).map(c => c.gu))].sort((a,b) => a.localeCompare(b, "ko"));
    if (!regions.length) continue;
    html += `<optgroup label="${esc(p)}">` + regions.map(r => {
      const key = `${p}::${r}`;
      return `<option value="${esc(key)}" ${tierState.region===key?'selected':''}>${esc(r)}</option>`;
    }).join("") + `</optgroup>`;
  }
  return html;
}
// 순위 번호 — 등급 필터를 빼고 나머지 조건(시·도·지역·동·검색)으로 거른 목록(평단가 내림차순) 기준으로 매긴다.
// 그래서 등급을 탭해도 번호가 1부터 다시 시작하지 않고 전체 순위가 이어진다(2026.09 운영자 요청 — 동별 분석과 동일).
function tierFiltered(){
  const ranked = tierScoped().filter(c =>
    (!tierState.region || `${c.province}::${c.gu}` === tierState.region) &&
    (!tierState.dong || c.dong === tierState.dong) &&
    (!tierState.q || c.nm.includes(tierState.q) || c.dong.includes(tierState.q) || c.gu.includes(tierState.q))
  ).map((c, i) => ({ ...c, rank: i + 1 }));
  return tierState.grade ? ranked.filter(c => c.g === tierState.grade) : ranked;
}
// 검색창 입력마다 이 함수만 다시 그림(#tierListArea만 갱신) — 검색창 포커스를 유지하기 위함.
function renderList(){
  const list = tierFiltered();
  const shown = list.slice(0, tierState.shown);
  $("#tierListCnt").textContent = `${list.length.toLocaleString()}개`;
  $("#tierListArea").innerHTML = shown.length ? `
    <div class="tier-list">
      ${shown.map((c,i) => {
        const grade = tierData.grades.find(g => g.g === c.g);
        return `
        <div class="tier-row">
          <div class="tier-row-no">${c.rank}</div>
          <div class="tier-row-main">
            <div class="tier-row-name">${grade?`<span class="tier-grade-badge" style="background:${grade.color}">${esc(gradeShort(grade.label))}</span>`:''}${esc(c.nm)}${c.presaleOnly?' <span class="tier-presale-badge">분양권</span>':''}</div>
            <div class="tier-row-sub">${esc(c.gu)} ${esc(c.dong)}${c.by?` · ${buildAgeLabel(c.by)}`:''}${c.hh?` · ${c.hh.toLocaleString()}세대`:''}</div>
          </div>
          <div class="tier-row-price"><b>${tierFmtPy(c.ppy)}</b><span>/평</span><div class="tier-row-amt">${tierFmtAmt(c.amt)} · ${c.py}평${c.ar?` (전용 ${c.ar})`:''}</div></div>
        </div>
      `;
      }).join("")}
    </div>
    ${list.length > shown.length ? `<button class="tier-more-btn" onclick="showMore()">${list.length - shown.length}개 더 보기</button>` : ""}
    ${couponBannerHTML()}
  ` : `<div class="tier-empty">조건에 맞는 단지가 없습니다.</div>`;
}
// 지역(구/시)별 대장주 히트맵 — 칸 색은 그 단지의 급지 등급색을 그대로 재사용.
// "전체" 탭(시·도 미선택)에서는 서울·경기·인천·부산 구분 없이 평단가 순으로 한 데 섞어 보여준다
// (운영자 요청, 2026.09 — 예전엔 시·도별로 그룹 나눠 보여줬음). 시·도가 같은 구 이름이 겹치는 경우
// (중구·강서구 등 서울↔부산)가 있어, 이 통합 뷰에서만 칸에 시·도명을 함께 표시해 구분한다.
function heatmapHTML(){
  const flags = tierData.flagships.filter(f => !tierState.province || f.province === tierState.province).slice().sort((a,b) => b.ppy - a.ppy);
  const showProvince = !tierState.province;
  if(!flags.length) return "";
  return `
    <div class="tier-heat-group">
      <div class="tier-heatmap">
        ${flags.map(f => {
          const grade = tierData.grades.find(g => g.g === f.g);
          return `
            <div class="tier-heat-cell" style="background:${grade.color}" onclick="setRegionFromHeat('${esc(f.province)}','${esc(f.gu)}')">
              <div class="tier-heat-region">${showProvince?`${esc(f.province)} `:''}${esc(f.gu)}</div>
              <div class="tier-heat-name">${esc(f.nm)}</div>
              <div class="tier-heat-amt">${tierFmtAmt(f.amt)} · ${f.py}평${f.ar?` (전용 ${f.ar})`:''}</div>
              <div class="tier-heat-price">${tierFmtPy(f.ppy)}<span>/평</span></div>
            </div>
          `;
        }).join("")}
      </div>
    </div>
  `;
}
function scopedFlagshipCount(){
  return tierData.flagships.filter(f => !tierState.province || f.province === tierState.province).length;
}
// 동별 순위 — 서울·경기·인천·부산 통합(또는 시·도 탭 선택 시 그 시·도 안)에서 동 단위로 대장주를 뽑아
// 그 동의 급지 등급(6분위)별로 묶어서 보여줌. 등급은 그 동 대장주 단지의 등급(g)을 그대로 씀 — 등급
// 사다리(6단계)와 같은 기준. 전부 다 보여주고 자르지 않음(운영자 요청, 기존 TOP 30 제한 삭제).
// 동별 순위 값 = 그 동 단지들 중 평단가 상위 10개(단지가 10개 미만이면 있는 만큼)의 평균 — 대장주
// 단지 1개만 보던 것보다 그 동 전체 수준을 더 잘 대표함(운영자 요청). 등급도 이 평균값 기준으로 새로 매김
// (tierData.grades가 min 내림차순이라 첫 매치가 맞는 등급).
function dongRankGroups(){
  const base = tierScoped();
  const byDong = new Map();
  for (const c of base) {
    const key = `${c.province}::${c.gu}::${c.dong}`;
    if (!byDong.has(key)) byDong.set(key, []);
    byDong.get(key).push(c);
  }
  const items = [...byDong.entries()].map(([key, list]) => {
    const [province, gu, dong] = key.split("::");
    const top = list.slice().sort((a,b) => b.ppy - a.ppy).slice(0, 10);
    const avgPpy = Math.round(top.reduce((s,c) => s + c.ppy, 0) / top.length);
    const grade = tierData.grades.find(g => avgPpy >= g.min) || tierData.grades[tierData.grades.length-1];
    return { province, gu, dong, ppy: avgPpy, count: top.length, g: grade.g };
  }).sort((a,b) => b.ppy - a.ppy);
  items.forEach((c,i) => { c.rank = i + 1; }); // 전체 순위 — 등급별로 나눠 봐도 번호가 안 끊기고 이어지게
  return tierData.grades.map(g => ({ grade: g, items: items.filter(c => c.g === g.g) }));
}
// 동 한 줄 — 동별 목록·동 검색 결과 공용. 누르면 그 동의 단지별 분석으로 이동.
function dongRowHTML(c){
  const grade = tierData.grades.find(g => g.g === c.g);
  return `
    <div class="tier-row" style="cursor:pointer" onclick="openDongFromRank('${esc(c.province)}','${esc(c.gu)}','${esc(c.dong)}')">
      <div class="tier-row-no">${c.rank}</div>
      <div class="tier-row-main">
        <div class="tier-row-name">${grade?`<span class="tier-grade-badge" style="background:${grade.color}">${esc(gradeShort(grade.label))}</span>`:''}${esc(c.dong)}</div>
        <div class="tier-row-sub">${esc(c.province)} ${esc(c.gu)} · 상위 ${c.count}개 단지 평균</div>
      </div>
      <div class="tier-row-price"><b>${tierFmtPy(c.ppy)}</b><span>/평</span></div>
    </div>
  `;
}
// 동별 분석도 단지별 분석처럼 등급을 탭하면 사다리 아래 목록이 그 등급으로 걸러진다(2026.09 운영자 요청 —
// 예전엔 누른 등급 바로 밑에 아코디언으로 끼어 펼쳐져서 두 탭의 동작이 달랐음). 다시 누르면 전체 동.
function setDongRankGrade(g){ tierState.dongRankGrade = tierState.dongRankGrade === g ? null : g; tierState.dongShown = 30; pushTierHistory(); renderDongRankArea(); }
function showMoreDong(){ tierState.dongShown += 50; renderDongRankArea(); }
// 동 검색 — 입력하면 등급 아코디언 대신 검색어가 포함된 동만 평단가순으로 쭉 보여줌(구/시 단위 검색도 가능).
function dongSearchResultsHTML(){
  const q = tierState.dongQ.trim();
  const all = dongRankGroups().flatMap(g => g.items);
  const matched = all.filter(c => c.dong.includes(q) || c.gu.includes(q)).sort((a,b) => b.ppy - a.ppy);
  if(!matched.length) return `<div class="tier-empty">"${esc(q)}"에 해당하는 동이 없습니다.</div>`;
  return `
    <div class="tier-list">${matched.map(dongRowHTML).join("")}</div>
    ${couponBannerHTML()}
  `;
}
function dongRankCardHTML(){
  if(tierState.dongQ.trim()) return dongSearchResultsHTML();
  const groups = dongRankGroups();
  const total = groups.reduce((s,g) => s + g.items.length, 0);
  const maxCount = Math.max(...groups.map(g => g.items.length), 1);
  const label = tierState.province ? `${tierState.province} 동별 순위` : '동별 순위 (통합)';
  const sel = tierState.dongRankGrade;
  const list = sel ? (groups.find(g => g.grade.g === sel)?.items || []) : groups.flatMap(g => g.items);
  const shown = list.slice(0, tierState.dongShown);
  return `
    <div class="tier-ladder">
      <div class="tier-ladder-title">${esc(label)} <span style="font-weight:400;color:var(--sub)">· ${total.toLocaleString()}개 동 (탭해서 필터링)</span></div>
      ${groups.map(({grade, items}) => `
        <div class="tier-rung ${sel===grade.g?'on':''}" onclick="setDongRankGrade(${grade.g})">
          <div class="tier-rung-dot" style="background:${grade.color}"></div>
          <div class="tier-rung-info"><div class="tier-rung-label">${esc(grade.label)}</div><div class="tier-rung-band">${esc(grade.band)}</div></div>
          <div class="tier-rung-bar-track"><div class="tier-rung-bar-fill" style="width:${(items.length/maxCount*100).toFixed(1)}%;background:${grade.color}"></div></div>
          <div class="tier-rung-count"><b>${items.length}</b>개 동</div>
        </div>
      `).join("")}
    </div>

    <div class="tier-section-hd"><h2>${sel ? esc(tierData.grades.find(g=>g.g===sel).label) : '전체 동'}</h2><span class="cnt">${list.length.toLocaleString()}개</span></div>
    ${shown.length ? `
      <div class="tier-list">${shown.map(dongRowHTML).join("")}</div>
      ${list.length > shown.length ? `<button class="tier-more-btn" onclick="showMoreDong()">${list.length - shown.length}개 더 보기</button>` : ""}
      ${couponBannerHTML()}
    ` : `<div class="tier-empty">이 등급에 해당하는 동이 없습니다.</div>`}
  `;
}
// 검색창 입력마다 이 함수만 다시 그림(#dongRankArea만 갱신) — 검색창 포커스 유지.
function renderDongRankArea(){
  $("#dongRankArea").innerHTML = dongRankCardHTML();
}
// 동별 평단가 히트맵 — 구/시를 선택했을 때만 노출. 동별 대장주(그 동에서 평단가가 가장 높은 단지) 1개씩 보여줌.
function dongHeatmapHTML(){
  if (!tierState.region) return "";
  const [province, gu] = tierState.region.split("::");
  const inGu = tierData.complexes.filter(c => c.province === province && c.gu === gu);
  const byDong = new Map();
  for (const c of inGu) {
    if (!byDong.has(c.dong) || byDong.get(c.dong).ppy < c.ppy) byDong.set(c.dong, c);
  }
  const items = [...byDong.values()].sort((a,b) => b.ppy - a.ppy);
  if (!items.length) return "";
  return `
    <div class="tier-section-hd"><h2>${esc(gu)} 동별 평단가</h2><span class="cnt">${items.length}개 동</span></div>
    <div class="tier-heatmap">
      ${items.map(c => {
        const grade = tierData.grades.find(g => g.g === c.g);
        return `
        <div class="tier-heat-cell ${tierState.dong===c.dong?'on':''}" style="background:${grade.color}" onclick="setDong('${esc(c.dong)}')">
          <div class="tier-heat-region">${esc(c.dong)}</div>
          <div class="tier-heat-name">${esc(c.nm)}</div>
          <div class="tier-heat-amt">${tierFmtAmt(c.amt)} · ${c.py}평${c.ar?` (전용 ${c.ar})`:''}</div>
          <div class="tier-heat-price">${tierFmtPy(c.ppy)}<span>/평</span></div>
        </div>
      `;
      }).join("")}
    </div>
  `;
}
function render(){
  const provTabsHTML = `
    <div class="tier-prov-tabs">
      <div class="tier-prov-tab ${tierState.province===''?'on':''}" onclick="setProvince('')">전체</div>
      ${TIER_PROVINCES.map(p => `<div class="tier-prov-tab ${tierState.province===p?'on':''}" onclick="setProvince('${p}')">${p}</div>`).join("")}
    </div>
  `;
  // 단지별 분석/동별 분석 완전 분리(운영자 요청) — 서로 다른 관점의 화면이라 한 화면에 섞지 않고
  // 탭으로 아예 나눔. 시·도 필터는 두 탭이 공유.
  const analysisTabsHTML = `
    <div class="tier-analysis-tabs">
      <div class="tier-analysis-tab ${tierState.tab==='complex'?'on':''}" onclick="setTab('complex')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="1.5"/><line x1="9" y1="8" x2="9.01" y2="8"/><line x1="15" y1="8" x2="15.01" y2="8"/><line x1="9" y1="13" x2="9.01" y2="13"/><line x1="15" y1="13" x2="15.01" y2="13"/></svg>단지별 분석</div>
      <div class="tier-analysis-tab ${tierState.tab==='dong'?'on':''}" onclick="setTab('dong')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 6-9 12-9 12s-9-6-9-12a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>동별 분석</div>
    </div>
  `;

  if(tierState.tab === 'dong'){
    $("#app").innerHTML = `
      ${provTabsHTML}
      ${analysisTabsHTML}
      <div class="tier-filters">
        <input id="dongQInput" type="text" placeholder="동 이름 검색 (예: 반포동, 강남구)" value="${esc(tierState.dongQ)}" oninput="setDongQuery(this.value)">
      </div>
      <div id="dongRankArea"></div>
    `;
    renderDongRankArea();
    return;
  }

  $("#app").innerHTML = `
    ${provTabsHTML}
    ${analysisTabsHTML}

    <div class="tier-filters">
      <select id="tierRegionSel" onchange="setRegion(this.value)">${tierRegionOptions()}</select>
      <input id="tierQInput" type="text" placeholder="단지명·구·동 이름 검색" value="${esc(tierState.q)}" oninput="setQuery(this.value)">
    </div>

    <div id="tierBodyArea"></div>

    <div class="tier-disclaimer">
      ${esc(tierData.meta.basis)}.<br>
      단지마다 여러 평형 (목록의 "○○평" 표기) 중 평단가가 가장 높은 평형 하나를 대표로 골라 등급을 매긴 값이라, 그 단지의 다른 평형은 실제 체감 시세와 다를 수 있습니다. ${Math.round(tierData.meta.months/12*10)/10}년 내 같은 평형 거래가 2건 미만이면 이상치 방지를 위해 집계에서 제외되므로, 거래가 드문 단지는 목록에 없을 수 있습니다 — 참고용으로만 활용하세요.<br>
      <a href="./index.html">단지별 상세 분석 보기</a>
    </div>
  `;
  renderComplexBody();
}
// 검색어 입력 시 등급 사다리/히트맵을 숨기고 검색 결과를 필터 바로 아래 보여줌(동별 분석과 동일한 위치·동작).
// #tierBodyArea 전체를 새로 그려도 이 안엔 입력창이 없어 검색창 포커스는 그대로 유지됨.
function renderComplexBody(){
  const q = tierState.q.trim();
  if(q){
    $("#tierBodyArea").innerHTML = `
      <div class="tier-section-hd"><h2>검색 결과</h2><span class="cnt" id="tierListCnt"></span></div>
      <div id="tierListArea"></div>
    `;
    renderList();
    return;
  }
  const base = tierScoped();
  const gradeStats = tierData.grades.map(g => {
    const inGrade = base.filter(c => c.g === g.g);
    const avg = inGrade.length ? Math.round(inGrade.reduce((s,c) => s + c.ppy, 0) / inGrade.length) : 0;
    return { ...g, count: inGrade.length, avg };
  });
  const maxCount = Math.max(...gradeStats.map(g => g.count), 1);
  $("#tierBodyArea").innerHTML = `
    <div class="tier-meta-line">단지 <b>${base.length.toLocaleString()}</b>개 · 최근 ${tierData.meta.months}개월 최고가 거래 기준</div>

    <div class="tier-ladder">
      <div class="tier-ladder-title">등급별 단지 분포 (탭해서 필터링)</div>
      ${gradeStats.map(g => `
        <div class="tier-rung ${tierState.grade===g.g?'on':''}" onclick="setGrade(${g.g})">
          <div class="tier-rung-dot" style="background:${g.color}"></div>
          <div class="tier-rung-info"><div class="tier-rung-label">${esc(g.label)}</div><div class="tier-rung-band">${esc(g.band)}</div></div>
          <div class="tier-rung-bar-track"><div class="tier-rung-bar-fill" style="width:${(g.count/maxCount*100).toFixed(1)}%;background:${g.color}"></div></div>
          <div class="tier-rung-count"><b>${g.count}</b>개 단지<br>평균 ${tierFmtPy(g.avg)}</div>
        </div>
      `).join("")}
    </div>

    ${!tierState.grade && !tierState.region ? `
    <div class="tier-section-hd"><h2>지역별 대장주 <span class="cnt">${scopedFlagshipCount()}개 지역</span></h2><button type="button" class="tier-toggle-btn" onclick="toggleFlagships()">${tierState.flagshipsOpen?'접기 ▲':'펼쳐보기 ▼'}</button></div>
    ${tierState.flagshipsOpen ? heatmapHTML() : ""}
    ` : ""}

    ${tierState.region ? dongHeatmapHTML() : ""}

    <div class="tier-section-hd"><h2>${tierState.grade ? esc(tierData.grades.find(g=>g.g===tierState.grade).label) : (tierState.dong ? esc(tierState.dong) : '전체 단지')}</h2><span class="cnt" id="tierListCnt"></span></div>

    <div id="tierListArea"></div>
  `;
  renderList();
}
// 브라우저 뒤로가기 지원 — 구/동 드릴다운(서초구→반포동 등)이 history 엔트리를 하나도 안 남겨서,
// 뒤로가기를 누르면 한 단계씩 빠져나오지 못하고 곧장 이 페이지 밖(원래 첫 페이지)으로 나가버리던
// 문제(운영자 스크린샷으로 발견). 시·도/등급/구/동/탭처럼 "드릴다운"에 해당하는 상태 변경마다
// pushState로 스냅샷을 쌓아, 뒤로가기 한 번에 그 이전 단계로만 돌아가도록 함. 검색어 입력·펼치기
// 토글·더보기처럼 타이핑/UI 상태는 history에 안 남김(안 그러면 글자 하나마다 뒤로가기 스택이 쌓임).
function tierSnapshot(){
  return { province: tierState.province, grade: tierState.grade, region: tierState.region, dong: tierState.dong, tab: tierState.tab, dongRankGrade: tierState.dongRankGrade };
}
function pushTierHistory(){
  history.pushState({ tier: tierSnapshot() }, "");
}
window.addEventListener("popstate", (e) => {
  const snap = e.state && e.state.tier;
  if(!snap || !tierData) return;
  Object.assign(tierState, snap);
  tierState.shown = 30;
  tierState.dongShown = 30;
  render();
});

function setTab(t){ tierState.tab = t; tierState.shown = 30; pushTierHistory(); render(); }
function setDongQuery(v){ tierState.dongQ = v; tierState.dongShown = 30; renderDongRankArea(); }

function setProvince(p){ tierState.province = p; tierState.region = ""; tierState.dong = ""; tierState.grade = null; tierState.dongRankGrade = null; tierState.shown = 30; tierState.dongShown = 30; pushTierHistory(); render(); }
function setGrade(g){ tierState.grade = tierState.grade === g ? null : g; tierState.shown = 30; pushTierHistory(); render(); }
function setRegion(v){ tierState.region = v; tierState.dong = ""; tierState.shown = 30; pushTierHistory(); render(); }
function setRegionFromHeat(province, gu){ tierState.region = `${province}::${gu}`; tierState.dong = ""; tierState.shown = 30; pushTierHistory(); render(); }
function toggleFlagships(){ tierState.flagshipsOpen = !tierState.flagshipsOpen; render(); }
function setDong(dong){ tierState.dong = tierState.dong === dong ? "" : dong; tierState.shown = 30; pushTierHistory(); render(); }
// 동별 분석에서 동 하나를 눌러 "단지별 분석 + 그 구 + 그 동"으로 한 번에 이동 — 예전엔 onclick에서
// setTab→setRegionFromHeat→setDong 세 함수를 연달아 불렀는데, 셋 다 history를 쌓게 되면서(2026.09
// 뒤로가기 지원 추가) 클릭 한 번에 엔트리가 3개 쌓여 뒤로가기를 세 번 눌러야 동별 분석으로 돌아오는
// 문제가 생겼음. 상태를 한 번에 바꾸고 history도 한 번만 쌓는다(렌더도 3회→1회로 줄어듦).
function openDongFromRank(province, gu, dong){
  tierState.tab = 'complex';
  tierState.region = `${province}::${gu}`;
  tierState.dong = dong;
  tierState.shown = 30;
  pushTierHistory();
  render();
}
function setQuery(v){ tierState.q = v; tierState.shown = 30; renderComplexBody(); }
function showMore(){ tierState.shown += 50; renderList(); }

load();
document.addEventListener("contextmenu", (e) => e.preventDefault());
document.addEventListener("copy", (e) => e.preventDefault());
fetch('/api/visits?page=tier').catch(() => {}); // 방문자 카운터(페이지별 집계, stats.html용) — 화면 표시는 없음
</script>
<div style="text-align:center;font-size:11px;color:#94A3B8;padding:8px 0 28px"><a href="/privacy.html" style="color:#64748B">개인정보처리방침</a></div>
</body>
</html>
